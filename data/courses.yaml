# 코스 — 이번 공연이 도는 큐들(2026-09-25 결정 문서 「코스」·「하이라이트 구성」).
#
# 첫 코스가 기동 때의 코스다. 시연 중에는 콘솔·대시보드 `k <코스>` 로 **바로** 바꾼다 — 지금 큐는 끝까지 말하고
# '다음' 부터 새 코스의 다음 큐로 간다. 되감기(공연 종료·시작)는 그 코스의 첫 큐로 간다.
#
# cues: all 이면 큐시트 전체. 아니면 큐 id 목록 — **큐시트 순서대로** 적는다(이야기 흐름이 곧 순서다).
# 로더가 모르는 id·중복·순서 어긋남을 기동에서 막는다(`stage/courses.py`).
courses:
  - name: 전체
    cues: all
  # 로봇 가이드 이용자 59.4% 가 몇 작품만 들었다(국립현대미술관 연구, 결정 문서). 이야기 흐름(개요·발견·원리·
  # 마무리)과 체험 코너(모스·해상·이동통신·탐사·과학)를 섞은 9큐 — 발화 초등 약 10분 ~ 전문가 약 13분.
  - name: 하이라이트
    cues: [01-intro, 02-history, 03-theory, 04-morse, 07-maritime, 14-mobile, 17-rover, 18-science, 19-closing]
