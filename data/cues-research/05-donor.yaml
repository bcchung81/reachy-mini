# 조사 산출물 — 05-donor (기증자 장황남 박사).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# ⚠️ **실존 인물 섹션이다.** 이 파일에 없는 사실은 도슨트가 말하지 않는다.
#    생몰년·학위·기증 경위를 LLM 이 그럴듯하게 채우는 것이 이 섹션의 가장 큰 위험이다.
#
# 조사 결과 핵심: 장황남 박사에 대해 웹에서 확인되는 것은 **조선대학교
# 장황남정보통신박물관** 쪽 기록뿐이다. **KCA 전파체험관과의 연결(정식 명칭, 200여 점
# 기증)은 어느 출처에서도 확인되지 않았다** — unverifiable 로 내렸다.
#
# 1차 출처: 조선대학교 장황남정보통신박물관 '기증자 인사말' (본인 서술).
#   https://changicmuseum.chosun.ac.kr/contents.php?mc=129
# 기관 소개: https://www3.chosun.ac.kr/chosun/643/subview.do

id: "05-donor"
title: "기증자 — 장황남 박사"
gaze: partner
topic: "의사가 평생 모은 통신기기를 기증했다는 대비"

facts:
  - claim: "조선대학교에 장황남 박사의 이름을 딴 **장황남정보통신박물관** 이 있다."
    source: "조선대학교 공식 — 장황남정보통신박물관
      https://www3.chosun.ac.kr/chosun/643/subview.do ,
      https://changicmuseum.chosun.ac.kr/"
    grade: B
  - claim: "그 박물관은 재미교포 의사 장황남 박사가 기증한 '역사적 가치가 풍부한 유무선
      정보 통신기기 4천5백여 점' 으로 만들어졌고, 구 대학원 건물을 리모델링해 2014년
      9월 30일 개관했다."
    source: "조선대학교 공식 소개 (원문 인용: '역사적 가치가 풍부한 유무선 정보 통신기기
      4천5백여 점')"
    grade: B
    note: "⚠️ 이 4,500여 점은 **조선대학교** 기증분이다. 체험관 기증분(원장의 '200여 점')과
      **절대 섞지 않는다.** 둘의 관계는 확인되지 않았다."
  - claim: "박물관 소장품은 1920년대부터 최근까지의 정보통신 기기를 포함한다."
    source: "조선대학교 공식 소개"
    grade: B
  - claim: "장황남은 전남 완도에서 태어나 광주고등학교를 졸업하고 전남의과대학을 졸업했다."
    source: "기증자 인사말 (본인 서술, 원문: '전남완도에서 출생하여 광주고등학교를
      졸업하고 전남의과대학을 졸업')"
    grade: B
  - claim: "전남의대 약리학교실에서 석사과정을 마쳤고, 군 복무를 거쳐 1972년 미국으로
      이주했다."
    source: "기증자 인사말 (본인 서술)"
    grade: B
  - claim: "미국 뉴욕주 뉴어크(Newark)에서 내과를 개업했고, 병원 과장과 의사협회장을
      역임했다."
    source: "기증자 인사말 (본인 서술, 원문: '뉴욕주 Newark에서 내과 개업')"
    grade: B
  - claim: "1963년 전남 최초의 아마추어 무선 통신사로 **HM4DF** 무선국을 운영했다.
      미국에서도 여러 무선국을 운영했고, 미국 아마추어 무선 잡지 QST 에 기술 기사가 실렸다."
    source: "기증자 인사말 (본인 서술, 원문: '1963년에 전남 최초의 아마추어 무선 통신사로
      HM4DF 무선국을 운영')"
    grade: B
    note: "HM 은 HL 이전에 한국에 배정됐던 호출부호 접두사다. 호출부호를 말할 때는
      철자 그대로 '에이치엠 사 디 에프' 로 읽히도록 브리프에 적어 둔다."
  - claim: "장황남은 수집한 통신기기를 조선대학교에 기증해 정보통신 박물관을 세울 수 있게
      했다."
    source: "기증자 인사말 (본인 서술, 원문: '조선대학에 정보 통신 박물관을 세울 수 있도록
      기증')"
    grade: B
  - claim: "조선대학교 공식 소개는 수집 기간을 '30여 년간' 으로 적는다."
    source: "조선대학교 공식 — 장황남정보통신박물관 소개"
    grade: B
  - claim: "광주MBC 보도는 '전남대 의대 재학 시절 광주에서 처음으로 아마추어 무선국을
      만들었던 장 박사는 미국으로 건너가 의사로 활동' 했고, '40년동안' 4천5백여 점을
      수집해 조선대에 기증했다고 전한다."
    source: "광주MBC 뉴스 — 기증품으로 정보통신 박물관 세워
      https://kjmbc.co.kr/NewsArticle/1221916"
    grade: C
    note: "⚠️ C 등급이고, 수집 기간이 조선대 공식(30여 년)과 어긋난다. 기간 숫자는
      발화에 쓰지 않는다. '의사로 활동' 과 '광주 최초 아마추어 무선국' 은 1차 출처와
      일치하므로 교차확인된 것으로 본다."

corrections:
  - "⚠️ `docs/exhibit-guide.md` §13 의 '조선대학교 **장황남 전파통신박물관**' 은 이름이
    틀렸다. 정식 명칭은 **장황남정보통신박물관** 이다. (조선대학교 공식 표기)"
  - "⚠️ `docs/exhibit-guide.md` §5 의 '전파·통신 관계자가 아니라 **의학박사**라는 점이
    훅' — 1차 출처(본인 인사말)에서 확인되는 것은 전남의과대학 졸업, 전남의대 약리학교실
    **석사과정** 수료, 미국에서 **내과 개업** 이다. **박사학위 취득은 어느 출처에서도
    확인되지 않는다.** 언론이 '장 박사' 로 부르는 것은 의사에 대한 통칭이다.
    → '의학박사' 대신 **'의사'** (미국에서 내과를 개업한 의사)라고 말한다.
    훅은 그대로 산다 — 전파·통신이 본업이 아닌 사람이 평생 통신 장비를 모았다는 대비다."
  - "⚠️ `docs/exhibit-guide.md` §5 의 '전남의대 재학 시절 **아마추어 무선 동아리 활동**
    으로 관심을 갖게 됐다' 는 출처와 다르다. 1차 출처는 동아리가 아니라 **본인이 무선국을
    개설·운영**했다고 적는다 — 1963년 전남 최초의 아마추어 무선 통신사, 호출부호 HM4DF.
    광주MBC 도 '광주에서 처음으로 아마추어 무선국을 만들었던' 이라고 쓴다.
    → '동아리' 를 빼고 '의대 시절 전남에서 처음으로 아마추어 무선국을 열었다' 로 바꾼다.
    '처음' 이 이 인물의 가장 강한 사실이므로 동아리로 눌러 두면 훅을 버리는 셈이다."
  - "⚠️ `docs/exhibit-guide.md` §5 의 '**40여 년간** 수집' 은 출처가 갈린다. 조선대 공식
    소개는 '30여 년간', 광주MBC(C)는 '40년동안', 본인 인사말은 기간을 못 박지 않는다.
    → 숫자를 말하지 않고 '수십 년에 걸쳐' 로 말한다. 확정하려면 조선대 박물관에 문의한다."

unverifiable:
  - "⚠️ **체험관 정식 명칭에 장황남의 이름이 들어가는지** — 확인 실패. KCA 공식 사이트
    (견학안내 www75, 본사 www86)와 웹 검색 어디에도 사람 이름이 붙은 체험관 명칭이 없다.
    **없다는 증거는 아니다** — 체험관 고유 정보 — 현장 확인 필요.
    확인 전까지 도슨트가 '제 이름이 체험관 이름에 들어 있습니다' 식으로 되풀이하지 않게
    한다. (사회자 고정 대사 mc 는 그 전제를 깔고 있으므로, 현장 확인이 최우선이다.)"
  - "⚠️ **체험관에 기증된 '200여 점'** — 확인 실패. 웹에서 확인되는 기증은 조선대학교
    4,500여 점뿐이다. 두 수를 섞지 않는다. 체험관 고유 정보 — 현장 확인 필요."
  - "조선대 박물관 소장품이 KCA 전파체험관으로 이관·대여됐는지 (`exhibit-guide.md` §13 의
    '조선대학교 …박물관에서 전시되던 전쟁 관련 군사장비') — 확인 실패. 현장 확인 필요."
  - "**생몰년** — 어느 출처에도 없다. 한국어 위키백과에 표제어가 없고, 부고 기사도
    확인되지 않았다. 나이·세대·생존 여부를 말하지 않는다."
  - "전남의과대학 졸업 연도, 미국 의사 면허·전문의 취득 시점, 개업 연도 — 확인 실패."
  - "기증 동기와 경위(왜 조선대학교였는지, 체험관 기증이 있었다면 왜였는지) — 본인
    인사말 전문을 확보하지 못했다. **지어내지 않는다.** 필요하면 조선대 박물관에 문의한다."
  - "국내 언론의 호칭이 '박사' 인 것 외에 학위 종류·수여 기관 — 확인 실패."

briefs:
  초등:
    mc_brief: "이 많은 물건을 한 사람이 모아서 주었다는 사실에 놀라는 반응으로 열고,
      그 사람이 누구인지 도슨트에게 묻는다. 어려운 직업 이름이나 학교 이름은 쓰지 않는다."
    guard: "연도·숫자·호출부호·학교 이름은 말하지 않는다. '의학박사'라고 하지 않고 '의사'라고 한다."
    docent_brief: "병을 고치는 의사 선생님이 통신 기계를 좋아해서 아주 오랫동안 하나씩
      모았고, 그걸 혼자 갖지 않고 우리가 볼 수 있게 내놓았다는 것이 핵심 훅. 이름은
      장황남이라는 것까지만. 연도·숫자·호출부호·학교 이름은 말하지 않는다.
      **'의학박사' 라고 하지 않고 '의사' 라고 한다.**"
  중고등:
    mc_brief: "전시품이 한 사람의 기증에서 나왔다는 점을 짚고 그 사람을 도슨트에게 묻는다."
    guard: "'의학박사'가 아니라 '의사'다. '동아리'라고 하지 않는다. 수량은 말하지 않는다."
    docent_brief: "본업이 전파가 아닌 사람이 평생 통신 장비를 모았다는 대비가 핵심 훅.
      전남 완도에서 태어나 의과대학을 다녔고, 1963년 전남에서 처음으로 아마추어 무선국을
      연 사람이라는 것. 1972년 미국으로 건너가 의사로 일하면서 수집을 이어갔고, 모은 것을
      기증해 2014년 조선대학교에 그의 이름을 딴 정보통신박물관이 세워졌다는 것.
      연도는 1963·1972·2014 만 쓰고 수량은 말하지 않는다.
      **'의학박사' 가 아니라 '의사' 다. '동아리' 라고 하지 않는다 — 본인이 무선국을 열었다.**"
  일반:
    mc_brief: "체험관의 전시품 상당수가 한 사람의 기증이라는 점을 언급하고, 장황남이
      누구인지 도슨트에게 소개를 청한다."
    guard: "4천5백여 점은 조선대학교 기증분이다 — 체험관 전시품 수와 섞지 않는다. 생몰년·학위·기증 동기는 말하지 않는다."
    docent_brief: "전파·통신이 본업이 아닌 의사가 평생 통신 장비를 모았다는 대비가 핵심 훅.
      전남 완도 출생, 광주고등학교와 전남의과대학을 나왔고 전남의대 약리학교실에서
      석사과정을 마쳤다는 것. 1963년 전남 최초의 아마추어 무선 통신사로 자기 무선국을
      운영했고(호출부호 HM4DF), 1972년 미국으로 이주해 뉴욕주 뉴어크에서 내과를 개업하며
      수십 년에 걸쳐 수집을 이어갔다는 것. 그 수집품 4천5백여 점을 조선대학교에 기증해
      2014년 9월 30일 **장황남정보통신박물관** 이 문을 열었다는 것.
      **4,500여 점은 조선대학교 기증분이다 — 이 체험관 전시품 수와 섞지 않는다.**
      생몰년·학위·기증 동기는 확인되지 않았으므로 말하지 않는다."
  전문가:
    mc_brief: "수집가 한 사람의 컬렉션이 공공 전시로 옮겨간 사례라는 전제를 깔고,
      그 인물의 이력을 도슨트에게 묻는다."
    guard: "수집 기간을 숫자로 말하지 않는다. 박사학위·생몰년은 말하지 않는다. 체험관 기증 규모를 단정하지 않는다."
    docent_brief: "핵심은 아마추어 무선(HAM)이 전문가와 비전문가의 경계를 허문 경로였다는
      것. 전남 완도 출생, 광주고등학교·전남의과대학 졸업, 전남의대 약리학교실 석사과정
      수료. 1963년 전남 최초의 아마추어 무선 통신사로 호출부호 HM4DF(HL 이전에 한국에
      배정됐던 접두사) 무선국을 운영했다는 것. 군 복무 후 1972년 도미, 뉴욕주 뉴어크에서
      내과를 개업하고 병원 과장·의사협회장을 역임했으며 미국 아마추어 무선 잡지 QST 에
      기술 기사가 실렸다는 것. 1920년대부터 최근까지를 아우르는 유무선 정보통신기기
      4천5백여 점을 조선대학교에 기증해 구 대학원 건물을 리모델링한 **장황남정보통신박물관**
      이 2014년 9월 30일 개관했다는 것. 수집 기간은 출처가 30여 년(조선대)과 40년(언론)으로
      갈리므로 숫자를 말하지 않는다. **박사학위·생몰년은 출처가 없어 말하지 않고,
      호칭은 '의사' 로 한다.**"

mc: "이 체험관 전시품 중에는 한 분이 기증한 것들이 있다고 들었어요. 도슨트, 장황남 박사가 누구인지 소개해 주세요."
# ⚠️ mc 는 기존 큐시트 원문 그대로다. 다만 '정식 이름에 사람 이름이 들어 있다' 는 전제가
#    웹 출처로 확인되지 않았다(unverifiable 1번). 현장 확인 후 필요하면 이 한 줄을 고친다.
# ⚠️ mc_after 의 '의학박사' 는 corrections 2번에 따라 '의사' 로 바꿨다. 사회자 고정 대사가
#    확인 안 된 학위를 못박으면 도슨트가 아무리 조심해도 관람객에게는 사실로 남는다.
mc_after: "의사가 통신 장비를 모았다는 게 뜻밖이죠. 궁금한 점 있으실까요?"
