# 조사 산출물 — 07-maritime (해상무선통신).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# ⚠️ 이 섹션은 기존 큐시트에서 **사실 오류 셋**이 나왔다. corrections 를 먼저 읽는다.
#    핵심은 "타이타닉 → GMDSS" 가 76년을 건너뛴 압축이라는 것이다.

id: "07-maritime"
title: "해상무선통신"
gaze: partner
topic: "타이타닉 침몰이 해상 무선통신 규칙을 어떻게 바꿨나 — 1912년 런던 회의·SOLAS·GMDSS"

facts:
  # ── 타이타닉 그 자체 (영국 난파위원회 공식 보고서 = 1차 출처) ──
  - claim: "영국 난파위원회(British Wreck Commissioner) 공식 보고서는 승선자 2,201명 중
      711명이 구조됐다고 적는다 — 원문 'Total on board saved 711 out of 2,201, or 32.30 per cent.'"
    source: "British Wreck Commissioner's Inquiry Report (1912), 'Number of Persons Saved'
      https://www.titanicinquiry.org/BOTInq/BOTReport/botRepSaved.php"
    grade: A
  - claim: "같은 보고서의 구조 항목 원문 — 'From these boats he took on board 712 persons,
      one of them died shortly afterwards.' 카르파티아호는 구명정에 타고 있던 사람들을
      배로 올렸다."
    source: "British Wreck Commissioner's Inquiry Report (1912), 'The Rescue by the S.S. Carpathia'
      https://www.titanicinquiry.org/BOTInq/BOTReport/botRepRescue.php"
    grade: A
  - claim: "카르파티아호 선장 로스트론은 조난 전문을 받자 즉시 배를 돌려 최고속력
      17.5노트로 달렸고, 현장에 도착해 4시 5분에 정선했다 — 원문 'he stopped his ship at 4.05.'
      타이타닉이 침몰한 시각은 2시 20분이다."
    source: "British Wreck Commissioner's Inquiry Report (1912), 'The Rescue by the S.S. Carpathia'
      / 침몰 시각은 Godalming Museum"
    grade: A
    note: "구조는 침몰 '전' 이 아니라 '후' 에 이뤄졌다. 카르파티아호가 온 시점에 배는 이미
      1시간 45분 전에 가라앉아 있었고, 구조된 사람들은 구명정 안에 있었다."
  - claim: "타이타닉의 수석 무선통신사 잭 필립스(John George 'Jack' Phillips)는 충돌 뒤
      CQD 에 이어 SOS 를 보내며 마지막까지 자리를 지켰다. 그의 마지막 전문은 2시 17분에
      다른 배에 잡혔고 배는 2시 20분에 침몰했다. 그는 살아남지 못했다."
    source: "Godalming Museum (필립스의 고향 서리주 고달밍 시립박물관)
      https://www.godalmingmuseum.co.uk/articles/jack-phillips"
    grade: B
    note: "영국 조사보고서 본문에서는 필립스의 이름을 확인하지 못했다. 박물관 해설이라 B."

  # ── 그 사고가 실제로 바꾼 것 ──
  - claim: "영국 조사위원회의 권고 제20항 원문 — 'there should be an installation of wireless
      telegraphy, and that such installation should be worked with a sufficient number of
      trained operators to secure a continuous service by night and day.'
      즉 무선설비를 갖추고 **밤낮 끊기지 않는 당직**을 세우라는 권고다."
    source: "British Wreck Commissioner's Inquiry Report (1912), Recommendations
      https://www.titanicinquiry.org/BOTInq/BOTReport/botRepRec.php"
    grade: A
    note: "이 한 줄이 '타이타닉이 무엇을 바꿨나' 의 정답이다. 사람이 아니라 제도가 바뀌었다."
  - claim: "ITU 공식 역사 — 참사 몇 달 뒤 열린 1912년 런던 국제무선전신회의(International
      Radiotelegraph Conference)가 선박 조난신호의 공통 파장에 합의했고, 모든 선박이 정해진
      간격으로 무선을 침묵하고 그 동안 조난 호출을 듣도록 하는 규정을 세웠다."
    source: "ITU — Overview of ITU's History
      https://www.itu.int/en/history/Pages/ITUsHistory-page-2.aspx"
    grade: A
  - claim: "모스부호 SOS 는 1906년 첫 국제무선전신회의에서 국제 해상 조난신호로 정해졌다 —
      타이타닉보다 6년 앞선다."
    source: "ITU — ITU's maritime journey: Then and now
      https://www.itu.int/hub/2022/06/seafarer-day-itu-maritime-publications/"
    grade: A
  - claim: "IMO 공식 — 해상인명안전협약(SOLAS)의 'The first version was adopted in 1914,
      in response to the Titanic disaster.' 지금 쓰는 것은 1974년 채택본이다."
    source: "IMO — International Convention for the Safety of Life at Sea (SOLAS), 1974
      https://www.imo.org/en/About/Conventions/Pages/International-Convention-for-the-Safety-of-Life-at-Sea-(SOLAS),-1974.aspx"
    grade: A

  # ── GMDSS 는 훨씬 나중이다 ──
  - claim: "IMO 공식 — 'In 1988, IMO's Member States adopted the basic requirements of the
      global maritime distress and safety system or GMDSS as part of SOLAS, and the system
      was phased in from 1992 onwards.' 그리고 'The full implementation of the GMDSS on
      1 February 1999 was an important date in maritime history.'"
    source: "IMO — GMDSS Introduction / History
      https://www.imo.org/en/ourwork/safety/pages/introduction-history.aspx"
    grade: A
  - claim: "GMDSS 는 SOLAS 제IV장(Radiocommunications)에 담겨 있고, 국제항해에 종사하는
      모든 여객선과 총톤수 300톤 이상 화물선이 대상이다. 위성 비상위치지시용 무선표지(EPIRB)와
      수색구조용 레이더 트랜스폰더(SART)가 필수 장비에 들어간다."
    source: "IMO — SOLAS 1974, Chapter IV 설명"
    grade: A
  - claim: "GMDSS 는 해역을 넷으로 나눈다 — A1(VHF 해안국 권역, 통상 약 30해리),
      A2(MF 해안국 권역, 통상 약 100~300해리), A3(정지궤도 이동위성 서비스 권역),
      A4(그 밖의 해역, HF). 선박 장비는 VHF·MF·HF 무선전화와 디지털선택호출(DSC),
      위성(Inmarsat·Iridium), 406MHz EPIRB, 9GHz 레이더 SART, NAVTEX 등이다."
    source: "ITU World Radiocommunication Seminar 2024 — Maritime Communications
      https://www.itu.int/en/ITU-R/seminars/wrs/Documents/2024/Presentations/29-Emmet_Maritime%20Communications.pdf"
    grade: A
  - claim: "ITU 전파규칙(Radio Regulations) 제31조가 GMDSS 조난·안전 주파수를 정하고
      (구체 목록은 부록 15), 제32조가 GMDSS 조난통신의 운용절차를 정한다."
    source: "ITU WRS-24 Maritime Communications 자료 (같은 URL)"
    grade: A
  - claim: "GMDSS 무선전화 조난·안전 주파수에는 2,182kHz 와 156.8MHz(VHF 16채널)가,
      DSC 조난호출에는 2,187.5kHz 와 156.525MHz(VHF 70채널)가 포함된다."
    source: "ITU Radio Regulations 관련 문서 (itu.int) — 부록 15 원문은 직접 열람하지 못했다"
    grade: B
    note: "⚠️ 숫자는 ITU 문서에서 나왔지만 부록 15 원문 확인은 못 했다. 전문가 수준에서만
      쓰고, 그마저도 '부록 15에 정리돼 있다' 정도로 말하는 편이 안전하다."

  # ── 국내법으로 어떻게 내려왔나 ──
  - claim: "선박안전법 제29조제1항 — 국제항해에 취항하는 여객선과 총톤수 300톤 이상 선박의
      소유자는 「해상에서의 인명안전을 위한 국제협약」에 따른 **세계 해상조난 및 안전제도**의
      시행에 필요한 무선설비를 갖추어야 하고, 그 무선설비는 「전파법」에 따른 성능과 기준에
      적합하여야 한다. 제3항은 이 설비 없이 선박을 항해에 쓰지 못하게 한다."
    source: "법제처 국가법령정보센터 — 선박안전법 제29조 https://www.law.go.kr/법령/선박안전법"
    grade: A
    note: "'세계 해상조난 및 안전제도' 가 GMDSS 의 국내법 표기다. SOLAS → 선박안전법 →
      전파법으로 이어지는 사슬이 한 조문 안에 다 들어 있다."
  - claim: "전파법 제25조제2항제1호 — 조난통신이란 '선박이나 항공기가 중대하고 급박한 위기에
      처한 경우에 조난신호를 먼저 보낸 후에 하는 무선통신' 이다. 같은 항이 긴급통신·안전통신·
      비상통신도 함께 정의한다. 이 통신들은 허가증에 적힌 범위를 벗어나도 할 수 있다."
    source: "법제처 국가법령정보센터 — 전파법 제25조 https://www.law.go.kr/법령/전파법"
    grade: A
  - claim: "전파법 제28조제2항 — 해안국·선박국·항공국·항공기국은 조난통신을 수신하면
      '다른 모든 무선통신에 우선하여 즉시 응답' 하고 구조에 가장 편리한 위치에 있는 무선국에
      통보하는 등 최선의 조치를 하여야 한다."
    source: "법제처 국가법령정보센터 — 전파법 제28조"
    grade: A
    note: "1912년 영국 조사위원회 권고(밤낮 없는 당직)가 114년 뒤 우리 법 조문에 그대로
      살아 있다는 것 — 이 대비가 일반·전문가 수준의 가장 좋은 마무리다."

corrections:
  - "⚠️ 현재 `data/cues.yaml` 의 **'695명을 구조'** 는 어느 공식 조사와도 맞지 않는다.
    영국 난파위원회 보고서는 2,201명 중 **711명 생존**, 카르파티아호가 구명정에서
    **712명**을 올려 그중 1명이 곧 사망했다고 적는다(미국 상원 조사 기준으로는 약 705명이
    널리 인용된다). 695라는 숫자의 출처는 확인하지 못했다.
    → 숫자를 쓰려면 '2,201명 중 711명(영국 공식 조사 기준)' 이거나 '약 700명' 으로 한다."
  - "⚠️ 현재 큐시트의 **'이 사고가 계기가 되어 GMDSS가 만들어졌고'** 는 76년을 건너뛴다.
    타이타닉이 직접 낳은 것은 (1) 1912년 런던 국제무선전신회의의 공통 조난주파수와
    무선 청취 의무(ITU 계열), (2) **1914년 SOLAS**(IMO 계열)다. GMDSS 는 훨씬 뒤인
    **1988년 SOLAS 개정**으로 채택됐다. → '타이타닉 → 1914년 SOLAS → 그 협약의 1988년
    개정으로 GMDSS' 라는 사슬로 말한다."
  - "⚠️ 현재 큐시트의 **'1992년에 도입됐다'** 는 반만 맞다. 1992년 2월 1일은 **단계 도입의
    시작**이고 전면 시행은 **1999년 2월 1일**이다 — 그날 모스부호가 해상에서 퇴장했다.
    연도를 하나만 말해야 한다면 전면 시행 연도인 1999년이다."
  - "⚠️ 현재 큐시트의 **'세 시간 거리에 있던 여객선이 이를 듣고 구조했다'** 는 구조가
    침몰 전이나 직후에 이뤄진 것처럼 들린다. 공식 보고서 기준으로 타이타닉은 2시 20분에
    침몰했고 카르파티아호는 **4시 5분에 정선**했다 — 침몰 1시간 45분 뒤다. 구조된 사람들은
    이미 구명정에 타고 있던 사람들이다(정본 「걷어낸 것」 3번과 같은 취지).
    → '몇 시간 떨어진 곳에서 달려왔다' 로 뭉개거나 도착 시각을 쓴다."

briefs:
  초등:
    mc_brief: "배가 바다 한가운데서 큰일이 났을 때 어떻게 도움을 부르는지 궁금하다는 투로
      열고 도슨트에게 넘긴다. 배 이름과 연도, 사람 수는 말하지 않는다."
    docent_brief: "아주 옛날 큰 배가 바다에서 가라앉을 때, 한 사람이 끝까지 자리를 지키며
      '도와주세요' 신호를 전파로 계속 보냈다는 것. 그 신호를 들은 다른 배가 달려와 많은
      사람을 구했다는 것. 그때부터 배들은 언제나 서로의 구조 신호를 듣고 있기로 약속했다는 것.
      숫자·연도·배 이름·죽음은 말하지 않는다. 2~3문장."
  중고등:
    mc_brief: "이번 주제는 바다 위의 무선통신이라고 알리고, 타이타닉 이야기를 도슨트에게
      청한다. '그 사고가 바꾼 것' 에 초점이 있다는 걸 미리 깔아 준다."
    docent_brief: "핵심 훅은 '사고가 사람을 바꾼 게 아니라 규칙을 바꿨다' 는 것.
      1912년 타이타닉이 침몰할 때 무선통신사가 마지막까지 구조 신호를 보냈고, 그 신호를 들은
      다른 배가 달려와 구명정의 사람들을 구했다는 것. 그 뒤 조사위원회가 '모든 배는 밤낮
      끊기지 않게 무선을 지켜야 한다' 고 권고했고, 그 권고가 국제 규칙이 됐다는 것.
      연도는 1912년만 말한다. 구조 인원 수는 말하지 않는다. 3~4문장."
  일반:
    mc_brief: "이번 주제는 바다 위의 무선통신이라고 알리고 타이타닉 이야기를 청한다.
      뒤에 '그래서 지금 규칙이 이렇게 됐다' 가 올 것을 예고한다."
    docent_brief: "핵심 훅은 '전파가 사람을 구했고, 그 경험이 제도가 됐다'.
      1912년 4월 타이타닉 침몰 때 수석 무선통신사 잭 필립스가 마지막까지 CQD 와 SOS 를
      보냈다는 것. 그 신호를 받은 카르파티아호가 달려와 구명정의 사람들을 구했고, 공식 조사
      기준으로 승선자 2,201명 중 약 700명이 살아남았다는 것. 사고 몇 달 뒤 1912년 런던
      국제무선전신회의가 조난신호의 공통 주파수를 정하고 선박이 정해진 시간마다 조난 호출을
      듣도록 했으며, 1914년에는 해상인명안전협약(SOLAS)이 처음 채택됐다는 것.
      지금 쓰는 국제해상조난안전시스템(GMDSS)은 그 SOLAS 의 1988년 개정으로 들어와
      1999년에 전면 시행됐다는 것. **'695명' 과 '타이타닉 때문에 GMDSS가 생겼다' 는
      말하지 않는다** — 둘 다 틀렸다. 4~5문장."
  전문가:
    mc_brief: "제도사의 관점을 전제로 깔고 — 사고 하나가 국제 규칙을 어디까지 바꿨는지 —
      도슨트에게 타이타닉의 규제사적 유산을 묻는다."
    docent_brief: "영국 난파위원회 보고서의 숫자로 연다: 승선 2,201명 중 711명 생존(32.30%),
      카르파티아호가 구명정에서 712명을 올렸고 4시 5분 정선 — 침몰(2시 20분) 1시간 45분 뒤다.
      같은 보고서 권고 제20항이 '충분한 수의 훈련된 통신사로 밤낮 끊기지 않는 당직' 을
      요구했다는 것. 그 권고가 두 갈래로 흘렀다는 것 — ITU 쪽은 1912년 런던 국제무선전신회의의
      공통 조난파장과 청취 의무(SOS 자체는 1906년 회의에서 이미 정해졌다), IMO 쪽은 1914년
      최초 SOLAS. GMDSS 는 1988년 SOLAS 개정으로 채택돼 1992년 2월 1일부터 단계 도입,
      1999년 2월 1일 전면 시행이며 SOLAS 제IV장에 담긴다는 것. GMDSS 는 해역을 A1(VHF 약
      30해리)·A2(MF 약 100~300해리)·A3(정지위성)·A4(그 밖, HF)로 나누고 406MHz EPIRB 와
      9GHz SART 를 필수 장비로 두며, 주파수는 ITU 전파규칙 제31조와 부록 15, 운용절차는
      제32조가 정한다는 것. 국내법으로는 선박안전법 제29조가 '세계 해상조난 및 안전제도'
      설비를 의무화하고 전파법 제28조제2항이 조난통신에 '다른 모든 무선통신에 우선하여 즉시
      응답' 할 의무를 지운다는 것 — 1912년 권고가 지금 우리 법 조문에 그대로 살아 있다.
      5~7문장. 조항 번호와 정확한 값을 그대로 말해도 된다."

