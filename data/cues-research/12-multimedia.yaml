researchable:
  - "KCA 가 '아마존의 눈물'·'남극의 눈물'·'최후의 제국'·'슈퍼 피쉬' 제작을 지원했는지 —
    KCA 공식 또는 방송통신발전기금 지원 실적으로 확인 가능해 보인다. A/B 등급 가능."
  - "전국 스마트미디어센터 개소 수(기존 지시문은 6개소) 와 현재 명칭 — 공식 확인 필요.
    `10-ham` 에서 'KCA 9개 지역본부' 가 실제로는 **10개 지방본부** 로 틀렸던 전례가 있다.
    기관 내부 조직·시설 수치는 이 큐시트에서 반복적으로 틀린 자리다."
  - "빛마루방송지원센터의 소재지와 운영 주체 — 공식 확인 가능."
  - "스마트미디어 X캠프 개최 주기 — 공식 확인 가능."

unverifiable:
