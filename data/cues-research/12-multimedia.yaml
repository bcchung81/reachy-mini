briefs:
  초등:
    mc_brief: "여기서는 방송 프로그램을 볼 수 있다고 알리고 도슨트에게 넘긴다."
    docent_brief: "여기는 방송 프로그램을 직접 볼 수 있는 곳이라는 것. **프로그램
      이름을 말하지 않는다** — 어떤 작품이 있는지 확인되지 않았다."
  중고등:
    mc_brief: "KCA 가 방송 콘텐츠 제작도 돕는다는 점을 짚고 넘긴다."
    docent_brief: "전파를 관리하는 일만 하는 게 아니라 그 위에 실리는 방송 콘텐츠
      제작도 돕는다는 것. 구체 작품명과 시설 수치는 확인 전이므로 말하지 않는다."
  일반:
    mc_brief: "KCA 의 콘텐츠 지원 역할을 소개하고 도슨트에게 넘긴다."
    docent_brief: "방송통신 진흥과 관련된 콘텐츠를 볼 수 있는 공간이라는 것과,
      KCA 가 제작 지원 사업을 한다는 것. **작품명·센터 개소 수는 확인 전이라
      말하지 않는다** — 기관 내부 수치는 이 큐시트에서 반복해서 틀린 자리다."
  전문가:
    mc_brief: "기금 기반 콘텐츠 제작지원이 진흥원 사업 어디에 해당하는지 묻는다."
    docent_brief: "전파법 제66조④의 진흥 사업과 방송통신발전기금 운용이 이 공간의
      배경이라는 것(`_law-basis.yaml` 참고). 구체 지원작과 시설 수치는 확인 전이다."

mc: "KCA가 방송 콘텐츠도 지원한다고 하던데요. 도슨트, 멀티미디어실에서는 어떤 것을 볼 수 있나요?"
mc_after: "전파를 관리하는 일만 하는 게 아니었군요. 궁금한 점 있으실까요?"
