briefs:
  초등:
    mc_brief: "초록 천 앞에서 사진을 찍으면 무슨 일이 생기는지 궁금하게 만들고 넘긴다."
    docent_brief: "초록색 천 앞에 서면 그 초록색만 쏙 빼고 다른 그림을 넣을 수 있다는 것.
      그래서 가만히 서 있어도 다른 곳에 간 것처럼 보인다는 것."
  중고등:
    mc_brief: "크로마키가 뭔지 도슨트에게 묻는다."
    docent_brief: "특정 색을 골라내 투명하게 만들고 그 자리에 다른 영상을 합성하는
      기법이라는 것과, 날씨예보·영화에서 쓰인다는 것."
  일반:
    mc_brief: "크로마키 체험 코너를 소개하고 원리를 도슨트에게 묻는다."
    docent_brief: "다른 카메라로 찍은 배경에 전경을 합성하는 기법이고 SF 영화나
      뉴스 날씨예보에 많이 쓰인다는 것. 체험 운영 방식(사진 전송 등)은 확인 전이라
      단정하지 않는다."
  전문가:
    mc_brief: "왜 하필 초록·파랑인지로 화제를 연다."
    docent_brief: "색상 키잉의 원리와 배경색 선택의 이유. **다만 그 이유(피부색과의
      색상 거리)는 이번 라운드에서 출처를 확보하지 않았으므로, 확인 전에는 원리만
      말하고 색 선택 이유는 말하지 않는다.**"

mc: "크로마키 체험 코너 이야기도 해 보죠. 도슨트, 크로마키가 뭔가요?"
mc_after: "가만히 서 있어도 다른 곳에 간 것처럼 보이는 거네요. 궁금한 점 있으실까요?"
