# 조사 산출물 — 15-emf (전자파 측정).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# ⚠️ 이 섹션은 오해·과장이 가장 많은 주제다. 아래 facts 는 전부 1차 출처
#    (전파법·과기정통부 고시 원문 / WHO / IARC / ICNIRP) 로만 채웠다.
#    **건강 영향에 대한 단정은 어느 방향으로도 쓰지 않는다.** 안전하다는 단정도
#    위험하다는 단정도 1차 출처에 없다. 출처가 쓰는 표현은
#    "기준 이하 노출에서 인과적으로 확인된 악영향이 없다" 이지 "안전하다" 가 아니다.
#
# ⚠️ 기존 큐시트에서 **사실·논리 오류 넷**이 나왔다. corrections 를 먼저 읽는다.

id: "15-emf"
title: "전자파 측정"
gaze: audience
topic: "전자파 인체보호기준과 전자파 등급제 — 무엇을 어떤 기준으로 재는가"

facts:
  # ── 국내 법·고시 (법제처 국가법령정보센터 원문) ──────────────────────────
  - claim: "전파법 제47조의2 제1항은 과학기술정보통신부장관이 전자파 인체보호기준,
      전자파 등급기준, 전자파 강도 측정기준, 전자파 흡수율 측정기준, 전자파 측정대상
      기자재와 측정방법, 전자파 등급 표시대상과 표시방법을 정하여 고시하도록 규정한다."
    source: "법제처 국가법령정보센터 — 전파법 제47조의2 (법령ID 001732)
      https://www.law.go.kr/법령/전파법"
    grade: A
  - claim: "전파법 제47조의2 제2항은 무선국 시설자·제작자·수입자가 전자파 강도를
      인체보호기준 이하로 유지하도록 하고, **그 기준을 초과하는 장소에는 취급자 외의
      자가 출입할 수 없도록 안전시설을 설치**하도록 규정한다. 제6항은 기준 초과 시
      안전시설 설치·운용제한·운용정지 등을 명할 수 있게 한다."
    source: "법제처 — 전파법 제47조의2 제2항·제6항 (원문 인용)"
    grade: A
    note: "'기준 초과 = 출입 차단' 이 법의 태도다. 시연에서 빨간불을 켜 놓고
      '그래도 괜찮다' 로 설명하면 이 조문과 정면으로 어긋난다."
  - claim: "「전자파인체보호기준」(과학기술정보통신부 고시 제2019-4호, 2019. 1. 16.)
      별표1의 일반인 전자파강도기준 중 — 10㎒ 이상 400㎒ 미만은 전기장강도 28 V/m,
      자기장강도 0.073 A/m, 전력밀도 2 W/㎡ 이고, 2㎓ 이상 300㎓ 미만은 전기장강도
      61 V/m, 자기장강도 0.16 A/m, 전력밀도 10 W/㎡ 이다."
    source: "법제처 — 행정규칙 「전자파인체보호기준」 별표1 (행정규칙일련번호 2100000175532)
      https://www.law.go.kr/행정규칙/전자파인체보호기준"
    grade: A
    note: "초단파(VHF, 30~300㎒) 무전기 시연은 10~400㎒ 구간에 들어간다 — 해당
      일반인 기준은 전기장 28 V/m."
  - claim: "같은 고시 별표2의 직업인 기준은 일반인 기준보다 높다 — 10~400㎒ 에서
      전기장강도 61 V/m, 전력밀도 10 W/㎡, 2~300㎓ 에서 137 V/m, 50 W/㎡."
    source: "법제처 — 「전자파인체보호기준」 별표2"
    grade: A
    note: "기준이 하나가 아니라 둘(일반인/직업인)이라는 점이 등급제를 이해하는 열쇠다."
  - claim: "같은 고시 별표3의 전자파흡수율(SAR) 기준은 100㎑~10㎓ 에서 일반인
      전신 0.08 W/kg, 머리/몸통 1.6 W/kg, 사지 4 W/kg 이고, 직업인은 각각
      0.4 / 8 / 20 W/kg 이다."
    source: "법제처 — 「전자파인체보호기준」 별표3"
    grade: A
  - claim: "같은 고시 제3조제3항 및 별표 비고 9는 60㎐ 주파수대역의 전기설비(송전선로)에
      이 기준을 적용하지 않는다고 명시한다."
    source: "법제처 — 「전자파인체보호기준」 제3조제3항"
    grade: A
    note: "'전자파 기준' 을 송전선로 논쟁까지 끌어다 쓰지 않게 막아 주는 조문이다."

  # ── 전자파 등급제 ────────────────────────────────────────────────────
  - claim: "「전자파 등급기준, 표시대상 및 표시방법 고시」(과학기술정보통신부 고시
      제2017-20호) 별표1의 전자파강도 등급은 넷이다 — 1등급은 측정값이 일반인
      기준의 50% 이하, 2등급은 일반인 기준의 50% 초과~일반인 기준 이하,
      주의등급은 일반인 기준 초과~직업인 기준 이하, 경고등급은 직업인 기준 초과."
    source: "법제처 — 행정규칙 「전자파 등급기준, 표시대상 및 표시방법 고시」 별표1
      (행정규칙일련번호 2100000099676)"
    grade: A
    note: "'4단계' 자체는 기존 큐시트가 맞다. 틀린 것은 경계값이 빠진 것과,
      이 등급을 체험관 장비 불빛으로 설명한 것이다."
  - claim: "같은 고시 별표2의 전자파강도 등급 라벨 색상은 **넷**이다 —
      1등급 연두, 2등급 파랑, 주의등급 주황, 경고등급 빨강.
      라벨에는 등급·측정값·측정일을 함께 표시해야 한다."
    source: "법제처 — 같은 고시 별표2 '도안요령 및 색채'"
    grade: A
  - claim: "같은 고시 제2조제1항에 따라 전자파강도 등급을 표시해야 하는 설비는
      「전파법 시행령」 제65조의 **전자파강도 보고대상 무선국**이다. 즉 등급 라벨은
      기지국·방송국 같은 무선국 설비에 붙이는 제도이지, 주변 공기의 전자파를
      실시간으로 재는 장치의 표시 체계가 아니다."
    source: "법제처 — 같은 고시 제2조제1항 + 전파법 시행령 제65조"
    grade: A
  - claim: "전파법 시행령 별표6의 보고대상 기준 — 이동통신·휴대인터넷 기지국·이동중계국은
      송신장치 안테나공급전력의 합이 30W 초과, 무선호출·주파수공용통신·방송국 등은 60W
      초과이고, 설치장소는 주거·상업·공업지역과 관리지역일 것."
    source: "법제처 — 전파법 시행령 [별표 6] (개정 2022. 1. 11.)"
    grade: A
  - claim: "휴대전화 등 휴대용 무선설비에 붙는 **전자파흡수율 등급은 2단계**다 —
      같은 고시 별표3 기준으로 1등급은 SAR 측정값 0.8 W/kg 이하, 2등급은 0.8 초과
      1.6 W/kg 이하(머리에 근접해 시험한 1g 평균값)."
    source: "법제처 — 같은 고시 제3조·별표3"
    grade: A
    note: "전자파강도 등급(4단계)과 전자파흡수율 등급(2단계)은 서로 다른 제도다.
      섞어 말하면 관람객이 '4등급 휴대폰' 같은 존재하지 않는 개념을 가져간다."
  - claim: "전자파 등급제는 2014년 8월 1일부터 시행됐다 — 고시 부칙 <제2013-29호,
      2013. 8. 1.> 제1조가 '고시한 날로부터 1년 후에 시행한다' 고 정했다."
    source: "법제처 — 같은 고시 부칙 제2013-29호 / 교차확인: 생활속 전자파 누리집
      https://emf.kca.kr/web/overview/system.do ('2014년부터 시행')"
    grade: A

  # ── 국제기구 ─────────────────────────────────────────────────────────
  - claim: "WHO 는 '전자파의 세기는 발생원에서 가장 크고 거리에 따라 빠르게 줄어든다'
      고 기술한다. (원문: \"The strength of RF fields is greatest at its source,
      and diminishes quickly with distance.\")"
    source: "WHO Backgrounder, Base stations and wireless technologies, May 2006
      https://www.who.int/teams/environment-climate-change-and-health/radiation-and-health/non-ionizing/wireless"
    grade: A
    note: "2006년 자료다. '거리에 따라 급감한다' 까지가 출처가 보증하는 범위이고,
      거기서 '그러므로 유해하지 않다' 로 건너뛰는 문장은 출처에 없다."
  - claim: "같은 WHO 자료는 기지국으로부터의 RF 노출이 국제 노출 가이드라인 수준의
      0.002%~2% 범위라고 기술하고, '지금까지 축적된 모든 증거로 볼 때 기지국이
      만드는 RF 신호로 인한 단기·장기 건강 영향은 확인된 바 없다' 고 적는다.
      (원문: \"no adverse short- or long-term health effects have been shown to
      occur from the RF signals produced by base stations.\")"
    source: "WHO Backgrounder, May 2006 (위와 동일)"
    grade: A
    note: "2006년 수치다. 최신 값으로 말하지 않는다."
  - claim: "WHO 의 5G Q&A(2020. 2. 27.)는 '지금까지 많은 연구가 수행됐으나 무선기술
      노출과 인과적으로 연결된 건강상 악영향은 없다' 고 기술한다. (원문: \"To date,
      and after much research performed, no adverse health effect has been
      causally linked with exposure to wireless technologies.\")"
    source: "WHO Q&A — Radiation: 5G mobile networks and health, 2020-02-27
      https://www.who.int/news-room/questions-and-answers/item/radiation-5g-mobile-networks-and-health"
    grade: A
    note: "이것이 국제기구가 쓰는 가장 강한 표현이다. '안전합니다' 가 아니라
      '인과적으로 연결된 악영향이 확인되지 않았다' 이다. 그대로 옮긴다."
  - claim: "IARC(WHO 국제암연구소)는 2011년 5월 31일, 휴대전화에서 방출되는 것과 같은
      무선주파수 전자기장을 인체발암가능물질 2B군(possibly carcinogenic to humans)으로
      분류했다. 2B 는 사람에 대한 발암 근거가 제한적이고 동물 실험 근거는 충분하지
      않은 경우에 쓰는 분류다."
    source: "IARC Press Release N° 208, 31 May 2011
      https://www.iarc.who.int/wp-content/uploads/2018/07/pr208_E.pdf"
    grade: A
    note: "2B 는 '위험하다' 가 아니라 '배제하지 못했다' 다. 이 두 가지(확인된 악영향
      없음 / 2B 분류)를 **함께** 말해야 어느 쪽으로도 기울지 않는다."
  - claim: "ICNIRP 는 2020년 'Guidelines for limiting exposure to electromagnetic
      fields (100 kHz to 300 GHz)' 를 발표해 1998년 가이드라인의 무선주파수 부분을
      갱신했다. 국내 「전자파인체보호기준」 고시의 현행판은 2019년(제2019-4호)이다."
    source: "ICNIRP https://www.icnirp.org/en/publications/article/rf-guidelines-2020.html
      / 국내 고시 개정 이력은 법제처 부칙"
    grade: A
    note: "국내 기준이 ICNIRP 2020 을 반영했는지는 이 조사에서 확인하지 못했다.
      '국제기준과 같다' 는 식의 단정을 하지 않는다 — unverifiable 참조."

  # ── 기관 해설 (B) ────────────────────────────────────────────────────
  - claim: "국립전파연구원 해설에 따르면 인체보호기준은 인체에 영향을 줄 수 있는
      임계치에 안전계수 1/50 을 적용해 도출한 값이며, 동물실험 임계치 4 W/kg 에
      안전계수 50 을 적용해 전신 0.08 W/kg 을 기준으로 삼았다고 설명한다."
    source: "국립전파연구원 생활속전자파 — 전자파 인체보호기준
      https://www.rra.go.kr/emf/wrongfact/knowing/index08.do"
    grade: B
    note: "고시 별표3의 일반인 전신 SAR 0.08 W/kg 과 4÷50=0.08 이 정확히 맞아
      수치는 교차확인됐다. 다만 '안전계수 50' 이라는 설명 자체는 고시 본문이 아니라
      해설 페이지의 서술이므로 B 로 둔다."
  - claim: "과기정통부는 생활환경 전자파 측정 결과로 전기자동차는 기준 대비 최대 11%,
      전기시내버스는 최대 2.12%, 지하철 1~9호선은 기준(833mG) 대비 최대 18.7%·평균
      0.6% 수준이었다고 밝혔다."
    source: "대한민국 정책브리핑 — 과학기술정보통신부 설명자료, 2023-08-14
      https://www.korea.kr/briefing/actuallyView.do?newsId=148918917"
    grade: A
    note: "측정 대상과 시점을 반드시 함께 말한다. 지하철 값은 2013년 국립환경과학원
      조사이고, 833mG(=83.3μT)는 60㎐ 자속밀도 기준으로 고시 별표1의
      5/f μT(f=0.06㎑) 계산과 일치한다."

corrections:
  - "⚠️ 현재 `data/cues.yaml` 의 '전자파 강도가 거리에 따라 급격히 감소해 일정 거리를
    두면 **인체에 유해하지 않다**는 뜻' 은 **출처 없는 건강 단정이다.** 앞 절(거리에
    따라 급감)은 WHO 표현으로 뒷받침되지만, 뒷 절은 어느 1차 출처도 그렇게 말하지
    않는다. WHO 의 표현은 '인과적으로 연결된 악영향이 확인된 바 없다' 이고, IARC 는
    무선주파수 전자기장을 2B(발암 가능)로 분류해 두었다. 단정형을 삭제하고
    '기준' 과 '확인된 바 없다' 로 바꿔 말한다."
  - "⚠️ **빨간불의 의미가 뒤집혀 있다.** 고시 별표1·별표2에서 빨강은 경고등급이고,
    경고등급은 **직업인 기준을 초과한** 구간이다. 전파법 제47조의2 제2항은 기준을
    초과하는 장소에 취급자 외의 출입을 막는 안전시설을 설치하도록 한다. '빨간불이
    켜져도 조금 떨어지면 괜찮다' 는 설명은 법이 출입을 차단하는 구간을 안전하다고
    소개하는 꼴이 된다. 시연 장비의 빨간불이 고시의 경고등급을 뜻하는 것이 아니라면
    **그 점을 먼저 갈라 말한 뒤** 시연을 설명한다."
  - "⚠️ 현재 큐시트는 '4단계 등급' 을 말한 직후 '세 가지 불빛' 으로 넘어가 **한 문단
    안에서 수가 어긋난다.** 고시의 전자파강도 등급 라벨은 4색(연두·파랑·주황·빨강)이다.
    장비 표시등이 정말 셋이라면 그것은 등급제와 다른 체계이므로 등급제 설명과
    섞어서는 안 된다(장비 사양은 unverifiable 참조)."
  - "⚠️ 현재 큐시트는 등급제를 체험관 측정 장비의 표시 방식인 것처럼 설명한다.
    등급제는 전파법 시행령 제65조·별표6의 **보고대상 무선국(기지국·방송국 등)에
    라벨을 붙이는 제도**다. 또 '인체보호기준에 맞춰 4단계' 라고만 하면 1등급이
    일반인 기준의 50% 이하라는 실제 경계가 빠지고, 주의·경고 등급이 이미 일반인
    기준을 넘어선 구간이라는 사실도 가려진다."
  - "현재 `mc_after` 의 '거리를 조금만 두면 괜찮다는 게 핵심이군요' 는 사회자가 위
    첫 번째 단정을 그대로 승인해 버리는 문장이다. 사실이 보증하는 범위인 '거리에
    따라 세기가 빠르게 줄어든다' 로 좁혀 다시 썼다."

unverifiable:
  - "체험관에 전시된 전자파 실시간 모니터링 장비의 기종·측정 주파수 범위·표시등 개수·
    색상·점등 임계값 — 체험관 고유 정보, 현장 확인 필요. 이 값을 모르면 '빨간불이
    무엇을 뜻하는지' 를 말할 수 없고, 말하면 고시의 경고등급과 혼동된다."
  - "'세 가지 불빛' 이 맞는지 — 체험관 고유 정보, 현장 확인 필요. 고시 라벨은 4색이다."
  - "시연에 쓰는 초단파 무전기의 주파수·안테나공급전력·시연 시 이격 거리 —
    체험관 고유 정보, 현장 확인 필요. 이 세 값 없이는 '얼마나 떨어지면 기준 이하인지'
    를 수치로 말할 수 없다. 전문가 수준에서도 추정치를 말하지 않는다."
  - "KCA 가 전자파 강도 측정·전파품질 관리 업무를 정부로부터 위탁받았다는 **근거 조문** —
    전파법 및 같은 법 시행령에서 확인하지 못했다. 사회자 대사가 이를 전제하므로
    KCA 내부 문서나 위탁 협약으로 확인이 필요하다. 확인 전까지 조항 번호를 말하지 않는다."
  - "국내 「전자파인체보호기준」(2019)이 ICNIRP 2020 가이드라인을 반영했는지 —
    확인하지 못했다. '우리 기준은 국제기준과 같다' 는 단정을 쓰지 않는다."

briefs:
  초등:
    mc_brief: "전자파는 눈에 보이지도 않는데 어떻게 세기를 알 수 있느냐고 궁금해하며
      도슨트에게 넘긴다. '안전한가요' 같은 예·아니오 질문으로 단답을 끌어내지 않는다.
      숫자·등급 이름·기관 이름은 쓰지 않는다."
    guard: "안전하다고도 위험하다고도 말하지 않는다. 숫자·등급 이름·법 이름은 쓰지 않는다."
    docent_brief: "전자파는 멀어질수록 빠르게 약해진다는 것이 핵심 훅 — 난롯불에서
      한 걸음 물러나면 덜 뜨거운 것에 빗댄다. 나라가 '여기까지' 라는 선을 정해 두고
      어른들이 그 선을 넘지 않는지 계속 재고 있다는 것까지만 말한다.
      **안전하다고도 위험하다고도 말하지 않는다.** 숫자·등급 이름·법 이름은 쓰지 않는다."
  중고등:
    mc_brief: "전자파 세기를 누가 무슨 기준으로 판단하는지 도슨트에게 묻는다.
      안전 여부를 단정적으로 물어 단답을 유도하지 않는다."
    guard: "'확인된 적 없다'를 '안전하다'로 바꿔 말하지 않는다. 연도 외의 수치는 말하지 않는다."
    docent_brief: "세기가 거리에 따라 빠르게 줄어든다는 원리, 그래서 '얼마나 센가' 는
      언제나 '어디서 쟀나' 와 함께여야 한다는 점이 핵심 훅. 국가가 일반인 기준과
      직업인 기준을 따로 정해 두었고, 기지국 같은 설비에는 그 기준 대비 세기를 등급
      라벨로 표시하게 돼 있다는 것(2014년부터 시행). 국제기구의 정리를 '기준 이하에서
      건강에 나쁜 영향이 확인된 적은 없다' 는 표현 **그대로** 전하고, 동시에 연구가
      아직 진행 중이라는 점도 덧붙인다 — '안전하다' 로 바꾸지 않는다.
      연도 외의 수치는 말하지 않는다."
  일반:
    mc_brief: "전파품질 관리 업무를 소개하면서, 전자파 세기를 어떻게 재고 무엇을
      기준으로 판단하는지 도슨트에게 묻는다."
    guard: "건강 영향은 '기준 이하에서 확인된 악영향 없음'과 '국제암연구소의 발암 가능 분류'를 반드시 한 묶음으로 말한다. 등급이 체험관 장비의 불빛이라고 하지 않는다."
    docent_brief: "① 국가가 전파법에 따라 전자파 인체보호기준(고시)을 정해 두었고
      일반인 기준과 직업인 기준이 따로 있다는 것. ② 일정 규모 이상의 무선국(기지국·
      방송국 등)은 세기를 측정해 보고하고 1등급·2등급·주의·경고 네 가지 등급 라벨을
      붙이게 돼 있으며, 1등급은 일반인 기준의 절반 이하라는 것 — 등급은 설비에
      붙는 것이지 체험관 장비의 불빛이 아니라는 구분을 명확히 한다. ③ 세기는
      발생원에서 멀어질수록 빠르게 줄어든다는 것(WHO 표현). ④ 실제 생활환경 측정에서
      기준 대비 수 % 수준으로 나오는 사례가 있다는 것 — 측정 대상과 시점을 함께
      말한다. ⑤ 건강 영향은 '기준 이하 노출에서 인과적으로 확인된 악영향은 없다' 와
      '국제암연구소가 무선주파수 전자기장을 발암 가능(2B)으로 분류해 두었다' 를
      **반드시 한 묶음으로** 말한다. 어느 쪽으로도 단정하지 않는다."
  전문가:
    mc_brief: "인체보호기준과 등급제의 관계를 전제로 깔고, 등급의 경계가 정확히
      어디에 그어져 있는지 도슨트에게 묻는다."
    guard: "국내 고시가 2020년 개정 국제 가이드라인을 반영했는지 단정하지 않는다. 체험 장비의 표시등을 등급제와 섞지 않는다."
    docent_brief: "전파법 제47조의2 제1항이 인체보호기준·등급기준·측정기준의 고시
      근거이고, 같은 조 제2항이 기준 초과 장소의 출입 차단 안전시설을 의무화한다는 것.
      「전자파인체보호기준」(과기정통부 고시 제2019-4호) 별표1 일반인 기준으로
      10~400㎒ 는 전기장 28 V/m·전력밀도 2 W/㎡, 2~300㎓ 는 61 V/m·10 W/㎡ 이고,
      별표3의 일반인 SAR 은 전신 0.08·머리/몸통 1.6·사지 4 W/kg 이라는 것.
      「전자파 등급기준, 표시대상 및 표시방법 고시」 별표1의 경계 — 1등급 일반인
      기준의 50% 이하, 2등급 50% 초과~기준 이하, 주의등급 일반인 기준 초과~직업인
      기준 이하, 경고등급 직업인 기준 초과 — 를 정확히 말하고, 라벨은 연두·파랑·주황·
      빨강 4색이며 표시대상은 시행령 제65조·별표6의 보고대상 무선국(이동통신 기지국은
      안테나공급전력 합 30W 초과 등)이라는 것. 휴대기기의 전자파흡수율 등급은 별개
      체계로 2단계(1등급 ≤0.8, 2등급 ≤1.6 W/kg, 머리 1g 평균)라는 구분까지.
      건강 영향은 WHO 의 '인과적으로 확인된 악영향 없음'(2020)과 IARC 2B 분류(2011)를
      병렬로 제시하고, ICNIRP 가 2020년 가이드라인을 개정한 반면 국내 고시 현행판은
      2019년판이라는 시차를 짚되 국내 기준이 그것을 반영했는지는 단정하지 않는다."

mc: "지금부터는 한국방송통신전파진흥원이 정부에서 위탁받은 전파품질 관리 이야기예요. 도슨트, 눈에 보이지도 않는 전자파를 어떻게 재고 관리해요?"
mc_after: "세기가 발생원에서 멀어질수록 빠르게 줄어든다는 것, 그래서 기준도 일반인용과 직업인용으로 따로 있다는 게 핵심이군요. 이 주제는 특히 궁금한 점이 많으실 것 같아요. 무엇이든 물어봐 주세요."
