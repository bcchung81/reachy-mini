# 조사 산출물 — 16-inspection (무선국 검사).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# 이 섹션은 전부 국내 법령으로 A등급이 나온다 — 전파법 제24조(검사)가 근거이고,
# 제78조제2항 + 시행령 제123조제3항제3호가 KCA 위탁의 사슬이다.
# ⚠️ 기존 큐시트에 **기관명 시대착오**가 하나 있다. corrections 를 먼저 읽는다.

id: "16-inspection"
title: "무선국 검사"
gaze: audience
topic: "전파를 법적 기준에 맞게 쓰고 있는지 누가 어떻게 확인하나 — 전파법 제24조와 KCA 위탁"

facts:
  # ── 왜 관리하나 ──
  - claim: "전파법 제1조(목적) — '이 법은 전파의 효율적이고 안전한 이용 및 관리에 관한
      사항을 정하여 전파이용과 전파에 관한 기술의 개발을 촉진함으로써 전파 관련 분야의
      진흥과 공공복리의 증진에 이바지함을 목적으로 한다.'"
    source: "법제처 국가법령정보센터 — 전파법 제1조 https://www.law.go.kr/법령/전파법"
    grade: A
  - claim: "전파법 제29조제1항 — '전파자원은 혼신·간섭 등을 일으켜 타인의 전파이용을
      방해 또는 차단하지 않도록 이용되어야 한다.' 제2항은 무선국이 다른 무선국의 운용을
      저해할 혼신을 하지 않도록 운용해야 한다고 적는다."
    source: "법제처 국가법령정보센터 — 전파법 제29조"
    grade: A
    note: "'전파는 한정된 자원이라 함께 쓰려면 관리가 필요하다' 는 큐시트 문장의 법적 근거.
      법은 '한정' 이라는 말 대신 '혼신·간섭으로 남의 이용을 방해하지 않도록' 이라고 쓴다."

  # ── 무선국 검사의 근거와 종류 ──
  - claim: "무선국 검사의 근거 조항은 **전파법 제24조(검사)** 다."
    source: "법제처 국가법령정보센터 — 전파법 제24조 /
      KCA 공식 — 무선국검사 https://www.kca.kr/contentsView.do?pageId=www154"
    grade: A
  - claim: "전파법 제24조제1항 — 무선국 개설허가·변경허가를 받은 자 등은 무선설비가 준공되면
      과학기술정보통신부장관에게 준공신고를 하고, 그 무선설비가 **기술기준 및 무선종사자의
      자격·정원배치기준에 적합한지** 검사(준공검사)를 받아야 한다. 일부 신고 무선국은
      표본추출 방법으로 검사(표본검사)할 수 있다."
    source: "법제처 국가법령정보센터 — 전파법 제24조제1항"
    grade: A
    note: "검사 대상은 장비만이 아니다 — **사람(무선종사자 자격·정원)도 함께 본다.**
      큐시트의 '전파를 법적 기준에 맞게 쓰고 있는지' 는 절반만 담은 표현이다."
  - claim: "전파법 제24조제3항 — 검사 결과 제45조에 따른 기술기준과 제71조에 따른 무선종사자
      자격·정원배치기준에 적합하면 지체 없이 **검사증명서**를 발급하고, 적합하지 않으면
      대통령령으로 정하는 기한까지 **재검사**를 받아야 한다."
    source: "법제처 국가법령정보센터 — 전파법 제24조제3항"
    grade: A
  - claim: "전파법 제24조제4항 — 개설허가를 받은 무선국 등에 대하여 **5년의 범위에서**
      무선국별로 대통령령으로 정하는 기간마다 **정기검사**를 실시한다."
    source: "법제처 국가법령정보센터 — 전파법 제24조제4항"
    grade: A
  - claim: "전파법 제24조제5항 — 무선국이 있는 **선박이나 항공기가 외국에 출항하려는 경우**나
      전파의 효율적 이용·관리를 위하여 특히 필요한 경우에는 무선설비의 기술기준, 무선종사자의
      자격과 정원 등을 검사할 수 있다."
    source: "법제처 국가법령정보센터 — 전파법 제24조제5항"
    grade: A
    note: "해상(07)·항공(08) 섹션과 직접 이어지는 조문. '아까 본 배와 비행기의 무선기가
      바로 이 검사를 받고 나간다' 로 연결할 수 있다."
  - claim: "전파법 제25조제1항 — 준공검사를 받아야 하는 무선국은 **준공검사를 받은 후에
      운용하여야 한다.** 검사를 통과하기 전에는 전파를 쓸 수 없다는 뜻이다."
    source: "법제처 국가법령정보센터 — 전파법 제25조제1항"
    grade: A
  - claim: "KCA 가 실시하는 무선국검사는 네 가지다 — **준공검사**(개설허가를 받은 자가 무선설비를
      준공하고 최초로 확인받는 것), **정기검사**(개설허가를 받은 무선국에 5년의 범위 내에서
      정기적으로), **변경검사**(변경허가 받은 대로 변경했는지), **수시검사**(전파의 효율적
      이용이나 관리를 위해 특히 필요하다고 인정될 때)."
    source: "KCA 공식 — 업무안내 > 무선국검사 https://www.kca.kr/contentsView.do?pageId=www154"
    grade: A

  # ── 왜 KCA 가 하나 (위탁 사슬) ──
  - claim: "전파법 제78조제2항 — 과학기술정보통신부장관은 대통령령으로 정하는 바에 따라
      **제24조제1항·제4항 및 제5항** 등에 따른 업무의 일부를 진흥원(한국방송통신전파진흥원)·
      협회 또는 기간통신사업자에게 **위탁할 수 있다**."
    source: "법제처 국가법령정보센터 — 전파법 제78조제2항"
    grade: A
  - claim: "전파법 시행령 제123조제3항제3호 — 과학기술정보통신부장관은 법 제78조제2항에 따라
      '과학기술정보통신부장관이 정하여 고시하는 무선국에 대한 **법 제24조에 따른 준공검사 등의
      검사**' 를 진흥원에 **위탁한다**. 같은 조 제5항은 진흥원이 장관 승인을 받아 법 제69조에
      따른 수수료를 징수할 수 있게 한다."
    source: "법제처 국가법령정보센터 — 전파법 시행령 제123조제3항·제5항
      https://www.law.go.kr/법령/전파법시행령"
    grade: A
    note: "'법 제78조제2항 → 시행령 제123조제3항제3호' 가 KCA 가 무선국 검사를 하는 근거의
      완성된 사슬이다. 조항 번호를 말해도 되는 전문가 수준에서 이 두 개를 쓴다."
  - claim: "검사 주체는 둘로 나뉜다 — 전파법 시행령 제123조제2항제4호는 법 제24조에 따른
      무선국 검사를 **중앙전파관리소장**에게 위임하고, 같은 조 제3항제3호가 고시된 무선국을
      **진흥원**에 위탁한다. 제2항제26호는 위탁받은 진흥원에 대한 지도·감독을 중앙전파관리소장이
      맡도록 한다."
    source: "법제처 국가법령정보센터 — 전파법 시행령 제123조제2항·제3항"
    grade: A
  - claim: "전파법 제66조제1항 — '전파의 효율적 관리 및 방송·통신·전파의 진흥을 위한 사업과
      **정부로부터 위탁받은 업무**를 수행하기 위하여 한국방송통신전파진흥원을 설립한다.'
      위탁 업무 수행이 설립 목적 자체에 들어 있다."
    source: "법제처 국가법령정보센터 — 전파법 제66조"
    grade: A

  # ── 연혁 (1981) ──
  - claim: "KCA 공식 연혁 — '1981.5.18 : 정부위탁업무(무선국 검사) 수탁시행'.
      그 앞에는 '1972.7.21 : 사단법인 한국무선종사자 협회 설립' 이 있다."
    source: "KCA 공식 — 연혁 https://www.kca.kr/contentsView.do?pageId=www114"
    grade: A
  - claim: "기관명 변천 — 1972.7.21 사단법인 한국무선종사자협회 → 1990.8.1 재단법인
      한국무선국관리사업단 → 2006.7.21 재단법인 한국전파진흥원(KORPA) →
      **2011.1.24 재단법인 한국방송통신전파진흥원(KCA)**."
    source: "KCA 공식 — 연혁 (같은 URL)"
    grade: A
    note: "1981년 수탁 주체의 당시 이름은 사단법인 한국무선종사자협회다. KCA 는 그 법적 승계 기관이라 '1981년부터' 는 KCA 의 역사로 말할 수 있다(`_kca-history.yaml`).
      KCA 라는 이름은 2011년부터다. corrections 참고."

  # ── 검사 대상이 사람이기도 하다는 근거 ──
  - claim: "전파법 시행령 제117조 — 무선종사자의 자격·정원 배치기준을 무선국 종류별로 정한다.
      해안국은 별표 18, 지구국 별표 19, 선박국은 별표 20·21, 방송국 별표 22,
      **항공기국은 전파전자통신기사·전파전자통신산업기사 또는 항공무선통신사 1명 배치**.
      세계 해상조난 및 안전제도(GMDSS) 설비를 갖춰야 하는 선박국은 별표 20 을 따른다."
    source: "법제처 국가법령정보센터 — 전파법 시행령 제117조"
    grade: A
    note: "'무선국 검사는 장비만 보는 게 아니라 사람도 본다' 를 뒷받침하는 조문.
      07·08 섹션에서 본 선박국·항공기국이 여기 그대로 나온다."

corrections:
  - "⚠️ 현재 `data/cues.yaml` 의 **'KCA는 1981년부터 정부 위탁을 받아 무선국 검사를 시행해
    왔다'** 는 **그대로 써도 된다**(2026-09-20 재검토). 1981년 5월 18일에 무선국 검사를 수탁한 주체는
    **사단법인 한국무선종사자협회**이고, 'KCA(한국방송통신전파진흥원)' 이라는 이름은
    **2011년 1월 24일**부터다(KCA 공식 연혁). 날짜 자체는 맞다.
    → 다만 KCA 는 그 협회의 **법적 승계 기관**이다. 협회→사업단→전파진흥원→KCA 네 단계 전부 '권리·의무 승계' 가 명시돼 있고(`_kca-history.yaml`), **KCA 공식 연혁이 1981-05-18 무선국 검사 수탁을 자기 역사로 싣는다.** 기관이 이름을 바꿔 가며 자기 역사를 말하는 통상적 방식이므로 금지할 근거가 없다. 전문가 수준에서만 당시 명칭과 승계 관계를 덧붙인다."

briefs:
  초등:
    mc_brief: "전파를 잘 쓰고 있는지 누가 확인하는지 궁금하다는 투로 열고 도슨트에게 넘긴다.
      법 이름·연도·기관 이름은 말하지 않는다."
    guard: "연도·법 조항·기관 이름은 말하지 않는다."
    docent_brief: "전파는 모두가 나눠 쓰는 것이라서, 한 사람이 너무 세게 쓰거나 엉뚱한 자리를
      쓰면 다른 사람 것이 안 들린다는 것. 그래서 기계가 약속대로 만들어졌는지 사람이 직접
      가서 확인한다는 것. 여기 있는 장비들이 그 확인에 쓰던 것들이라는 것.
      비유를 쓴다 — 여러 사람이 같이 쓰는 놀이터에서 차례를 지키는 것처럼.
      연도·법 조항·기관 이름은 말하지 않는다. 2~3문장."
  중고등:
    mc_brief: "전파품질 관리의 또 다른 축이라고 짚고, 무선국 검사가 무엇인지 도슨트에게 묻는다."
    guard: "연도는 1981년만 말한다. 법 조항 번호는 생략한다."
    docent_brief: "핵심 훅은 '전파는 공유 자원이라 허가만으로는 부족하고 확인이 필요하다'.
      전파는 한정돼 있어 혼신이 생기면 남의 통신이 끊기기 때문에 법이 무선국을 허가제로
      두고, 설비를 다 만든 뒤에 기준에 맞는지 검사를 받아야 비로소 쓸 수 있게 한다는 것.
      검사는 한 번으로 끝나지 않고 정기적으로 다시 받으며, 배나 비행기가 외국으로 나갈 때도
      따로 검사한다는 것. 이 일을 정부가 직접 다 하지 않고 이 기관이 1981년부터 위탁받아
      해 왔다는 것. 연도는 1981년만. 법 조항 번호는 생략한다.
      'KCA 가 1981년부터' 라고 말해도 된다 — 공식 연혁이 그렇게 적는다. 이 수준에서는 옛 이름을 굳이 꺼내지 않는다. 3~4문장."
  일반:
    mc_brief: "전파품질 관리의 또 다른 축이 무선국 검사라고 짚고, 그게 무엇인지 도슨트에게 묻는다."
    guard: "검사 종류를 지어내지 않는다. 전시 장비의 제조연도는 단정하지 않는다."
    docent_brief: "핵심 훅은 '허가는 시작이고 검사가 마무리다'.
      전파는 한정된 자원이고 법도 '남의 전파이용을 방해하지 않도록 써야 한다' 고 적기 때문에,
      무선국은 설비를 다 갖춘 뒤 준공검사를 받아야 비로소 운용할 수 있다는 것.
      검사는 네 가지 — 준공검사, 5년 범위에서 받는 정기검사, 허가받은 대로 바꿨는지 보는
      변경검사, 특별히 필요할 때 하는 수시검사 — 이고, 배나 항공기가 외국으로 출항할 때도
      검사 대상이 된다는 것. 검사는 장비의 기술기준만이 아니라 **무선종사자의 자격과 정원**도
      함께 본다는 것 — 기계와 사람을 같이 본다. 이 업무를 정부가 이 기관에 위탁해 왔고
      그 시작이 1981년이라는 것, 그때 쓰던 검사 장비들이 여기 전시돼 있다는 것.
      'KCA 가 1981년부터' 라고 말해도 된다 — 이름을 바꿔 온 같은 기관이고 공식 연혁이 1981년 수탁을 자기 역사로 싣는다.
      4~5문장."
  전문가:
