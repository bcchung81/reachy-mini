source: "법제처 국가법령정보센터 「전파법」·「전파법 시행령」 원문"
grade: A
checked: "2026-09-20"

articles:
  - ref: "전파법 제66조(한국방송통신전파진흥원)"
    used_by: ["01-intro"]
    text_summary: >
      ① 전파의 효율적 관리 및 방송·통신·전파의 진흥을 위한 사업과 정부로부터
      위탁받은 업무를 수행하기 위하여 한국방송통신전파진흥원을 설립한다.
      ② 법인으로 한다. ④ 사업: 1. 전파이용 촉진에 관한 연구,
      2. 방송·통신·전파 관련 국내외 기술 정보의 수집·조사 및 분석,
      3. 방송·통신·전파에 관한 연구지원 및 교육, 4. 부수 사업,
      5. 그 밖에 이 법 또는 다른 법령에서 진흥원의 업무로 정하거나 위탁한
      사업 또는 과학기술정보통신부장관이 위탁한 사업.

  - ref: "전파법 제78조(권한의 위임ㆍ위탁)"
    used_by: ["15-emf", "16-inspection"]
    text_summary: >
      ② 과학기술정보통신부장관은 대통령령으로 정하는 바에 따라 제7조, 제7조의2,
      제18조, **제24조제1항ㆍ제4항 및 제5항**, 제25조의2제1항,
      **제47조의2제4항ㆍ제5항** 및 제58조의2, 제63조부터 제65조까지, 제69조 및
      제70조제1항ㆍ제2항에 따른 업무의 일부를 **진흥원**ㆍ협회 또는 기간통신사업자에게
      위탁할 수 있다.
      ① 장관의 권한 일부는 소속 기관의 장에게 위임할 수 있다.
    note: >
      ⚠️ 앞서 unverified 에 있던 "제77조는 청문" 은 맞다. 위임ㆍ위탁 조항은
      **제77조가 아니라 제78조**다.

  - ref: "전파법 시행령 제123조(권한의 위임ㆍ위탁)"
    used_by: ["15-emf", "16-inspection"]
    text_summary: >
      ② 장관은 법 제78조제1항에 따라 다음 권한을 **중앙전파관리소장**에게 위임한다 —
      4호 "법 제24조에 따른 무선국의 검사(같은 조 제4항제2호에 따른 무선국의 검사는
      제외한다)에 관한 사항", 11호 "법 제47조의2제5항에 따른 무선국 전자파 강도의
      측정ㆍ조사", 26호 "법 제78조제2항에 따라 과학기술정보통신부장관이 업무의
      일부를 위탁한 **진흥원에 대한 지도ㆍ감독**".
      ③ 장관은 법 제78조제2항에 따라 다음 업무를 **진흥원에 위탁한다** —
      3호 "과학기술정보통신부장관이 정하여 고시하는 무선국에 대한 **법 제24조에 따른
      준공검사 등의 검사**", 4호 "**법 제47조의2제4항에 따른 전자파강도 측정요청의
      수리 및 측정**", 5호 "법 제58조제3항에 따른 산업ㆍ과학ㆍ의료용 전파응용설비
      등에 대한 준공검사 등의 검사", 6ㆍ7호 무선종사자 자격검정 실시와 기술자격증 발급.
      ⑤ 진흥원은 위탁받은 업무를 처리할 때 장관의 승인을 받아 법 제69조에 따른
      수수료를 징수할 수 있다.

  - ref: "전파법 제47조의2(전자파 인체보호기준 등)"
    used_by: ["15-emf", "16-inspection"]
    text_summary: >
      ① 과기정통부장관은 전자파 인체보호기준, 전자파 등급기준, 전자파 강도
      측정기준, 전자파 흡수율 측정기준, 측정대상 기자재와 측정방법, 등급
      표시대상과 표시방법 등을 정하여 고시하여야 한다.
      ② 무선국 시설자·제작자·수입자는 전자파 강도가 인체보호기준을 초과하지
      않도록 하여야 하며, **그 기준을 초과하는 장소에는 취급자 외의 자가
      출입할 수 없도록 안전시설을 설치**하여야 한다.
      ③ 대통령령이 정하는 기준에 해당하는 무선국 시설자는 스스로 전자파 강도를
      측정해 장관에게 보고하여야 한다.
      ④ 그 시설자는 **제24조에 따른 무선국 검사 때 장관에게 측정을 요청할 수
      있고, 그러면 ③의 보고의무를 이행한 것으로 본다.**
      ⑤ 장관은 기준 초과 가능성이 있거나 보고의 거짓 여부 확인이 필요하면
      직접 측정·조사할 수 있다.
      ⑥ 초과하면 안전시설 설치·운용제한·운용정지 등을 명할 수 있다.
      ⑧ 전자파 등급을 표시하여야 한다.

confirms:
  - target: "15-emf"
    what: >
      조사 에이전트가 올린 정정 "빨강 = 경고등급 = 직업인 기준 초과이고 그 구간
      출입이 제한된다" 가 **1차 원문으로 확인된다**(제47조의2②). 기존 큐시트가
      의미를 뒤집어 적고 있었다.

adds:
  - target: "16-inspection + 15-emf"
    what: >
      **제47조의2④ 가 두 섹션을 법적으로 잇는다** — 무선국 검사(제24조) 때
      전자파 강도 측정을 함께 요청하면 별도 보고의무를 이행한 것으로 본다.
      "검사 받는 김에 전자파도 같이 잰다" 는 구조라 해설 훅으로 쓸 만하다.
      일반·전문가 수준에서 쓴다.

corrections:
  - target: "01-intro"
    what: >
      ⚠️ 조사 파일 01-intro 가 KCA 공식 웹페이지 인용을 A등급으로 적었는데,
      **법 조문이 더 상위 출처이고 문구가 다르다.**
      KCA 사이트는 "전파의 효율적 관리, 방송·통신·전파의 진흥 및 **인력양성**을
      위한 사업과 정부로부터 위탁받은 업무를 수행함으로써 **국민의 전파이용
      기회 확대**와 방송·통신·전파 진흥에 기여" 라고 적지만,
      전파법 제66조① 원문은 "전파의 효율적 관리 및 방송·통신·전파의 진흥을
      위한 사업과 정부로부터 위탁받은 업무를 수행하기 위하여" 다.
      즉 **"인력양성" 과 "국민의 전파이용 기회 확대" 는 법 조문에 없다.**
      전문가 수준에서 조문을 인용할 때는 법 원문을 쓴다. 일반 이하에서는 기관
      소개 문구를 써도 되지만 "법에 그렇게 적혀 있다" 고 말하지 않는다.

resolved:
  - what: "KCA 에 전자파 측정 업무를 위탁하는 **구체 조문** — 찾았다 (2026-09-20)"
    detail: >
      **전파법 제78조제2항 → 전파법 시행령 제123조제3항제4호** 가 그 사슬이다.
      시행령 제123조제3항은 "장관은 법 제78조제2항에 따라 다음 각 호의 업무를
      진흥원에 **위탁한다**" 로 열리고, 그 4호가 "법 제47조의2제4항에 따른
      **전자파강도 측정요청의 수리 및 측정**" 이다. 같은 항 3호는 "고시하는 무선국에
      대한 법 제24조에 따른 준공검사 등의 검사" 로 **무선국 검사 위탁**의 근거다.
      → **현재 사회자 대사의 전제가 1차 원문으로 확인됐다. 발화에서 빼지 않아도 된다.**
      단 "고시하는 무선국" 의 범위(과기정통부 고시)는 아직 확인 못 했으니, KCA 가
      *모든* 무선국을 검사한다고 말하지는 않는다 — 나머지는 중앙전파관리소장 위임분이다
      (시행령 제123조제2항제4호).
      앞선 메모의 "시행령 제107조는 기술자격검정" 은 착오로 보인다 — 시행령 제107조가
      아니라 제112조가 기술자격증 발급이고, 제107조는 항공안전법 시행규칙 쪽 번호다.
      어느 쪽이든 위임·위탁 조항은 **시행령 제123조** 하나다.

