# 조사 산출물 — 14-mobile (이동통신).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# `unverifiable` 는 "웹에서 확인할 수 없어 비워 둔 것" 목록이다.
#
# ⚠️ 이 섹션은 세대별 연도·속도가 가장 틀리기 쉬운 자리다. 기존 큐시트에서
#    **사실 오류 셋**이 나왔다. corrections 를 먼저 읽는다.
#
# 이 섹션의 모든 연도에는 **주어(어느 나라 / 무엇이 최초인지)** 를 반드시 붙인다.
# '세계 최초' 와 '국내 최초' 를 섞어 쓰는 것이 이 주제의 대표적 오류다.

id: "14-mobile"
title: "이동통신"
gaze: audience
topic: "1세대부터 5세대까지 — 무엇이 언제, 어디서 처음이었나"

facts:
  # ── 1세대 ──────────────────────────────────────────────
  - claim: "국내 1세대 이동통신은 차량전화(카폰)로 시작했다. 1984년 4월 한국이동통신서비스가
      카폰의 청약 접수와 설치를 맡으면서 보급이 시작됐다."
    source: "서울생활사박물관 소장유물 해설 — 카폰
      https://museum.seoul.go.kr/sulm/board/NR_boardView.do?bbsCd=1176&seq=20230919165445994"
    grade: B
  - claim: "카폰 사용에 필요한 각종 비용을 합치면 대략 400만 원이었다. 1982년 출시된 포니2
      승용차 가격이 347만 원이었으므로 '카폰의 가격이 자동차보다 비쌌던 셈' 이다."
    source: "서울생활사박물관 소장유물 해설 — 카폰 (원문 인용)"
    grade: B
    note: "언론(영남일보·ZDNet Korea 등, C)도 '단말기 300만 원 + 설치비 116만8천 원' 으로
      같은 400만 원대를 말한다. 비교 대상은 일관되게 **승용차**이지 아파트가 아니다."

  # ── 2세대 ──────────────────────────────────────────────
  - claim: "CDMA(코드분할다중접속)는 하나의 주파수 대역을 고유 코드로 나눠 여러 사용자가
      동시에 간섭 없이 쓰게 하는 2세대 디지털 이동통신 기술이다. ETRI 가 1989년부터 국책과제로
      추진해 1991년 퀄컴과 공동개발계약을 맺고, 1994년 4월 17일 첫 통화, 1995년 6월 9일
      상용 시험통화 시연을 거쳤다."
    source: "ETRI 45주년 — CDMA 세계최초 상용화 https://www.etri.re.kr/45th/sub05_8.html"
    grade: B
  - claim: "ETRI 는 CDMA 세계 최초 상용화 성공 시점을 '1996년 4월' 로 기록한다."
    source: "ETRI 45주년 — CDMA 세계최초 상용화 (원문: 1996.04. 세계최초 CDMA 상용화 성공)"
    grade: B
  - claim: "SK텔레콤은 1996년 1월 3일 오전 9시 1분 한국이동통신 남인천영업소에서 CDMA 세계
      1호 가입자가 나왔고, 4월 12일 서울·수도권에서 상용 서비스를 시작했다고 기록한다.
      첫 단말은 삼성전자 SCH-100 이다."
    source: "SK텔레콤 뉴스룸 — CDMA 30년 https://news.sktelecom.com/223649 (자사 기록)"
    grade: C
    note: "자사 발표. ETRI 의 '1996년 4월' 과 함께 보면 1월은 첫 가입자, 4월은 상용 서비스
      개시로 읽힌다. 발화에서는 '1996년' 까지만 말하고 월·일은 전문가 수준에서만."

  # ── 3세대 ──────────────────────────────────────────────
  - claim: "세계 최초의 W-CDMA 기반 3세대 상용 서비스는 일본 NTT도코모의 FOMA 로,
      2001년 10월 1일 일본 일부 지역에서 시작됐다."
    source: "Wikipedia — Freedom of Mobile Multimedia Access (FOMA)"
    grade: B
  - claim: "국내 W-CDMA(비동기식 IMT-2000) 상용 서비스는 2003년 12월 SK텔레콤과 KTF 가 시작했다.
      3세대부터 고속 데이터와 영상통화가 가능해졌다."
    source: "국내 언론 복수 보도(디지털투데이·시사오늘·inews24 등)에서 2003년 12월로 일치"
    grade: C
    note: "1차 출처(과기정통부·정보통신부 보도자료) 미확인. 발화에서는 '2000년대 초' 또는
      '2003년' 까지만 말하고, 날짜를 단정하지 않는다."
  - claim: "SK텔레콤은 2006년 5월 세계 최초로 휴대폰 기반 HSDPA(3.5세대) 서비스를
      상용화했다고 기록한다."
    source: "SK텔레콤 뉴스룸 — CDMA 30년 (자사 기록)"
    grade: C

  # ── 4세대 ──────────────────────────────────────────────
  - claim: "세계 최초의 LTE 상용 서비스는 2009년 12월 14일 TeliaSonera 가 스웨덴 스톡홀름과
      노르웨이 오슬로에서 개시했다."
    source: "GSMArena 보도 및 삼성전자 뉴스룸(단말 GT-B3710 공급) — 2009년 12월"
    grade: C
    note: "언론·제조사 발표. 날짜는 여러 출처가 일치하지만 1차 출처(TeliaSonera 원문 릴리스) 미확인."
  - claim: "국내 LTE 상용화는 2011년 7월 1일 SK텔레콤과 LG유플러스가 시작했다."
    source: "국내 언론 복수 보도(서울신문·디지털데일리·inews24) 및 SK텔레콤 뉴스룸에서 일치"
    grade: C
  - claim: "ITU-R 는 2010년 10월(제네바 발표) LTE-Advanced 와 WirelessMAN-Advanced 두 기술만
      IMT-Advanced 공식 지정을 받아 '진짜 4G' 자격을 갖췄다고 밝혔다."
    source: "ITU 보도자료 — ITU paves way for next-generation 4G mobile technologies
      https://www.itu.int/net/pressoffice/press_releases/2010/40.aspx
      (원문: two technologies, 'LTE-Advanced' and 'WirelessMAN-Advanced' being accorded the
      official designation of IMT-Advanced, qualifying them as true 4G technologies)"
    grade: A
  - claim: "그 뒤 2010년 12월 ITU-R 는 IMT-Advanced 요구조건을 충족하지 않는 LTE·WiMAX 등도
      IMT-Advanced 로 가는 전신 기술이라면 '4G' 로 부를 수 있다고 인정했다."
    source: "ITU-R 2010년 12월 결정 — 4G 호칭 범위 확대"
    grade: B
    note: "ITU 원 릴리스 본문 미열람(Wikipedia 4G 항목 및 다수 보도 경유). 전문가 수준에서만 꺼낸다."

  # ── 5세대 ──────────────────────────────────────────────
  - claim: "대한민국 이동통신 3사는 2018년 12월 1일 0시 5G 전파 송출과 함께 기업용(B2B)
      5G 상용 서비스를 시작했다."
    source: "대한민국 정책브리핑(과기정통부) 및 복수 보도 — 2018-12-01"
    grade: B
    note: "정책브리핑 큐레이션 경유. 단말은 라우터(동글) 기반이었다."
  - claim: "대한민국은 2019년 4월 3일 밤(이통3사 동시 개시) 스마트폰 기반 5G 를 세계 최초로
      상용화했다. 과기정통부는 이튿날 보도자료로 이를 공식화했다."
    source: "대한민국 정책브리핑 — '5G 세계 최초 상용화…정보통신 최강국 입증'
      https://www.korea.kr/news/policyNewsView.do?newsId=148859737
      (원문: 세계 최초로 스마트폰 기반 5G 상용화를 달성)"
    grade: A
    note: "'세계 최초' 의 대상은 **스마트폰 기반 상용화**다. 이 한정어를 빼면 틀린 말이 된다."
  - claim: "IMT-2020(5G) 의 최소 요구조건은 하향 피크 데이터율 20 Gbit/s, 상향 10 Gbit/s 다.
      조건 — eMBB 사용 시나리오 평가용이며 이상적 조건에서의 이론 최대값이다."
    source: "Report ITU-R M.2410-0 (11/2017) §4.1 Peak data rate
      https://www.itu.int/dms_pub/itu-r/opb/rep/R-REP-M.2410-2017-PDF-E.pdf"
    grade: A
  - claim: "IMT-2020 의 **체감** 데이터율 목표는 Dense Urban-eMBB 시험환경에서 하향 100 Mbit/s,
      상향 50 Mbit/s 다. 이 값은 사용자 처리율 분포의 5% 지점으로 정의된다."
    source: "Report ITU-R M.2410-0 §4.3 User experienced data rate"
    grade: A
  - claim: "IMT-Advanced(4G) 의 피크 데이터율 목표는 저이동성 1 Gbit/s, 고이동성 100 Mbit/s 였다."
    source: "Report ITU-R M.2134 (2008) — Requirements related to technical performance for
      IMT-Advanced radio interface(s) https://www.itu.int/dms_pub/itu-r/opb/rep/r-rep-m.2134-2008-pdf-e.pdf"
    grade: A
  - claim: "따라서 흔히 말하는 '5G 는 LTE 보다 20배 빠르다' 는 IMT-2020 하향 피크 20 Gbit/s 를
      IMT-Advanced 하향 피크 1 Gbit/s 로 나눈 **규격 목표의 이론 최대값 비교**다.
      이용자가 실제로 겪는 속도의 비율이 아니다."
    source: "Report ITU-R M.2410-0 §4.1 과 Report ITU-R M.2134 의 수치 대조"
    grade: A
    note: "두 값 모두 ITU 원문 확인. '20배' 를 말할 때는 '이론상 최대 속도 기준' 이라는 조건을
      반드시 붙인다."

unverifiable:
  - "체험관에 전시된 SKT 지원 기지국 장비가 무엇인지 — 체험관 고유 정보, 현장 확인 필요."
  - "전시된 단말기 모델 목록(카폰·벽돌폰·영상통화 폰 등) — 체험관 고유 정보, 현장 확인 필요."
  - "세계 최초 1세대 상용 서비스 시점(1979년 일본 NTT, 1981년 북유럽 NMT 등) — 이번 조사에서
    1차 출처로 확인하지 않았다. 발화에서 말하지 않는다."
  - "'세계 최초 CDMA 상용화는 1995년 9월 홍콩 허치슨텔레콤' 이라는 이설 — 검색 요약에서만 보였고
    1차 출처를 확인하지 못했다. 발화에서 말하지 않는다."
  - "'1세대 다음에 벽돌폰이 나왔다' 의 구체 연도·모델 — 서울생활사박물관 해설에서 확인한 것은
    카폰 부분뿐이다. 벽돌폰(모토로라 다이나택) 도입 시점은 1차 출처 미확인."

corrections:
  - "⚠️ 현재 `data/cues.yaml` 의 '카폰이 아파트 한 채 값' 은 **출처로 확인되지 않는다.**
    서울생활사박물관 해설이 말하는 비교 대상은 승용차다 — 카폰 총비용 약 400만 원,
    1982년 포니2 347만 원, 즉 '자동차보다 비쌌던 셈'. 언론 보도들도 400만 원대와 승용차
    비교로 일치한다. → '당시 자동차 한 대 값보다 비쌌다' 로 바꾼다.
    현재 큐시트의 `mc_after` 도 '아파트 한 채 값' 을 되받고 있으므로 함께 고쳐야 한다."
  - "⚠️ 현재 큐시트의 '5세대는 2019년 세계 최초로 상용화됐고' 는 **주어와 한정어가 빠져 틀린
    인상을 준다.** 과기정통부 기록은 '대한민국이 2019년 4월 3일 **스마트폰 기반** 5G 를 세계
    최초로 상용화' 한 것이고, 그보다 앞선 2018년 12월 1일에 기업용(B2B) 5G 상용 서비스가
    시작됐다. 무엇이 최초인지를 빼고 '2019년 세계 최초' 만 말하지 않는다."
  - "⚠️ 현재 큐시트의 'LTE 보다 최대 20배' 는 **조건 없이 말하면 틀린다.** 20배는
    IMT-2020 하향 피크 20 Gbit/s ÷ IMT-Advanced 하향 피크 1 Gbit/s 라는 **규격의 이론
    최대값 비교**다. IMT-2020 이 목표로 하는 체감 데이터율은 하향 100 Mbit/s 다.
    → '이론상 최대 속도 기준으로 20배' 라고 조건을 붙이거나, 아래 수준에서는 아예 수치를 뺀다."
  - "참고(오류는 아님) — ITU 기준으로 정식 IMT-Advanced(4G)는 LTE-Advanced 이고, 초기 LTE 는
    2010년 12월에 ITU-R 가 '4G' 호칭을 허용한 전신 기술이다. 초등~일반 수준에서는 '4세대는 LTE'
    로 말해도 되지만 전문가 수준에서는 이 구분을 짚는다."

briefs:
  초등:
    mc_brief: "옛날 휴대폰은 어떻게 생겼을까 하는 호기심으로 열고 도슨트에게 넘긴다.
      '몇 세대' 같은 말은 쓰되 숫자를 따지지 않는다."
    docent_brief: "맨 처음 전화기는 들고 다닐 수 없어서 자동차에 싣고 다녔다는 것, 그게 자동차
      한 대보다 비쌌다는 것, 그 뒤로 점점 작아지고 목소리뿐 아니라 글자와 얼굴까지 주고받게
      됐다는 것. 비유와 크기 변화 중심. **연도·속도·배수는 하나도 말하지 않는다.**
      '아파트 한 채 값' 이라고 말하지 않는다."
  중고등:
    mc_brief: "1세대부터 5세대까지 무엇이 달라졌는지 도슨트에게 묻는다."
    docent_brief: "세대 구분의 핵심 훅은 '무엇을 실어 날랐는가' — 1세대는 음성만(그것도 차에
      실린 카폰), 2세대는 디지털로 바뀌어 음성과 문자, 3세대는 영상통화, 4세대는 LTE 로 데이터,
      5세대는 기기를 아주 많이·아주 빠른 응답으로 연결. 연도는 국내 기준으로 1984년(카폰),
      1996년(CDMA), 2011년(LTE), 2019년(5G)만. **각 연도가 국내 기준임을 밝힌다.**
      속도 배수와 월·일은 말하지 않는다. '아파트 한 채 값' 이라고 말하지 않는다."
  일반:
    mc_brief: "세대가 바뀔 때마다 무엇이 새로 가능해졌는지 도슨트에게 묻고, 카폰 가격에
      놀랄 준비를 한다."
    docent_brief: "국내 1세대는 1984년 차량전화로 시작했고 총비용이 약 400만 원이라 당시
      승용차(포니2 347만 원)보다 비쌌다는 것, 1996년 국내에서 CDMA 방식 디지털 이동통신이
      상용화됐다는 것, 2000년대 초 3세대에서 영상통화가 가능해졌다는 것, 2011년 국내에서
      LTE 가 상용화됐다는 것, 2019년 4월 대한민국이 **스마트폰 기반** 5G 를 세계 최초로
      상용화했다는 것. 연도는 개략 수치로만 쓰고 '국내 최초' 와 '세계 최초' 를 분명히 갈라 말한다.
      **속도 배수는 말하지 않거나 '이론상 최대 기준' 이라는 조건을 반드시 붙인다.**"
  전문가:
    mc_brief: "세대 구분이 ITU 규격 기준인지 사업자 마케팅 기준인지를 전제로 깔고,
      '세계 최초' 라는 말의 대상이 무엇이었는지 도슨트에게 묻는다."
    docent_brief: "국내 1984년 카폰(약 400만 원, 포니2 347만 원 대비)에서 시작해,
      ETRI 가 1989년 국책과제로 착수해 1991년 퀄컴과 공동개발하고 1994년 첫 통화·1995년 시연을
      거쳐 1996년 CDMA 를 상용화한 경위. 3세대는 2001년 10월 NTT도코모 FOMA 가 세계 최초이고
      국내는 2003년 12월 W-CDMA. 4세대는 2009년 12월 TeliaSonera 가 세계 최초 LTE, 국내는
      2011년 7월. **다만 ITU-R 가 2010년 10월 IMT-Advanced 로 공식 지정한 것은 LTE-Advanced 와
      WirelessMAN-Advanced 뿐이고, 초기 LTE 는 2010년 12월에 '4G' 호칭이 허용된 전신 기술**이라는
      구분을 짚는다. 5세대는 2018년 12월 1일 국내 B2B 상용, 2019년 4월 3일 스마트폰 기반
      세계 최초 상용화(과기정통부). 속도는 반드시 조건과 함께 — Report ITU-R M.2410-0 의 하향
      피크 20 Gbit/s / 상향 10 Gbit/s, 체감 데이터율 하향 100 Mbit/s(Dense Urban-eMBB, CDF 5% 지점),
      Report ITU-R M.2134 의 IMT-Advanced 피크 1 Gbit/s. '20배' 는 이 두 피크값의 비라는 점까지
      말한다. 1차 출처가 없는 연도(세계 최초 1세대 등)는 말하지 않는다."

mc: "이번 주제는 휴대폰의 발전, 이동통신입니다. 도슨트, 1세대부터 5세대까지 어떻게 달라졌나요?"
mc_after: "카폰 한 대가 자동차 한 대보다 비쌌다니 놀랍네요. 궁금한 점 있으실까요?"
