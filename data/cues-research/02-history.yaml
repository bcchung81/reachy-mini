# 조사 산출물 — 02-history (전파의 발견 역사).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# ⚠️ 이 섹션은 기존 큐시트에서 **사실 오류 셋**이 나왔다. corrections 를 먼저 읽는다.

id: "02-history"
title: "전파의 발견 역사"
gaze: partner
topic: "전파는 발명인가 발견인가 — 맥스웰·헤르츠·마르코니"

facts:
  - claim: "맥스웰은 전기·자기·빛이 같은 현상의 다른 모습임을 기술한 고전 전자기 복사
      이론을 세웠고, 그의 방정식이 전자기파의 존재를 예언했다."
    source: "Wikipedia — James Clerk Maxwell"
    grade: B
  - claim: "헤르츠는 맥스웰 방정식이 예언한 전자기파의 존재를 처음으로 결정적으로 증명했다."
    source: "Wikipedia — Heinrich Hertz"
    grade: B
  - claim: "마르코니는 실용적인 전파 기반 무선전신 시스템을 만들었고, 1909년 페르디난트
      브라운과 노벨 물리학상을 공동 수상했다."
    source: "Wikipedia — Guglielmo Marconi"
    grade: B
  - claim: "1901년 12월 12일, 마르코니는 연에 매단 안테나로 폴듀(영국 콘월)에서 반복
      송신된 모스 부호 'S' 를 약 2,200마일(3,500km) 떨어진 곳에서 수신했다고 보고했다."
    source: "Wikipedia — Guglielmo Marconi (원문: over a distance of about 2,200 miles (3,500 km))"
    grade: B
  - claim: "그 수신 자체는 지금도 기술적 논쟁의 대상이다."
    source: "Wikipedia — Guglielmo Marconi"
    grade: B
    note: "전문가 수준에서만 꺼낸다. 아래 수준에서는 서사를 흐리기만 한다."
  - claim: "수신 지점인 세인트존스(뉴펀들랜드)는 1901년 당시 캐나다가 아니라 별도의
      영국 식민지였다. 뉴펀들랜드는 1907년 자치령이 됐고 1949년에 캐나다에 합류했다."
    source: "Wikipedia — Newfoundland Colony"
    grade: B
  - claim: "1785년은 쿨롱이 쿨롱 법칙을 발표한 해로, 정지한 전하 사이에 작용하는 힘에
      관한 것이다. 전자기학 이론의 출발점으로 평가되지만 전파의 발견은 아니다."
    source: "Wikipedia — Coulomb's law"
    grade: B

corrections:
  - "⚠️ 현재 `data/cues.yaml` 의 '1785년에 (전파의) 존재가 처음 발견됐다' 는 **사실이
    틀렸다.** 1785년은 쿨롱 법칙 발표 연도다. 전파는 맥스웰이 예언(이론)하고 헤르츠가
    증명(실험)했다."
  - "⚠️ 현재 큐시트의 '1600마일' 은 틀렸다. 출처 수치는 약 2,200마일(3,500km) 이다."
  - "⚠️ 현재 큐시트의 '영국에서 캐나다까지' 는 시대착오다. 1901년 뉴펀들랜드는 캐나다가
    아니었다. '대서양 건너편' 이라고 하면 안전하다."

briefs:
  초등:
    mc_brief: "전파를 누가 만들었을까 하는 질문으로 호기심을 열고 도슨트에게 넘긴다."
    docent_brief: "전파는 사람이 만든 게 아니라 원래 있었는데 사람이 찾아낸 것이라는 대비가
      핵심 훅. 먼저 머리로 '있을 거야' 라고 알아낸 사람이 있었고, 나중에 실험으로 진짜
      있다는 걸 보여준 사람이 있었다는 순서만. 인명·연도·거리는 말하지 않는다."
  중고등:
    mc_brief: "전파는 발명인지 발견인지 도슨트에게 묻는다."
    docent_brief: "발명이 아니라 발견이라는 대비가 핵심 훅. 맥스웰이 수식으로 존재를
      예언하고 헤르츠가 실험으로 증명했으며, 마르코니가 그것을 통신에 써먹었다는 세 단계.
      1901년 대서양 횡단 수신까지. 거리는 약 3,500km 로만 말한다."
  일반:
    mc_brief: "전파는 발명인지 발견인지 도슨트에게 묻고, 답이 의외라는 반응을 준비한다."
    docent_brief: "발명이 아니라 발견이라는 대비가 핵심 훅. 맥스웰의 이론적 예언 →
      헤르츠의 실험적 증명 → 마르코니의 실용화라는 세 단계. 1901년 12월 12일 폴듀에서
      보낸 모스 부호를 대서양 건너편에서 약 3,500km 떨어져 수신했다는 것.
      '캐나다' 라고 말하지 않는다 — 당시 뉴펀들랜드는 영국 식민지였다."
  전문가:
    mc_brief: "이론·실험·실용화의 분리를 전제로 깔고, 발견의 주체가 누구냐고 도슨트에게 묻는다."
    docent_brief: "맥스웰 방정식의 예언, 헤르츠의 결정적 실험 증명, 마르코니의 실용
      무선전신과 1909년 노벨상(브라운 공동 수상). 1901년 12월 12일 연 안테나로 폴듀 →
      세인트존스 약 2,200마일(3,500km) 수신 보고. **그 수신의 진위가 지금도 기술적
      논쟁의 대상**이라는 점까지 말한다. 1785년 쿨롱 법칙은 전자기학의 출발점이지
      전파의 발견이 아니라는 구분도 짚는다."

mc: "첫 주제는 전파의 발견 역사입니다. 도슨트, 전파는 발명일까요, 발견일까요?"
mc_after: "발명이 아니라 발견이라니, 저도 처음엔 헷갈렸어요. 궁금한 점 있으실까요?"
