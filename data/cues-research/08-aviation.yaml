# 조사 산출물 — 08-aviation (항공무선통신과 시뮬레이터).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# 이 섹션의 절반은 **체험관 고유 정보**(어떤 장비를 개조했는지, 조종석 부품을 뭐라 부르는지)라
# 웹에 없다. unverifiable 을 먼저 읽는다. 나머지 절반 — 항공무선의 국제 근거와 주파수 —
# 은 ICAO 와 국내 항공안전법에서 A등급으로 확보했다.

id: "08-aviation"
title: "항공무선통신과 시뮬레이터"
gaze: audience
topic: "하늘의 무선 규칙은 누가 정하나 — ICAO 부속서 10과 항공안전법, 그리고 조종석 체험"

facts:
  # ── 국제 근거: ICAO 와 시카고 협약 ──
  - claim: "정식 명칭은 국제민간항공기구(ICAO, International Civil Aviation Organization)다.
      시카고 협약(Convention on International Civil Aviation)은 1944년 12월 7일 52개국이
      서명했고, 비준이 충족된 1947년 4월 4일 잠정기구(PICAO)가 정식으로 ICAO 가 됐다.
      현재 회원국은 193개국이다."
    source: "ICAO — The History of ICAO and the Chicago Convention
      https://www.icao.int/history-icao-and-chicago-convention"
    grade: A
  - claim: "시카고 협약에는 19개 기술 부속서(Annex)가 있고, 그중 **부속서 10(Annex 10)
      Aeronautical Telecommunications** 이 '항공 통신·항법·감시' 세 가지를 다룬다 —
      원문 'aeronautical communications, navigation and surveillance'."
    source: "ICAO — Annex 10: Aeronautical Telecommunications
      https://www.icao.int/sites/default/files/postalhistory/annex_10_aeronautical_telecommunications.htm"
    grade: A
  - claim: "항공통신 표준 및 권고방식(SARPs)은 1949년 5월 30일 ICAO 이사회가 채택해
      1950년 3월 1일 발효했고, 1995년 3월 20일 개정 70호로 부속서 10이 5권 체제가 됐다 —
      제I권 무선항법보조시설, 제II권 통신절차, 제III권 통신시스템, 제IV권 감시레이더·충돌회피,
      제V권 항공 무선주파수 스펙트럼 이용."
    source: "ICAO — Annex 10: Aeronautical Telecommunications (같은 URL)"
    grade: A

  # ── 실제 주파수 (ICAO Doc 9718 표) ──
  - claim: "ICAO 가 정리한 민간항공 주파수 대역 — 2,850~22,000kHz HF 공대지 음성·데이터,
      108~117.975MHz VOR/ILS 로컬라이저, **117.975~137MHz VHF 공대지·공대공 음성·데이터**,
      **121.5·123.1·243MHz 비상주파수**, 328.6~335.4MHz ILS 글라이드패스,
      406~406.1MHz 수색구조, 1,030/1,090MHz SSR·ACAS·ADS-B."
    source: "ICAO Doc 9718, Handbook on Radio Frequency Spectrum Requirements for Civil
      Aviation, Vol I, Section 7-I List of Frequency Bands
      https://www.icao.int/sites/default/files/FSMP/Doc.9718-Vol-I-AdvanceUneditedVersion-2021.pdf"
    grade: A
    note: "관제사와 조종사가 주고받는 목소리가 실려 있는 대역이 117.975~137MHz 다.
      항공무선통신 코너의 '안테나가 어디 붙어 있나' 전시와 짝을 이루는 숫자."

  # ── 국내법: 국제 표준이 어떻게 우리 법이 됐나 ──
  - claim: "항공안전법 제1조(목적) — '이 법은 「국제민간항공협약」 및 같은 협약의 부속서에서
      채택된 표준과 권고되는 방식에 따라 (…) 안전하고 효율적인 항행을 위한 방법과 국가,
      항공사업자 및 항공종사자 등의 의무 등에 관한 사항을 규정함을 목적으로 한다.'"
    source: "법제처 국가법령정보센터 — 항공안전법 제1조 https://www.law.go.kr/법령/항공안전법"
    grade: A
    note: "국내 항공법이 ICAO 부속서를 그대로 받아 쓴다는 것을 법 제1조가 스스로 밝힌다.
      '국제 표준이 우리 하늘에 어떻게 내려오나' 를 한 문장으로 보여주는 조문."
  - claim: "항공안전법 제51조(무선설비의 설치·운용 의무) — '항공기를 운항하려는 자 또는
      소유자등은 해당 항공기에 비상위치 무선표지설비, 2차감시레이더용 트랜스폰더 등
      국토교통부령으로 정하는 무선설비를 설치·운용하여야 한다.'"
    source: "법제처 국가법령정보센터 — 항공안전법 제51조"
    grade: A
  - claim: "항공안전법 시행규칙 제107조가 그 목록을 적는다 — 항공교통관제기관과 교신할
      초단파(VHF) 또는 극초단파(UHF) 무선전화 송수신기 **각 2대**, 기압고도 정보를 제공하는
      2차감시레이더용 트랜스폰더, 자동방향탐지기(ADF), 계기착륙시설(ILS) 수신기,
      전방향표지시설(VOR) 수신기, 거리측정시설(DME) 수신기, 기상레이더,
      비상위치지시용 무선표지설비(ELT), 자동종속감시시설(ADS-B) 송신기."
    source: "법제처 국가법령정보센터 — 항공안전법 시행규칙 제107조제1항"
    grade: A
  - claim: "같은 조문의 성능 요건 — ELT 신호는 **121.5MHz 및 406MHz** 로 송신되어야 하고,
      무선설비는 **항공비상주파수(121.5MHz 또는 243.0MHz)** 로 관제기관과 통신이 가능해야
      하며, 무선전화 송수신기 2대는 '각 1대가 고장이 나더라도 나머지 각 1대는 고장이 나지
      아니하도록 각각 독립적으로 설치' 해야 한다."
    source: "법제처 국가법령정보센터 — 항공안전법 시행규칙 제107조제1항제8호·제2항"
    grade: A
    note: "국내 시행규칙의 121.5/406MHz 가 ICAO Doc 9718 표의 비상주파수·수색구조 대역과
      정확히 일치한다. 국제 표준 → 국내 법령의 연결을 숫자로 보여줄 수 있는 지점."
  - claim: "전파법 제28조제2항·제4항 — 항공국과 항공기국은 조난통신을 수신하면 다른 모든
      무선통신에 우선하여 즉시 응답해야 하고, 항공기국은 항행 중에는 고시로 정하는 바에 따라
      항공국과 연락하여야 한다. 전파법 제25조제2항제1호는 조난통신을 '선박이나 항공기가
      중대하고 급박한 위기에 처한 경우' 의 통신으로 정의한다."
    source: "법제처 국가법령정보센터 — 전파법 제25조·제28조 https://www.law.go.kr/법령/전파법"
    grade: A
    note: "해상(07)과 항공(08)이 같은 조문 안에 나란히 있다. 두 섹션을 잇는 다리로 쓴다."

  # ── 조종석: 표준 명칭과 기능 ──
  - claim: "FAA 공식 교재 — 러더는 수직축 둘레의 운동(yaw)을 제어하며 '좌·우 러더 페달
      (left and right rudder pedals)' 로 조작한다. 에일러론(roll)과 엘리베이터(pitch)는
      조종륜(control wheel/yoke)으로 조작한다."
    source: "FAA, Pilot's Handbook of Aeronautical Knowledge, Chapter 6 Flight Controls
      https://www.faa.gov/sites/faa.gov/files/08_phak_ch6.pdf"
    grade: A
    note: "요크는 정확히는 기수 각도(pitch)와 좌우 경사(roll)를 조작한다 — 고도와 선회는
      그 '결과' 다. 일반 수준까지는 결과로 말해도 되지만 전문가 수준에서는 구분한다."
  - claim: "조종사 훈련용 모의비행장치는 ICAO Doc 9625 'Manual of Criteria for the
      Qualification of Flight Simulation Training Devices' 의 기준으로 자격인정을 받는다
      (제I권 비행기 4판 2015, 제II권 헬리콥터)."
    source: "ICAO Store — Doc 9625
      https://store.icao.int/en/manual-of-criteria-for-the-qualification-of-flight-simulation-training-devices-volume-i-aeroplanes-9625-1"
    grade: A
    note: "'실제 조종사 교육용 장비' 라는 말에 근거를 주는 국제 문서번호. 다만 이 체험관의
      장비가 Doc 9625 자격을 받은 것이라는 증거는 없다 — 그렇게 말하지 않는다."

corrections:
  - "⚠️ 정본 `docs/exhibit-guide.md` 8번의 **'국제항공기구'** 는 부정확한 이름이다.
    정식 명칭은 **국제민간항공기구(ICAO)** 이고, 우리 법도 협약을 「국제민간항공협약」으로
    부른다(항공안전법 제1조). '민간' 이 빠지면 다른 기구를 가리키게 된다."
  - "⚠️ 현재 `data/cues.yaml` 의 **'패들(브레이크·지상 방향 전환)'** — 항공 표준 명칭은
    **러더 페달(rudder pedal)** 이다(FAA 공식 교재 6장). '패들' 이 이 전시장 고유 표기일
    가능성은 남아 있으므로(→ unverifiable) 현장 확인 전까지 도슨트는 부품 이름을 단정하지
    말고 '발로 밟는 페달' 처럼 기능으로 말한다. 전문가 수준에서만 '러더 페달' 을 쓴다."

briefs:
  초등:
    mc_brief: "바다 다음은 하늘이라고 넘기면서, 비행기 조종석에 앉아볼 수 있다는 것을
      기대되는 투로 알리고 도슨트에게 묻는다. 기종·숫자·기관 이름은 말하지 않는다."
    guard: "기종·숫자·기관 이름은 말하지 않는다. 조종석 부품 이름을 단정하지 않는다."
    docent_brief: "비행기는 하늘에서 땅에 있는 사람과 전파로 이야기하면서 날아간다는 것,
      여기서는 진짜 조종석에 앉아 손잡이를 당겨 비행기를 띄워볼 수 있다는 것.
      비유를 쓴다 — 비행기와 땅이 보이지 않는 실로 이어져 있는 것 같다는 식.
      주파수·기종·법·부품 이름은 말하지 않는다. 2~3문장."
  중고등:
    mc_brief: "바다 다음은 하늘이라고 넘기고, 항공무선통신 코너와 시뮬레이터에서 무엇을
      해볼 수 있는지 도슨트에게 묻는다."
    guard: "기종은 말하지 않는다. 주파수 숫자는 말하지 않는다."
    docent_brief: "핵심 훅은 '하늘의 규칙은 한 나라가 못 정한다'.
      비행기는 어느 나라 하늘을 날든 같은 방식으로 통신해야 해서 국제민간항공기구(ICAO)가
      표준을 정하고 각 나라가 그걸 법으로 받아 쓴다는 것. 그래서 항공기에는 관제소와 말할
      무선기, 위치를 알리는 장비, 사고 시 위치를 쏘는 비상 신호기가 반드시 실린다는 것.
      시뮬레이터는 실제 조종사 교육용 장비를 체험용으로 고친 것이고 조종석에서 이륙까지
      해볼 수 있다는 것. 연도는 시카고 협약 1944년 정도만. 주파수 숫자는 말하지 않는다.
      기종은 절대 말하지 않는다. 3~4문장."
  일반:
    mc_brief: "바다 다음은 하늘이라고 넘기고, 항공무선통신 코너와 시뮬레이터에서 무엇을
      해볼 수 있는지 묻는다. 체험 이야기로 끝날 것을 예고한다."
    guard: "기종은 말하지 않는다. 조종석 부품은 기능으로 말하고 이름을 단정하지 않는다."
    docent_brief: "핵심 훅은 '국제 표준이 우리 하늘의 법이 된다'.
      1944년 시카고 협약으로 만들어진 국제민간항공기구(ICAO)가 협약의 부속서로 항공통신
      표준을 정하고, 우리 항공안전법이 제1조에서 그 부속서를 따른다고 스스로 밝힌다는 것.
      그래서 항공기에는 관제기관과 교신할 무선전화 송수신기, 위치를 응답하는 트랜스폰더,
      사고 시 위치를 알리는 비상위치지시용 무선표지설비(ELT)가 법으로 의무화돼 있고,
      무선기는 하나가 고장나도 나머지가 살아 있도록 두 벌을 따로 설치한다는 것.
      코너 안쪽에는 항공기 어느 위치에 어떤 통신 안테나가 붙는지 볼 수 있다는 것.
      시뮬레이터는 실제 조종사 교육용 장비를 이착륙 체험용으로 개조한 것이고, 실제 이륙은
      수많은 절차를 거치지만 체험에서는 미리 세팅해 두며 착륙은 시간관계상 생략한다는 것.
      **기종은 말하지 않는다.** 조종석 부품은 기능으로 설명하고 이름을 단정하지 않는다.
      4~5문장."
  전문가:
    mc_brief: "국제 표준과 국내 법령의 관계를 전제로 깔고, 항공무선의 근거 체계와
      시뮬레이터 체험이 각각 어디에 해당하는지 도슨트에게 묻는다."
    guard: "기종과 체험관 장비의 자격 여부는 말하지 않는다. 조종석 페달을 '패들'이라고 하지 않는다 — 러더 페달이다."
    docent_brief: "시카고 협약(1944.12.7 서명, 52개국 / 1947.4.4 ICAO 발족, 현 193개국)의
      19개 부속서 중 **부속서 10 Aeronautical Telecommunications** 이 통신·항법·감시를
      규율하며, 1949년 5월 30일 채택·1950년 3월 1일 발효 후 1995년 개정 70호로 5권 체제
      (I 무선항법보조, II 통신절차, III 통신시스템, IV 감시레이더·충돌회피, V 주파수 이용)가
      됐다는 것. ICAO Doc 9718 기준 공대지 음성은 117.975~137MHz(AM(R)S), 비상주파수는
      121.5·123.1·243MHz, 수색구조는 406~406.1MHz, SSR·ACAS·ADS-B 는 1,030/1,090MHz 라는 것.
      국내로 내려오면 항공안전법 제1조가 협약 부속서를 따른다고 명시하고, 제51조와 시행규칙
      제107조가 VHF/UHF 무선전화 송수신기 각 2대·트랜스폰더·ADF·ILS·VOR·DME·기상레이더·
      ELT·ADS-B 를 의무화하며, ELT 는 121.5MHz 와 406MHz 로 송신하고 무선설비는 항공비상주파수
      121.5MHz 또는 243.0MHz 로 관제기관과 통신 가능해야 한다는 것 — ICAO 표의 숫자가 국내
      시행규칙에 그대로 박혀 있다. 전파법 제28조제2항은 항공국·항공기국에 조난통신 우선
      응답 의무를 지우는데, 같은 조문이 해안국·선박국도 함께 묶는다는 것. 조종면은 FAA 기준
      요크가 pitch(엘리베이터)와 roll(에일러론)을, 러더 페달이 yaw(러더)를 맡으며 고도와
      선회는 그 결과라는 것. 조종사 훈련용 모의비행장치의 국제 자격기준은 ICAO Doc 9625 라는 것.
      **기종과 체험관 장비의 자격 여부는 말하지 않는다** — 확인되지 않았다. 5~7문장."

