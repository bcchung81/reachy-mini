# KCA 기관 연혁 — 여러 섹션이 공유한다. 섹션 파일이 아니다(앞의 `_` 가 그 표시다).
#
# 출처: KCA 공식 연혁 페이지 https://www.kca.kr/contentsView.do?pageId=www114
# 조회 2026-09-20. 기관이 자기 역사를 공식적으로 밝힌 문서이므로 **A등급**이다.
#
# 이 파일이 생긴 이유: 조사 에이전트가 "KCA 는 1981년부터 무선국 검사를 수탁했다" 를
# **기관명 시대착오라며 정정**했는데, 공식 연혁을 보니 그 정정이 과했다.
# 1981년 수탁 주체가 사단법인 한국무선종사자협회인 것은 맞지만, KCA 는 그 협회의
# **법적 승계 기관**이고 KCA 스스로 1981년 수탁을 자기 연혁에 싣는다.
# → 정정을 다시 정정한 기록이다. 조사 결과도 검증 대상이라는 예다.

source: "KCA 공식 — 연혁 https://www.kca.kr/contentsView.do?pageId=www114"
grade: A
checked: "2026-09-20"
used_by: ["01-intro", "16-inspection"]

timeline:
  - date: "1971-01-13"
    what: "법률 제2280호 전파관리법 개정으로 한국무선종사자협회 설립 근거 마련"
  - date: "1972-07-21"
    what: "사단법인 한국무선종사자협회 설립"
  - date: "1981-05-18"
    what: "정부위탁업무(**무선국 검사**) 수탁시행"
    note: "16-inspection 의 '1981년부터' 는 여기서 온다. KCA 공식 연혁의 자기 기록이다."
  - date: "1989-12-30"
    what: "법률 제4193호 전파관리법 개정으로 개편 근거 마련"
  - date: "1990-08-01"
    what: "재단법인 한국무선국관리사업단(KORA)으로 개편 — **한국무선종사자협회로부터 권리·의무 승계**"
  - date: "2005-12-30"
    what: "법률 제7815호 전파법 개정으로 개편 근거 마련"
  - date: "2006-07-21"
    what: >
      재단법인 한국전파진흥원(KORPA)으로 개편 — **한국무선국관리사업단으로부터
      권리·의무 승계**, ICU 정보통신교육원 통합
  - date: "2010-07-23"
    what: "법률 제10393호 전파법 개정으로 개편 근거 마련"
  - date: "2011-01-24"
    what: >
      재단법인 한국방송통신전파진흥원(KCA)으로 개편 — **한국전파진흥원으로부터
      권리·의무 승계**, 방송통신발전기금 위탁관리 및 정보통신교육원 이관

lineage_summary: >
  한국무선종사자협회(1972) → 한국무선국관리사업단(1990) → 한국전파진흥원(2006)
  → 한국방송통신전파진흥원 KCA(2011). **네 단계 전부 권리·의무 승계가 명시돼 있어
  끊긴 곳이 없다.** 이름만 바뀐 같은 기관의 계보다.

usage_rules:
  - >
    "KCA 는 1981년부터 무선국 검사를 수탁해 왔다" 는 **쓸 수 있다.** 기관이 이름을
    바꿔 가며 자기 역사를 말하는 통상적인 방식이고 공식 연혁이 그렇게 적는다.
  - >
    다만 "1981년에 **KCA 가**" 처럼 그 시점에 그 이름이 있었던 것처럼 말하지는 않는다.
    당시 이름은 사단법인 한국무선종사자협회다. 전문가 수준에서는 이름과 승계를
    같이 말하고, 일반 이하에서는 "40여 년" 같은 기간 표현으로 두는 편이 안전하다.
  - >
    기간을 말할 때 1981년 기준이면 **44년**(2026년 기준)이다. 어림수를 쓰려면
    "40년 넘게" 라고 한다.

corrections:
  - target: "16-inspection"
    what: >
      ⚠️ 조사 에이전트의 정정 "**'KCA 는 1981년부터' 는 기관명 시대착오**" 는 **과했다.**
      수탁 주체가 당시 사단법인 한국무선종사자협회였다는 사실관계는 맞지만, 그로부터
      "KCA 가 1981년부터라고 말하면 안 된다" 는 결론은 나오지 않는다 — KCA 는 그
      협회의 법적 승계 기관이고 **공식 연혁에 1981-05-18 무선국 검사 수탁을 자기
      역사로 싣는다.** 원래 큐시트 표현을 되살리되, 전문가 수준에서만 당시 명칭과
      승계 관계를 덧붙인다.
  - target: "01-intro"
    what: >
      이 연혁은 01-intro 의 재료이기도 하다. 체험관 개관일(2020-11-24)이 C등급으로
      남아 있는데, **연혁 페이지에도 개관 항목이 없다** — 체험관은 기관 연혁에
      실릴 만한 사건으로 다뤄지지 않는다. 개관일은 여전히 미확인이다.
