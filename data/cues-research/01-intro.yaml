# 조사 산출물 — 01-intro (체험관 개요).  조사일 2026-09-20
#
# 이 폴더는 **조사 결과**이지 큐시트가 아니다. 최종 `data/cues.yaml` 은 이것을
# 재료로 만들어진다. 섹션당 한 파일인 이유는 조사를 병렬로 돌리기 때문이다.
#
#   facts        확인한 사실 + 출처 + 등급. **수준과 무관하다** — 사실은 하나이고
#                수준은 그것을 어떻게 말하느냐만 가른다.
#                A 정부·표준화기구·학술 원문 / B 백과·교과서·기관 해설 / C 언론·블로그
#                C 는 교차확인 전에는 발화에 쓰지 않는다.
#   corrections  기존 큐시트에서 **틀린 것으로 확인된 내용**. 사람이 반드시 본다.
#   briefs       수준별 지시문(초등/중고등/일반/전문가). 대사가 아니라 지시다.
#   mc/mc_after  생성이 실패했을 때 그대로 읽는 폴백 원문.

id: "01-intro"
title: "체험관 개요"
gaze: partner
topic: "KCA 설립 목적과 전파체험관의 성격"

facts:
  - claim: "KCA 는 전파법 제66조에 따라 설립된 기관이다."
    source: "KCA 공식 — 설립목적 https://www.kca.kr/contentsView.do?pageId=www69"
    grade: A
  - claim: "설립목적은 전파의 효율적 관리, 방송·통신·전파의 진흥 및 인력양성을 위한
      사업과 정부로부터 위탁받은 업무 수행으로, 국민의 전파이용 기회 확대와
      방송·통신·전파 진흥에 기여하는 것이다."
    source: "KCA 공식 — 설립목적 (원문 인용)"
    grade: A
  - claim: "주요 사업은 방송통신융합 산업진흥, ICT기금 운용, 전파산업진흥, 전파자원관리 넷이다."
    source: "KCA 공식 — 설립목적 페이지"
    grade: A
  - claim: "전파체험관은 2020년 11월 24일 개관했다."
    source: "웹 검색 결과 — KCA 공식 페이지에서는 확인되지 않음"
    grade: C
    note: "⚠️ 1차 출처 미확인. 확정 전까지 도슨트가 날짜를 입에 올리지 않게 한다.
      KCA 보도자료나 체험관 안내 페이지에서 재확인이 필요하다."

corrections:
  - "현재 `data/cues.yaml` 의 '자료 보존, 연구를 위해 세운 곳' 은 공식 설립목적
    문구에 없다. 공식 표현은 '효율적 관리 · 진흥 · 인력양성' 이다."
  - "현재 큐시트는 개관 시점을 '2020년 11월' 로 단정한다. 1차 출처가 확인될 때까지
    발화에서 뺀다."

briefs:
  초등:
    mc_brief: "전파를 눈으로 볼 수 있는 곳에 왔다는 것을 반갑게 알리고, 옆의 도슨트에게
      여기가 어떤 곳인지 물어본다. 어려운 기관 이름은 쓰지 않는다."
    docent_brief: "전파는 눈에 안 보이지만 우리가 매일 쓰고 있다는 것, 여기는 그 보이지
      않는 전파를 보고 만질 수 있게 만든 곳이라는 것. 기관 이름·법 조항·연도는 말하지 않는다."
  중고등:
    mc_brief: "전파를 다루는 공공기관이 만든 체험관이라는 점을 짚고 도슨트에게 소개를 넘긴다."
    docent_brief: "전파는 국가가 관리하는 공공 자원이라는 점이 핵심 훅. 이곳을 만든 기관이
      전파를 관리하고 관련 산업과 인력을 키우는 일을 한다는 것. 법 조항 번호는 생략한다."
  일반:
    mc_brief: "체험관과 운영 기관을 간단히 소개하고 도슨트에게 넘긴다."
    docent_brief: "KCA 가 전파의 효율적 관리와 방송·통신·전파 진흥, 인력양성을 위해 설립된
      기관이라는 것과, 전파를 직접 체험할 수 있게 만든 곳이 이 체험관이라는 것.
      개관 시점은 확정 전이므로 말하지 않는다."
  전문가:
    mc_brief: "설립 근거와 사업 범위를 전제로 깔고, 체험관이 그중 어디에 해당하는지 도슨트에게 묻는다."
    docent_brief: "전파법 제66조가 설립 근거라는 것, 사업이 방송통신융합 산업진흥·ICT기금
      운용·전파산업진흥·전파자원관리 넷으로 나뉜다는 것, 체험관은 그중 진흥·인력양성
      기능의 대국민 접점이라는 것. 기관명과 조항을 그대로 말해도 된다."

mc: "안녕하세요, 전파체험관 이야기 시간에 오신 것을 환영합니다. 오늘 진행은 제가, 해설은 제 옆의 도슨트가 맡습니다. 도슨트, 먼저 이 체험관이 어떤 곳인지 소개해 줄래요?"
mc_after: "네, 소개 고마워요. 궁금한 점 있으실까요?"
