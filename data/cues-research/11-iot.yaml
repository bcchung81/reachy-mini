# 조사 산출물 — 11-iot (사물인터넷).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# `unverifiable` 는 "웹에서 확인할 수 없어 비워 둔 것" 목록이다. 채우지 않은 것이
# 실패가 아니라, 근거 없이 채우는 것이 실패다.
#
# ⚠️ 이 섹션은 기존 큐시트에서 **근거 없는 인과 단정 하나**가 나왔다.
#    "5G 와 접목되면 완전 자율주행" — corrections 를 먼저 읽는다.

id: "11-iot"
title: "사물인터넷"
gaze: audience
topic: "사물인터넷이란 무엇이며 5G 가 그것을 어디까지 바꾸는가"

facts:
  - claim: "국제 표준의 사물인터넷 정의는 '정보사회를 위한 글로벌 인프라로서, 기존 및
      진화하는 상호운용 가능한 정보통신기술에 기반해 (물리적·가상의) 사물을 상호연결함으로써
      진보된 서비스를 가능하게 하는 것' 이다."
    source: "ITU-T Recommendation Y.4000/Y.2060 (06/2012) — Overview of the Internet of things.
      https://www.itu.int/rec/T-REC-Y.4000 / 정의 인용 https://www.itu.int/en/ITU-T/gsi/iot/Pages/default.aspx
      (원문: a global infrastructure for the information society, enabling advanced services by
      interconnecting (physical and virtual) things based on existing and evolving interoperable
      information and communication technologies)"
    grade: A
  - claim: "같은 권고는 '사물(thing)' 을 물리적 또는 가상의 식별 가능한 객체로, '디바이스(device)' 를
      통신 기능은 필수이고 센싱·구동·저장·처리 기능은 선택인 장치로 구분한다."
    source: "ITU-T Y.4000/Y.2060 (06/2012) — 용어 정의"
    grade: A
  - claim: "IMT-2020(5G) 은 eMBB(초광대역), URLLC(초고신뢰·저지연), mMTC(대규모 사물통신)
      세 가지 사용 시나리오를 전제로 요구조건이 정의돼 있다. IoT 에 직접 대응하는 것은
      mMTC 와 URLLC 다."
    source: "Report ITU-R M.2410-0 (11/2017) — Minimum requirements related to technical
      performance for IMT-2020 radio interface(s).
      https://www.itu.int/dms_pub/itu-r/opb/rep/R-REP-M.2410-2017-PDF-E.pdf"
    grade: A
  - claim: "IMT-2020 의 연결밀도 최소 요구조건은 1 km2 당 1,000,000 대다. 조건 — mMTC
      사용 시나리오 평가용이고, 제한된 대역폭과 제한된 송수신점(TRxP) 수에서 정해진 크기의
      메시지를 정해진 시간 안에 정해진 성공확률로 전달한다는 QoS 를 만족해야 한다."
    source: "Report ITU-R M.2410-0 §4.8 Connection density (원문: The minimum requirement for
      connection density is 1 000 000 devices per km2)"
    grade: A
  - claim: "IMT-2020 의 사용자평면 지연 최소 요구조건은 URLLC 1 ms, eMBB 4 ms 다.
      조건 — 무부하 상태(단일 사용자), 작은 IP 패킷(예: 0바이트 페이로드 + IP 헤더),
      상·하향 모두. 그리고 이 값은 **무선 구간이 기여하는 편도 시간**이지 앱에서 앱까지의
      왕복 시간이 아니다."
    source: "Report ITU-R M.2410-0 §4.7.1 User plane latency"
    grade: A
    note: "숫자만 떼어 '5G 는 1밀리초' 라고 말하면 틀린 인상을 준다. 조건을 함께 말한다."
  - claim: "IMT-2020 의 제어평면 지연 최소 요구조건은 20 ms 다(더 낮은 10 ms 도 권장)."
    source: "Report ITU-R M.2410-0 §4.7.2 Control plane latency"
    grade: A
  - claim: "IMT-2020 의 신뢰도 최소 요구조건은 Urban Macro-URLLC 시험환경의 커버리지 경계
      채널품질에서 32바이트 계층2 PDU 를 1 ms 안에 전달할 성공확률 1 − 10^-5 다."
    source: "Report ITU-R M.2410-0 §4.10 Reliability"
    grade: A
  - claim: "자율주행 등급(레벨 0~5)은 주행을 사람이 책임지는지 차량의 주행 자동화 시스템이
      책임지는지로 나뉜다. 레벨 0~2 는 운전자 책임 구간이고 레벨 3부터 시스템이 주도권을 갖는다.
      통신망 세대는 등급 정의에 들어가지 않는다."
    source: "SAE J3016 'Levels of Driving Automation' 체계에 대한 국내 기관 해설
      (보험연구원 연구보고서 2023-02 등). SAE J3016 원문은 유료라 이번 조사에서 직접 열람하지 못했다."
    grade: B
    note: "원 표준 미열람. 전문가 수준에서도 '등급은 시스템 책임 소재로 정의된다' 이상을 말하지 않는다."

unverifiable:
  - "체험관에 전시된 전구를 태블릿으로 밝기·색상을 바꿀 수 있는지 — 체험관 고유 정보, 현장 확인 필요."
  - "전시된 IoT 기기의 종류·제조사·사용 프로토콜(Wi-Fi/BLE/Zigbee/Matter 등) — 체험관 고유 정보, 현장 확인 필요."
  - "전 세계 또는 국내 IoT 연결 기기 수 — 출처마다 정의와 집계 기준이 달라 A/B 등급으로 확정하지 못했다.
    숫자를 말하지 않는다."

corrections:
  - "⚠️ 현재 `data/cues.yaml` 의 '5G 와 접목되면 완전 자율주행·능동 제어로 나아간다' 는
    **근거 없는 인과 단정**이다. 5G 규격(Report ITU-R M.2410-0)이 규정하는 것은 지연 1 ms,
    연결밀도 100만 대/km2 같은 **무선 성능 요구조건**이지 '완전 자율주행' 같은 응용의 달성이
    아니다. 게다가 자율주행 등급은 차량의 주행 자동화 시스템이 무엇을 책임지느냐로 정의되며
    통신망 세대와 대응하지 않는다. → '5G 가 되면 완전 자율주행이 된다' 로 말하지 않는다.
    '지연과 동시접속 한계가 줄어 원격·협력 제어의 여지가 커진다' 까지만 말한다."
  - "현재 큐시트의 '초연결 인터넷' 은 표준 용어가 아니다. 사실과 어긋나지는 않지만,
    전문가 수준에서는 ITU-T Y.4000/Y.2060 의 '정보사회를 위한 글로벌 인프라' 라는 표준 표현을 쓴다."

briefs:
  초등:
    mc_brief: "물건들끼리 서로 이야기를 주고받는다는 상상으로 호기심을 열고 도슨트에게 넘긴다.
      '사물인터넷' 이라는 말은 써도 되지만 풀어서 설명해 달라고 부탁한다."
    guard: "숫자·연도·표준 이름은 말하지 않는다. 전시된 기기로 무엇을 할 수 있는지 단정하지 않는다."
    docent_brief: "전등·시계·자동차 같은 물건들이 인터넷으로 서로 연결돼서 서로에게 말을 걸 수
      있게 됐다는 것, 그래서 멀리서도 물건을 켜고 끄고 상태를 알 수 있다는 것.
      비유 중심으로. 숫자·연도·표준 이름은 말하지 않는다."
  중고등:
    mc_brief: "인터넷에 연결되는 것이 컴퓨터와 휴대폰만은 아니라는 점을 짚고 도슨트에게 넘긴다."
    guard: "'5G가 되면 완전 자율주행'이라고 하지 않는다. 연도만 말하고 구체 수치는 말하지 않는다."
    docent_brief: "사물인터넷은 사물에 통신 기능을 붙여 서로 연결하고 그 데이터로 서비스를
      만드는 것이라는 원리. 핵심 훅은 '사람이 일일이 입력하지 않아도 사물이 스스로 상태를
      알린다' 는 대비. 5G 이야기를 꺼낼 때는 '기기를 훨씬 많이, 훨씬 빠른 응답으로 연결할 수
      있게 설계된 세대' 까지만 — **완전 자율주행이 된다고 말하지 않는다.**
      연도만 말하고 구체 수치는 말하지 않는다."
  일반:
    mc_brief: "체험관에서 직접 만져볼 수 있는 사물인터넷이 무엇인지 도슨트에게 묻는다."
    guard: "'5G가 되면 완전 자율주행'이라는 인과는 말하지 않는다. 연결 기기 수는 말하지 않는다 — 집계 기준이 출처마다 다르다."
    docent_brief: "국제 표준(ITU)의 정의는 사물을 서로 연결해 진보된 서비스를 가능하게 하는
      글로벌 인프라라는 것, 여기서 '사물' 은 물리적인 것뿐 아니라 가상의 것도 포함한다는 것,
      5G 는 이 사물들을 훨씬 촘촘하게(1제곱킬로미터에 백만 대 규모) 훨씬 빠른 응답으로(밀리초 단위)
      연결하는 것을 목표로 설계된 세대라는 것. 수치는 개략으로만.
      **'5G 가 되면 완전 자율주행' 이라는 인과는 말하지 않는다** — 자율주행 수준은 차량이
      스스로 무엇을 하느냐로 정해지고 통신은 이를 돕는 쪽이라는 정도로 정리한다."
  전문가:
    mc_brief: "표준 정의와 5G 의 사용 시나리오 구분을 전제로 깔고, IoT 가 그중 어디에
      해당하는지 도슨트에게 묻는다."
    guard: "지연·연결밀도 값에는 조건을 반드시 함께 말한다. 요구조건이 특정 응용의 달성을 뜻한다고 말하지 않는다. 전시 기기의 프로토콜은 단정하지 않는다."
    docent_brief: "ITU-T Y.4000/Y.2060(2012-06)의 IoT 정의와 thing/device 구분을 그대로 말한다.
      IMT-2020 의 세 사용 시나리오(eMBB·URLLC·mMTC) 중 IoT 에 대응하는 것은 mMTC 와 URLLC 이며,
      Report ITU-R M.2410-0 의 최소 요구조건이 연결밀도 100만 대/km2(mMTC), 사용자평면 지연
      URLLC 1 ms·eMBB 4 ms, 제어평면 지연 20 ms, URLLC 신뢰도 32바이트 L2 PDU 를 1 ms 안에
      1 − 10^-5 성공확률이라는 것. **조건을 반드시 함께 말한다** — 지연 값은 무부하·단일 사용자·
      소형 IP 패킷 가정의 무선 구간 편도 기여분이고, 연결밀도는 제한된 대역폭과 TRxP 수 조건이다.
      끝으로 이 요구조건들은 성능 목표이지 특정 응용(완전 자율주행)의 달성을 규정하지 않는다는
      점을 분명히 한다."

mc: "다음 주제는 사물인터넷이에요. 도슨트, 사물인터넷이 뭐예요?"
mc_after: "물건들끼리 서로 말을 걸다니 신기하네요. 궁금한 점 있으실까요?"
