# 조사 산출물 — 09-special-exhibit (특별교류전시).  2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에.
#
# **외부 조사 대상이 아니다.** 지금 무엇이 전시돼 있는지는 전시 운영 정보라 웹에 없다.
# 에이전트를 붙이면 뭔가 찾아내려다 근거 없는 내용을 만든다 — 그래서 붙이지 않았다.

id: "09-special-exhibit"
title: "특별교류전시"
gaze: audience
topic: "유관기관 교류 특별전시 — 현재 전시품"

facts: []
facts_note: >
  비어 있는 것이 맞다. 특별전시는 기간마다 바뀌는 운영 정보이고 KCA 공식 어디에도
  현재 전시 목록이 없다. 억지로 채우면 지어낸 내용이 된다.

corrections:
  - ⚠️ 기존 지시문의 "조선대학교 장황남 **전파통신**박물관" 은 이름이 틀렸다.
    정식 명칭은 **장황남정보통신박물관** 이다(조선대학교 공식 표기, `05-donor.yaml` 참고).
  - ⚠️ 조선대 박물관 소장품이 이 체험관으로 이관·대여됐는지 자체가 확인되지 않았다
    (`05-donor.yaml` unverifiable). 전시 경위를 단정하지 않는다.

unverifiable:
  - 현재 전시품 목록(군용 헤드셋·마이크·간첩 무전기 등) — 현장 확인 필요.
  - 전시 시작·종료 시점, 교류 상대 기관 — 현장 확인 필요.
  - >
    기존 지시문의 "군사장비는 내구도를 높이느라 튼튼하지만 무겁다" 는 상식적이나
    출처가 없다. 일반화된 단정 대신 눈앞의 실물을 가리키는 말이 안전하다.

briefs:
  초등:
    mc_brief: "여기에는 가끔 바뀌는 특별한 전시가 있다고 알리고 도슨트에게 넘긴다."
    docent_brief: "이 코너는 전시품이 때때로 바뀐다는 것과, 지금 눈앞에 보이는 것을
      가리켜 설명한다는 것. **구체적인 물건 이름을 미리 말하지 않는다** — 무엇이
      전시 중인지 확인되지 않았다."
  중고등:
    mc_brief: "다른 기관과 교류해 꾸미는 특별전시라는 점을 짚고 넘긴다."
    docent_brief: "유관기관과 교류해 일정 기간만 여는 전시 공간이라는 것. 지금 무엇이
      있는지는 눈앞의 것을 보고 말한다. 목록을 외워 말하지 않는다."
  일반:
    mc_brief: "특별교류전시의 성격을 소개하고 지금 무엇이 있는지 도슨트에게 묻는다."
    docent_brief: "유관기관과 교류해 특별 전시품을 일정 기간 전시하는 공간이라는 것.
      전시품 목록·전시 기간·교류 기관은 확인되지 않았으므로 단정하지 않고, 관람객이
      직접 보고 있는 것을 중심으로 말한다."
  전문가:
    mc_brief: "상설전시와 교류전시의 운영 차이를 짚고 도슨트에게 넘긴다."
    docent_brief: "상설전시와 달리 기간 한정이라 소장·대여 주체가 갈린다는 점.
      **구체 전시품과 소장기관은 확인되지 않았으므로 말하지 않는다.**"

mc: "특별교류전시라는 코너도 있다고 들었습니다. 도슨트, 지금은 어떤 것이 전시돼 있나요?"
mc_after: "기간마다 바뀌는 전시라 올 때마다 다르겠네요. 궁금한 점 있으실까요?"
