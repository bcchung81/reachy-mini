# 조사 산출물 — 04-morse (전파이야기 체험).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# ⚠️ 이 섹션은 기존 큐시트에서 **용어·사실 오류 둘 + 혼동 위험 하나**가 나왔다.
#    corrections 를 먼저 읽는다.
#
# 조사 범위 주의: 모스 부호·헤르츠 실험·라이덴 병의 **역사와 원리**는 출처로 확보된다.
# 그러나 **체험관에 놓인 장치가 어떻게 생겼고 어떻게 조작하는지**는 웹에 없다 —
# unverifiable 로 내렸다. 도슨트가 장치 조작을 단정하지 않게 한다.

id: "04-morse"
title: "전파이야기 체험 — 모스부호·헤르츠 실험·라이덴 병"
gaze: audience
topic: "점과 선의 약속, 불꽃으로 만든 전파, 전기를 담는 병"

facts:
  # --- 모스 부호 ---
  - claim: "모스 부호는 짧은 신호(점)와 긴 신호(선)를 조합해 문자를 표기하는 방식이고,
      신호는 소리·빛·전류 무엇으로든 나타낼 수 있다."
    source: "한국어 위키백과 — 모스 부호 https://ko.wikipedia.org/wiki/모스_부호"
    grade: B
  - claim: "모스 부호는 모스 한 사람의 작품이 아니다. 모스의 최초 제안은 숫자만 보내는
      코드였고, 실제로 쓰인 알파벳 기반 코드는 함께 일하던 기술자 앨프리드 베일이
      확장한 것이다. 조지프 헨리도 전신 시스템 개발에 참여했다."
    source: "Wikipedia — Morse code (원문: Morse's preliminary proposal for a telegraph code
      was replaced by an alphabet-based code developed by Alfred Vail)"
    grade: B
  - claim: "베일은 뉴저지 모리스타운의 지역 신문 활자 케이스에 든 활자 수를 세어 영어
      글자 빈도를 추정했고, 자주 쓰는 글자에 짧은 부호를 배정했다. 영어에서 가장 흔한
      글자 E 가 점 하나인 이유다."
    source: "Wikipedia — Morse code"
    grade: B
  - claim: "오늘날의 국제 모스 부호는 1848년 프리드리히 게르케가 내놓은 개량안
      ('함부르크 알파벳')에서 나왔고, 1865년 5월 17일 파리에서 열린 국제전신협약
      회의에서 표준화됐다. 그 회의가 지금 ITU 의 전신인 국제전신연합을 만들었다."
    source: "Wikipedia — Morse code (원문: standardized by the International Telegraph
      Convention ... on 17 May 1865 in Paris. This formed the International Telegraph Union)"
    grade: B
  - claim: "모스·베일의 원래 코드(American Morse)와 국제 모스 부호에서 부호가 그대로
      남은 글자는 E, H, K, N 넷뿐이며, 그나마 K 와 N 은 짧던 대시가 정식 길이로 늘어났다."
    source: "Wikipedia — Morse code"
    grade: B
  - claim: "국제 모스 부호의 현행 국제 표준은 ITU-R 권고 M.1677-1 (2009년 10월) 이다.
      제목은 'International Morse code', M 시리즈(이동·무선측위·아마추어 및 관련 위성업무)."
    source: "ITU 원문 PDF — Recommendation ITU-R M.1677-1 (10/2009)
      https://www.itu.int/dms_pubrec/itu-r/rec/m/R-REC-M.1677-1-200910-I!!PDF-E.pdf"
    grade: A
  - claim: "ITU-R M.1677-1 Annex 1 제2절의 타이밍 규정: 선은 점 셋과 같다 / 같은 글자를
      이루는 신호 사이 간격은 점 하나 / 두 글자 사이 간격은 점 셋 / 두 낱말 사이 간격은
      점 일곱."
    source: "ITU-R M.1677-1, Annex 1, §2.1~2.4 (원문: A dash is equal to three dots ...
      The space between two words is equal to seven dots)"
    grade: A
  - claim: "ITU-R M.1677-1 §1.1.1 에서 s 는 점 셋(. . .), o 는 선 셋(− − −) 이다."
    source: "ITU-R M.1677-1, Annex 1, §1.1.1 Letters"
    grade: A
  - claim: "ITU 는 권고 서두에서 '모스 부호의 여러 판본이 1844년부터 사용돼 왔다'고 적는다."
    source: "ITU-R M.1677-1, considering a) (원문: that versions of the Morse code have been
      in use since 1844)"
    grade: A
  - claim: "한국어 위키백과는 모스가 1837년에 고안했고 1844년 볼티모어–워싱턴 D.C. 전신
      연락에 처음 쓰였다고 적는다."
    source: "한국어 위키백과 — 모스 부호"
    grade: B
    note: "영문 위키백과는 '모스의 최초안은 베일의 코드로 대체됐다'고 더 세분한다.
      두 서술이 충돌하지는 않지만, 일반·전문가 수준에서는 베일의 몫을 같이 말한다."
  - claim: "SOS 는 세 글자가 아니라 글자 사이 간격 없이 이어 치는 하나의 프로사인이며,
      뜻은 '지금부터 조난 통신이 시작된다(다른 모든 송신은 침묵하라)' 이다."
    source: "Wikipedia — Morse code (원문: The SOS signal is not sent as three separate
      characters; rather, it is a prosign SOS, and is keyed without gaps between characters)"
    grade: B
  - claim: "SOS 는 1906년 11월 3일 서명된 제1차 국제무선전신협약에서 채택돼 1908년 7월
      1일 발효했다."
    source: "Wikipedia — SOS"
    grade: B
  - claim: "한글 전신 부호는 김학우가 개발했고, 사용 빈도와 한글 순서·획순을 함께 고려해
      정했다. 가장 많이 쓰는 'ㅏ' 에 점 하나를, 대칭인 'ㅓ' 에 선 하나를 배정했다."
    source: "한국어 위키백과 — 모스 부호"
    grade: B
    note: "모스부호 변환기에 한국어 문구를 넣는 체험과 직결되는 훅이다. 개발 연도는
      출처에 없으므로 말하지 않는다."

  # --- 헤르츠 실험 ---
  - claim: "헤르츠는 1886년 가을 카를스루에에서 리스 나선(Riess/Reiss spirals) 한 쌍을
      실험하다가, 한쪽 코일에 라이덴 병을 방전시키면 다른 쪽 코일의 간극에 불꽃이 튀는
      것을 보고 장치를 착상했다."
    source: "Wikipedia — Heinrich Hertz / Spark-gap transmitter (원문: discharging a Leyden
      jar into one of these coils produced a spark in the other coil)"
    grade: B
  - claim: "헤르츠의 송신기는 1 m 짜리 금속 막대 한 쌍을 일직선으로 놓고 안쪽 끝 사이에
      불꽃 간극을, 바깥 끝에 용량을 위한 금속 구 또는 판을 붙인 쌍극자 안테나였다.
      전원은 룸코르프 유도코일이 만드는 5~30 kV 고전압 펄스였다."
    source: "Wikipedia — Heinrich Hertz / Spark-gap transmitter (원문: metal balls or plates
      for capacitance (C) ... an induction coil (Ruhmkorff coil) (T) ... 5 to 30 kV)"
    grade: B
    note: "큐시트의 '네모 구리판' 은 금속 판 형태를 가리키므로 틀렸다고 볼 근거는 없다.
      정정하지 않는다. 다만 **전원**은 유도코일이다 — corrections 2번 참고."
  - claim: "헤르츠의 수신기는 양 끝에 마이크로미터 불꽃 간극을 둔 공진 고리 안테나였고,
      검출은 그 간극에 튀는 아주 작은 불꽃을 눈으로 확인하는 것이었다."
    source: "Wikipedia — Spark-gap transmitter (원문: Hertz detected the waves by observing
      tiny sparks in micrometer spark gaps (M) in loops of wire)"
    grade: B
  - claim: "헤르츠가 1887년에 만든 것이 최초의 실험용 불꽃간극 송신기다. 그가 만든 전파는
      1910년 무렵까지 '헤르츠파(Hertzian waves)' 로 불리다가 '라디오파' 로 바뀌었다."
    source: "Wikipedia — Spark-gap transmitter / Heinrich Hertz"
    grade: B
  - claim: "헤르츠는 1886~1889년 실험에서 50~450 MHz 대의 전파를 만들었다. 진동자를
      아연 반사판에서 12 m 떨어뜨려 파장 약 4 m 의 정상파를 만들고, 반사·굴절·회절·편광·
      간섭을 보였으며, 전파의 속도가 빛의 속도와 같음을 측정했다."
    source: "Wikipedia — Heinrich Hertz / Spark-gap transmitter"
    grade: B
  - claim: "헤르츠는 자기 실험의 실용성을 몰랐다. '아무 쓸모 없습니다 … 마에스트로 맥스웰이
      옳았다는 것을 증명하는 실험일 뿐입니다' 라고 했고, 응용을 묻자 '없을 것 같은데요
      (Nothing, I guess)' 라고 답했다."
    source: "Wikipedia — Heinrich Hertz (직접 인용문)"
    grade: B
    note: "강력한 훅이다. 헤르츠 증명 6년 안에 마르코니가 무선전신을 시작했다는 대비와
      묶으면 좋다 — 02-history 와 연결된다."

  # --- 라이덴 병 ---
  - claim: "라이덴 병은 유리병 안쪽과 바깥쪽에 붙인 금속 박막 사이에 고전압 전하를
      저장하는 부품이며, **축전기(콘덴서, capacitor)의 원형** 이다."
    source: "Wikipedia — Leyden jar (원문: It was the original form of the capacitor) /
      한국어 위키백과 — 라이덴병 (원문: 축전기의 시초이다)"
    grade: B
  - claim: "라이덴 병은 두 갈래로 독립 발견됐다. 독일의 에발트 게오르크 폰 클라이스트가
      1745년 10월 11일에 먼저 발견했고, 네덜란드 라이던의 피터르 판 뮈스헨브룩과
      안드레아스 쿠나에우스가 1745~1746년에 따로 발견했다. 이름은 도시 라이던에서 왔다."
    source: "Wikipedia — Leyden jar, Discovery 절"
    grade: B
  - claim: "라이덴 병은 20세기 전환기 무렵부터 불꽃간극 무선송신기와 의료용 전기치료
      장비에 널리 쓰였다."
    source: "Wikipedia — Leyden jar (원문: Around the turn of the century it began to be
      widely used in spark-gap transmitters and medical electrotherapy equipment)"
    grade: B

  # --- 대중문화 훅 ---
  - claim: "영화 '기생충' 에 지하의 근세가 전등 스위치를 눌러 모스 부호를 보내고 다송이
      받아 적는 장면이 있다."
    source: "문화일보·씨네21 의 봉준호 감독 인터뷰 보도, 나무위키 해석 문서"
    grade: C
    note: "⚠️ C 등급. 연출 소재이지 사실 주장이 아니다. 훅으로만 쓰고, 영화의 세부
      (대사·정확한 장면 순서·어떤 부호였는지)를 도슨트가 단정하지 않게 한다."

corrections:
  - "⚠️ 현재 `docs/exhibit-guide.md` §4 와 `data/cues.yaml` 04-morse 의 '라이덴 병 —
    정전기를 저장하는 최초의 **축전지**' 는 **용어가 틀렸다.** 라이덴 병은
    **축전기(콘덴서, capacitor)** 의 원형이다. 축전지(battery / accumulator)는 화학 반응으로
    전기를 저장하는 전혀 다른 물건이고 라이덴 병과 계보가 없다. 한 글자 차이지만 중고등
    이상 관람객에게는 바로 걸리는 오류다. → '축전기(콘덴서)의 시초' 로 고친다."
  - "⚠️ 현재 큐시트의 '헤르츠는 구리판 사이 방전에 **전기가 아닌 정전기**를 썼다' 는
    두 군데가 틀렸다. (가) 헤르츠 송신기의 전원은 **룸코르프 유도코일**이 만든 5~30 kV
    고전압 펄스다. 라이덴 병은 전원이 아니라 1886년 리스 나선 관찰 — 즉 장치를 떠올린
    **계기** — 에 나온다. (나) **정전기도 전기다.** '전기가 아닌 정전기' 라는 대비는
    성립하지 않는다. 정지한 전하냐 흐르는 전류냐의 구분일 뿐이다. → 이 문장은 통째로
    빼고, '라이덴 병 방전 실험이 헤르츠에게 장치의 실마리를 줬다' 로 바꾼다."
  - "⚠️ (혼동 위험 — 사실 오류는 아님) '원형 고리에서 검출돼 **네온전구**가 켜진다' 는
    **체험 장치**의 동작이다. 헤르츠의 원래 검출기는 마이크로미터 불꽃 간극이 달린 고리
    안테나였고, 신호는 눈에 겨우 보이는 작은 불꽃이었다. 큐시트 문장이 둘을 구분하지 않아
    도슨트가 '헤르츠는 네온전구로 확인했다' 고 말할 여지가 있다. → 장치를 설명할 때
    '오늘날 체험용으로는 네온전구를 쓴다' 로 시점을 분명히 갈라 준다."

