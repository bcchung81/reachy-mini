briefs:
  초등:
    mc_brief: "직접 만져보고 쳐볼 수 있는 것들이 있다는 걸 신나게 알리고, 무엇을 해볼 수
      있는지 도슨트에게 묻는다. 장치 이름을 줄줄이 늘어놓지 않는다."
    docent_brief: "점과 선 두 가지만으로 글자를 만들어 보내는 약속이 모스 부호라는 것이
      핵심 훅 — 짧게 '똑', 길게 '뚜우' 두 소리로 편지를 쓰는 셈이라는 비유를 쓴다.
      그리고 그걸 여기서 직접 손으로 쳐볼 수 있다는 것. 인명·연도·숫자·표준 이름은
      말하지 않는다."
  중고등:
    mc_brief: "만져볼 수 있는 체험 장치가 있다는 것을 짚고, 무엇을 해볼 수 있는지
      도슨트에게 넘긴다."
    docent_brief: "모스 부호가 점과 선의 **길이 차이**로 글자를 표현하고, 자주 쓰는
      글자일수록 짧은 부호를 받았다는 설계가 핵심 훅 — 영어에서 가장 흔한 E 가 점 하나다.
      한글에도 전신 부호가 있고 김학우가 만들었다는 것. 헤르츠는 불꽃을 튀겨 전파를
      만들고 떨어진 고리에서 그 전파를 받아 존재를 확인했다는 것. 연도는 1844년(첫 사용)과
      1887년(헤르츠의 불꽃간극 송신기) 정도만 말하고 수치는 넣지 않는다."
  일반:
    mc_brief: "체험관에 직접 만져볼 수 있는 장치가 있다는 것을 언급하고, 전파이야기 쪽에서
      무엇을 해볼 수 있는지 도슨트에게 묻는다."
    docent_brief: "모스 부호가 모스 혼자의 작품이 아니라는 것이 핵심 훅 — 동료 앨프리드
      베일이 알파벳 코드로 확장했고, 지금 쓰는 국제 모스 부호는 1848년 게르케의 개량을
      거쳐 1865년에 국제 표준이 됐다. 자주 쓰는 글자에 짧은 부호를 준 설계(E 는 점 하나)와,
      SOS 는 세 글자가 아니라 끊지 않고 이어 치는 하나의 신호라는 것. 헤르츠는 유도코일로
      만든 고전압을 불꽃 간극에 튀겨 전파를 쏘고, 떨어진 고리 안테나의 미세한 불꽃으로
      그것을 받았다는 것. 라이덴 병은 1745년에 발견된 **축전기(콘덴서)의 원형** 이라는 것
      — '축전지' 라고 말하지 않는다. 헤르츠가 그 방전 실험에서 장치의 실마리를 얻었다는
      연결까지."
  전문가:
    mc_brief: "이론이 실험 장치로 내려오는 지점이라는 전제를 깔고, 이 체험이 무엇을
      재현하는 것인지 도슨트에게 묻는다."
    docent_brief: "국제 모스 부호의 현행 표준이 ITU-R 권고 M.1677-1(2009년 10월)이고,
      타이밍이 선=점 셋 / 글자 안 간격=점 하나 / 글자 사이=점 셋 / 낱말 사이=점 일곱으로
      규정돼 있다는 것. s=··· , o=--- 이고 SOS 는 글자 간격 없이 이어 치는 프로사인이며
      1906년 11월 3일 제1차 국제무선전신협약에서 채택돼 1908년 7월 1일 발효했다는 것.
      지금의 국제 부호는 1848년 게르케의 '함부르크 알파벳' 에서 나와 1865년 5월 17일 파리
      국제전신협약에서 표준화됐고 그 회의가 ITU 의 전신을 만들었으며, 모스·베일 원본과
      부호가 같은 글자는 E·H·K·N 넷뿐이라는 것. 헤르츠는 1886년 가을 카를스루에에서 리스
      나선에 라이덴 병을 방전시키다 착상했고, 룸코르프 유도코일의 5~30 kV 펄스로 1 m
      쌍극자의 불꽃 간극을 때려 50~450 MHz 를 발생시켰으며 마이크로미터 불꽃 간극이 달린
      공진 고리로 수신했다는 것. 아연 반사판을 12 m 떨어뜨려 파장 약 4 m 의 정상파를 만들어
      반사·굴절·회절·편광·간섭과 빛과 같은 전파 속도를 보였다는 것. 라이덴 병은
      폰 클라이스트(1745년 10월 11일)와 뮈스헨브룩·쿠나에우스(1745~46, 라이던)가 독립
      발견한 축전기의 원형이고 20세기 전환기 불꽃간극 송신기에 널리 쓰였다는 것.
      **'전기가 아닌 정전기' 라는 표현은 쓰지 않는다** — 정전기도 전기다."

mc: "체험관에는 직접 만져볼 수 있는 장치들도 있다고 들었어요. 도슨트, 전파이야기 체험존에서는 무엇을 해볼 수 있나요?"
mc_after: "모스부호를 직접 쳐볼 수 있다니 재미있겠어요. 궁금한 점 있으실까요?"
