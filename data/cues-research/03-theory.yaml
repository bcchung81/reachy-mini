# 조사 산출물 — 03-theory (전파 이론: 주파수와 파장).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# ⚠️ 기존 큐시트 지시문에서 **범주 오류 1건 + 누락 1건**이 나왔다. corrections 를 먼저 읽는다.
#
# 이 섹션은 드물게 **A 등급 1차 출처(법령 원문)** 를 쓸 수 있는 섹션이다.
# 전파는 물리 현상이면서 동시에 「전파법」이 정의한 법적 대상이기 때문이다.

id: "03-theory"
title: "전파 이론 — 주파수와 파장"
gaze: partner
topic: "전파란 무엇인가 — 주파수·파장·헤르츠, 그리고 둘의 반비례 관계"

facts:
  # ── 정의 (A 등급) ────────────────────────────────────────────────
  - claim: "「전파법」 제2조제1항제1호는 '전파'를 '인공적인 유도(誘導) 없이 공간에 퍼져
      나가는 전자파로서 국제전기통신연합이 정한 범위의 주파수를 가진 것'으로 정의한다."
    source: "국가법령정보센터 — 전파법 제2조 (법령ID 001732, 공포 2025-10-01 / 시행 2026-01-02)
      https://www.law.go.kr/법령/전파법"
    grade: A
    note: "법령 원문 그대로다. 두 가지가 핵심 — ① '인공적인 유도 없이'(케이블 같은
      인공 도파로를 타지 않는다) ② 주파수 범위는 법이 직접 정하지 않고 ITU 에 맡겼다."

  - claim: "「전파법」 제2조제1항제5호의2는 '무선통신'을 '전파를 이용하여 모든 종류의
      기호·신호·문언·영상·음향 등의 정보를 보내거나 받는 것'으로 정의한다."
    source: "국가법령정보센터 — 전파법 제2조 (원문 인용)"
    grade: A

  - claim: "ITU 전파규칙(Radio Regulations) No. 1.5 는 radio waves(= hertzian waves)를
      '3,000GHz 보다 임의로 낮은 주파수를 가지고, 인공적인 도파로 없이 공간에 전파되는
      전자기파'로 정의한다."
    source: "ITU Radio Regulations No. 1.5 — ITU-R 세미나 공식 배포자료에서 동일 문구 확인
      https://www.itu.int/dms_pub/itu-r/md/15/wrs18/sp/R15-WRS18-SP-0003!!PDF-E.pdf
      (영문 원문: \"electromagnetic waves of frequencies arbitrarily lower than
      3 000 GHz, propagated in space without artificial guide\")"
    grade: A
    note: "전파법이 말하는 '국제전기통신연합이 정한 범위'가 바로 이것이다. 다만 두 조항을
      잇는 연결 자체는 조사자의 해석이므로, 전문가 수준에서 '법이 ITU 에 위임했고 ITU 는
      3,000GHz 를 상한으로 본다'는 형태로만 말한다."

  # ── 주파수와 단위 ────────────────────────────────────────────────
  - claim: "주파수는 단위시간당 반복 횟수를 나타내는 물리량이고, 헤르츠(Hz)는 그 SI 단위다.
      헤르츠는 SI 유도단위로 기본단위 표현은 s⁻¹ 이며, 주기적 현상에만 쓴다."
    source: "Wikipedia — Hertz / Frequency (원문: \"The hertz is the unit of frequency in
      the International System of Units (SI)\", \"It is used only in the case of
      periodic events.\")"
    grade: B
    note: "⚠️ 기존 지시문의 '단위는 주파수, 표기는 헤르츠'는 이 관계가 뒤집혀 있다.
      corrections 참조."

  - claim: "헤르츠라는 단위 이름은 하인리히 루돌프 헤르츠(1857–1894)에서 왔고, 그는
      전자기파의 존재를 처음으로 결정적으로 증명한 사람이다."
    source: "Wikipedia — Hertz (원문: \"named after Heinrich Rudolf Hertz (1857–1894),
      the first person to provide conclusive proof of the existence of electromagnetic
      waves\")"
    grade: B
    note: "02-history 와 그대로 맞물린다 — 단위 이름이 앞 섹션의 주인공이다.
      중고등 이상에서 이 연결을 쓰면 두 섹션이 하나로 이어진다."

  - claim: "1초에 1회 진동하면 1헤르츠, 1,000회면 1킬로헤르츠(kHz)다. 높은 주파수는
      킬로헤르츠·메가헤르츠(MHz)·기가헤르츠(GHz)·테라헤르츠(THz)로 쓴다."
    source: "Wikipedia — Hertz"
    grade: B

  # ── 파장과 관계식 ────────────────────────────────────────────────
  - claim: "파장(λ)은 파형이 반복되는 거리 — 전기장의 한 마루에서 다음 마루까지의 거리이고,
      주파수 f 에 반비례한다. 관계식은 λ = c / f 이다."
    source: "Wikipedia — Radio wave / Wavelength (원문: \"λ = c/f … inversely proportional
      to the frequency f of the wave\")"
    grade: B
    note: "이 섹션 제목이 '주파수와 파장'인데 기존 지시문에는 이 관계식이 아예 없다.
      corrections 참조."

  - claim: "진공에서의 빛의 속도 c 는 정확히 299,792,458 m/s 다. 미터가 '빛이 진공에서
      1/299792458 초 동안 지나간 거리'로 정의되어 있어서 근삿값이 아니라 정확한 값이다."
    source: "Wikipedia — Speed of light (원문: \"exactly equal to 299792458 m⋅s−1.
      It is exact because, by international agreement, a metre is defined as …\")"
    grade: B
    note: "정의상 고정된 값이라는 점이 전문가 수준의 훅이다. 측정해서 얻은 수치가 아니다."

  - claim: "λ = c / f 로부터, 주파수 100MHz 인 FM 라디오 전파의 파장은 약 3m 다."
    source: "λ = c/f 에 c ≈ 3×10⁸ m/s, f = 1×10⁸ Hz 를 넣은 **계산값** (출처에 적힌
      수치가 아니라 위 관계식에서 도출한 값)"
    grade: B
    note: "일반 수준에서 '개략 수치' 로 쓸 만한 유일하게 안전한 예시다. 계산이 자명해서
      검증 가능하다. 다른 대역의 파장을 즉석에서 지어내지 않는다."

  # ── 성질 ────────────────────────────────────────────────────────
  - claim: "전파는 매질 없이 진행한다. 다른 모든 전자기파와 마찬가지로 진공에서는 빛의
      속도로, 지구 대기에서는 그보다 약간 느린 속도로 진행한다."
    source: "Wikipedia — Radio wave (원문: \"radio waves in a vacuum travel at the speed
      of light, and in the Earth's atmosphere at a slightly lower speed\")"
    grade: B
    note: "⚠️ **물결 비유의 한계가 여기다.** 물결은 물이라는 매질이 있어야 하지만 전파는
      아무것도 없는 곳도 지나간다. 비유를 쓰되 '전달해 주는 무언가가 있어야 한다'는
      인상을 남기면 안 된다. 소리와의 대비(소리는 진공에서 안 들린다)가 안전한 보정이다."

  - claim: "전자기파는 전자기장이 스스로 퍼져 나가는 파동이며, 주파수로 분류하면 전파,
      마이크로파, 적외선, 가시광선, 자외선, X선, 감마선이 모두 같은 스펙트럼에 속한다."
    source: "Wikipedia — Electromagnetic radiation"
    grade: B

  - claim: "전파는 전자기 스펙트럼에서 주파수가 가장 낮고 파장이 가장 긴 부류로, 물리학
      관례로는 대체로 300GHz 이하 · 파장 1mm 이상을 가리킨다. 그중 1GHz 이상
      (파장 30cm 이하)을 마이크로파라고 부른다."
    source: "Wikipedia — Radio wave (원문: \"typically with frequencies below 300
      gigahertz (GHz) and wavelengths greater than 1 millimeter\")"
    grade: B
    note: "물리학 관례 상한(300GHz)과 ITU 규정 상한(3,000GHz)이 **다르다**. 전문가
      수준에서만 꺼낸다. 아래 수준에서는 혼란만 준다."

  - claim: "전파는 전하를 띤 입자가 가속될 때 — 예컨대 시간에 따라 변하는 전류에서 —
      발생한다. 번개나 천체에서 나오는 자연 전파도 있다."
    source: "Wikipedia — Radio wave"
    grade: B
    note: "'전파는 사람이 만든 것만 있는 게 아니다'라는 점에서 02-history 의
      '발명이 아니라 발견' 서사를 뒷받침한다."

unverifiable:
  - "이 섹션에서 관람객이 어느 전시물 앞에 서 있는지, 주파수·파장을 눈으로 보여 주는
    장치(파형 전시, 대역 비교 패널 등)가 있는지 — 체험관 고유 정보 — 현장 확인 필요."
  - "기존 지시문의 '퐁당퐁당' 물결 비유가 체험관이 원래 쓰던 해설 표현인지, 큐시트
    작성자가 새로 넣은 것인지 — 체험관 고유 정보 — 현장 확인 필요."
  - "「전파법」의 '국제전기통신연합이 정한 범위'를 국내 고시가 구체적으로 몇 Hz~몇 GHz 로
    받는지 — 「대한민국 주파수 분배표」(과기정통부 고시, 공포 2025-02-17, 행정규칙
    일련번호 2100000254700)에 있을 것으로 보이나 이번 조사에서 본문을 확인하지 못했다.
    확정 전까지 도슨트가 국내 고시의 상·하한 수치를 입에 올리지 않게 한다."

corrections:
  - "⚠️ 현재 `data/cues.yaml` 03-theory 지시문의 '**단위는 주파수, 표기는 헤르츠**'는
    **범주가 뒤바뀌었다.** 주파수가 물리량이고 헤르츠(Hz)가 그 SI 단위다.
    출처: Wikipedia — Hertz(\"The hertz is the unit of frequency in the SI\").
    → '물리량은 주파수, 단위는 헤르츠'로 바로잡는다. 뒤따르는
    '1초에 1회 진동하면 1헤르츠, 1000회면 1킬로헤르츠'는 **맞다** — 그대로 둔다."

  - "⚠️ **오류가 아니라 누락.** 섹션 제목이 '주파수와 **파장**'인데 현재 지시문에는
    파장이 단 한 번도 나오지 않는다. λ = c / f 라는 반비례 관계가 이 섹션의 절반인데
    빠져 있어, 제목과 내용이 어긋난다. 모든 수준의 지시문에 파장을 넣는다."

  - "⚠️ **오류가 아니라 주의.** '퐁당퐁당' 물결 비유는 초등·중고등에서 유효하지만,
    물결은 물이라는 매질이 있어야 하고 전파는 없어도 된다(출처: Wikipedia — Radio wave,
    진공에서 빛의 속도로 진행). 비유를 쓸 때 '전달해 주는 무언가가 있어야 한다'는
    인상을 남기지 않도록 지시문에 못을 박는다."

briefs:
  초등:
    mc_brief: "'그런데 전파가 도대체 뭐예요?' 하고 아이들 대신 궁금해하는 투로 묻고
      도슨트에게 넘긴다. 주파수·파장 같은 말은 사회자가 먼저 쓰지 않는다."
    guard: "숫자·단위·사람 이름·연도는 말하지 않는다. 전파가 지나가려면 물 같은 무언가가 있어야 한다는 인상을 주지 않는다."
    docent_brief: "2~3문장. 전파는 눈에 보이지도 만져지지도 않는 '보이지 않는 물결'
      이라는 것, 연못에 돌을 던지면 물결이 건너편까지 닿듯 전파도 멀리까지 퍼져 간다는
      비유가 핵심 훅. 그 물결이 빠르게 출렁이기도 하고 느리게 출렁이기도 한다는 것까지만.
      **숫자·단위·사람 이름·연도는 하나도 말하지 않는다.**
      ⚠️ 물결 비유를 쓰되 '물이 있어야 간다'는 인상을 주지 않는다 — 전파는 아무것도
      없는 텅 빈 곳도 지나간다고 한마디 덧붙인다."

  중고등:
    mc_brief: "전파의 정체를 원리로 들어가 보자고 예고하고, 주파수와 파장이 무엇인지
      도슨트에게 묻는다."
    guard: "연도 외의 수치는 말하지 않는다. '단위는 주파수'라고 하지 않는다 — 주파수가 물리량이고 헤르츠가 단위다."
    docent_brief: "3~4문장. 전파는 전기와 자기가 서로를 밀어 주며 퍼져 나가는 전자기파의
      한 갈래라는 것. 1초에 몇 번 출렁이느냐가 주파수이고 그 단위가 헤르츠인데, 그 이름이
      **앞에서 나온 헤르츠**에서 왔다는 연결이 핵심 훅. 한 번 출렁이는 동안 파동이 나아간
      거리가 파장이고, 빨리 출렁일수록(주파수가 높을수록) 파장은 짧아진다는 반비례 관계.
      소리와 달리 전파는 진공에서도 간다는 대비를 한마디. 연도 외의 수치는 말하지 않는다."

  일반:
    mc_brief: "전파가 정확히 무엇인지 원리로 들어가 보자고 예고하고, 주파수와 파장을
      쉽게 풀어 달라고 도슨트에게 청한다."
    guard: "FM 라디오 예시 말고 다른 대역의 파장을 지어내지 않는다."
    docent_brief: "4~5문장. 전파는 전자기파(electromagnetic wave)의 한 갈래로, 매질 없이
      공간을 스스로 퍼져 나간다는 것 — 소리는 공기가 있어야 들리지만 전파는 진공에서도
      간다는 대비가 핵심 훅. 1초당 진동 횟수가 **주파수**(물리량)이고 그 **단위**가
      헤르츠(Hz)이며, 1초에 1,000번이면 1킬로헤르츠라는 것. 파동이 한 번 진동하는 동안
      나아간 거리가 **파장**이고, 파장 = 빛의 속도 ÷ 주파수 이므로 주파수가 높을수록
      파장은 짧아진다는 반비례. 개략 수치는 '100메가헤르츠짜리 FM 라디오 전파의 파장이
      약 3미터' 하나만 든다 — 다른 대역의 파장을 즉석에서 만들어 내지 않는다."

  전문가:
    mc_brief: "전파가 물리 현상이면서 동시에 법으로 정의된 대상이기도 하다는 점을 전제로
      깔고, 정의와 관계식을 도슨트에게 청한다."
    guard: "국내 주파수 분배표의 상·하한 수치는 말하지 않는다(미확인)."
    docent_brief: "5~7문장. 「전파법」 제2조제1항제1호가 전파를 '인공적인 유도 없이 공간에
      퍼져 나가는 전자파로서 국제전기통신연합이 정한 범위의 주파수를 가진 것'으로 정의한다는
      것 — 즉 전파는 물리 개념이자 법적 개념이라는 이중성이 핵심 훅. 법이 주파수 범위를
      직접 정하지 않고 ITU 에 위임했고, ITU 전파규칙(RR) No. 1.5 가 그 범위를
      '3,000GHz 보다 임의로 낮은 주파수'로 잡는다는 것. λ = c / f 이며 c 는 진공에서
      정확히 299,792,458 m/s 인데, 이것이 측정값이 아니라 **미터의 SI 정의가 c 를
      고정했기 때문에** 정확한 값이라는 것. 헤르츠는 SI 유도단위 s⁻¹ 이고 주기적 현상에만
      쓴다는 것. 물리학 관례의 전파 상한(약 300GHz, 파장 1mm)과 ITU 규정 상한(3,000GHz)이
      서로 다르다는 점까지 짚는다. 조항 번호와 표준 번호를 그대로 말해도 된다.
      ⚠️ 국내 고시(「대한민국 주파수 분배표」)의 구체적 상·하한 수치는 미확인이므로
      말하지 않는다."

