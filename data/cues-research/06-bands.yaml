# 조사 산출물 — 06-bands (주파수 대역별 기증품).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# ⚠️ 기존 큐시트의 "ITU 10개 대역" 은 **어느 ITU 표로도 나오지 않는 숫자**다.
#    corrections 를 먼저 읽는다.

id: "06-bands"
title: "주파수 대역별 기증품 — 초장파에서 밀리미터파까지"
gaze: audience
topic: "ITU 주파수 대역 구분과 대역별 전시 장비"

facts:
  # ── 전파의 정의 ──────────────────────────────────────────────
  - claim: "전파법상 '전파' 란 인공적인 유도 없이 공간에 퍼져 나가는 전자파로서
      국제전기통신연합이 정한 범위의 주파수를 가진 것을 말한다."
    source: "전파법 제2조제1항제1호 (법제처 국가법령정보센터, 시행 2026-01-02)"
    grade: A
  - claim: "ITU 무선규칙(RR) No. 1.5 는 전파(radio waves / hertzian waves)를 '인공적인
      유도 없이 공간에 전파되는, 임의로 3,000 GHz 보다 낮은 주파수의 전자기파' 로 정의한다."
    source: "ITU RR No. 1.5 — 한국어 위키백과 '전파' 가 인용한 문구. ITU 1차 원문 미확인"
    grade: B
    note: "3,000 GHz 라는 상한은 아래 V.431-8 Table 1 의 마지막 대역(12번, 300~3,000 GHz)
      과 맞물린다. 숫자 자체는 여러 출처가 일치하나 RR 원문 PDF 는 확보하지 못했다."

  # ── ITU 대역 표 (1차 출처) ───────────────────────────────────
  - claim: "ITU-R 권고 V.431-8 Table 1 은 대역번호 3번부터 15번까지 13개 행을 정의한다.
      3 ULF 300~3,000 Hz / 4 VLF 3~30 kHz / 5 LF 30~300 kHz / 6 MF 300~3,000 kHz /
      7 HF 3~30 MHz / 8 VHF 30~300 MHz / 9 UHF 300~3,000 MHz / 10 SHF 3~30 GHz /
      11 EHF 30~300 GHz / 12 (기호 없음) 300~3,000 GHz / 13 3~30 THz /
      14 30~300 THz / 15 300~3,000 THz."
    source: "Recommendation ITU-R V.431-8 (08/2015), Table 1 —
      https://www.itu.int/dms_pubrec/itu-r/rec/v/r-rec-v.431-8-201508-i!!pdf-e.pdf"
    grade: A
  - claim: "같은 표의 '파장에 의한 구분' 열은 3번부터 차례로 헥토킬로미터파·미리어미터파·
      킬로미터파·헥토미터파·데카미터파·미터파·데시미터파·센티미터파·밀리미터파·
      데시밀리미터파·센티밀리미터파·마이크로미터파·데시마이크로미터파다."
    source: "Recommendation ITU-R V.431-8 (08/2015), Table 1 (Corresponding metric subdivision 열)"
    grade: A
  - claim: "Note 1 의 규칙은 '대역번호 N 은 0.3×10^N Hz 에서 3×10^N Hz 까지' 이다.
      대역 경계는 아래쪽이 열린 구간, 위쪽이 닫힌 구간이다."
    source: "Recommendation ITU-R V.431-8 (08/2015), Table 1 표제 및 NOTE 1"
    grade: A
  - claim: "V.431-8 은 Note 3 과 Table 2 로 URSI 가 제안한 확장 구간(-1번 0.03~0.3 Hz,
      0번 ELF 0.3~3 Hz, 1번 3~30 Hz, 2번 30~300 Hz)을 덧붙인다. Table 1 의 13개와
      합치면 17개가 된다."
    source: "Recommendation ITU-R V.431-8 (08/2015), NOTE 3 및 Table 2"
    grade: A
  - claim: "ITU 무선규칙(RR) No. 2.1 의 표는 4번(VLF, 3~30 kHz)부터 12번(300~3,000 GHz)
      까지 9개 행만 싣는다. V.431-8 은 자신의 Table 1 이 'RR No. 2.1 을 고려한 것' 이라고
      명시한다."
    source: "CRAF — Nomenclature (ITU Radio Regulations Article 2.1)
      https://www.craf.eu/miscellaneous/nomenclature-itu-radio-regulations-article-2-1/
      / ITU-R V.431-8 recommends 2 (RR No. 2.1 언급 부분은 A)"
    grade: B
    note: "행 수 9 는 CRAF 재수록본 기준. RR 원문 PDF(life.itu.int)는 현재 404 다.
      '몇 개냐' 를 발화에 쓰려면 RR 원문 확인이 필요하다 — 아래 corrections 참조."

  # ── 한국어 대역 명칭 ─────────────────────────────────────────
  - claim: "전파법 시행령은 중파를 300 kHz~3 MHz, 단파를 3~30 MHz, 초단파를 30~300 MHz
      대역으로 규정한다(각 방송 정의 안에서)."
    source: "전파법 시행령 제2조제8호·제9호·제10호 (법제처, 시행 2025-10-01)"
    grade: A
  - claim: "초장파는 VLF 의 한국어 명칭으로 대역번호 4, 3~30 kHz, 파장 10~100 km 이며
      파장에 의한 구분은 미리어미터파다."
    source: "TTA 정보통신용어사전 '초장파' (출처 표기: 단체표준 TTAK.KO-06.0502/R1)
      https://terms.tta.or.kr/dictionary/dictionaryView.do?subject=초장파"
    grade: B
  - claim: "극초단파는 UHF(대역 9, 300~3,000 MHz, 파장 0.1~1 m), 센티미터파는 SHF
      (대역 10, 3~30 GHz, 파장 1~10 cm), 밀리미터파는 EHF(대역 11, 30~300 GHz,
      파장 1~10 mm)의 한국어 동의어다."
    source: "TTA 정보통신용어사전 UHF / SHF / EHF 표제어"
    grade: B
  - claim: "따라서 초장파(VLF, 4번)에서 밀리미터파(EHF, 11번)까지는 8개 대역이고,
      주파수로는 3 kHz~300 GHz, 파장으로는 100 km~1 mm 다."
    source: "ITU-R V.431-8 Table 1 에서 직접 계산 (3 kHz → 100 km, 300 GHz → 1 mm)"
    grade: A
  - claim: "ITU 표는 대역 이름을 두 계열로 나란히 적는다. VLF·LF·MF·HF·VHF·UHF·SHF·EHF
      는 '기호(Symbols)' 열의 주파수 기준 이름이고, 미리어미터파~밀리미터파는
      '파장에 의한 구분(Corresponding metric subdivision)' 열의 파장 기준 이름이다."
    source: "Recommendation ITU-R V.431-8 (08/2015), Table 1 의 열 구성"
    grade: A

  # ── 전시품 관련 주변 사실 ────────────────────────────────────
  - claim: "국내 무선호출(삐삐) 서비스는 1982년 12월 15일 처음 실시됐고, 1992년 전국
      광역화와 함께 160 MHz 대에서 322 MHz 대로 확대됐다."
    source: "한국민족문화대백과사전 '무선호출기' https://encykorea.aks.ac.kr/Article/E0019085"
    grade: B
    note: "원문에 '322∼238.6MHz' 라는 표기가 있는데 하한>상한이라 오타로 보인다.
      **상한 숫자는 인용하지 않는다.** 160 MHz 는 초단파(VHF), 322 MHz 는 극초단파(UHF)
      대역이므로 '삐삐 = 극초단파' 라고 단정하면 초기 서비스가 빠진다."

corrections:
  - "⚠️ 현재 `data/cues.yaml` 의 'ITU가 전파를 … 10개 대역으로 분류' 는 **어느 ITU 표와도
    맞지 않는다.** ITU-R V.431-8 Table 1 은 13개(3~15번), Table 2 를 합치면 17개,
    ITU 무선규칙 No. 2.1 의 표는 9개(4~12번)다. 10 은 세 가지 어느 셈법에서도 나오지
    않는다. 개수를 꼭 말해야 한다면 근거를 함께 대야 하고, 그게 어려우면 개수를 빼고
    '낮은 주파수부터 높은 주파수까지 차례로 이름이 붙어 있다' 로 말한다."
  - "⚠️ '체험관에는 그중 8개 대역 장비가 전시돼 있다' 의 8 자체는 초장파(VLF, 4번)~
    밀리미터파(EHF, 11번) 범위와 정확히 맞아떨어진다. 틀린 것은 분모(10)뿐이다.
    무선규칙 기준으로 고치면 '9개 중 8개' 가 된다 — 단, 전시 대역 수 자체는 아래
    unverifiable 항목이라 현장 확인 전까지는 숫자를 확정하지 않는다."
  - "⚠️ '대역 이름은 파장 길이(100km~1mm)와 연관된다' 는 절반만 맞다. 파장 범위
    100 km~1 mm 는 VLF~EHF 와 정확히 일치해 맞다. 그러나 '대역 이름' 은 두 계열이다 —
    VLF/LF/…/EHF 와 한국어 초장파·장파·중파·단파·초단파·극초단파는 **주파수** 기준
    이름이고, 미리어미터파·킬로미터파·…·밀리미터파가 **파장** 기준 이름이다
    (ITU-R V.431-8 Table 1 이 두 열을 따로 둔다). 섹션 제목 '초장파에서 밀리미터파까지'
    는 두 계열의 이름을 한 문장에 섞어 쓴 것이다. 가리키는 구간(4~11번)은 맞으므로
    제목을 고칠 필요는 없지만, '이름이 파장에서 왔다' 고 설명하면 초장파·극초단파가
    설명되지 않는다."

unverifiable:
  - "체험관에 실제로 전시된 기증품의 목록과 대역별 구성 — 체험관 고유 정보, 현장 확인 필요."
  - "전시 장비가 덮는 대역이 정말 8개인지 — 체험관 고유 정보, 현장 확인 필요."
  - "'1920년 제작 진공관 라디오 Masterpiece' — 1920년대 미국 Freshman 사의 'Freshman
    Masterpiece' 라는 진공관 라디오가 실재한다는 정황은 있으나(C급, 수집가 영상),
    전시품의 제작연도·모델 동일성은 웹으로 확인할 수 없다. 체험관 명판 확인 필요."
  - "전시된 무선호출기의 제조연도·사용 대역 — 체험관 고유 정보, 현장 확인 필요."

briefs:
  초등:
    mc_brief: "전파에도 여러 종류가 있다는 사실에 놀라는 반응으로 열고, 여기 무엇이
      놓여 있는지 도슨트에게 묻는다. '주파수'·'대역' 같은 말은 쓰지 않는다."
    docent_brief: "전파에는 아주 길게 출렁이는 것부터 아주 짧게 떨리는 것까지 여러
      종류가 있고, 길이가 다르면 잘하는 일도 다르다는 것. 여기 놓인 기계들은 서로 다른
      종류의 전파를 쓰던 옛날 기계라는 것. 숫자·기호·기관 이름은 하나도 말하지 않는다.
      비유는 '아주 긴 파' 와 '쌀알만큼 짧은 파' 정도까지만 — 거리 비유를 지어내지 않는다."
  중고등:
    mc_brief: "전파를 왜 굳이 여러 대역으로 나눠 놓았는지 도슨트에게 묻는다."
    docent_brief: "주파수가 낮을수록 파장이 길고 장애물을 돌아 멀리 가며, 높을수록
      파장이 짧고 곧게 나아간다는 대비가 핵심 훅. 성질이 다르니 국제기구가 구간을 나누고
      쓰임새를 정해 뒀다는 것, 전시된 기계들이 그 서로 다른 구간을 쓰던 것들이라는 것.
      **대역이 몇 개인지는 말하지 않는다** — 세는 기준마다 달라서 지금 큐시트 숫자가
      틀렸다. 정확한 주파수 값도 생략한다."
  일반:
    mc_brief: "전시가 주파수 순서로 늘어서 있다는 점을 짚고, 양쪽 끝이 무엇인지 도슨트에게 묻는다."
    docent_brief: "국제전기통신연합(ITU)이 전파를 주파수 순서로 구간을 나누고 이름을
      붙였다는 것, 이 전시의 낮은 쪽 끝이 초장파(VLF)이고 높은 쪽 끝이 밀리미터파(EHF)
      라는 것, 그 사이가 파장으로 100킬로미터에서 1밀리미터까지라는 것, 파장이 길수록
      멀리 돌아가고 짧을수록 직진한다는 것. **'10개 대역' 이라고 말하지 않는다** —
      ITU 무선규칙 표는 9개, ITU-R 권고 V.431 표는 13개다. 개수 대신 '낮은 쪽부터
      높은 쪽까지' 로 말한다. 전시품 개수·연도는 현장 확인 전이므로 단정하지 않는다."
  전문가:
    mc_brief: "대역 구분의 근거 문서가 무엇인지, 그리고 명명 체계가 하나인지 도슨트에게 묻는다."
    docent_brief: "ITU-R 권고 V.431-8 Table 1 이 대역번호 3(ULF, 300~3,000 Hz)부터
      15(300~3,000 THz)까지를 정의하고, 무선규칙(RR) No. 2.1 의 표는 그중 4번(VLF,
      3~30 kHz)부터 12번(300~3,000 GHz)까지를 싣는다는 것. Note 1 의 규칙
      '대역번호 N 은 0.3×10^N Hz ~ 3×10^N Hz' 를 그대로 말해도 된다. 전시 범위인
      VLF(4번)~EHF(11번)는 8개 대역, 주파수 3 kHz~300 GHz, 파장 100 km~1 mm 라는 것.
      **명명 체계가 둘**이라는 점을 반드시 짚는다 — VLF/LF/MF/HF/VHF/UHF/SHF/EHF 는
      주파수 기준 기호이고 미리어미터파·킬로미터파·…·밀리미터파는 파장 기준 이름이라,
      '초장파에서 밀리미터파까지' 는 두 계열을 섞은 표현이다. 한국어 중파·단파·초단파의
      주파수 범위는 전파법 시행령 제2조에 그대로 있다는 것도 덧붙일 수 있다.
      '10개 대역' 은 근거가 없으니 쓰지 않는다."

mc: "그 기증품을 주파수 대역별로 둘러볼 차례입니다. 도슨트, 어떤 대역의 장비들이 전시돼 있나요?"
mc_after: "초장파부터 밀리미터파까지, 범위가 정말 넓네요. 어느 대역이 제일 궁금하신가요?"
