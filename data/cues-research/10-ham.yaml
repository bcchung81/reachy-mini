# 조사 산출물 — 10-ham (아마추어 무선통신).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# ⚠️ 기존 큐시트에서 **사실 오류 하나(지역본부 9개)와 조문 인용 부정확 둘**이 나왔다.
#    corrections 를 먼저 읽는다.

id: "10-ham"
title: "아마추어 무선통신 (HAM)"
gaze: partner
topic: "취미로서의 아마추어 무선과 그것을 떠받치는 국제·국내 제도"

facts:
  # ── ITU 무선규칙: 아마추어업무란 무엇인가 ────────────────────
  - claim: "ITU 무선규칙(RR) No. 1.56 은 아마추어업무를 '자기훈련·상호통신·기술연구를
      목적으로 아마추어가 수행하는 무선통신업무. 여기서 아마추어란 금전적 이익 없이
      오로지 개인적 관심에서 무선기술에 흥미를 가진, 정당하게 허가받은 사람을 말한다'
      로 정의한다."
    source: "Recommendation ITU-R M.1544-1 (09/2015) considering a) 가 RR No. 1.56 을 직접 인용 —
      https://www.itu.int/dms_pubrec/itu-r/rec/m/R-REC-M.1544-1-201509-I!!PDF-E.pdf"
    grade: A
  - claim: "RR No. 1.57 은 아마추어위성업무를 '아마추어업무와 같은 목적으로 지구 위성상의
      우주국을 이용하는 무선통신업무' 로 정의한다."
    source: "Recommendation ITU-R M.1544-1 (09/2015) considering b)"
    grade: A
  - claim: "RR 제25조는 아마추어업무의 기본 규칙이다. 25.6 은 각국 주관청이 아마추어국을
      운용하려는 사람의 운용·기술 자격을 검증하도록 하고, 25.5 는 모스부호 송수신 능력을
      요구할지 말지를 각국이 정하게 한다(WRC-03)."
    source: "ITU RR Article 25 전문 (ANCOM 게재본) —
      https://www.ancom.ro/wp-content/uploads/2010/07/form_ram_extras_din_reglementari_internationale_UIT_regulamentul_radiocomunicatiilor_art_25.pdf"
    grade: A
  - claim: "ITU-R M.1544-1 은 각주에서 '모스부호로 문장을 주고받는 능력은 최소 자격이
      아니다(RR No. 25.5 참조)' 라고 못박는다."
    source: "Recommendation ITU-R M.1544-1 (09/2015), 각주 1"
    grade: A
  - claim: "RR 25.9 는 아마추어국이 송신하는 동안 짧은 간격으로 자기 호출부호를 송신하도록
      의무화한다."
    source: "ITU RR Article 25, No. 25.9"
    grade: A
  - claim: "RR 25.2 는 서로 다른 나라 아마추어국 사이의 송신을 아마추어업무의 목적에
      부수하는 통신과 개인적 성격의 언급으로 한정하고, 25.2A 는 뜻을 감추기 위한 부호화를
      금지하며, 25.3 은 제3자를 대신한 국제통신을 **비상 또는 재난구호의 경우에만**
      허용한다(WRC-03)."
    source: "ITU RR Article 25, Nos. 25.2 / 25.2A / 25.3"
    grade: A
  - claim: "RR 25.9A 는 '각국 주관청은 아마추어국이 재난구호를 지원하는 통신 수요에
      대비하고 대응할 수 있도록 필요한 조치를 취하도록 권장된다' 고 규정한다(WRC-03)."
    source: "ITU RR Article 25, No. 25.9A"
    grade: A
    note: "'취미가 재난 때는 통신망이 된다' 는 훅의 **국제 규범 근거**가 바로 이 조항이다.
      기관 사례를 인용할 필요 없이 이 한 줄로 성립한다."
  - claim: "RR 25.7 은 아마추어국의 최대 출력을 각국 주관청이 정하도록 한다."
    source: "ITU RR Article 25, No. 25.7"
    grade: A

  # ── 국내 제도: 전파법 ────────────────────────────────────────
  - claim: "전파법상 '무선설비' 는 전파를 보내거나 받는 전기적 시설,
      '무선국' 은 무선설비와 무선설비를 조작하는 자의 총체(방송수신만을 목적으로 하는 것은 제외),
      '무선종사자' 는 무선설비를 조작하거나 설치공사를 하는 사람으로서 제70조제2항에 따라
      기술자격증을 발급받은 사람이다."
    source: "전파법 제2조제1항제5호·제6호·제7호 (법제처, 시행 2026-01-02)"
    grade: A
  - claim: "무선종사자가 되려면 기술자격검정에 합격해야 하고, 무선국의 무선설비는 원칙적으로
      무선종사자가 아니면 운용하거나 공사할 수 없다(선박·항공기 항행 중 등 예외 있음).
      자격종목과 종목별 종사범위는 대통령령으로 정한다."
    source: "전파법 제70조제1항·제3항·제4항"
    grade: A
  - claim: "아마추어무선기사 자격은 네 등급이다. 제1급은 아마추어국의 안테나공급전력 1 kW
      이하, 제2급은 200 W 이하, 제3급(전신급·전화급)은 100 W 이하로서 21 MHz 이상 또는
      8 MHz 이하 주파수, 제4급은 10 W 이하로서 30 MHz 이상 주파수의 무선설비 운용.
      제3급 전화급과 제4급은 모르스부호에 의한 통신이 제외된다."
    source: "전파법 시행령 별표 17 '무선종사자의 자격종목 및 자격종목별 종사범위'
      (제115조 관련, 개정 2016-06-21) — 법제처"
    grade: A
  - claim: "과학기술정보통신부장관은 제70조제1항·제2항에 따른 기술자격검정과 자격증 발급
      업무의 일부를 진흥원(한국방송통신전파진흥원, KCA)에 위탁할 수 있다."
    source: "전파법 제78조제2항"
    grade: A
  - claim: "KCA 는 실제로 국가기술자격검정을 운영하며 무선통신사·아마추어무선기사 검정을
      시행한다. KCA 대표 안내에 '자격검정문의' 번호가 따로 있고 검정 포털(cq.or.kr)을 둔다."
    source: "KCA 공식 — 자격검정 안내 https://www.kca.kr/contentsView.do?pageId=www169 ,
      KCA 국가기술자격검정 https://www.cq.or.kr/"
    grade: A

  # ── KCA 조직 ─────────────────────────────────────────────────
  - claim: "KCA 의 지방본부는 10개다 — 서울·북서울·부산·경인·충청·전남·경북·전북·강원·제주."
    source: "KCA 공식 — 지방본부별 관할구역 https://www.kca.kr/contentsView.do?pageId=www153"
    grade: A
    note: "공식 명칭은 '지역본부' 가 아니라 **지방본부** 다. 같은 사이트의 '오시는길' 메뉴는
      제주를 '제주지사' 로 적어 둔 곳이 있으나, 관할구역 표는 '제주본부' 로 10개를 싣는다.
      숫자를 발화에 쓸 거라면 관할구역 표 쪽을 근거로 삼는다."
  - claim: "KCA 는 2017년 초 초단파대(근거리) 아마추어 무선 통신망을, 2018년 단파대(원거리)
      비상통신 전국망을 구축하고 본원과 10개 지방본부 간 재난안전 훈련을 한다고 보도됐다."
    source: "이데일리 2018-12-30 '재난시 아마추어 무선 활용한다..KCA 개통'"
    grade: C
    note: "⚠️ 언론 단독. KCA 공식 페이지에서 교차확인되지 않았다. **브리프에서 연도·망
      종류·본부 수를 수치로 말하지 않는다.** 재난 대비 근거는 RR 25.9A 로 충분하다."

  # ── 대중문화 훅 ──────────────────────────────────────────────
  - claim: "한국 영화 '동감'(2000)은 1979년의 대학생 소은과 2000년의 대학생 지인이
      월식이 있던 날 낡은 무전기로 이어져 매일 밤 교신한다는 이야기다. 김정권 감독,
      김하늘·유지태 주연."
    source: "한국어 위키백과 '동감 (2000년 영화)' / 씨네21 영화정보 movie_id=5489"
    grade: B
    note: "씨네21 페이지에는 2020년 5월 14일이 적혀 있는데 이는 **재개봉** 일자다.
      원 개봉은 2000년. '2000년 영화' 라고만 말하고 날짜는 말하지 않는 것이 안전하다.
      작중 기기를 '아마추어 무선' 으로 부르는 것은 통용되는 설명이나, 영화가 햄 면허·
      호출부호를 다루지는 않는다 — 제도 설명의 근거로 삼지 않는다."

  # ── 호출부호 ─────────────────────────────────────────────────
  - claim: "ITU 가 한반도에 배정한 호출부호 계열 중 대한민국 몫은 HLA–HLZ, DSA–DTZ,
      D7A–D9Z, 6KA–6NZ 이고, HMA–HMZ 와 P5A–P9Z 는 조선민주주의인민공화국 몫이다."
    source: "영어 위키백과 'Call signs in Korea' (출처로 ITU Appendix 42 표를 인용).
      ITU 공식 페이지(itu.int … call_sign_series.aspx)는 JS 렌더링이라 직접 확인 실패"
    grade: B
    note: "**HM 을 한국 호출부호로 말하면 안 된다** — 북한 배정이다. 한국 아마추어
      호출부호로 실제 쓰이는 접두는 HL·DS·D7·6K 계열."

corrections:
  - "⚠️ 현재 `data/cues.yaml` 의 'KCA가 9개 지역본부에 아마추어 무선국을 개설해 두었다'
    는 두 군데가 어긋난다. (1) KCA 공식 명칭은 '지역본부' 가 아니라 **지방본부** 다.
    (2) 지방본부는 9개가 아니라 **10개**(서울·북서울·부산·경인·충청·전남·경북·전북·
    강원·제주)다 — KCA '지방본부별 관할구역' 페이지 기준. 2018년 KCA 발표를 전한 보도도
    '본원과 10개 지방본부' 라고 적었다. 다만 각 지방본부에 아마추어무선국이 실제로
    개설돼 있는지는 KCA 공식 페이지로 확인되지 않으므로, **개수를 말하지 말고**
    '전국 지방본부에' 로 말하거나 기관 사례 자체를 빼고 RR 25.9A 로 대체한다."
  - "⚠️ '전파를 이용하는 전기적 설비가 무선설비' 는 조문과 다르다. 전파법 제2조제1항
    제5호의 문언은 '전파를 **보내거나 받는** 전기적 **시설**' 이다. '이용하는' 도
    '설비' 도 원문이 아니다. 조문을 근거로 말할 때는 원문대로 인용한다."
  - "⚠️ '무선설비를 운용하는 사람이 무선종사자, 둘을 합쳐 무선국' 은 두 정의를 뭉갠
    것이다. 전파법 제2조제1항제6호의 무선국은 '무선설비와 무선설비를 **조작하는 자**의
    총체' 이고, 무선종사자(제7호)는 그중에서도 **기술자격증을 발급받은 사람**이라는 더
    좁은 개념이다. 실무상 제70조제4항이 원칙적으로 무선종사자만 운용하게 해서 겹치지만,
    정의 자체를 같은 것으로 말하면 틀린다. 세 낱말을 이어 붙이려면 '무선설비 + 그것을
    조작하는 사람 = 무선국, 그 조작을 할 자격을 국가가 검정해 준 사람이 무선종사자'
    순서로 말한다."

unverifiable:
  - "체험관에 전시된 아마추어 무선 장비의 종류·연식·기증자 — 체험관 고유 정보, 현장 확인 필요."
  - "체험관 안에 실제 운용 중인 아마추어무선국이 있는지, 있다면 호출부호 — 현장 확인 필요."
  - "KCA 각 지방본부 아마추어무선국의 개설 여부·호출부호·사용 주파수 — KCA 공식 페이지에서
    확인되지 않음. 언론 보도(C급)만 있다."
  - "국내 아마추어무선 자격자 수·개설 무선국 수 — 신뢰할 만한 최신 1차 통계를 찾지 못했다.
    영어 위키백과가 '4만 2천여 명' 을 적고 있으나 기준연도가 불명이라 쓰지 않는다."

briefs:
  초등:
    mc_brief: "무선으로 모르는 사람과 이야기를 나누는 취미가 있다는 점을 신기해하며
      도슨트에게 넘긴다. '아마추어'·'무선국' 같은 말은 풀어서 쓴다."
    docent_brief: "돈을 벌려고가 아니라 그냥 재미있어서 무선으로 멀리 있는 사람과 이야기를
      나누는 사람들이 있다는 것, 전화나 인터넷이 끊기는 큰일이 나면 그 사람들의 무선이
      대신 소식을 전해 줄 수 있다는 것. 법 조항·기관 이름·주파수·출력 숫자는 말하지 않는다."
  중고등:
    mc_brief: "취미인데 왜 나라가 자격시험까지 보게 하는지 도슨트에게 묻는다."
    docent_brief: "돈벌이가 아니라 스스로 익히고 기술을 시험해 보려는 목적이라는 점이
      아마추어 무선의 정의라는 것, 그래도 전파는 남과 나눠 쓰는 자원이라 나라가 자격을
      확인하고 허가한 뒤에야 쓸 수 있다는 것, 재난으로 통신망이 끊길 때를 대비하도록
      국제 규칙이 각국에 권장한다는 것. 영화 '동감'(2000)을 훅으로 써도 좋다 — 연도만
      말하고 날짜는 말하지 않는다. 주파수·출력 수치는 생략한다."
  일반:
    mc_brief: "햄이 정확히 무엇인지, 그리고 취미와 제도가 어떻게 이어지는지 도슨트에게 묻는다."
    docent_brief: "국제전기통신연합(ITU)이 아마추어업무를 '금전적 이익 없이 개인적 관심에서
      하는 자기훈련·상호통신·기술연구' 로 정의한다는 것이 핵심 훅. 그래서 각국이 자격을
      검정하고 허가한다는 것, 우리나라는 전파법이 무선설비(전파를 보내거나 받는 전기적
      시설)·무선국(무선설비와 그것을 조작하는 자의 총체)·무선종사자(기술자격증을 받은
      사람)를 나눠 규정한다는 것, 국제 규칙이 아마추어국을 재난구호 통신에 대비시키도록
      각국에 권장하고 있어 취미가 비상망이 된다는 것. 영화 '동감'(2000)으로 열어도 좋다.
      **'9개 지역본부' 같은 기관 수치는 말하지 않는다** — 틀렸고, 정정된 숫자도 확인 중이다."
  전문가:
    mc_brief: "아마추어업무의 국제 정의와 국내 자격 체계가 어떻게 맞물리는지 도슨트에게 묻는다."
    docent_brief: "RR No. 1.56 의 아마추어업무 정의(self-training·intercommunication·
      technical investigations, without pecuniary interest)를 원문 개념 그대로 말한다.
      RR 제25조가 그 운용 규칙이라는 것 — 25.6 자격 검증 의무, 25.5 모스 요구 여부는 각국
      재량(WRC-03), 25.7 최대 출력도 각국이 결정, 25.9 송신 중 짧은 간격의 호출부호 송신
      의무, 25.2A 뜻을 감추는 부호화 금지, 25.3 제3자 대리 국제통신은 비상·재난구호에 한정,
      25.9A 재난구호 대비 권장. 국내는 전파법 제2조의 무선설비·무선국·무선종사자 정의와
      제70조의 자격검정, 시행령 별표 17 의 네 등급 — 제1급 1 kW 이하, 제2급 200 W 이하,
      제3급 100 W 이하(21 MHz 이상 또는 8 MHz 이하), 제4급 10 W 이하(30 MHz 이상, 모스 제외).
      검정 업무가 전파법 제78조제2항에 따라 진흥원(KCA)에 위탁된다는 고리까지 말한다.
      ITU-R M.1544-1 이 최소 자격 기준의 권고라는 표준번호도 꺼낼 수 있다."

mc: "이번엔 취미로 즐기는 무선통신, 아마추어 무선입니다. 도슨트, 햄이 뭔가요?"
mc_after: "취미가 재난 때는 통신망이 된다는 게 멋지네요. 궁금한 점 있으실까요?"
