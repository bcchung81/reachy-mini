    현장 확인 필요. 현재 지시문은 조작 가능 여부를 말하지 않는데, 그 상태를 유지한다."
  - "테레민이 실제로 연주 가능한 상태로 놓여 있는지, 관람객이 손을 대 볼 수 있는지 —
    체험관 고유 정보 — 현장 확인 필요. 사회자 대사가 '꼭 들어보고 싶네요'라고 기대를
    만들어 두므로, 연주 불가 상태라면 사회자 대사부터 고쳐야 한다."
  - "오실로스코프에 마이크가 연결돼 목소리를 파형으로 볼 수 있는지 — 현재 지시문의
    '목소리를 파동의 형태로 봄'은 체험관 고유 설정이다. 오실로스코프가 전압을 시간의
    함수로 그린다는 것은 확인했지만, 이 체험관 장치에 음성 입력이 붙어 있는지는
    확인 못 했다 — 현장 확인 필요."
  - "테슬라 코일 옆에 형광등이 비치돼 있는지, 관람객이 직접 대 볼 수 있는지 —
    체험관 고유 정보 — 현장 확인 필요."

corrections:
  - "⚠️ 현재 `data/cues.yaml` 18-science 지시문의 '**1924년** 러시아 음향물리학자 레온
    테레민이 발명한'에서 **연도가 틀렸다.** 출처는 발명 **1920년 10월**, 미국 특허
    **1928년**이다(Wikipedia — Theremin). 1924년은 발명 연도도 특허 연도도 아니다.
    → '1920년에 발명' 으로 고치거나, 특허를 말하려면 '1928년에 특허' 로 명시한다."

  - "⚠️ 같은 문장의 '러시아 **음향물리학자**'도 출처와 맞지 않는다. 출처는
    '러시아 물리학자(Russian physicist)'이고, 테레민은 음악을 만들려다 나온 것이 아니라
    **소련 정부가 지원한 근접 센서 연구의 산물**이다(Wikipedia — Theremin).
    음향학 전공이라는 근거는 찾지 못했다. → '러시아 물리학자'로 쓴다."

  - "⚠️ '테슬라 코일(형광등을 가까이 대면 **전기 없이** 불이 켜짐)'은 표현이 틀렸다.
    전기가 없는 것이 아니라 **전선을 꽂지 않아도** 켜지는 것이다. 테슬라 코일 자체가
    고전압·저전류·고주파 교류를 만드는 전기 장치이고(Wikipedia — Tesla coil),
    형광등은 그 방전의 근접장 안에서 에너지를 받아 켜진다(텍사스대 오스틴 물리 시연 259).
    → '전선을 연결하지 않아도 불이 켜진다'로 고친다. '전기 없이'는 관람객에게
    정반대의 인상을 준다."

  - "⚠️ **오류가 아니라 정밀화.** '두 고주파의 **간섭**으로 소리를 내고'는 틀린 말은
    아니지만, 출처 용어는 **헤테로다인 원리**이고 실제로는 두 발진기의 **주파수 차**를
    가청음으로 쓴다(둘 다 500kHz 미만). 전문가 수준에서는 용어를 그대로 쓰고,
    아래 수준에서는 '두 개의 보이지 않는 떨림이 서로 어긋난 만큼이 소리가 된다' 정도로
    푼다."

  - "✅ **검증 결과 맞아서 그대로 두는 것** — 혼동을 막기 위해 적어 둔다.
    '긴 안테나에 손이 가까우면 높은 음, 멀어지면 낮은 음'(맞음),
    '왼쪽은 볼륨 조절'(맞음, 다만 통상적인 배치이고 반대로 연주하는 사람도 있다),
    '코히러 전파 검출기 — 초창기 전파 검출 방식'(맞음),
    '전자기 유도(패러데이의 법칙)'(맞음),
    '오실로스코프 — 파동의 형태로 봄'(원리는 맞음, 음성 입력 여부만 미확인)."

briefs:
  초등:
    mc_brief: "마지막으로 직접 해볼 수 있는 신기한 장치들이 남아 있다고 들뜬 투로 소개하고,
      무엇이 있는지 도슨트에게 묻는다. 장치 이름을 사회자가 먼저 줄줄이 읊지 않는다."
    docent_brief: "2~3문장. 도구를 나열하지 말고 **딱 하나만** 골라 이야기한다. 손을 대지
      않고 허공에서 손만 움직여 연주하는 악기(테레민)가 가장 잘 먹힌다 — 손을 가까이
      가져가면 소리가 높아지고 멀리 하면 낮아진다는 것까지. 또는 전선을 꽂지 않았는데
      가까이 대기만 하면 불이 켜지는 형광등. **숫자·연도·사람 이름·전문용어는 하나도
      말하지 않는다.** '마법 같지만 마법이 아니라 눈에 보이지 않는 전기의 힘 때문'
      이라는 마무리."
  중고등:
    mc_brief: "전파의 바탕이 되는 과학 원리를 직접 확인할 수 있는 도구들이 있다고 짚고,
      그중 무엇이 있는지 도슨트에게 묻는다."
    docent_brief: "3~4문장. 도구 전체를 훑지 말고 **한두 가지만** 골라 원리까지 간다.
      테레민을 고른다면 — 1920년에 발명됐고, 악기를 만들려던 게 아니라 **가까이 온 것을
      알아채는 센서 연구에서 나왔다**는 뒤집기가 핵심 훅. 두 개의 금속 막대가 안테나처럼
      생겼지만 전파를 주고받는 안테나가 아니라 손과 함께 '축전기'가 되어 손의 거리를
      감지한다는 것. 코히러를 고른다면 — 금속가루가 전파를 받으면 달라붙어 전류가 흐르는데,
      신호마다 사람이 톡 쳐서 되돌려야 했다는 것. 연도만 말하고 다른 수치는 말하지 않는다."
  일반:
    mc_brief: "마지막 주제로 전파와 관련된 기초 과학 실험 도구들을 꺼내고, 무엇이 있는지
      도슨트에게 묻는다."
    docent_brief: "4~5문장. 도구 이름을 두세 개만 스치듯 언급하고 **한 가지에 집중**한다.
      테레민이 가장 좋다 — 1920년 러시아 물리학자 레온 테레민이 발명했고(미국 특허는
      1928년), 소련의 **근접 센서 연구**에서 나왔다는 것이 핵심 훅. 두 금속 막대는 전파용
      안테나가 아니라 축전기 극판으로 작동해 손의 거리를 정전용량으로 읽고, 음정 안테나에
      손이 가까울수록 음이 높아진다는 것. 곁들일 것이 있다면 전자기 유도 — 자석을 가만히
      두면 아무 일도 없고 **움직여야** 전류가 생긴다는 것(1831년 패러데이), 그게 오늘날
      모든 발전기와 변압기의 원리라는 것. 연도와 개략 수치까지만, 정확한 주파수 값은
      말하지 않는다.
      ⚠️ '전기 없이 켜진다'고 말하지 않는다 — **전선 없이** 켜지는 것이다."
  전문가:
    mc_brief: "이 도구들이 앞에서 다룬 전파 이야기의 물리적 바탕에 해당한다는 점을 전제로
      깔고, 어떤 원리들이 모여 있는지 도슨트에게 묻는다."
    docent_brief: "5~7문장. 도구들을 **원리 축으로 묶어서** 말한다 — 정전기(전하의 축적),
      전자기 유도(1831년 패러데이, 변하는 자기장이 기전력을 만든다), 전자기 회전
      (1821년 패러데이의 호모폴라 전동기 — 최초로 만들어진 전동기, 정류자가 없다),
      공진(1891년 테슬라 코일 — 고전압·저전류·고주파 교류를 내는 공진 변압기),
      검파(1890년 브랑리의 발견에 기반한 코히러 — 금속가루가 응집해 저항이 떨어지고,
      신호마다 두드려 되돌려야 했으며 1907년경 더 민감한 검파기로 대체됐다),
      표시(오실로스코프 — 전압을 시간의 함수로 그린다. 그 화면의 조상인 음극선관은
      **1897년 페르디난트 브라운**이 만들었고, 브라운은 1909년 마르코니와 노벨 물리학상을
      공동 수상했다 — 첫 섹션의 이야기로 고리가 닫힌다). 테레민은 **헤테로다인 원리**로,
      500kHz 미만으로 맞춘 발진기 둘의 주파수 차를 가청음으로 쓰며 안테나는 전파용이
      아니라 커패시터 극판이라는 점까지. 연도·원리 명칭을 그대로 말해도 된다.
      ⚠️ 체험관에 어떤 기종이 실제로 놓여 있는지는 미확인이므로, 눈앞에 보이는 것만
      이름으로 부르고 없는 것을 있다고 말하지 않는다."

mc: "마지막 주제는 전파와 관련된 기초 과학 실험 도구들입니다. 도슨트, 무엇이 있나요?"

# mc_after: 원본은 "손을 대지 않고 연주하는 테레민, 꼭 들어보고 싶네요. 마지막으로 궁금한 점
# 있으신가요? 없으면 '다음'이라고 해 주세요." 였다. 테레민 언급은 도슨트가 테레민을 고르지
# 않은 수준에서는 어긋나므로 뺐다(초등에서는 형광등을 고를 수도 있다). 끝을 질문 권유로 맞췄다.
# ⚠️ 테레민이 실제로 연주 가능한 상태인지 미확인이다 — 원본의 '꼭 들어보고 싶네요'는
# 들을 수 있다는 기대를 만든다. 현장 확인 전까지 되살리지 않는다.
mc_after: "손을 대지 않고, 전선을 꽂지 않고도 되는 것들이 이렇게 많군요. 마지막으로 궁금한 점 있으실까요?"
