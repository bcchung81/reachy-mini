# 조사 산출물 — 18-science (과학 원리 실험 도구).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# ⚠️ 기존 큐시트에서 **사실 오류 3건**이 나왔다(테레민 연도·테레민 직업·테슬라 코일 설명).
#    corrections 를 먼저 읽는다.
#
# 이 섹션은 사실의 절반이 **체험관 고유 정보**다 — 어떤 도구가 실제로 놓여 있는지,
# 관람객이 만질 수 있는지는 웹에 없다. 아래 facts 는 '그 도구가 무엇인가'만 확인한 것이고,
# '여기 있는가'는 전부 unverifiable 로 뺐다.

id: "18-science"
title: "과학 원리 실험 도구"
gaze: audience
topic: "전파의 바탕이 되는 기초 과학 원리 — 정전기·전자기 유도·공진·검파, 그리고 테레민"

facts:
  # ── 테레민 ──────────────────────────────────────────────────────
  - claim: "테레민은 연주자가 악기에 몸을 대지 않고 연주하는 전자악기이며, 발명자
      레온 테레민의 이름을 땄다. 대량생산된 최초의 전자악기다."
    source: "Wikipedia — Theremin / Leon Theremin"
    grade: B

  - claim: "테레민은 **1920년 10월** 러시아 물리학자 레프 세르게예비치 테르멘(서방에서는
      레온 테레민)이 발명했고, 유럽 순회 연주 뒤 미국으로 건너가 **1928년에 특허**를 받았다."
    source: "Wikipedia — Theremin (원문: \"The instrument was invented in October 1920
      by the Russian physicist Lev Sergeyevich Termen … he patented his invention
      in 1928\")"
    grade: B
    note: "⚠️ 기존 큐시트의 '1924년'은 발명 연도도 특허 연도도 아니다. corrections 참조."

  - claim: "테레민은 소련 정부가 지원한 **근접 센서(proximity sensor) 연구의 산물**이었다.
      악기를 만들려다 나온 것이 아니라 센서 연구에서 파생됐다."
    source: "Wikipedia — Theremin (원문: \"The theremin was the product of Soviet
      government-sponsored research into proximity sensors.\")"
    grade: B
    note: "'악기가 아니라 센서 연구에서 나왔다'는 뒤집기가 이 섹션에서 가장 강한 훅이다."

  - claim: "테레민의 두 금속 막대는 흔히 '안테나'로 불리지만 전파를 보내거나 받는 안테나가
      아니라 **축전기(커패시터)의 극판**으로 작동한다. 연주자의 손이 반대쪽 극판 역할을 해서,
      손의 상대 위치를 정전용량으로 감지한다."
    source: "Wikipedia — Theremin (원문: \"they are not used as radio antennas for
      receiving or broadcasting radio waves, but rather act as plates of capacitors\")"
    grade: B
    note: "전파체험관에서 '안테나인데 안테나가 아니다'라는 점은 오해를 부르기 쉬운 자리다.
      중고등 이상에서는 반드시 짚는다."

  - claim: "테레민은 **헤테로다인(heterodyne) 원리**로 소리를 만든다. 음정 회로에 무선주파수
      발진기 두 개가 있고, 전파 간섭을 줄이려고 둘 다 **500kHz 미만**으로 맞춘다. 한쪽은
      고정 주파수이고 다른 쪽은 연주자와 음정 안테나 사이의 거리로 바뀐다."
    source: "Wikipedia — Theremin (원문: \"two radio frequency oscillators set below
      500 kHz to minimize radio interference\")"
    grade: B
    note: "기존 지시문의 '두 고주파의 간섭'이 틀린 말은 아니지만, 정확히는 두 발진기의
      **주파수 차**(맥놀이)를 가청음으로 쓰는 헤테로다인이다. 전문가 수준에서는 용어를
      그대로 쓴다."

  - claim: "음정 안테나에 손이 **가까울수록 음이 높아진다.** 볼륨 안테나는 반대로 손이
      **멀어질수록 소리가 커진다.** 보통 오른손이 음정, 왼손이 볼륨을 맡지만 반대로
      연주하는 사람도 있다."
    source: "Wikipedia — Theremin (원문: \"Higher notes are played by moving the hand
      closer to the pitch antenna. Louder notes are played by moving the hand away
      from the volume antenna.\" / \"Most frequently, the right hand controls the pitch
      and the left controls the volume, although some performers reverse this\")"
    grade: B
    note: "기존 지시문의 '긴 안테나에 손이 가까우면 높은 음, 왼쪽은 볼륨'은 **맞다** —
      그대로 둔다. 다만 볼륨 방향(멀어질수록 커진다)이 직관과 반대라서, 말할 거면
      정확히 말하고 아니면 방향을 아예 언급하지 않는다."

  # ── 테슬라 코일 ─────────────────────────────────────────────────
  - claim: "테슬라 코일은 니콜라 테슬라가 **1891년**에 설계한 전기 공진 변압기로,
      고전압·저전류·고주파 교류를 만든다."
    source: "Wikipedia — Tesla coil (원문: \"an electrical resonant transformer device
      designed by inventor Nikola Tesla in 1891\")"
    grade: B

  - claim: "오늘날 테슬라 코일의 주된 용도는 오락과 교육 전시다. 과학관과 전자 박람회에
      전시물로 놓이고, 학교에서 고주파 전기의 원리를 보여 주는 데 쓰인다."
    source: "Wikipedia — Tesla coil (원문: \"Today, their main usage is for entertainment
      and educational displays\")"
    grade: B
    note: "'과학관 전시물'이라는 용도가 출처에 명시돼 있다 — 체험관에 있다는 것 자체는
      확인 못 했지만, 있다면 그것이 통상적 용도라는 뒷받침은 된다."

  - claim: "형광등 관을 테슬라 코일 방전의 근접장(near field)에 가까이 대면 관에 불이 켜진다."
    source: "텍사스대 오스틴 물리학과 강의 시연 목록 — Tesla Coil: Glowing Fluorescent Lamp
      https://lecturedemos.ph.utexas.edu/demo/259 (원문: \"The fluorescent tube can be
      energized by holding close to the near field of the tesla's discharge pattern.\")"
    grade: B
    note: "⚠️ **불이 켜지는 상세 메커니즘(고주파 전기장이 관 속 기체를 이온화한다)은
      이번 조사에서 1차 출처로 확정하지 못했다.** '전선을 꽂지 않아도 코일이 만든 강한
      고주파 전기장 때문에 켜진다' 정도까지만 말하고, 이온화·플라스마 같은 단어로
      더 들어가지 않는다."

  # ── 전자기 유도 · 호모폴라 전동기 ────────────────────────────────
  - claim: "전자기 유도는 **변하는** 자기장이 도체에 기전력(전류)을 만드는 현상이다.
      자석을 그냥 가만히 놓아 두면 전류가 생기지 않는다 — '변한다'가 조건이다."
    source: "Wikipedia — Electromagnetic induction / Faraday's law of induction
      (원문: \"Initial experiments revealed that a static magnetic field had no effect
      on a nearby circuit\")"
    grade: B
    note: "'가만히 있으면 아무 일도 안 일어난다'가 체험 도구 앞에서 가장 잘 먹히는 설명이다."

  - claim: "**1831년** 마이클 패러데이가 변하는 자기장이 회로에 전류를 유도함을 보였다.
      1831년 8월 29일 노트에 철 고리 양쪽에 코일 둘을 감은 실험 — 원시적인 변압기 —
      이 기록돼 있다. 조지프 헨리가 1832년 독립적으로 같은 관찰을 했지만 먼저 발표한 것은
      패러데이다."
    source: "Wikipedia — Faraday's law of induction (History)"
    grade: B

  - claim: "전자기 유도는 변압기·인덕터·전동기·발전기·솔레노이드의 기본 작동 원리다."
    source: "Wikipedia — Faraday's law of induction"
    grade: B

  - claim: "호모폴라 전동기는 **최초로 만들어진 전동기**이며, **1821년** 마이클 패러데이가
      런던 왕립연구소에서 작동을 시연했다. 정류자(commutator)가 필요 없는 것이 특징이고,
      거꾸로 돌리면 호모폴라 발전기가 된다."
    source: "Wikipedia — Homopolar motor (원문: \"The homopolar motor was the first
      electrical motor to be built. Its operation was demonstrated by Michael Faraday
      in 1821 at the Royal Institution in London.\")"
    grade: B

  - claim: "1821년 패러데이의 실험은 전선을 수은 웅덩이에 담그고 그 안에 자석을 놓아,
      전류를 흘리면 전선이 자석 둘레를 계속 도는 '전자기 회전'을 만든 것이었다."
    source: "Wikipedia — Homopolar motor (History)"
    grade: B
    note: "수은을 쓴 원본 장치는 체험관에 그대로 있을 리 없다. 현대의 교육용 호모폴라
      모터는 건전지·자석·구리선으로 만든다 — 다만 체험관 장치의 구성은 미확인이므로
      도슨트가 구성 부품을 단정하지 않게 한다."

  - claim: "패러데이는 1831년에 자석 앞에서 구리 원판을 돌려 직류를 얻는 장치도 만들었다.
      오늘날 '패러데이 원판' 또는 호모폴라 발전기라고 부른다."
    source: "Wikipedia — Faraday's law of induction"
    grade: B
    note: "1821년 전동기와 1831년 발전기는 **다른 실험, 다른 해**다. 섞지 않는다."

  # ── 코히러 ──────────────────────────────────────────────────────
  - claim: "코히러는 20세기 초 무선전신 시대의 최초 라디오 수신기에 쓰인 원시적인 전파
      검출기다. **1890년 프랑스 물리학자 에두아르 브랑리**의 발견에 기반하며, 이후 10년간
      여러 물리학자·발명가가 개량했다."
    source: "Wikipedia — Coherer (원문: \"Its use in radio was based on the 1890 findings
      of French physicist Édouard Branly\")"
    grade: B

  - claim: "코히러는 관 안에 전극 두 개를 조금 띄워 놓고 그 사이에 금속가루를 느슨하게
      채운 구조다. 전파 신호가 걸리면 금속가루가 서로 달라붙어(cohere) 저항이 크게 떨어지고,
      그래서 훨씬 큰 직류가 흐른다. 그 전류로 벨을 울리거나 모스 기록지를 돌렸다."
    source: "Wikipedia — Coherer"
    grade: B

  - claim: "코히러는 신호가 끝난 뒤에도 전도 상태가 유지돼서, 신호를 받을 때마다 전자석이
      작동하는 망치로 톡 쳐서(decohere) 원래 상태로 되돌려야 했다. **1907년경**까지 널리
      쓰이다가 더 민감한 전해식·광석(crystal) 검파기로 대체됐다."
    source: "Wikipedia — Coherer (원문: \"Coherers remained in widespread use until about
      1907\")"
    grade: B
    note: "'한 글자 받을 때마다 사람이 톡 쳐서 되돌려야 했다'는 그림이 초등·중고등에서
      가장 잘 먹힌다. 오늘 휴대폰과의 대비가 자연스럽게 나온다."

  # ── 오실로스코프 ────────────────────────────────────────────────
  - claim: "오실로스코프는 전압의 변화를 **시간의 함수**로 화면에 그려 주는 전자 계측기다.
      그려진 파형에서 진폭·주파수·상승시간·왜곡 같은 성질을 읽는다."
    source: "Wikipedia — Oscilloscope"
    grade: B

  - claim: "**페르디난트 브라운이 1897년에 최초의 음극선관(CRT)을 만들었고**, 음극선관은
      오실로스코프로 전기 파형을 표시하는 데 쓰였다. 브라운은 1909년 마르코니와 노벨
      물리학상을 공동 수상했다."
    source: "Wikipedia — Ferdinand Braun / Cathode-ray tube (원문: \"Braun built the first
      cathode-ray tube in 1897\" / \"The images may represent electrical waveforms on an
      oscilloscope\")"
    grade: B
    note: "02-history 의 마르코니 노벨상 공동 수상자가 바로 이 사람이다. 마지막 섹션에서
      첫 섹션으로 고리가 닫힌다 — 전문가 수준에서 이 연결을 쓰면 해설이 완결된다."

  # ── 정전기 발생 장치 (어느 기종인지는 미확인) ────────────────────
  - claim: "밴더그래프 발전기는 움직이는 벨트로 절연된 속이 빈 금속 구에 전하를 모아
      전위를 만드는 정전 발전기다. 전하를 기계적으로 옮기기 때문에 전류가 아주 작은
      고전압 직류를 낸다."
    source: "Wikipedia — Van de Graaff generator"
    grade: B
    note: "⚠️ 체험관의 '정전기 발생 장치'가 이것인지는 **확인되지 않았다.** 현장에서
      기종을 확인하기 전에는 도슨트가 기종 이름을 말하지 않게 한다."

  - claim: "윔셔스트 기전기는 고전압을 만드는 또 다른 정전 발전기로, 영국 발명가
      제임스 윔셔스트(1832–1903)가 1880~1883년 사이에 개발했다."
    source: "Wikipedia — Wimshurst machine"
    grade: B
    note: "⚠️ 위와 같다. 두 기종 중 어느 쪽인지 현장 확인 전에는 이름을 말하지 않는다."

unverifiable:
