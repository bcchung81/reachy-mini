    현장 확인 필요. 아래 facts 는 전부 '그 도구가 일반적으로 무엇인가'만 확인한 것이고,
    '여기 있다'를 확인한 것이 아니다."
  - "'정전기 발생 장치'가 밴더그래프 발전기인지 윔셔스트 기전기인지 또 다른 것인지 —
    체험관 고유 정보 — 현장 확인 필요."
