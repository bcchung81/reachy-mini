# 조사 산출물 — 19-closing (마무리).  조사일 2026-09-20
# 스키마 설명은 `01-intro.yaml` 머리말에 있다.
#
# ⚠️ **facts 가 비어 있는 것은 실패가 아니다.** 이 섹션은 앞 18개 섹션을 닫는
#    인사·안내이고, 외부에서 확인할 사실이 없다. 내용이 되는 것은 전부 둘 중 하나다 —
#    (가) 앞 섹션에서 이미 조사·검증한 사실의 재사용, (나) 체험관 고유 운영 정보.
#    (가)는 여기서 다시 조사하지 않는다(중복 출처는 브리프를 흐린다).
#    (나)는 웹에 없다 — unverifiable 에 남겼다.
#
#    마무리에서 **새 사실을 꺼내지 않는다.** 앞에서 검증되지 않은 문장이
#    마지막에 슬쩍 들어가면 아무도 잡지 못한다.

id: "19-closing"
title: "마무리"
gaze: audience
topic: "해설 종료 인사와 되짚기 — 새 정보 없이 닫는다"

# 외부 조사로 확인할 사실이 없다. 억지로 채우지 않는다.
facts: []

# 기존 `data/cues.yaml` 의 19-closing 에서 확인된 **사실 오류는 없다.**
# (원장에 없는 안내를 덧붙이지 말라는 제약도 이미 들어가 있다.)
# 아래는 오류가 아니라 마무리 섹션이 구조적으로 안는 위험이다.
corrections:
  - "사실 오류 없음. 다만 이 섹션의 진짜 위험은 **앞 섹션의 틀린 내용이 되짚기를
    타고 되살아나는 것**이다. 특히 `02-history` 에서 정정된 '1785년 발견'·'1600마일'·
    '영국에서 캐나다까지' 와 `15-emf` 에서 삭제한 '거리를 두면 인체에 유해하지 않다'
    는 마무리 요약에 절대 다시 넣지 않는다. 되짚기는 **앞 섹션에서 실제로 말한
    문장만** 재사용한다."
  - "현재 `mc_after` 의 '즐거운 관람 되시길 바랍니다' 는 해설 종료 후 자유관람이
    이어진다는 운영 전제를 깔고 있다. 전제가 맞는지는 현장 확인 대상이다
    (unverifiable 참조). 확인 전에는 관람 계속 여부를 단정하지 않는 표현이 안전하다."

unverifiable:
  - "해상무선통신 부스의 위치·기념촬영 가능 여부·운영 시간 — 체험관 고유 정보,
    현장 확인 필요. 기존 큐시트의 기념촬영 안내가 이 부스를 전제한다."
  - "해설 종료 후의 관람 동선(자유관람 계속 여부, 퇴장 안내, 다음 회차 운영) —
    체험관 고유 정보, 현장 확인 필요."
  - "관람 종료 시 안내하는 부가 절차(설문·기념품·안내 데스크 위치 등)가 있는지 —
    체험관 고유 정보, 현장 확인 필요. 확인 전까지 어떤 절차도 안내하지 않는다."

briefs:
  초등:
    mc_brief: "오늘 이야기가 끝났다는 것을 밝게 알리고 도슨트에게 마지막 인사를
      부탁한다. 새로운 이야기를 덧붙이지 않는다."
    docent_brief: "와 줘서 고맙다는 인사와, 오늘 본 것 가운데 **딱 하나**만 되짚는다 —
      눈에 보이지 않는 전파를 사람이 찾아내서 지금처럼 쓰게 됐다는 것. 새로운 사실·
      숫자·장소 안내를 덧붙이지 않는다. 마지막은 밝은 인사로 닫는다."
  중고등:
    mc_brief: "해설을 마무리하며 도슨트에게 인사를 넘긴다. 요약을 사회자가 대신
      해 버리지 않는다."
    docent_brief: "감사 인사와 함께 오늘의 줄기를 한 문장으로 되짚는다 — 전파는
      발명이 아니라 발견이었고, 그것을 통신에 쓰기 시작하면서 방송과 이동통신으로
      이어졌으며, 지금은 국가가 기준을 두고 관리한다는 흐름. **앞 섹션에서 말하지
      않은 사실은 꺼내지 않는다.** 안내는 원장에 있는 것만 한다."
  일반:
    mc_brief: "오늘 해설이 끝났음을 알리고 도슨트에게 마무리 인사를 넘긴다.
      새 주제를 열지 않는다."
    docent_brief: "① 관람해 주셔서 감사하다는 인사. ② 오늘의 줄기를 짧게 되짚기 —
      발견에서 실용화로, 방송과 이동통신으로, 그리고 전파품질 관리와 인체보호기준으로
      이어지는 순서. ③ 궁금한 점이 남았으면 지금 물어봐도 된다는 안내. ④ 원장에 있는
      기념촬영 안내. 되짚기에서 **연도나 수치를 새로 꺼내지 않는다** — 앞에서 이미
      말한 것만 재사용한다. 확인되지 않은 장소·절차 안내를 덧붙이지 않는다."
  전문가:
    mc_brief: "오늘 다룬 범위를 한 줄로 정리하고 도슨트에게 마무리를 넘긴다.
      마지막에 새 쟁점을 던져 해설을 다시 열지 않는다."
    docent_brief: "감사 인사와 함께 오늘 다룬 축을 제도의 관점에서 되짚는다 —
      이론(맥스웰)·실증(헤르츠)·실용화(마르코니)로 이어지는 발견의 계보,
      그것이 방송과 이동통신 세대 전환으로 이어진 경로, 그리고 전파법 제47조의2를
      축으로 한 전자파 인체보호기준·전자파 등급제·무선국 검사라는 관리 체계.
      남은 쟁점은 '기준 이하 노출의 장기 영향은 국제적으로도 연구가 계속되고 있다'
      정도로 **열어 둔 채** 닫고, 결론을 내리지 않는다. 새 수치·새 고시 번호를
      추가하지 않는다 — 전부 앞 섹션에서 이미 말한 것의 재배열이어야 한다.
      마지막은 원장에 있는 안내와 인사로 마친다."

mc: "오늘의 전파체험관 이야기는 이것으로 마칩니다. 도슨트, 마무리 인사 부탁해요."
mc_after: "저도 감사드립니다. 질문이 남았다면 지금 말씀해 주세요. 오늘 이야기가 전파를 조금 더 가깝게 느끼는 계기가 되었기를 바랍니다. 고맙습니다."
