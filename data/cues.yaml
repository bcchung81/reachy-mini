      중고등: 방송 콘텐츠를 볼 수 있는 공간이에요. 전파를 관리하는 일만 하는 게 아니라, 그 위에 실리는 방송 콘텐츠 제작도 돕고 있거든요.
      일반: 방송통신 진흥과 관련된 콘텐츠를 볼 수 있는 공간이에요. 한국방송통신전파진흥원이 제작 지원 사업도 하고 있어서, 그 결과물을 함께 소개하는 자리죠.
