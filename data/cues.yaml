        말씀드리기 어렵습니다.
    answer_emotion: 설명
    listener_emotion: 경청
  - ask: 전파를 관리하는 기관이 방송 프로그램까지 돕는 거예요?
    ask_emotion: 놀람
    answers:
      초등: 네, 전파를 돌보는 일만 하는 게 아니라 방송을 만드는 일도 도와줘요. 전파 위에 실려 오는 게 바로 방송이니까요.
      중고등: 네, 전파는 길이고 방송은 그 길 위를 달리는 셈이라 둘이 이어져 있어요. 그래서 길을 관리하는 곳이 그 위에 실리는 콘텐츠 제작도 돕는 거죠.
      일반: 네, 한국방송통신전파진흥원은 전파 관리와 함께 방송통신 진흥도 맡고 있어요. 콘텐츠 제작 지원은 그 진흥 사업 가운데 하나고요.
      전문가: 전파법 제66조가 정한 진흥 사업의 한 갈래라고 보시면 돼요. 방송통신발전기금을 운용해 콘텐츠 제작을 지원하는 구조이고, 전파 관리와 진흥이 한 기관 안에 함께 있는
