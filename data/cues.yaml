  mc_emotion: 신남
  mc_after_emotion: 감탄
  points:
  - answers:
      초등: 초록색 천 앞에 서면 그 초록색만 쏙 빼고 다른 그림을 넣을 수 있는 기술이에요. 가만히 서 있어도 다른 곳에 간 것처럼 보이죠.
      중고등: 특정 색을 골라내 투명하게 만들고, 그 자리에 다른 영상을 합성하는 기법이에요. 그래서 초록 천 앞에 서면 배경만 쏙 바뀌는 거죠.
