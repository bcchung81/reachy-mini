- id: 01-intro
  title: 체험관 개요
  mc: 안녕하세요, 여러분! 전파체험관 이야기 시간에 오신 걸 환영해요. 진행은 제가, 해설은 옆에 있는 도슨트가 맡을게요. 도슨트, 이 체험관이 어떤 곳인지부터 소개해 줄래요?
  mc_after: 네, 소개 고마워요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: KCA가 전파의 효율적 관리와 방송·통신·전파 진흥, 인력양성을 위해 설립된 기관이고, 전파체험관은 2020년 11월에 개관했다는 것. 상대연도('몇 년
    전')를 쓰지 말고 절대연도로만 말한다.
  gaze: partner
  topic: KCA 설립 목적과 전파체험관의 성격
  briefs:
    초등:
      mc_brief: 전파를 눈으로 볼 수 있는 곳에 왔다는 것을 반갑게 알리고, 옆의 도슨트에게 이 체험관이 어떤 곳인지 물어본다. 어려운 기관 이름은 쓰지 않는다.
      guard: 한국방송통신전파진흥원 말고 다른 기관 이름, 법 조항, 연도는 말하지 않는다.
      docent_brief: 전파는 눈에 안 보이지만 우리가 매일 쓰고 있다는 것, 전파체험관은 그 보이지 않는 전파를 보고 만질 수 있게 만든 곳이라는 것. 기관 이름은 한국방송통신전파진흥원만
        말하고, 법 조항·연도는 말하지 않는다.
    중고등:
      mc_brief: 전파를 다루는 공공기관이 만든 체험관이라는 점을 짚고 도슨트에게 소개를 넘긴다.
      guard: 법 조항 번호는 말하지 않는다.
      docent_brief: 전파는 국가가 관리하는 공공 자원이라는 점이 핵심 훅. 체험관을 만든 기관이 전파를 관리하고 관련 산업과 인력을 키우는 일을 한다는 것. 법 조항
        번호는 생략한다.
    일반:
      mc_brief: 체험관과 운영 기관을 간단히 소개하고 도슨트에게 넘긴다.
      guard: 개관 날짜(며칠)는 말하지 않는다. '자료 보존, 연구를 위해 세운 곳'이라고 하지 않는다.
      docent_brief: KCA 가 전파의 효율적 관리와 방송·통신·전파 진흥, 인력양성을 위해 설립된 기관이라는 것과, 전파를 직접 체험할 수 있게 만든 곳이 이 체험관이라는
        것. 2020년 11월에 개관했다는 것. 날짜(며칠)는 말하지 않는다.
    전문가:
      mc_brief: 설립 근거와 사업 범위를 전제로 깔고, 체험관이 그중 어디에 해당하는지 도슨트에게 묻는다.
      guard: 개관 날짜(며칠)는 말하지 않는다.
      docent_brief: 전파법 제66조가 설립 근거라는 것, 사업이 방송통신융합 산업진흥·ICT기금 운용·전파산업진흥·전파자원관리 넷으로 나뉜다는 것, 체험관은 그중 진흥·인력양성
        기능의 대국민 접점이라는 것. 기관명과 조항을 그대로 말해도 된다.
  points:
  - answers:
      초등: 안녕하세요, 여러분! 전파는 눈에 안 보이지만 우리가 날마다 쓰고 있거든요. 이 체험관은 그 전파를 직접 보고 만져 보게 만든 곳이에요.
      중고등: 반가워요, 여러분! 이 체험관은 눈에 보이지 않는 전파를 직접 보고 체험해 볼 수 있게 만든 곳이에요. 전파가 뭔지, 어디에 쓰이는지 하나씩 만나 보게 될 거예요.
      일반: 반갑습니다! 이 체험관은 전파를 직접 체험할 수 있게 만든 곳으로, 2020년 11월에 문을 열었어요. 전파가 무엇인지부터 생활 곳곳에 어떻게 쓰이는지까지 차례로 둘러보실
        거예요.
      전문가: 반갑습니다. 이 체험관은 전파를 직접 체험하도록 만든 대국민 전시 공간으로, 2020년 11월에 문을 열었어요. 한국방송통신전파진흥원의 진흥과 인력양성 기능이 시민과
        직접 만나는 자리라고 보시면 돼요.
    answer_emotion: 반가움
    listener_emotion: 경청
  - ask: 오, 그럼 이 체험관은 누가 만든 거예요?
    ask_emotion: 궁금
    answers:
      초등: 한국방송통신전파진흥원이라는 곳에서 만들었어요. 전파는 모두가 함께 쓰는 거라서, 누군가 사이좋게 나눠 주고 지켜 줘야 하거든요.
      중고등: 한국방송통신전파진흥원이라는 공공기관이 만들었어요. 전파는 아무나 마음대로 쓰는 게 아니라 나라가 관리하는 공공 자원이거든요. 그래서 전파를 관리하고 인력도 키우죠.
      일반: 한국방송통신전파진흥원이 만들었어요. 전파를 효율적으로 관리하고, 방송과 통신, 전파를 진흥하고, 인력을 키우려고 세운 기관이거든요.
      전문가: 한국방송통신전파진흥원이에요. 전파법 제66조에 따라 설립된 기관이고요, 사업은 방송통신융합 산업진흥, ICT기금 운용, 전파산업진흥, 전파자원관리 이렇게 넷으로 나뉘어요.
    answer_emotion: 뿌듯
    listener_emotion: 끄덕
  mc_emotion: 반가움
  mc_after_emotion: 감사
- id: 02-history
  title: 전파의 발견 역사
  mc: 자, 첫 번째 이야기는 전파가 처음 세상에 알려진 이야기예요. 도슨트, 전파는 도대체 누가 만든 거예요?
  mc_after: 발명이 아니라 발견이라니, 저도 처음엔 헷갈렸어요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 전파는 발명이 아니라 발견이라는 대비가 핵심 훅. 맥스웰이 존재를 예언하고 헤르츠가 실험으로 증명했으며, 1901년 마르코니가 영국에서 대서양 건너편 약
    2,200마일(3,500km) 떨어진 곳으로 모스 신호를 보내 장거리 무선전신에 성공했다는 것.
  gaze: partner
  topic: 전파는 발명인가 발견인가 — 맥스웰·헤르츠·마르코니
  briefs:
    초등:
      mc_brief: 전파를 누가 만들었을까 하는 질문으로 호기심을 열고 도슨트에게 묻는다.
      docent_brief: 전파는 사람이 만든 게 아니라 원래 있었는데 사람이 찾아낸 것이라는 대비가 핵심 훅. 먼저 머리로 '있을 거야' 라고 알아낸 사람이 있었고, 나중에
        실험으로 진짜 있다는 걸 보여준 사람이 있었다는 순서만. 인명·연도·거리는 말하지 않는다.
      guard: 인명·연도·거리는 말하지 않는다.
    중고등:
      mc_brief: 전파는 누가 만든 것인지 도슨트에게 묻는다.
      guard: '''캐나다''라고 하지 않는다. 거리는 약 3,500km로만 말한다.'
      docent_brief: 발명이 아니라 발견이라는 대비가 핵심 훅. 맥스웰이 수식으로 존재를 예언하고 헤르츠가 실험으로 증명했으며, 마르코니가 그것을 통신에 써먹었다는 세
        단계. 1901년 대서양 횡단 수신까지. 거리는 약 3,500km 로만 말한다.
    일반:
      mc_brief: 전파는 누가 만든 것인지 도슨트에게 묻는다.
      guard: '''캐나다''라고 하지 않는다 — 1901년 뉴펀들랜드는 캐나다가 아니었다.'
      docent_brief: 발명이 아니라 발견이라는 대비가 핵심 훅. 맥스웰의 이론적 예언 → 헤르츠의 실험적 증명 → 마르코니의 실용화라는 세 단계. 1901년 12월 12일
        폴듀에서 보낸 모스 부호를 대서양 건너편에서 약 3,500km 떨어져 수신했다는 것. '캐나다' 라고 말하지 않는다 — 당시 뉴펀들랜드는 영국 식민지였다.
    전문가:
      mc_brief: 전파는 누가 만든 것인지, 즉 발견의 주체가 누구인지 도슨트에게 묻는다.
      guard: 1901년 수신을 확정된 사실로 단정하지 않는다. 1785년을 전파 발견 연도로 말하지 않는다. '캐나다'라고 하지 않는다.
      docent_brief: 맥스웰 방정식의 예언, 헤르츠의 결정적 실험 증명, 마르코니의 실용 무선전신과 1909년 노벨상(브라운 공동 수상). 1901년 12월 12일 연
        안테나로 폴듀 → 세인트존스 약 2,200마일(3,500km) 수신 보고. **그 수신의 진위가 지금도 기술적 논쟁의 대상**이라는 점까지 말한다. 1785년 쿨롱 법칙은
        전자기학의 출발점이지 전파의 발견이 아니라는 구분도 짚는다.
  points:
  - answers:
      초등: 놀랍게도 전파는 누가 만든 게 아니에요! 원래 우리 주변에 있었는데, 눈에 안 보여서 아무도 몰랐던 거예요.
      중고등: 사실 전파는 누가 만든 게 아니라 찾아낸 거예요. 없던 걸 새로 만드는 게 발명이라면, 전파는 원래 있던 걸 알아낸 거라서 발견이라고 부르거든요.
      일반: 재밌게도 전파는 발명이 아니라 발견이에요. 머리로 예언한 사람, 실험으로 증명한 사람, 통신에 쓴 사람이 다 따로 있었다는 게 이 이야기의 재미거든요.
      전문가: 발명이 아니라 발견이에요. 다만 발견한 사람을 딱 한 명으로 꼽기는 어렵습니다. 이론적 예언, 실험적 증명, 실용화가 각각 다른 사람의 일이었거든요.
    answer_emotion: 뿌듯
    listener_emotion: 놀람
  - ask: 와, 원래 있던 거였다니 신기하네요! 그럼 눈에 안 보이는 전파를 어떻게 찾아낸 거예요?
    ask_emotion: 감탄
    answers:
      초등: 먼저 한 과학자가 계산을 해 보고 '이런 게 있을 거야' 하고 알아냈어요. 그다음에 다른 과학자가 실험으로 진짜 있다는 걸 보여 줬답니다.
      중고등: 그게 재밌는 부분이에요. 맥스웰이라는 과학자가 먼저 수식만으로 이런 파동이 있을 거라고 예언했거든요. 그리고 헤르츠가 실험으로 처음 증명했죠.
      일반: 맥스웰은 전기와 자기, 빛이 한 가지 현상이라는 이론을 세웠는데요, 그 방정식이 전자기파가 있다고 예언했어요. 그걸 실험으로 처음 확실하게 증명한 사람이 헤르츠예요.
      전문가: 맥스웰 방정식이 전자기파의 존재를 예언했고, 헤르츠가 처음으로 결정적인 실험으로 증명했어요. 흔히 출발점으로 꼽는 1785년은 쿨롱 법칙이 나온 해라서, 전자기학의
        출발점이지 전파의 발견은 아니에요.
    answer_emotion: 신남
    listener_emotion: 경청
  - ask: 그렇군요! 그럼 전파는 처음에 어디에 쓰였어요?
    ask_emotion: 궁금
    answers:
      초등: 전파에 신호를 실어서 멀리 보내는 데 처음 쓰였어요. 글쎄, 넓은 바다 건너편까지 신호가 닿았대요!
      중고등: 마르코니가 전파로 신호를 주고받는 무선전신을 실용화했어요. 1901년에는 무려 대서양 건너 약 3,500킬로미터 떨어진 곳에서 모스 부호를 받았다고 발표했죠.
      일반: 마르코니가 만든 무선전신이에요. 1901년 12월 12일 영국 폴듀에서 보낸 모스 부호를 약 3,500킬로미터 떨어진 대서양 건너 뉴펀들랜드에서 받았대요. 그때 뉴펀들랜드는
        영국 식민지였고요.
      전문가: 마르코니의 실용 무선전신이에요. 그는 1909년 브라운과 함께 노벨 물리학상도 받았죠. 1901년 폴듀에서 보낸 모스 부호를 약 3,500킬로미터 떨어진 세인트존스에서
        받았다고 했는데, 그 수신은 지금도 논쟁거리예요.
    answer_emotion: 놀람
    listener_emotion: 감탄
  mc_emotion: 궁금
  mc_after_emotion: 멋쩍음
- id: 03-theory
  title: 전파 이론 — 주파수와 파장
  mc: 이제 전파가 정확히 뭔지 원리로 들어가 볼게요. 도슨트, 전파는 도대체 뭐예요?
  mc_after: 보이지 않는 것을 이렇게 풀어 주시니 훨씬 가깝게 느껴지네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 전파는 전기와 자기가 파동의 형태로 퍼져나가는 것이고 볼 수도 만질 수도 없다는 것. '퐁당퐁당'처럼 돌로 일으킨 물결이 건너편 손등에 닿는 비유를 쓴다.
    물리량은 주파수, 단위는 헤르츠 — 1초에 1회 진동하면 1헤르츠, 1000회면 1킬로헤르츠.
  gaze: partner
  topic: 전파란 무엇인가 — 주파수·파장·헤르츠, 그리고 둘의 반비례 관계
  briefs:
    초등:
      mc_brief: '''그런데 전파가 도대체 뭐예요?'' 하고 아이들 대신 궁금해하는 투로 묻고 도슨트에게 넘긴다. 주파수·파장 같은 말은 사회자가 먼저 쓰지 않는다.'
      guard: 숫자·단위·사람 이름·연도는 말하지 않는다. 전파가 지나가려면 물 같은 무언가가 있어야 한다는 인상을 주지 않는다.
      docent_brief: 전파는 눈에 보이지도 만져지지도 않는 '보이지 않는 물결' 이라는 것, 연못에 돌을 던지면 물결이 건너편까지 닿듯 전파도 멀리까지 퍼져 간다는 비유가
        핵심 훅. 그 물결이 빠르게 출렁이기도 하고 느리게 출렁이기도 한다는 것까지만. **숫자·단위·사람 이름·연도는 하나도 말하지 않는다.** ⚠️ 물결 비유를 쓰되 '물이
        있어야 간다'는 인상을 주지 않는다 — 전파는 아무것도 없는 텅 빈 곳도 지나간다고 한마디 덧붙인다.
    중고등:
      mc_brief: 전파의 정체를 원리로 들어가 보자고 예고하고, 주파수와 파장이 무엇인지 도슨트에게 묻는다.
      guard: 연도 외의 수치는 말하지 않는다. '단위는 주파수'라고 하지 않는다 — 주파수가 물리량이고 헤르츠가 단위다.
      docent_brief: 전파는 전기와 자기가 서로를 밀어 주며 퍼져 나가는 전자기파의 한 갈래라는 것. 1초에 몇 번 출렁이느냐가 주파수이고 그 단위가 헤르츠인데, 그 이름이
        **앞에서 나온 헤르츠**에서 왔다는 연결이 핵심 훅. 한 번 출렁이는 동안 파동이 나아간 거리가 파장이고, 빨리 출렁일수록(주파수가 높을수록) 파장은 짧아진다는 반비례
        관계. 소리와 달리 전파는 진공에서도 간다는 대비를 한마디. 연도 외의 수치는 말하지 않는다.
    일반:
      mc_brief: 전파가 정확히 무엇인지 원리로 들어가 보자고 예고하고, 주파수와 파장을 쉽게 풀어 달라고 도슨트에게 청한다.
      guard: FM 라디오 예시 말고 다른 대역의 파장을 지어내지 않는다.
      docent_brief: 전파는 전자기파(electromagnetic wave)의 한 갈래로, 매질 없이 공간을 스스로 퍼져 나간다는 것 — 소리는 공기가 있어야 들리지만
        전파는 진공에서도 간다는 대비가 핵심 훅. 1초당 진동 횟수가 **주파수**(물리량)이고 그 **단위**가 헤르츠(Hz)이며, 1초에 1,000번이면 1킬로헤르츠라는 것.
        파동이 한 번 진동하는 동안 나아간 거리가 **파장**이고, 파장 = 빛의 속도 ÷ 주파수 이므로 주파수가 높을수록 파장은 짧아진다는 반비례. 개략 수치는 '100메가헤르츠짜리
        FM 라디오 전파의 파장이 약 3미터' 하나만 든다 — 다른 대역의 파장을 즉석에서 만들어 내지 않는다.
    전문가:
      mc_brief: 전파가 물리 현상이면서 동시에 법으로 정의된 대상이기도 하다는 점을 전제로 깔고, 정의와 관계식을 도슨트에게 청한다.
      guard: 국내 주파수 분배표의 상·하한 수치는 말하지 않는다(미확인).
      docent_brief: 「전파법」 제2조제1항제1호가 전파를 '인공적인 유도 없이 공간에 퍼져 나가는 전자파로서 국제전기통신연합이 정한 범위의 주파수를 가진 것'으로 정의한다는
        것 — 즉 전파는 물리 개념이자 법적 개념이라는 이중성이 핵심 훅. 법이 주파수 범위를 직접 정하지 않고 ITU 에 위임했고, ITU 전파규칙(RR) No. 1.5 가
        그 범위를 '3,000GHz 보다 임의로 낮은 주파수'로 잡는다는 것. λ = c / f 이며 c 는 진공에서 정확히 299,792,458 m/s 인데, 이것이 측정값이
        아니라 **미터의 SI 정의가 c 를 고정했기 때문에** 정확한 값이라는 것. 헤르츠는 SI 유도단위 s⁻¹ 이고 주기적 현상에만 쓴다는 것. 물리학 관례의 전파 상한(약
        300GHz, 파장 1mm)과 ITU 규정 상한(3,000GHz)이 서로 다르다는 점까지 짚는다. 조항 번호와 표준 번호를 그대로 말해도 된다. ⚠️ 국내 고시(「대한민국
        주파수 분배표」)의 구체적 상·하한 수치는 미확인이므로 말하지 않는다.
  points:
  - answers:
      초등: 전파는 눈에 보이지도 않고 만져지지도 않는 물결 같은 거예요. 연못의 물결처럼 멀리 퍼져 가는데요, 전파는 물이 없는 텅 빈 곳도 지나가요.
      중고등: 전파는 전기와 자기가 서로를 밀어 주며 퍼져 나가는 전자기파의 한 갈래예요. 소리는 공기가 없으면 못 가잖아요? 그런데 전파는 텅 빈 우주 공간에서도 퍼져 나가요.
      일반: 전파는 빛과 같은 전자기파의 한 갈래로, 아무것도 없는 공간에서도 스스로 퍼져 나가요. 소리는 공기가 있어야 들리잖아요. 전파는 진공에서도 가고, 그때는 빛의 속도로
        달려요.
      전문가: 전파법은 전파를 인공적인 유도 없이 공간에 퍼져 나가는 전자파로서 국제전기통신연합이 정한 범위의 주파수를 가진 것으로 정의해요. 그 범위는 ITU 전파규칙이 3,000기가헤르츠보다
        낮은 주파수로 잡고 있고요.
    answer_emotion: 설명
    listener_emotion: 놀람
  - ask: 아하, 그렇군요! 그럼 주파수는 뭐예요?
    ask_emotion: 끄덕
    answers:
      초등: 주파수는 전파가 얼마나 빠르게 출렁이는지를 말해요. 아주 빠르게 출렁이는 전파도 있고, 느릿느릿 천천히 출렁이는 전파도 있답니다.
      중고등: 주파수는 전파가 1초에 몇 번 출렁이는지를 나타내는 양이고, 단위는 헤르츠예요. 재밌는 건 이 이름이 앞에서 전파를 처음 증명한 헤르츠에서 왔다는 거예요.
      일반: 주파수는 1초 동안 진동하는 횟수를 나타내는 물리량이고, 단위가 헤르츠예요. 1초에 한 번 진동하면 1헤르츠, 천 번이면 1킬로헤르츠라고 부르죠.
      전문가: 주파수는 단위시간당 반복 횟수를 나타내는 물리량이고, 헤르츠는 그 SI 단위로 초의 역수예요. 주기적인 현상에만 쓰고, 이름은 전자기파를 처음 결정적으로 증명한 하인리히
        헤르츠에서 왔습니다.
    answer_emotion: 기쁨
    listener_emotion: 감탄
  - ask: 그럼 파장은 뭐고, 주파수랑은 어떤 사이예요?
    ask_emotion: 궁금
    answers:
      초등: 파장은 물결 하나의 길이예요. 빠르게 출렁이는 전파일수록 물결 하나가 짧아지고, 천천히 출렁일수록 길어지거든요.
      중고등: 파장은 전파가 한 번 출렁이는 동안 나아간 거리예요. 빨리 출렁일수록, 그러니까 주파수가 높을수록 파장은 짧아지죠. 둘은 서로 반비례하는 사이예요.
      일반: 파장은 파동이 한 번 진동하는 동안 나아간 거리로, 빛의 속도를 주파수로 나눈 값이에요. 그래서 주파수가 높을수록 짧아지는데요, 100메가헤르츠 FM 라디오 전파는
        파장이 약 3미터나 돼요.
      전문가: 파장은 빛의 속도를 주파수로 나눈 값이고, 진공에서 빛의 속도는 정확히 초속 299,792,458미터예요. 재밌는 건 이게 측정값이 아니라, 미터의 정의가 이 값을
        고정해 뒀기 때문에 정확하다는 거예요.
    answer_emotion: 뿌듯
    listener_emotion: 끄덕
  mc_emotion: 골똘
  mc_after_emotion: 감사
- id: 04-morse
  title: 전파이야기 체험 — 모스부호·헤르츠 실험·라이덴 병
  mc: 체험관에는 직접 만져볼 수 있는 장치들도 있다고 들었어요. 도슨트, 전파이야기 체험존에서는 무엇을 해볼 수 있나요?
  mc_after: 모스부호를 직접 쳐볼 수 있다니 재미있겠어요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 모스부호 변환기(문구를 넣으면 부호가 표시되고 송신키로 직접 쳐볼 수 있음), 헤르츠 실험 도구(스위치를 켜면 구리판으로 고전압이 흘러 전파가 발사되고 원형
    고리에서 검출돼 네온전구가 켜짐), 라이덴 병(정전기를 저장하는 최초의 축전지).
  gaze: audience
  topic: 점과 선의 약속, 불꽃으로 만든 전파, 전기를 담는 병
  briefs:
    초등:
      mc_brief: 직접 만져보고 쳐볼 수 있는 것들이 있다는 걸 신나게 알리고, 무엇을 해볼 수 있는지 도슨트에게 묻는다. 장치 이름을 줄줄이 늘어놓지 않는다.
      guard: 인명·연도·숫자·표준 이름은 말하지 않는다. 체험 장치 조작법을 단정하지 않는다.
      docent_brief: 점과 선 두 가지만으로 글자를 만들어 보내는 약속이 모스 부호라는 것이 핵심 훅 — 짧게 '똑', 길게 '뚜우' 두 소리로 편지를 쓰는 셈이라는 비유를
        쓴다. 그리고 그걸 체험존에서 직접 손으로 쳐볼 수 있다는 것. 인명·연도·숫자·표준 이름은 말하지 않는다.
    중고등:
      mc_brief: 만져볼 수 있는 체험 장치가 있다는 것을 짚고, 무엇을 해볼 수 있는지 도슨트에게 넘긴다.
      guard: '''축전지''라고 하지 않는다 — 축전기다. 체험 장치 조작법과 수치를 단정하지 않는다.'
      docent_brief: 모스 부호가 점과 선의 **길이 차이**로 글자를 표현하고, 자주 쓰는 글자일수록 짧은 부호를 받았다는 설계가 핵심 훅 — 영어에서 가장 흔한 E
        가 점 하나다. 한글에도 전신 부호가 있고 김학우가 만들었다는 것. 헤르츠는 불꽃을 튀겨 전파를 만들고 떨어진 고리에서 그 전파를 받아 존재를 확인했다는 것. 연도는 1844년(첫
        사용)과 1887년(헤르츠의 불꽃간극 송신기) 정도만 말하고 수치는 넣지 않는다.
    일반:
      mc_brief: 체험관에 직접 만져볼 수 있는 장치가 있다는 것을 언급하고, 전파이야기 쪽에서 무엇을 해볼 수 있는지 도슨트에게 묻는다.
      guard: '''축전지''라고 하지 않는다. 헤르츠가 네온전구로 확인했다고 하지 않는다. 체험 장치 조작법을 단정하지 않는다.'
      docent_brief: 모스 부호가 모스 혼자의 작품이 아니라는 것이 핵심 훅 — 동료 앨프리드 베일이 알파벳 코드로 확장했고, 지금 쓰는 국제 모스 부호는 1848년 게르케의
        개량을 거쳐 1865년에 국제 표준이 됐다. 자주 쓰는 글자에 짧은 부호를 준 설계(E 는 점 하나)와, SOS 는 세 글자가 아니라 끊지 않고 이어 치는 하나의 신호라는
        것. 헤르츠는 유도코일로 만든 고전압을 불꽃 간극에 튀겨 전파를 쏘고, 떨어진 고리 안테나의 미세한 불꽃으로 그것을 받았다는 것. 라이덴 병은 1745년에 발견된 **축전기(콘덴서)의
        원형** 이라는 것 — '축전지' 라고 말하지 않는다. 헤르츠가 그 방전 실험에서 장치의 실마리를 얻었다는 연결까지.
    전문가:
      mc_brief: 이론이 실험 장치로 내려오는 지점이라는 전제를 깔고, 이 체험이 무엇을 재현하는 것인지 도슨트에게 묻는다.
      guard: '''전기가 아닌 정전기''라고 하지 않는다 — 정전기도 전기다. 체험 장치의 출력·주파수를 말하지 않는다.'
      docent_brief: 국제 모스 부호의 현행 표준이 ITU-R 권고 M.1677-1(2009년 10월)이고, 타이밍이 선=점 셋 / 글자 안 간격=점 하나 / 글자 사이=점
        셋 / 낱말 사이=점 일곱으로 규정돼 있다는 것. s=··· , o=--- 이고 SOS 는 글자 간격 없이 이어 치는 프로사인이며 1906년 11월 3일 제1차 국제무선전신협약에서
        채택돼 1908년 7월 1일 발효했다는 것. 지금의 국제 부호는 1848년 게르케의 '함부르크 알파벳' 에서 나와 1865년 5월 17일 파리 국제전신협약에서 표준화됐고
        그 회의가 ITU 의 전신을 만들었으며, 모스·베일 원본과 부호가 같은 글자는 E·H·K·N 넷뿐이라는 것. 헤르츠는 1886년 가을 카를스루에에서 리스 나선에 라이덴
        병을 방전시키다 착상했고, 룸코르프 유도코일의 5~30 kV 펄스로 1 m 쌍극자의 불꽃 간극을 때려 50~450 MHz 를 발생시켰으며 마이크로미터 불꽃 간극이 달린
        공진 고리로 수신했다는 것. 아연 반사판을 12 m 떨어뜨려 파장 약 4 m 의 정상파를 만들어 반사·굴절·회절·편광·간섭과 빛과 같은 전파 속도를 보였다는 것. 라이덴
        병은 폰 클라이스트(1745년 10월 11일)와 뮈스헨브룩·쿠나에우스(1745~46, 라이던)가 독립 발견한 축전기의 원형이고 20세기 전환기 불꽃간극 송신기에 널리 쓰였다는
        것. **'전기가 아닌 정전기' 라는 표현은 쓰지 않는다** — 정전기도 전기다.
  points:
  - answers:
      초등: 점과 선으로 글자를 보내는 모스 부호를 직접 손으로 쳐 볼 수 있어요! 짧게 똑, 길게 뚜우, 이 두 소리만으로 편지를 쓰는 셈이에요.
      중고등: 모스 부호랑 헤르츠의 전파 실험, 라이덴 병을 직접 체험해 볼 수 있어요. 전파를 처음 만들고 쓰던 방법을 손으로 하나씩 따라가 보는 거죠.
      일반: 모스 부호, 헤르츠의 전파 실험, 그리고 라이덴 병까지 세 가지를 직접 해 볼 수 있어요. 전파를 처음 증명하고 통신에 쓰기까지의 과정을 손으로 따라가 보는 코너예요.
      전문가: 국제 모스 부호 송신, 헤르츠의 불꽃간극 실험, 라이덴 병 방전까지 전파 기술의 출발점을 재현해 볼 수 있어요. 이론이 실험 장치로 내려오는 지점을 직접 만져 보는
        셈이죠.
    answer_emotion: 권유
    listener_emotion: 신남
  - ask: 재밌겠네요! 그럼 모스 부호는 어떻게 만들어진 거예요?
    ask_emotion: 기쁨
    answers:
      초등: 짧은 신호와 긴 신호를 섞어서 글자마다 약속을 정해 둔 거예요. 자주 쓰는 글자일수록 짧은 신호를 줘서 빨리 보낼 수 있게 했답니다.
      중고등: 점과 선의 길이 차이로 글자를 나타내는데, 자주 쓰는 글자일수록 짧은 부호를 받았어요. 그래서 영어에서 가장 흔한 E가 점 하나예요. 한글 전신 부호는 김학우가 만들었죠.
      일반: 사실 이건 모스 혼자 만든 게 아니에요. 동료 베일이 알파벳 부호로 넓혔고, 지금의 국제 모스 부호는 1865년에 표준이 됐어요. SOS도 세 글자가 아니라 끊지 않고
        이어 치는 하나의 신호예요.
      전문가: 베일이 알파벳 부호로 확장한 코드가 1848년 게르케의 개량을 거쳐 1865년 5월 17일 파리 국제전신협약에서 표준화됐어요. 현행 표준은 ITU-R 권고 M.1677-1이고,
        선은 점 셋, 낱말 사이 간격은 점 일곱이에요.
    answer_emotion: 뿌듯
    listener_emotion: 감탄
  - ask: 그럼 헤르츠 실험은 무엇을 보여 주는 거예요?
    ask_emotion: 궁금
    answers:
      초등: 옛날 한 과학자가 불꽃을 튀겨서 전파를 만들고, 떨어진 곳에서 그 전파를 받아 낸 실험이에요. 라이덴 병은 전기를 잠깐 담아 두는 병이고요.
      중고등: 헤르츠가 불꽃을 튀겨 전파를 만들고 떨어진 고리에서 받아 내 존재를 확인한 실험이에요. 라이덴 병은 전기를 담는 축전기의 원형인데, 그 방전 실험이 실마리가 됐어요.
      일반: 헤르츠는 유도코일의 고전압을 불꽃 간극에 튀겨 전파를 쏘고, 떨어진 고리 안테나의 작은 불꽃으로 받았어요. 라이덴 병은 1745년에 발견된 축전기의 원형이고, 그 방전
        실험이 실마리가 됐어요.
      전문가: 헤르츠는 1886년 가을 리스 나선에 라이덴 병을 방전시키다 장치를 착상했고, 룸코르프 유도코일의 고전압으로 1미터 쌍극자의 불꽃 간극을 때려 전파를 만들었어요.
        재밌는 건 본인은 쓸모를 묻자 없을 것 같다고 답했대요.
    answer_emotion: 설명
    listener_emotion: 경청
  mc_emotion: 신남
  mc_after_emotion: 신남
- id: 05-donor
  title: 기증자 — 장황남 박사
  mc: 이 체험관 전시품 중에는 한 분이 기증한 것들이 있다고 들었어요. 도슨트, 장황남 박사가 누구인지 소개해 주세요.
  mc_after: 의사가 통신 장비를 모았다는 게 뜻밖이죠. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 체험관 정식 명칭에 이름이 들어간 기증자라는 것과, 원장 §5 에 적힌 생애·기증 내역을 그대로 옮긴다. 상대연도('몇 년 전')를 쓰지 않고 절대연도로만
    말한다. 원장에 없는 사실을 덧붙이지 않는다.
  gaze: partner
  topic: 의사가 평생 모은 통신기기를 기증했다는 대비
  briefs:
    초등:
      mc_brief: 이 많은 물건을 한 사람이 모아서 주었다는 사실에 놀라는 반응으로 열고, 그 사람이 누구인지 도슨트에게 묻는다. 어려운 직업 이름이나 학교 이름은 쓰지 않는다.
      guard: 연도·숫자·호출부호·학교 이름은 말하지 않는다. '의학박사'라고 하지 않고 '의사'라고 한다.
      docent_brief: 병을 고치는 의사 선생님이 통신 기계를 좋아해서 아주 오랫동안 하나씩 모았고, 그걸 혼자 갖지 않고 우리가 볼 수 있게 내놓았다는 것이 핵심 훅.
        이름은 장황남이라는 것까지만. 연도·숫자·호출부호·학교 이름은 말하지 않는다. **'의학박사' 라고 하지 않고 '의사' 라고 한다.**
    중고등:
      mc_brief: 전시품이 한 사람의 기증에서 나왔다는 점을 짚고 그 사람을 도슨트에게 묻는다.
      guard: '''의학박사''가 아니라 ''의사''다. ''동아리''라고 하지 않는다. 수량은 말하지 않는다.'
      docent_brief: 본업이 전파가 아닌 사람이 평생 통신 장비를 모았다는 대비가 핵심 훅. 전남 완도에서 태어나 의과대학을 다녔고, 1963년 전남에서 처음으로 아마추어
        무선국을 연 사람이라는 것. 1972년 미국으로 건너가 의사로 일하면서 수집을 이어갔고, 모은 것을 기증해 2014년 조선대학교에 그의 이름을 딴 정보통신박물관이 세워졌다는
        것. 연도는 1963·1972·2014 만 쓰고 수량은 말하지 않는다. **'의학박사' 가 아니라 '의사' 다. '동아리' 라고 하지 않는다 — 본인이 무선국을 열었다.**
    일반:
      mc_brief: 체험관의 전시품 상당수가 한 사람의 기증이라는 점을 언급하고, 장황남이 누구인지 도슨트에게 소개를 청한다.
      guard: 4천5백여 점은 조선대학교 기증분이다 — 체험관 전시품 수와 섞지 않는다. 생몰년·학위·기증 동기는 말하지 않는다.
      docent_brief: 전파·통신이 본업이 아닌 의사가 평생 통신 장비를 모았다는 대비가 핵심 훅. 전남 완도 출생, 광주고등학교와 전남의과대학을 나왔고 전남의대 약리학교실에서
        석사과정을 마쳤다는 것. 1963년 전남 최초의 아마추어 무선 통신사로 자기 무선국을 운영했고(호출부호 HM4DF), 1972년 미국으로 이주해 뉴욕주 뉴어크에서 내과를
        개업하며 수십 년에 걸쳐 수집을 이어갔다는 것. 그 수집품 4천5백여 점을 조선대학교에 기증해 2014년 9월 30일 **장황남정보통신박물관** 이 문을 열었다는 것.
        **4,500여 점은 조선대학교 기증분이다 — 이 체험관 전시품 수와 섞지 않는다.** 생몰년·학위·기증 동기는 확인되지 않았으므로 말하지 않는다.
    전문가:
      mc_brief: 수집가 한 사람의 컬렉션이 공공 전시로 옮겨간 사례라는 전제를 깔고, 그 인물의 이력을 도슨트에게 묻는다.
      guard: 수집 기간을 숫자로 말하지 않는다. 박사학위·생몰년은 말하지 않는다. 체험관 기증 규모를 단정하지 않는다.
      docent_brief: 핵심은 아마추어 무선(HAM)이 전문가와 비전문가의 경계를 허문 경로였다는 것. 전남 완도 출생, 광주고등학교·전남의과대학 졸업, 전남의대 약리학교실
        석사과정 수료. 1963년 전남 최초의 아마추어 무선 통신사로 호출부호 HM4DF(HL 이전에 한국에 배정됐던 접두사) 무선국을 운영했다는 것. 군 복무 후 1972년
        도미, 뉴욕주 뉴어크에서 내과를 개업하고 병원 과장·의사협회장을 역임했으며 미국 아마추어 무선 잡지 QST 에 기술 기사가 실렸다는 것. 1920년대부터 최근까지를 아우르는
        유무선 정보통신기기 4천5백여 점을 조선대학교에 기증해 구 대학원 건물을 리모델링한 **장황남정보통신박물관** 이 2014년 9월 30일 개관했다는 것. 수집 기간은 출처가
        30여 년(조선대)과 40년(언론)으로 갈리므로 숫자를 말하지 않는다. **박사학위·생몰년은 출처가 없어 말하지 않고, 호칭은 '의사' 로 한다.**
  points:
  - answers:
      초등: 병을 고치는 의사 선생님이에요! 통신 기계를 무척 좋아해서 아주 오랫동안 하나씩 모았고, 그걸 혼자 갖지 않고 우리가 볼 수 있게 내놓았어요.
      중고등: 놀랍게도 본업이 의사였던 분이에요. 전남 완도에서 태어나 의과대학을 다녔고, 1963년 전남에서 처음으로 아마추어 무선국을 연 사람이기도 해요.
      일반: 전파나 통신이 본업이 아닌 의사예요. 전남 완도에서 태어나 전남의과대학을 나왔고, 1963년에는 전남 최초의 아마추어 무선 통신사로 자기 무선국을 운영했어요.
      전문가: 전남 완도 출생으로 광주고등학교와 전남의과대학을 나와 전남의대 약리학교실에서 석사과정을 마친 의사예요. 1963년 전남 최초의 아마추어 무선 통신사로 호출부호 에이치엠
        사 디 에프 무선국을 운영했어요.
    answer_emotion: 놀람
    listener_emotion: 감탄
  - ask: 의사 선생님이 통신 기계를요? 그럼 모은 기계들은 어떻게 됐어요?
    ask_emotion: 놀람
    answers:
      초등: 모은 기계들을 대학교에 내놓아서, 그분 이름을 딴 박물관이 생겼어요. 덕분에 많은 사람이 옛날 통신 기계를 볼 수 있게 됐답니다.
      중고등: 1972년 미국으로 건너가 의사로 일하면서도 수집을 이어 갔어요. 모은 것을 기증해서 2014년 조선대학교에 그의 이름을 딴 정보통신박물관이 세워졌어요.
      일반: 1972년 미국 뉴욕주 뉴어크에서 내과를 개업하고도 수십 년에 걸쳐 수집을 이어 갔어요. 그렇게 모은 4천5백여 점을 조선대학교에 기증해 2014년 9월 30일 장황남정보통신박물관이
        문을 열었어요.
      전문가: 1972년 미국 뉴욕주 뉴어크에서 내과를 개업해 의사협회장을 지냈고, 아마추어 무선 잡지 QST에 기술 기사도 실었어요. 유무선 통신기기 4천5백여 점을 조선대학교에
        기증해 2014년 9월 30일 장황남정보통신박물관이 개관했어요.
    answer_emotion: 뿌듯
    listener_emotion: 끄덕
  mc_emotion: 궁금
  mc_after_emotion: 감탄
- id: 06-bands
  title: 주파수 대역별 기증품 — 초장파에서 밀리미터파까지
  mc: 이번엔 기증품을 주파수 대역별로 둘러볼 차례예요. 도슨트, 전파를 왜 여러 종류로 나눠 놓은 거예요?
  mc_after: 초장파부터 밀리미터파까지, 범위가 정말 넓네요. 어느 대역이 제일 궁금하신가요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: ITU가 전파를 낮은 주파수부터 높은 주파수까지 차례로 구간을 나눠 이름을 붙였고 체험관에는 초장파부터 밀리미터파까지의 장비가 전시돼 있다는 것, 그 범위가
    파장으로는 100km~1mm라는 것. 1920년 제작 진공관 라디오 'Masterpiece'나 1980년대 무선호출기(삐삐) 같은 구체적인 전시품을 한두 개 예로 들어도 좋다.
    원장 표에 없는 대역 성질은 지어내지 않는다. 절대연도로만 말한다.
  gaze: audience
  topic: ITU 주파수 대역 구분과 대역별 전시 장비
  briefs:
    초등:
      mc_brief: 전파에도 여러 종류가 있다는 사실에 놀라는 반응으로 열고, 왜 여러 종류로 나눠 놓았는지 도슨트에게 묻는다. '주파수'·'대역' 같은 말은 쓰지 않는다.
      guard: 숫자·기호·기관 이름은 말하지 않는다. 어떤 기계가 무슨 일을 했는지 지어내지 않는다. 거리 비유를 지어내지 않는다.
      docent_brief: 전파에는 아주 길게 출렁이는 것부터 아주 짧게 떨리는 것까지 여러 종류가 있고, 길이가 다르면 잘하는 일도 다르다는 것. 이 코너에 놓인 기계들은
        서로 다른 종류의 전파를 쓰던 옛날 기계라는 것. 숫자·기호·기관 이름은 하나도 말하지 않는다. 비유는 '아주 긴 파' 와 '쌀알만큼 짧은 파' 정도까지만 — 거리 비유를
        지어내지 않는다.
    중고등:
      mc_brief: 전파를 왜 굳이 여러 대역으로 나눠 놓았는지 도슨트에게 묻는다.
      guard: 대역이 몇 개인지 말하지 않는다. 정확한 주파수 값은 말하지 않는다. 전시품 이름·연도를 단정하지 않는다.
      docent_brief: 주파수가 낮을수록 파장이 길고 장애물을 돌아 멀리 가며, 높을수록 파장이 짧고 곧게 나아간다는 대비가 핵심 훅. 성질이 다르니 국제기구가 구간을 나누고
        쓰임새를 정해 뒀다는 것, 전시된 기계들이 그 서로 다른 구간을 쓰던 것들이라는 것. **대역이 몇 개인지는 말하지 않는다** — 세는 기준마다 달라서 지금 큐시트 숫자가
        틀렸다. 정확한 주파수 값도 생략한다.
    일반:
      mc_brief: 전파를 왜 여러 대역으로 나눠 놓았는지 도슨트에게 묻는다.
      guard: 대역 개수를 말하지 않는다 — 표마다 다르다. 전시품 개수·연도는 단정하지 않는다.
      docent_brief: 국제전기통신연합(ITU)이 전파를 주파수 순서로 구간을 나누고 이름을 붙였다는 것, 이 전시의 낮은 쪽 끝이 초장파(VLF)이고 높은 쪽 끝이 밀리미터파(EHF)
        라는 것, 그 사이가 파장으로 100킬로미터에서 1밀리미터까지라는 것, 파장이 길수록 멀리 돌아가고 짧을수록 직진한다는 것. **'10개 대역' 이라고 말하지 않는다**
        — ITU 무선규칙 표는 9개, ITU-R 권고 V.431 표는 13개다. 개수 대신 '낮은 쪽부터 높은 쪽까지' 로 말한다. 전시품 개수·연도는 현장 확인 전이므로 단정하지
        않는다.
    전문가:
      mc_brief: 전파를 왜 여러 대역으로 나눠 다루는지 도슨트에게 묻는다.
      guard: '''10개 대역''이라고 말하지 않는다. 실제 전시품이 몇 개 대역을 덮는지 단정하지 않는다.'
      docent_brief: ITU-R 권고 V.431-8 Table 1 이 대역번호 3(ULF, 300~3,000 Hz)부터 15(300~3,000 THz)까지를 정의하고,
        무선규칙(RR) No. 2.1 의 표는 그중 4번(VLF, 3~30 kHz)부터 12번(300~3,000 GHz)까지를 싣는다는 것. Note 1 의 규칙 '대역번호 N
        은 0.3×10^N Hz ~ 3×10^N Hz' 를 그대로 말해도 된다. 전시 범위인 VLF(4번)~EHF(11번)는 8개 대역, 주파수 3 kHz~300 GHz, 파장
        100 km~1 mm 라는 것. **명명 체계가 둘**이라는 점을 반드시 짚는다 — VLF/LF/MF/HF/VHF/UHF/SHF/EHF 는 주파수 기준 기호이고 미리어미터파·킬로미터파·…·밀리미터파는
        파장 기준 이름이라, '초장파에서 밀리미터파까지' 는 두 계열을 섞은 표현이다. 한국어 중파·단파·초단파의 주파수 범위는 전파법 시행령 제2조에 그대로 있다는 것도 덧붙일
        수 있다. '10개 대역' 은 근거가 없으니 쓰지 않는다.
  points:
  - answers:
      초등: 전파에도 아주 길게 출렁이는 것부터 쌀알만큼 짧게 떨리는 것까지 여러 종류가 있거든요. 길이가 다르면 잘하는 일도 달라서 나눠 놓은 거예요.
      중고등: 주파수에 따라 전파의 성질이 달라서예요. 주파수가 낮을수록 한 번 출렁이는 길이, 즉 파장이 길고, 높을수록 짧아지거든요.
      일반: 주파수에 따라 파장과 성질이 달라서예요. 이 코너 제목의 초장파는 주파수가 아주 낮은 쪽, 밀리미터파는 아주 높은 쪽이고, 파장으로 치면 100킬로미터에서 1밀리미터까지예요.
      전문가: 주파수에 따라 전파 특성이 달라서 구간별로 다뤄야 하거든요. 파장은 주파수에 반비례해서, 제목의 범위인 3킬로헤르츠에서 300기가헤르츠는 파장으로 100킬로미터에서
        1밀리미터예요.
    answer_emotion: 설명
    listener_emotion: 경청
  - ask: 아, 그렇구나! 그럼 길이가 다르면 실제로 뭐가 달라져요?
    ask_emotion: 끄덕
    answers:
      초등: 신기하게도 긴 전파는 언덕을 빙 돌아서 넘어가고, 짧은 전파는 곧게 쭉 나아가요. 그래서 하는 일도 서로 달라요.
      중고등: 파장이 긴 전파는 언덕 같은 장애물을 휘돌아 넘어가고 땅을 따라 지평선 너머까지 가요. 반대로 짧은 전파는 빛처럼 곧게 나아가서 앞이 트여 있어야 잘 닿죠.
      일반: 장파나 중파 같은 낮은 주파수는 언덕을 휘돌아 넘고 땅을 따라 지평선 너머까지 가요. 초단파부터는 빛처럼 곧게 가서 보이는 거리 안에서 쓰이고, 단파는 하늘의 전리층에서
        꺾여 멀리 가기도 해요.
      전문가: VLF에서 MF까지는 회절로 장애물을 넘는 지표파가 주된 전파 방식이고, VHF 이상은 가시선 전파가 주를 이뤄요. 중파와 단파는 전리층 굴절로 대륙 간 거리까지
        가기도 해서, 파장이 길수록 멀리 간다고 단정할 순 없어요.
    answer_emotion: 신남
    listener_emotion: 놀람
  - ask: 그럼 그 구분은 누가 정하는 거예요?
    ask_emotion: 궁금
    answers:
      초등: 세계가 함께 쓰는 약속으로 구간을 나누고 이름을 붙여 뒀어요. 이 코너 기계들은 서로 다른 전파를 쓰던 옛날 기계들이고요.
      중고등: 성질이 다르니까 국제기구가 구간을 나누고 이름과 쓰임새를 정해 뒀어요. 이 코너의 기계들이 바로 그 서로 다른 구간을 쓰던 것들이에요.
      일반: 국제전기통신연합, ITU가 전파를 주파수 순서로 나누고 구간마다 이름을 붙였어요. 초장파는 VLF, 밀리미터파는 EHF처럼 영어 기호도 함께 있죠.
      전문가: 기준은 ITU-R 권고 V.431-8의 표로, 대역번호 N을 0.3 곱하기 10의 N승에서 3 곱하기 10의 N승 헤르츠로 정해요. 다만 초장파는 주파수 기준, 밀리미터파는
        파장 기준 이름이라 제목은 두 계열이 섞인 표현이에요.
    answer_emotion: 설명
    listener_emotion: 끄덕
  mc_emotion: 골똘
  mc_after_emotion: 감탄
- id: 07-maritime
  title: 해상무선통신
  mc: 이번엔 바다 위의 무선통신 이야기예요. 도슨트, 타이타닉호 이야기를 들려주실래요?
  mc_after: 마지막까지 구조 신호를 보낸 전신기사 이야기가 뭉클하네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 1912년 4월 타이타닉호가 침몰할 때 전신기사 잭 필립스가 죽는 순간까지 모스부호로 구조를 요청했고, 이를 듣고 몇 시간 떨어진 곳에서 달려온 여객선이
    구명정에 있던 약 700명을 구조했다는 것(영국 공식 조사 기준 2,201명 중 711명 생존). 이 사고가 계기가 되어 1914년 해상인명안전협약(SOLAS)이 만들어졌고,
    그 협약의 1988년 개정으로 국제해상조난안전시스템(GMDSS)이 채택돼 1992년 단계 도입을 거쳐 1999년 전면 시행됐다는 것. 절대연도로만 말한다. '바다에 빠진 사람'처럼
    구조 대상을 단정하는 수식어는 쓰지 않는다.
  gaze: partner
  topic: 타이타닉 침몰이 해상 무선통신 규칙을 어떻게 바꿨나 — 1912년 런던 회의·SOLAS·GMDSS
  briefs:
    초등:
      mc_brief: 배가 바다 한가운데서 큰일이 났을 때 어떻게 도움을 부르는지 궁금하다는 투로 열고 도슨트에게 넘긴다. 배 이름과 연도, 사람 수는 말하지 않는다.
      guard: 숫자·연도·배 이름은 말하지 않는다. 사람이 죽었다는 말을 하지 않는다.
      docent_brief: 아주 옛날 큰 배가 바다에서 가라앉을 때, 한 사람이 끝까지 자리를 지키며 '도와주세요' 신호를 전파로 계속 보냈다는 것. 그 신호를 들은 다른 배가
        달려와 많은 사람을 구했다는 것. 그때부터 배들은 언제나 서로의 구조 신호를 듣고 있기로 약속했다는 것. 숫자·연도·배 이름·죽음은 말하지 않는다.
    중고등:
      mc_brief: 이번 주제는 바다 위의 무선통신이라고 알리고, 타이타닉 이야기를 도슨트에게 청한다. '그 사고가 바꾼 것' 에 초점이 있다는 걸 미리 깔아 준다.
      guard: 구조 인원 수는 말하지 않는다. 연도는 1912년과 1999년만 말한다.
      docent_brief: 핵심 훅은 '사고가 사람을 바꾼 게 아니라 규칙을 바꿨다' 는 것. 1912년 타이타닉이 침몰할 때 무선통신사가 마지막까지 구조 신호를 보냈고, 그
        신호를 들은 다른 배가 달려와 구명정의 사람들을 구했다는 것. 그 뒤 조사위원회가 '모든 배는 밤낮 끊기지 않게 무선을 지켜야 한다' 고 권고했고, 그 권고가 국제 규칙이
        됐다는 것. 연도는 1912년만 말한다. 구조 인원 수는 말하지 않는다.
    일반:
      mc_brief: 이번 주제는 바다 위의 무선통신이라고 알리고 타이타닉 이야기를 청한다. 뒤에 '그래서 지금 규칙이 이렇게 됐다' 가 올 것을 예고한다.
      guard: '''695명''이라고 하지 않는다. 타이타닉 때문에 국제해상조난안전시스템이 생겼다고 하지 않는다 — 1914년 협약의 1988년 개정으로 들어왔다.'
      docent_brief: 핵심 훅은 '전파가 사람을 구했고, 그 경험이 제도가 됐다'. 1912년 4월 타이타닉 침몰 때 수석 무선통신사 잭 필립스가 마지막까지 CQD 와
        SOS 를 보냈다는 것. 그 신호를 받은 카르파티아호가 달려와 구명정의 사람들을 구했고, 공식 조사 기준으로 승선자 2,201명 중 약 700명이 살아남았다는 것. 사고
        몇 달 뒤 1912년 런던 국제무선전신회의가 조난신호의 공통 주파수를 정하고 선박이 정해진 시간마다 조난 호출을 듣도록 했으며, 1914년에는 해상인명안전협약(SOLAS)이
        처음 채택됐다는 것. 지금 쓰는 국제해상조난안전시스템(GMDSS)은 그 SOLAS 의 1988년 개정으로 들어와 1999년에 전면 시행됐다는 것. **'695명' 과 '타이타닉
        때문에 GMDSS가 생겼다' 는 말하지 않는다** — 둘 다 틀렸다.
    전문가:
      mc_brief: 제도사의 관점을 전제로 깔고 — 사고 하나가 국제 규칙을 어디까지 바꿨는지 — 도슨트에게 타이타닉의 규제사적 유산을 묻는다.
      guard: 카르파티아호가 조난 전문을 받은 시각은 말하지 않는다(미확인). 체험관 전시물·장치는 단정하지 않는다.
      docent_brief: '영국 난파위원회 보고서의 숫자로 연다: 승선 2,201명 중 711명 생존(32.30%), 카르파티아호가 구명정에서 712명을 올렸고 4시 5분
        정선 — 침몰(2시 20분) 1시간 45분 뒤다. 같은 보고서 권고 제20항이 ''충분한 수의 훈련된 통신사로 밤낮 끊기지 않는 당직'' 을 요구했다는 것. 그 권고가
        두 갈래로 흘렀다는 것 — ITU 쪽은 1912년 런던 국제무선전신회의의 공통 조난파장과 청취 의무(SOS 자체는 1906년 회의에서 이미 정해졌다), IMO 쪽은 1914년
        최초 SOLAS. GMDSS 는 1988년 SOLAS 개정으로 채택돼 1992년 2월 1일부터 단계 도입, 1999년 2월 1일 전면 시행이며 SOLAS 제IV장에 담긴다는
        것. GMDSS 는 해역을 A1(VHF 약 30해리)·A2(MF 약 100~300해리)·A3(정지위성)·A4(그 밖, HF)로 나누고 406MHz EPIRB 와 9GHz
        SART 를 필수 장비로 두며, 주파수는 ITU 전파규칙 제31조와 부록 15, 운용절차는 제32조가 정한다는 것. 국내법으로는 선박안전법 제29조가 ''세계 해상조난
        및 안전제도'' 설비를 의무화하고 전파법 제28조제2항이 조난통신에 ''다른 모든 무선통신에 우선하여 즉시 응답'' 할 의무를 지운다는 것 — 1912년 권고가 지금 우리
        법 조문에 그대로 살아 있다. 조항 번호와 정확한 값을 그대로 말해도 된다.'
  mc_emotion: 궁금
  mc_after_emotion: 아쉬움
  points:
  - answers:
      초등: 옛날 큰 배가 바다에서 가라앉을 때, 한 사람이 끝까지 도와 달라는 신호를 전파로 보냈어요. 그걸 들은 다른 배가 달려와 사람들을 구했답니다.
      중고등: 1912년 타이타닉이 침몰할 때 무선통신사가 마지막까지 구조 신호를 보냈어요. 그 신호를 들은 다른 배가 달려와 구명정에 있던 사람들을 구했죠.
      일반: 1912년 4월 타이타닉이 침몰할 때 무선통신사 잭 필립스가 마지막까지 구조 신호를 보냈어요. 카르파티아호가 달려와 구명정의 사람들을 구했고, 공식 조사로는 약 700명이
        살아남았죠.
      전문가: 영국 난파위원회 보고서 기준으로 승선 2,201명 중 711명이 살아남았어요. 카르파티아호가 구명정에서 712명을 올렸고, 정선 시각은 새벽 4시 5분으로 침몰 1시간
        45분 뒤였죠.
    answer_emotion: 아쉬움
    listener_emotion: 아쉬움
  - ask: 그 사고가 바꾼 게 있다고 들었어요. 무엇이 달라졌나요?
    ask_emotion: 골똘
    answers:
      초등: 그때부터 배들은 언제나 서로의 구조 신호를 듣고 있기로 약속했어요. 덕분에 지금도 바다에서 누가 도움을 부르면 가까운 배가 달려갈 수 있답니다.
      중고등: 사고 뒤 조사위원회가 모든 배는 밤낮 끊기지 않게 무선을 지켜야 한다고 권고했어요. 그 권고가 국제 규칙이 됐으니, 사고가 사람이 아니라 규칙을 바꾼 셈이죠.
      일반: 사고 몇 달 뒤 1912년 런던 국제무선전신회의가 조난신호의 공통 주파수를 정하고, 배가 정해진 시간마다 조난 호출을 듣도록 했어요. 1914년에는 해상인명안전협약이
        처음 채택됐고요.
      전문가: 같은 보고서 권고 제20항이 충분한 수의 훈련된 통신사로 밤낮 끊기지 않는 당직을 요구했어요. 그 권고가 두 갈래로 흘러 1912년 런던 국제무선전신회의의 공통 조난파장과
        청취 의무, 1914년 최초 해상인명안전협약이 됐고요.
    answer_emotion: 설명
    listener_emotion: 끄덕
  - ask: 그럼 지금은 어떤 규칙으로 바뀌었어요?
    ask_emotion: 궁금
    answers:
      초등: 요즘은 배에 자동으로 위치를 알리는 장치가 있어요. 사람이 못 보내도 구조 신호가 저절로 나가서, 기계가 대신 외쳐 주는 셈이죠.
      중고등: 지금은 국제해상조난안전시스템이라는 규칙이 있어서 조난 신호를 장비가 자동으로 주고받아요. 1999년 전면 시행되면서 모스 부호는 바다에서 물러났죠.
      일반: 지금 쓰는 국제해상조난안전시스템은 그 협약의 1988년 개정으로 들어와 1992년부터 단계 도입되고 1999년에 전면 시행됐어요. 그날부터 모스 부호가 해상에서 물러났죠.
      전문가: 국제해상조난안전시스템은 1988년 협약 개정으로 채택돼 1992년 2월 1일 단계 도입, 1999년 2월 1일 전면 시행됐어요. 해역을 네 구간으로 나누고 406메가헤르츠
        비상위치표지와 수색구조 트랜스폰더를 필수로 둡니다.
    answer_emotion: 뿌듯
    listener_emotion: 안도
- id: 08-aviation
  title: 항공무선통신과 시뮬레이터
  mc: 바다 다음은 하늘이에요! 도슨트, 항공무선통신 코너에서는 무엇을 해볼 수 있어요?
  mc_after: 조종석에 앉아 이륙까지 해볼 수 있다니 인기가 많겠어요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 실제 조종사 교육용 장비를 이착륙 체험용으로 개조한 항공 시뮬레이터가 있고, 조종석은 계기 본체(속도·고도·방향)·발로 밟는 페달(브레이크·지상 방향 전환)·요크(고도
    상승·하강, 방향 전환)·스로틀(엔진 출력 제어)로 구성된다는 것. 실제 이륙 절차는 미리 세팅해 두고 체험한다는 것과, 착륙 체험은 시간관계상 생략한다는 것만 말한다. 시뮬레이터의
    기종은 언급하지 않는다 — 확인되지 않았다.
  gaze: audience
  topic: 하늘의 무선 규칙은 누가 정하나 — ICAO 부속서 10과 항공안전법, 그리고 조종석 체험
  briefs:
    초등:
      mc_brief: 바다 다음은 하늘이라고 넘기면서, 비행기 조종석에 앉아볼 수 있다는 것을 기대되는 투로 알리고 도슨트에게 묻는다. 기종·숫자·기관 이름은 말하지 않는다.
      guard: 기종·숫자·기관 이름은 말하지 않는다. 조종석 부품 이름을 단정하지 않는다.
      docent_brief: 비행기는 하늘에서 땅에 있는 사람과 전파로 이야기하면서 날아간다는 것, 항공무선통신 코너에서는 진짜 조종석에 앉아 손잡이를 당겨 비행기를 띄워볼 수
        있다는 것. 비유를 쓴다 — 비행기와 땅이 보이지 않는 실로 이어져 있는 것 같다는 식. 주파수·기종·법·부품 이름은 말하지 않는다.
    중고등:
      mc_brief: 바다 다음은 하늘이라고 넘기고, 항공무선통신 코너와 시뮬레이터에서 무엇을 해볼 수 있는지 도슨트에게 묻는다.
      guard: 기종은 말하지 않는다. 주파수 숫자는 말하지 않는다.
      docent_brief: 핵심 훅은 '하늘의 규칙은 한 나라가 못 정한다'. 비행기는 어느 나라 하늘을 날든 같은 방식으로 통신해야 해서 국제민간항공기구(ICAO)가 표준을
        정하고 각 나라가 그걸 법으로 받아 쓴다는 것. 그래서 항공기에는 관제소와 말할 무선기, 위치를 알리는 장비, 사고 시 위치를 쏘는 비상 신호기가 반드시 실린다는 것.
        시뮬레이터는 실제 조종사 교육용 장비를 체험용으로 고친 것이고 조종석에서 이륙까지 해볼 수 있다는 것. 연도는 시카고 협약 1944년 정도만. 주파수 숫자는 말하지 않는다.
        기종은 절대 말하지 않는다.
    일반:
      mc_brief: 바다 다음은 하늘이라고 넘기고, 항공무선통신 코너와 시뮬레이터에서 무엇을 해볼 수 있는지 묻는다. 체험 이야기로 끝날 것을 예고한다.
      guard: 기종은 말하지 않는다. 조종석 부품은 기능으로 말하고 이름을 단정하지 않는다.
      docent_brief: 핵심 훅은 '국제 표준이 우리 하늘의 법이 된다'. 1944년 시카고 협약으로 만들어진 국제민간항공기구(ICAO)가 협약의 부속서로 항공통신 표준을
        정하고, 우리 항공안전법이 제1조에서 그 부속서를 따른다고 스스로 밝힌다는 것. 그래서 항공기에는 관제기관과 교신할 무선전화 송수신기, 위치를 응답하는 트랜스폰더, 사고
        시 위치를 알리는 비상위치지시용 무선표지설비(ELT)가 법으로 의무화돼 있고, 무선기는 하나가 고장나도 나머지가 살아 있도록 두 벌을 따로 설치한다는 것. 코너 안쪽에는
        항공기 어느 위치에 어떤 통신 안테나가 붙는지 볼 수 있다는 것. 시뮬레이터는 실제 조종사 교육용 장비를 이착륙 체험용으로 개조한 것이고, 실제 이륙은 수많은 절차를 거치지만
        체험에서는 미리 세팅해 두며 착륙은 시간관계상 생략한다는 것. **기종은 말하지 않는다.** 조종석 부품은 기능으로 설명하고 이름을 단정하지 않는다.
    전문가:
      mc_brief: 국제 표준과 국내 법령의 관계를 전제로 깔고, 항공무선의 근거 체계와 시뮬레이터 체험이 각각 어디에 해당하는지 도슨트에게 묻는다.
      guard: 기종과 체험관 장비의 자격 여부는 말하지 않는다. 조종석 페달을 '패들'이라고 하지 않는다 — 러더 페달이다.
      docent_brief: 시카고 협약(1944.12.7 서명, 52개국 / 1947.4.4 ICAO 발족, 현 193개국)의 19개 부속서 중 **부속서 10 Aeronautical
        Telecommunications** 이 통신·항법·감시를 규율하며, 1949년 5월 30일 채택·1950년 3월 1일 발효 후 1995년 개정 70호로 5권 체제 (I
        무선항법보조, II 통신절차, III 통신시스템, IV 감시레이더·충돌회피, V 주파수 이용)가 됐다는 것. ICAO Doc 9718 기준 공대지 음성은 117.975~137MHz(AM(R)S),
        비상주파수는 121.5·123.1·243MHz, 수색구조는 406~406.1MHz, SSR·ACAS·ADS-B 는 1,030/1,090MHz 라는 것. 국내로 내려오면
        항공안전법 제1조가 협약 부속서를 따른다고 명시하고, 제51조와 시행규칙 제107조가 VHF/UHF 무선전화 송수신기 각 2대·트랜스폰더·ADF·ILS·VOR·DME·기상레이더·
        ELT·ADS-B 를 의무화하며, ELT 는 121.5MHz 와 406MHz 로 송신하고 무선설비는 항공비상주파수 121.5MHz 또는 243.0MHz 로 관제기관과 통신
        가능해야 한다는 것 — ICAO 표의 숫자가 국내 시행규칙에 그대로 박혀 있다. 전파법 제28조제2항은 항공국·항공기국에 조난통신 우선 응답 의무를 지우는데, 같은 조문이
        해안국·선박국도 함께 묶는다는 것. 조종면은 FAA 기준 요크가 pitch(엘리베이터)와 roll(에일러론)을, 러더 페달이 yaw(러더)를 맡으며 고도와 선회는 그 결과라는
        것. 조종사 훈련용 모의비행장치의 국제 자격기준은 ICAO Doc 9625 라는 것. **기종과 체험관 장비의 자격 여부는 말하지 않는다** — 확인되지 않았다.
  mc_emotion: 신남
  mc_after_emotion: 기쁨
  points:
  - answers:
      초등: 진짜 조종석에 앉아서 손잡이를 당겨 비행기를 띄워 볼 수 있어요! 비행기는 하늘에서도 땅에 있는 사람과 전파로 이야기하면서 날아가거든요.
      중고등: 실제 조종사 교육용 장비를 체험용으로 고친 시뮬레이터가 있어서 조종석에서 이륙까지 해 볼 수 있어요. 비행기가 관제소와 어떻게 통신하는지도 함께 볼 수 있고요.
      일반: 실제 조종사 교육용 장비를 이착륙 체험용으로 개조한 시뮬레이터가 있어요. 코너 안쪽에서는 항공기 어느 위치에 어떤 통신 안테나가 붙는지도 볼 수 있고요.
      전문가: 조종사 교육용 장비를 개조한 시뮬레이터로 이륙을 체험할 수 있고, 항공기 통신 안테나 배치도 함께 볼 수 있어요. 조종면은 요크가 피치와 롤을, 페달이 요를 맡습니다.
    answer_emotion: 권유
    listener_emotion: 신남
  - ask: 비행기는 어떻게 땅이랑 이야기하는 거예요?
    ask_emotion: 궁금
    answers:
      초등: 비행기와 땅이 보이지 않는 실로 이어져 있다고 생각하면 돼요. 그 실이 전파라서, 조종사는 하늘에서도 땅의 목소리를 들을 수 있어요.
      중고등: 비행기에는 관제소와 말할 무선기, 위치를 알리는 장비, 사고 때 위치를 쏘는 비상 신호기가 실려 있어요. 어느 나라 하늘을 날든 같은 방식으로 통신해야 하거든요.
      일반: 항공기에는 관제기관과 교신할 무선전화 송수신기, 위치를 응답하는 트랜스폰더, 사고 시 위치를 알리는 비상위치표지가 법으로 의무예요. 무선기는 하나가 고장나도 되도록
        두 벌을 싣고요.
      전문가: 항공안전법 제51조와 시행규칙 제107조가 무선전화 송수신기 두 대와 트랜스폰더, 비상위치지시용 무선표지설비를 의무화해요. 비상표지는 121.5메가헤르츠와 406메가헤르츠로
        송신하고요.
    answer_emotion: 설명
    listener_emotion: 경청
  - ask: 그런 규칙은 누가 정해요?
    ask_emotion: 골똘
    answers:
      초등: 하늘은 여러 나라가 함께 쓰는 길이라, 나라들이 모여 같은 약속을 정해 뒀어요. 그래서 어느 나라 하늘에서도 같은 방법으로 이야기할 수 있어요.
      중고등: 국제민간항공기구가 표준을 정하고 각 나라가 그걸 법으로 받아 써요. 1944년 시카고 협약으로 만들어진 기구인데, 하늘의 규칙은 한 나라가 정할 수 없으니까요.
      일반: 1944년 시카고 협약으로 만들어진 국제민간항공기구가 부속서로 항공통신 표준을 정해요. 우리 항공안전법은 제1조에서 그 부속서를 따른다고 스스로 밝히고 있고요.
      전문가: 시카고 협약 부속서 10 항공통신이 통신과 항법, 감시를 규율하고, 공대지 음성은 117.975에서 137메가헤르츠, 비상주파수는 121.5메가헤르츠예요. 국제 표의
        숫자가 우리 시행규칙에 그대로 박혀 있는 셈이죠.
    answer_emotion: 뿌듯
    listener_emotion: 끄덕
- id: 09-special-exhibit
  title: 특별교류전시
  mc: 특별교류전시라는 코너도 있다고 들었어요. 도슨트, 그건 어떤 코너예요?
  mc_after: 기간마다 바뀌는 전시라 올 때마다 다르겠네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 유관기관과 교류해 특별 전시품을 일정 기간 전시하는 공간이라는 것, 지금은 조선대학교 장황남 전파통신박물관에서 전시되던 전쟁 관련 군사장비 — 군용 헤드셋과
    마이크, 간첩이 사용했던 무전기 등 — 가 전시돼 있다는 것, 군사장비는 내구도를 높이느라 튼튼하지만 무겁다는 것. 전시 시작·종료 연도는 원장에 없으니 지어내지 않는다.
  gaze: audience
  topic: 유관기관 교류 특별전시 — 현재 전시품
  briefs:
    초등:
      mc_brief: 특별교류전시에는 가끔 바뀌는 전시가 있다고 알리고 도슨트에게 넘긴다.
      guard: 구체적인 물건 이름을 말하지 않는다 — 무엇이 전시 중인지 확인되지 않았다.
      docent_brief: 이 코너는 전시품이 때때로 바뀐다는 것과, 지금 눈앞에 보이는 것을 가리켜 설명한다는 것. **구체적인 물건 이름을 미리 말하지 않는다** — 무엇이
        전시 중인지 확인되지 않았다.
    중고등:
      mc_brief: 다른 기관과 교류해 꾸미는 특별전시라는 점을 짚고 넘긴다.
      guard: 전시품 목록을 외워 말하지 않는다. 눈앞의 것을 보고 말한다.
      docent_brief: 유관기관과 교류해 일정 기간만 여는 전시 공간이라는 것. 지금 무엇이 있는지는 눈앞의 것을 보고 말한다. 목록을 외워 말하지 않는다.
    일반:
      mc_brief: 특별교류전시의 성격을 소개하고 지금 무엇이 있는지 도슨트에게 묻는다.
      guard: 전시품 목록·전시 기간·교류 기관을 단정하지 않는다 — 확인되지 않았다.
      docent_brief: 유관기관과 교류해 특별 전시품을 일정 기간 전시하는 공간이라는 것. 전시품 목록·전시 기간·교류 기관은 확인되지 않았으므로 단정하지 않고, 관람객이
        직접 보고 있는 것을 중심으로 말한다.
    전문가:
      mc_brief: 상설전시와 교류전시의 운영 차이를 짚고 도슨트에게 넘긴다.
      guard: 구체 전시품과 소장기관은 말하지 않는다 — 확인되지 않았다. 조선대학교 박물관에서 왔다고 단정하지 않는다.
      docent_brief: 상설전시와 달리 기간 한정이라 소장·대여 주체가 갈린다는 점. **구체 전시품과 소장기관은 확인되지 않았으므로 말하지 않는다.**
  mc_emotion: 궁금
  mc_after_emotion: 기쁨
  points:
  - answers:
      초등: 이 코너의 물건들은 가끔씩 바뀌는 특별한 전시예요. 그래서 오늘 보이는 것과 다음에 오셨을 때 보이는 게 다를 수 있답니다.
      중고등: 다른 기관과 교류해서 일정 기간만 여는 전시 공간이에요. 그래서 지금 무엇이 있는지는 눈앞에 보이는 것을 보고 말씀드리는 게 정확해요.
      일반: 유관기관과 교류해 특별 전시품을 일정 기간 선보이는 공간이에요. 전시품과 기간은 그때그때 달라지니, 지금 보고 계신 것을 중심으로 봐 주시면 좋겠어요.
      전문가: 상설전시와 달리 기간 한정이라 소장과 대여의 주체가 갈리는 공간이에요. 그래서 전시품 목록과 교류 기관은 시기마다 달라지고, 지금 놓인 실물을 기준으로 보시는 게
        맞습니다.
    answer_emotion: 멋쩍음
    listener_emotion: 끄덕
- id: 10-ham
  title: 아마추어 무선통신 (HAM)
  mc: 이번엔 취미로 즐기는 무선통신, 아마추어 무선이에요. 도슨트, 햄이 뭐예요?
  mc_after: 취미가 재난 때는 통신망이 된다는 게 멋지네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 직업이 아니라 취미로 즐기는 무선 통신이 아마추어 무선(HAM)이라는 것, 영화 '동감'(2000)에서 두 주인공이 햄으로 교감한 것이 훅이 될 수 있다는
    것, 전파를 보내거나 받는 전기적 시설이 무선설비이고, 무선설비와 그것을 조작하는 사람을 합쳐 무선국이라 전파법이 규정하며, 그 조작을 할 자격을 국가가 검정해 준 사람이 무선종사자라는
    것, 아마추어 무선은 비상시 재난통신망으로도 쓸 수 있다는 것. 절대연도로만 말한다.
  gaze: partner
  topic: 취미로서의 아마추어 무선과 그것을 떠받치는 국제·국내 제도
  briefs:
    초등:
      mc_brief: 무선으로 모르는 사람과 이야기를 나누는 취미가 있다는 점을 신기해하며 도슨트에게 넘긴다. '아마추어'·'무선국' 같은 말은 풀어서 쓴다.
      guard: 법 조항·기관 이름·주파수·출력 숫자는 말하지 않는다.
      docent_brief: 돈을 벌려고가 아니라 그냥 재미있어서 무선으로 멀리 있는 사람과 이야기를 나누는 사람들이 있다는 것, 전화나 인터넷이 끊기는 큰일이 나면 그 사람들의
        무선이 대신 소식을 전해 줄 수 있다는 것. 법 조항·기관 이름·주파수·출력 숫자는 말하지 않는다.
    중고등:
      mc_brief: 취미인데 왜 나라가 자격시험까지 보게 하는지 도슨트에게 묻는다.
      guard: 주파수·출력 수치는 말하지 않는다. 날짜는 말하지 않는다.
      docent_brief: 돈벌이가 아니라 스스로 익히고 기술을 시험해 보려는 목적이라는 점이 아마추어 무선의 정의라는 것, 그래도 전파는 남과 나눠 쓰는 자원이라 나라가 자격을
        확인하고 허가한 뒤에야 쓸 수 있다는 것, 재난으로 통신망이 끊길 때를 대비하도록 국제 규칙이 각국에 권장한다는 것. 영화 '동감'(2000)을 훅으로 써도 좋다 — 연도만
        말하고 날짜는 말하지 않는다. 주파수·출력 수치는 생략한다.
    일반:
      mc_brief: 햄이 정확히 무엇인지, 그리고 취미와 제도가 어떻게 이어지는지 도슨트에게 묻는다.
      guard: '''9개 지역본부'' 같은 기관 수치는 말하지 않는다 — 틀렸고 정정된 숫자도 확인 중이다.'
      docent_brief: 국제전기통신연합(ITU)이 아마추어업무를 '금전적 이익 없이 개인적 관심에서 하는 자기훈련·상호통신·기술연구' 로 정의한다는 것이 핵심 훅. 그래서
        각국이 자격을 검정하고 허가한다는 것, 우리나라는 전파법이 무선설비(전파를 보내거나 받는 전기적 시설)·무선국(무선설비와 그것을 조작하는 자의 총체)·무선종사자(기술자격증을
        받은 사람)를 나눠 규정한다는 것, 국제 규칙이 아마추어국을 재난구호 통신에 대비시키도록 각국에 권장하고 있어 취미가 비상망이 된다는 것. 영화 '동감'(2000)으로
        열어도 좋다. **'9개 지역본부' 같은 기관 수치는 말하지 않는다** — 틀렸고, 정정된 숫자도 확인 중이다.
    전문가:
      mc_brief: 아마추어업무의 국제 정의와 국내 자격 체계가 어떻게 맞물리는지 도슨트에게 묻는다.
      guard: 지방본부 수는 말하지 않는다(미확인).
      docent_brief: RR No. 1.56 의 아마추어업무 정의(self-training·intercommunication· technical investigations,
        without pecuniary interest)를 원문 개념 그대로 말한다. RR 제25조가 그 운용 규칙이라는 것 — 25.6 자격 검증 의무, 25.5 모스 요구
        여부는 각국 재량(WRC-03), 25.7 최대 출력도 각국이 결정, 25.9 송신 중 짧은 간격의 호출부호 송신 의무, 25.2A 뜻을 감추는 부호화 금지, 25.3
        제3자 대리 국제통신은 비상·재난구호에 한정, 25.9A 재난구호 대비 권장. 국내는 전파법 제2조의 무선설비·무선국·무선종사자 정의와 제70조의 자격검정, 시행령 별표
        17 의 네 등급 — 제1급 1 kW 이하, 제2급 200 W 이하, 제3급 100 W 이하(21 MHz 이상 또는 8 MHz 이하), 제4급 10 W 이하(30 MHz
        이상, 모스 제외). 검정 업무가 전파법 제78조제2항에 따라 진흥원(KCA)에 위탁된다는 고리까지 말한다. ITU-R M.1544-1 이 최소 자격 기준의 권고라는 표준번호도
        꺼낼 수 있다.
  mc_emotion: 궁금
  mc_after_emotion: 감탄
  points:
  - answers:
      초등: 돈을 벌려고가 아니라 그냥 재미있어서, 무선으로 멀리 있는 사람과 이야기를 나누는 사람들이 있어요. 그 사람들을 햄이라고 부른답니다.
      중고등: 돈벌이가 아니라 스스로 익히고 기술을 시험해 보려고 하는 무선통신이 아마추어 무선이에요. 그런 무선을 즐기는 사람들을 햄이라고 부르고요.
      일반: 국제전기통신연합은 아마추어업무를 금전적 이익 없이 개인적 관심에서 하는 자기훈련과 상호통신, 기술연구라고 정의해요. 그런 무선을 즐기는 사람을 햄이라고 부르고요.
      전문가: 국제 전파규칙 제1.56조가 아마추어업무를 금전적 이익 없는 자기훈련, 상호통신, 기술연구로 정의해요. 영리 목적이 아니라는 점이 정의의 핵심이고, 운용 규칙은 전파규칙
        제25조가 따로 둡니다.
    answer_emotion: 기쁨
    listener_emotion: 경청
  - ask: 아, 그렇군요. 그런데 취미인데 왜 자격시험까지 봐야 해요?
    ask_emotion: 골똘
    answers:
      초등: 전파는 모두가 나눠 쓰는 거라서, 아무나 마음대로 쓰면 서로 방해가 되거든요. 그래서 잘 쓸 수 있는지 먼저 확인하고 쓰게 해요.
      중고등: 전파는 남과 나눠 쓰는 자원이라 나라가 자격을 확인하고 허가한 뒤에야 쓸 수 있어요. 시험은 방해 없이 제대로 쓰라는 약속인 셈이죠.
      일반: 전파법이 무선설비와 무선국, 무선종사자를 나눠 규정하고 있어요. 전파를 보내거나 받는 시설이 무선설비, 그 설비와 조작하는 사람을 합쳐 무선국, 자격을 받은 사람이
        무선종사자예요.
      전문가: 전파규칙 제25.6조가 각국에 자격 검증 의무를 지우고, 출력 상한은 제25.7조에 따라 각국이 정해요. 우리는 전파법 제70조의 자격검정과 시행령 별표 17의 네
        등급이 있고, 검정 업무는 한국방송통신전파진흥원에 위탁돼 있습니다.
    answer_emotion: 설명
    listener_emotion: 끄덕
  - ask: 그럼 이 취미가 실제로 쓸모 있을 때도 있어요?
    ask_emotion: 궁금
    answers:
      초등: 전화나 인터넷이 끊기는 큰일이 났을 때, 그 사람들의 무선이 대신 소식을 전해 줄 수 있어요. 취미가 이웃을 돕는 일이 되는 거죠.
      중고등: 재난으로 통신망이 끊길 때를 대비하도록 국제 규칙이 각국에 권장하고 있어요. 그래서 평소의 취미가 비상시에는 통신망이 되기도 해요.
      일반: 국제 규칙이 아마추어국을 재난구호 통신에 대비시키도록 각국에 권장하고 있어요. 그래서 평소엔 취미지만, 통신망이 끊긴 상황에서는 실제 비상망이 되죠.
      전문가: 전파규칙 제25.9A조가 재난구호 대비를 권장하고, 제25.3조는 제3자 대리 국제통신을 비상과 재난구호에 한정해요. 취미로 운영되는 무선국이 제도 안에서 비상망으로
        자리 잡은 셈입니다.
    answer_emotion: 뿌듯
    listener_emotion: 놀람
- id: 11-iot
  title: 사물인터넷
  mc: 다음 주제는 사물인터넷이에요. 도슨트, 사물인터넷이 뭐예요?
  mc_after: 물건들끼리 서로 말을 걸다니 신기하네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 사람·사물·공간이 모두 인터넷으로 연결돼 정보를 공유·활용하는 초연결 인터넷이라는 것, 전시된 전구를 태블릿으로 밝기와 색상을 바꿀 수 있다는 것, 지금은
    무선으로 불을 켜고 끄는 정도지만 5G와 접목되면 지연과 동시접속 한계가 줄어 원격·협력 제어의 여지가 커진다는 것.
  gaze: audience
  topic: 사물인터넷이란 무엇이며 5G 가 그것을 어디까지 바꾸는가
  briefs:
    초등:
      mc_brief: 물건들끼리 서로 이야기를 주고받는다는 상상으로 호기심을 열고 도슨트에게 넘긴다. '사물인터넷' 이라는 말은 써도 되지만 풀어서 설명해 달라고 부탁한다.
      guard: 숫자·연도·표준 이름은 말하지 않는다. 전시된 기기로 무엇을 할 수 있는지 단정하지 않는다.
      docent_brief: 전등·시계·자동차 같은 물건들이 인터넷으로 서로 연결돼서 서로에게 말을 걸 수 있게 됐다는 것, 그래서 멀리서도 물건을 켜고 끄고 상태를 알 수 있다는
        것. 비유 중심으로. 숫자·연도·표준 이름은 말하지 않는다.
    중고등:
      mc_brief: 인터넷에 연결되는 것이 컴퓨터와 휴대폰만은 아니라는 점을 짚고 도슨트에게 넘긴다.
      guard: '''5G가 되면 완전 자율주행''이라고 하지 않는다. 연도만 말하고 구체 수치는 말하지 않는다.'
      docent_brief: 사물인터넷은 사물에 통신 기능을 붙여 서로 연결하고 그 데이터로 서비스를 만드는 것이라는 원리. 핵심 훅은 '사람이 일일이 입력하지 않아도 사물이
        스스로 상태를 알린다' 는 대비. 5G 이야기를 꺼낼 때는 '기기를 훨씬 많이, 훨씬 빠른 응답으로 연결할 수 있게 설계된 세대' 까지만 — **완전 자율주행이 된다고
        말하지 않는다.** 연도만 말하고 구체 수치는 말하지 않는다.
    일반:
      mc_brief: 체험관에서 직접 만져볼 수 있는 사물인터넷이 무엇인지 도슨트에게 묻는다.
      guard: '''5G가 되면 완전 자율주행''이라는 인과는 말하지 않는다. 연결 기기 수는 말하지 않는다 — 집계 기준이 출처마다 다르다.'
      docent_brief: 국제 표준(ITU)의 정의는 사물을 서로 연결해 진보된 서비스를 가능하게 하는 글로벌 인프라라는 것, 이 정의에서 '사물' 은 물리적인 것뿐 아니라
        가상의 것도 포함한다는 것, 5G 는 이 사물들을 훨씬 촘촘하게(1제곱킬로미터에 백만 대 규모) 훨씬 빠른 응답으로(밀리초 단위) 연결하는 것을 목표로 설계된 세대라는
        것. 수치는 개략으로만. **'5G 가 되면 완전 자율주행' 이라는 인과는 말하지 않는다** — 자율주행 수준은 차량이 스스로 무엇을 하느냐로 정해지고 통신은 이를 돕는
        쪽이라는 정도로 정리한다.
    전문가:
      mc_brief: 표준 정의와 5G 의 사용 시나리오 구분을 전제로 깔고, IoT 가 그중 어디에 해당하는지 도슨트에게 묻는다.
      guard: 지연·연결밀도 값에는 조건을 반드시 함께 말한다. 요구조건이 특정 응용의 달성을 뜻한다고 말하지 않는다. 전시 기기의 프로토콜은 단정하지 않는다.
      docent_brief: ITU-T Y.4000/Y.2060(2012-06)의 IoT 정의와 thing/device 구분을 그대로 말한다. IMT-2020 의 세 사용 시나리오(eMBB·URLLC·mMTC)
        중 IoT 에 대응하는 것은 mMTC 와 URLLC 이며, Report ITU-R M.2410-0 의 최소 요구조건이 연결밀도 100만 대/km2(mMTC), 사용자평면
        지연 URLLC 1 ms·eMBB 4 ms, 제어평면 지연 20 ms, URLLC 신뢰도 32바이트 L2 PDU 를 1 ms 안에 1 − 10^-5 성공확률이라는 것.
        **조건을 반드시 함께 말한다** — 지연 값은 무부하·단일 사용자· 소형 IP 패킷 가정의 무선 구간 편도 기여분이고, 연결밀도는 제한된 대역폭과 TRxP 수 조건이다.
        끝으로 이 요구조건들은 성능 목표이지 특정 응용(완전 자율주행)의 달성을 규정하지 않는다는 점을 분명히 한다.
  mc_emotion: 궁금
  mc_after_emotion: 감탄
  points:
  - answers:
      초등: 전등이나 시계, 자동차 같은 물건들이 인터넷으로 서로 연결된 거예요. 그래서 물건들끼리 서로 말을 걸 수 있게 됐답니다.
      중고등: 사물에 통신 기능을 붙여 서로 연결하고, 거기서 모인 정보로 서비스를 만드는 걸 사물인터넷이라고 해요. 물건이 인터넷에 접속하는 셈이죠.
      일반: 국제 표준에서는 사물을 서로 연결해 진보된 서비스를 가능하게 하는 글로벌 인프라라고 정의해요. 이때 사물은 물리적인 것뿐 아니라 가상의 것도 포함하고요.
      전문가: 국제 표준 ITU-T Y.4000이 사물인터넷을 정보사회를 위한 글로벌 인프라로 정의해요. 물리적 사물과 가상 사물을 구분하고, 기기는 통신 기능을 가진 장치로 따로
        규정합니다.
    answer_emotion: 설명
    listener_emotion: 경청
  - ask: 아, 그렇군요. 그럼 우리한테 뭐가 좋아지는 거예요?
    ask_emotion: 끄덕
    answers:
      초등: 멀리 있어도 물건을 켜고 끄고, 지금 어떤지 알 수 있어요. 집에 가지 않아도 전등을 끌 수 있는 거죠.
      중고등: 사람이 일일이 입력하지 않아도 사물이 스스로 상태를 알린다는 게 가장 큰 차이예요. 그래서 멀리서도 켜고 끄거나 상태를 확인할 수 있고요.
      일반: 사람이 하나하나 확인하지 않아도 사물이 스스로 상태를 알려 준다는 점이에요. 그 정보를 모아 관리하거나 자동으로 반응하게 만들 수도 있고요.
      전문가: 사람의 개입 없이 사물이 상태를 보고하고 제어되는 구조라는 점이에요. 표준도 이를 사물 간 통신과 그 위의 서비스 계층으로 나눠 규정하고요. 사람이 아니라 사물이
        데이터의 출발점이 되는 셈입니다.
    answer_emotion: 기쁨
    listener_emotion: 기쁨
  - ask: 5세대 이동통신이랑도 관계가 있어요?
    ask_emotion: 골똘
    answers:
      초등: 네, 5세대 이동통신은 한꺼번에 아주 많은 물건을 연결할 수 있게 만들어졌어요. 그래서 앞으로 더 많은 물건이 서로 이야기하게 될 거예요.
      중고등: 5세대는 기기를 훨씬 많이, 훨씬 빠른 응답으로 연결할 수 있게 설계된 세대예요. 다만 5세대가 됐다고 뭐든 저절로 되는 건 아니고요.
      일반: 5세대는 사물을 훨씬 촘촘하게, 1제곱킬로미터에 백만 대 규모로 연결하고 응답도 밀리초 단위로 빠르게 하는 걸 목표로 설계됐어요. 다만 그건 성능 목표이지 자율주행의
        달성을 뜻하진 않고요.
      전문가: 5세대 요구조건 가운데 사물인터넷에 대응하는 건 대규모 기기 연결과 초저지연이에요. 연결밀도 1제곱킬로미터당 백만 대, 사용자평면 지연 1밀리초인데, 무부하 단일
        사용자 가정의 무선 구간 값이라는 조건이 붙습니다.
    answer_emotion: 설명
    listener_emotion: 끄덕
- id: 12-multimedia
  title: KCA 멀티미디어실
