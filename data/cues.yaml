- id: 01-intro
  title: 체험관 개요
  mc: 안녕하세요, 전파체험관 이야기 시간에 오신 것을 환영합니다. 오늘 진행은 제가, 해설은 제 옆의 도슨트가 맡습니다. 도슨트, 먼저 이 체험관이 어떤 곳인지 소개해 줄래요?
  mc_after: 네, 소개 고마워요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: KCA가 방송·통신·전파 분야의 교육·홍보, 자료 보존, 연구를 위해 세운 곳이고 2020년 11월에 개관했다는 것. 상대연도('몇 년 전')를 쓰지 말고
    절대연도로만 말한다.
  gaze: partner
  topic: KCA 설립 목적과 전파체험관의 성격
  briefs:
    초등:
      mc_brief: 전파를 눈으로 볼 수 있는 곳에 왔다는 것을 반갑게 알리고, 옆의 도슨트에게 이 체험관이 어떤 곳인지 물어본다. 어려운 기관 이름은 쓰지 않는다.
      docent_brief: 전파는 눈에 안 보이지만 우리가 매일 쓰고 있다는 것, 전파체험관은 그 보이지 않는 전파를 보고 만질 수 있게 만든 곳이라는 것. 기관 이름·법 조항·연도는
        말하지 않는다.
    중고등:
      mc_brief: 전파를 다루는 공공기관이 만든 체험관이라는 점을 짚고 도슨트에게 소개를 넘긴다.
      docent_brief: 전파는 국가가 관리하는 공공 자원이라는 점이 핵심 훅. 체험관을 만든 기관이 전파를 관리하고 관련 산업과 인력을 키우는 일을 한다는 것. 법 조항
        번호는 생략한다.
    일반:
      mc_brief: 체험관과 운영 기관을 간단히 소개하고 도슨트에게 넘긴다.
      docent_brief: KCA 가 전파의 효율적 관리와 방송·통신·전파 진흥, 인력양성을 위해 설립된 기관이라는 것과, 전파를 직접 체험할 수 있게 만든 곳이 이 체험관이라는
        것. 2020년 11월에 개관했다는 것. 날짜(며칠)는 말하지 않는다.
    전문가:
      mc_brief: 설립 근거와 사업 범위를 전제로 깔고, 체험관이 그중 어디에 해당하는지 도슨트에게 묻는다.
      docent_brief: 전파법 제66조가 설립 근거라는 것, 사업이 방송통신융합 산업진흥·ICT기금 운용·전파산업진흥·전파자원관리 넷으로 나뉜다는 것, 체험관은 그중 진흥·인력양성
        기능의 대국민 접점이라는 것. 기관명과 조항을 그대로 말해도 된다.
- id: 02-history
  title: 전파의 발견 역사
  mc: 첫 주제는 전파의 발견 역사입니다. 도슨트, 전파는 발명일까요, 발견일까요?
  mc_after: 발명이 아니라 발견이라니, 저도 처음엔 헷갈렸어요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 전파는 발명이 아니라 발견이라는 대비가 핵심 훅. 1785년에 존재가 처음 발견됐고, 1901년 마르코니가 영국에서 캐나다까지 1600마일 떨어진 곳으로
    모스 신호를 보내 장거리 무선전신에 성공했다는 것.
  gaze: partner
  topic: 전파는 발명인가 발견인가 — 맥스웰·헤르츠·마르코니
  briefs:
    초등:
      mc_brief: 전파를 누가 만들었을까 하는 질문으로 호기심을 열고 도슨트에게 넘긴다.
      docent_brief: 전파는 사람이 만든 게 아니라 원래 있었는데 사람이 찾아낸 것이라는 대비가 핵심 훅. 먼저 머리로 '있을 거야' 라고 알아낸 사람이 있었고, 나중에
        실험으로 진짜 있다는 걸 보여준 사람이 있었다는 순서만. 인명·연도·거리는 말하지 않는다.
      points:
        - 전파는 사람이 만든 게 아니라 원래 있었는데 사람이 찾아낸 것
        - 먼저 머리로 '있을 거야' 라고 알아낸 사람이 있었고, 나중에 실험으로 진짜 있다는 걸 보여준 사람이 있었다는 것
    중고등:
      mc_brief: 전파는 발명인지 발견인지 도슨트에게 묻는다.
      docent_brief: 발명이 아니라 발견이라는 대비가 핵심 훅. 맥스웰이 수식으로 존재를 예언하고 헤르츠가 실험으로 증명했으며, 마르코니가 그것을 통신에 써먹었다는 세
        단계. 1901년 대서양 횡단 수신까지. 거리는 약 3,500km 로만 말한다.
      points:
        - 전파는 발명이 아니라 발견이라는 대비
        - 맥스웰이 수식으로 존재를 예언하고 헤르츠가 실험으로 증명했으며, 마르코니가 그것을 통신에 써먹었다는 세 단계
        - 1901년 마르코니의 대서양 횡단 수신, 거리는 약 3,500km
    일반:
      mc_brief: 전파는 발명인지 발견인지 도슨트에게 묻고, 답이 의외라는 반응을 준비한다.
      docent_brief: 발명이 아니라 발견이라는 대비가 핵심 훅. 맥스웰의 이론적 예언 → 헤르츠의 실험적 증명 → 마르코니의 실용화라는 세 단계. 1901년 12월 12일
        폴듀에서 보낸 모스 부호를 대서양 건너편에서 약 3,500km 떨어져 수신했다는 것. '캐나다' 라고 말하지 않는다 — 당시 뉴펀들랜드는 영국 식민지였다.
      points:
        - 전파는 발명이 아니라 발견이라는 대비
        - 맥스웰의 이론적 예언 → 헤르츠의 실험적 증명 → 마르코니의 실용화라는 세 단계
        - 1901년 12월 12일 마르코니가 폴듀에서 보낸 모스 부호를 대서양 건너 약 3,500km 떨어진 곳(당시 영국 식민지 뉴펀들랜드)에서 수신했다는 것
    전문가:
      mc_brief: 이론·실험·실용화의 분리를 전제로 깔고, 발견의 주체가 누구냐고 도슨트에게 묻는다.
      docent_brief: 맥스웰 방정식의 예언, 헤르츠의 결정적 실험 증명, 마르코니의 실용 무선전신과 1909년 노벨상(브라운 공동 수상). 1901년 12월 12일 연
        안테나로 폴듀 → 세인트존스 약 2,200마일(3,500km) 수신 보고. **그 수신의 진위가 지금도 기술적 논쟁의 대상**이라는 점까지 말한다. 1785년 쿨롱 법칙은
        전자기학의 출발점이지 전파의 발견이 아니라는 구분도 짚는다.
      points:
        - 맥스웰 방정식의 예언과 헤르츠의 결정적 실험 증명
        - 마르코니의 실용 무선전신과 1909년 노벨상(브라운 공동 수상)
        - 1901년 12월 12일 연 안테나로 폴듀에서 세인트존스까지 약 2,200마일(3,500km) 수신 보고, 그 진위가 지금도 기술적 논쟁의 대상이라는 것
        - 1785년 쿨롱 법칙은 전자기학의 출발점이지 전파의 발견이 아니라는 구분
- id: 03-theory
  title: 전파 이론 — 주파수와 파장
  mc: 그럼 전파가 정확히 무엇인지 원리로 들어가 보죠. 도슨트, 주파수와 파장을 쉽게 풀어 주세요.
  mc_after: 보이지 않는 것을 이렇게 풀어 주시니 훨씬 가깝게 느껴지네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 전파는 전기와 자기가 파동의 형태로 퍼져나가는 것이고 볼 수도 만질 수도 없다는 것. '퐁당퐁당'처럼 돌로 일으킨 물결이 건너편 손등에 닿는 비유를 쓴다.
    단위는 주파수, 표기는 헤르츠 — 1초에 1회 진동하면 1헤르츠, 1000회면 1킬로헤르츠.
  gaze: partner
  topic: 전파란 무엇인가 — 주파수·파장·헤르츠, 그리고 둘의 반비례 관계
  briefs:
    초등:
      mc_brief: '''그런데 전파가 도대체 뭐예요?'' 하고 아이들 대신 궁금해하는 투로 묻고 도슨트에게 넘긴다. 주파수·파장 같은 말은 사회자가 먼저 쓰지 않는다.'
      docent_brief: 전파는 눈에 보이지도 만져지지도 않는 '보이지 않는 물결' 이라는 것, 연못에 돌을 던지면 물결이 건너편까지 닿듯 전파도 멀리까지 퍼져 간다는 비유가
        핵심 훅. 그 물결이 빠르게 출렁이기도 하고 느리게 출렁이기도 한다는 것까지만. **숫자·단위·사람 이름·연도는 하나도 말하지 않는다.** ⚠️ 물결 비유를 쓰되 '물이
        있어야 간다'는 인상을 주지 않는다 — 전파는 아무것도 없는 텅 빈 곳도 지나간다고 한마디 덧붙인다.
    중고등:
      mc_brief: 전파의 정체를 원리로 들어가 보자고 예고하고, 주파수와 파장이 무엇인지 도슨트에게 묻는다.
      docent_brief: 전파는 전기와 자기가 서로를 밀어 주며 퍼져 나가는 전자기파의 한 갈래라는 것. 1초에 몇 번 출렁이느냐가 주파수이고 그 단위가 헤르츠인데, 그 이름이
        **앞에서 나온 헤르츠**에서 왔다는 연결이 핵심 훅. 한 번 출렁이는 동안 파동이 나아간 거리가 파장이고, 빨리 출렁일수록(주파수가 높을수록) 파장은 짧아진다는 반비례
        관계. 소리와 달리 전파는 진공에서도 간다는 대비를 한마디. 연도 외의 수치는 말하지 않는다.
    일반:
      mc_brief: 전파가 정확히 무엇인지 원리로 들어가 보자고 예고하고, 주파수와 파장을 쉽게 풀어 달라고 도슨트에게 청한다.
      docent_brief: 전파는 전자기파(electromagnetic wave)의 한 갈래로, 매질 없이 공간을 스스로 퍼져 나간다는 것 — 소리는 공기가 있어야 들리지만
        전파는 진공에서도 간다는 대비가 핵심 훅. 1초당 진동 횟수가 **주파수**(물리량)이고 그 **단위**가 헤르츠(Hz)이며, 1초에 1,000번이면 1킬로헤르츠라는 것.
        파동이 한 번 진동하는 동안 나아간 거리가 **파장**이고, 파장 = 빛의 속도 ÷ 주파수 이므로 주파수가 높을수록 파장은 짧아진다는 반비례. 개략 수치는 '100메가헤르츠짜리
        FM 라디오 전파의 파장이 약 3미터' 하나만 든다 — 다른 대역의 파장을 즉석에서 만들어 내지 않는다.
    전문가:
      mc_brief: 전파가 물리 현상이면서 동시에 법으로 정의된 대상이기도 하다는 점을 전제로 깔고, 정의와 관계식을 도슨트에게 청한다.
      docent_brief: 「전파법」 제2조제1항제1호가 전파를 '인공적인 유도 없이 공간에 퍼져 나가는 전자파로서 국제전기통신연합이 정한 범위의 주파수를 가진 것'으로 정의한다는
        것 — 즉 전파는 물리 개념이자 법적 개념이라는 이중성이 핵심 훅. 법이 주파수 범위를 직접 정하지 않고 ITU 에 위임했고, ITU 전파규칙(RR) No. 1.5 가
        그 범위를 '3,000GHz 보다 임의로 낮은 주파수'로 잡는다는 것. λ = c / f 이며 c 는 진공에서 정확히 299,792,458 m/s 인데, 이것이 측정값이
        아니라 **미터의 SI 정의가 c 를 고정했기 때문에** 정확한 값이라는 것. 헤르츠는 SI 유도단위 s⁻¹ 이고 주기적 현상에만 쓴다는 것. 물리학 관례의 전파 상한(약
        300GHz, 파장 1mm)과 ITU 규정 상한(3,000GHz)이 서로 다르다는 점까지 짚는다. 조항 번호와 표준 번호를 그대로 말해도 된다. ⚠️ 국내 고시(「대한민국
        주파수 분배표」)의 구체적 상·하한 수치는 미확인이므로 말하지 않는다.
- id: 04-morse
  title: 전파이야기 체험 — 모스부호·헤르츠 실험·라이덴 병
  mc: 체험관에는 직접 만져볼 수 있는 장치들도 있다고 들었어요. 도슨트, 전파이야기 체험존에서는 무엇을 해볼 수 있나요?
  mc_after: 모스부호를 직접 쳐볼 수 있다니 재미있겠어요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 모스부호 변환기(문구를 넣으면 부호가 표시되고 송신키로 직접 쳐볼 수 있음), 헤르츠 실험 도구(스위치를 켜면 구리판으로 고전압이 흘러 전파가 발사되고 원형
    고리에서 검출돼 네온전구가 켜짐), 라이덴 병(정전기를 저장하는 최초의 축전지).
  gaze: audience
  topic: 점과 선의 약속, 불꽃으로 만든 전파, 전기를 담는 병
  briefs:
    초등:
      mc_brief: 직접 만져보고 쳐볼 수 있는 것들이 있다는 걸 신나게 알리고, 무엇을 해볼 수 있는지 도슨트에게 묻는다. 장치 이름을 줄줄이 늘어놓지 않는다.
      docent_brief: 점과 선 두 가지만으로 글자를 만들어 보내는 약속이 모스 부호라는 것이 핵심 훅 — 짧게 '똑', 길게 '뚜우' 두 소리로 편지를 쓰는 셈이라는 비유를
        쓴다. 그리고 그걸 체험존에서 직접 손으로 쳐볼 수 있다는 것. 인명·연도·숫자·표준 이름은 말하지 않는다.
    중고등:
      mc_brief: 만져볼 수 있는 체험 장치가 있다는 것을 짚고, 무엇을 해볼 수 있는지 도슨트에게 넘긴다.
      docent_brief: 모스 부호가 점과 선의 **길이 차이**로 글자를 표현하고, 자주 쓰는 글자일수록 짧은 부호를 받았다는 설계가 핵심 훅 — 영어에서 가장 흔한 E
        가 점 하나다. 한글에도 전신 부호가 있고 김학우가 만들었다는 것. 헤르츠는 불꽃을 튀겨 전파를 만들고 떨어진 고리에서 그 전파를 받아 존재를 확인했다는 것. 연도는 1844년(첫
        사용)과 1887년(헤르츠의 불꽃간극 송신기) 정도만 말하고 수치는 넣지 않는다.
    일반:
      mc_brief: 체험관에 직접 만져볼 수 있는 장치가 있다는 것을 언급하고, 전파이야기 쪽에서 무엇을 해볼 수 있는지 도슨트에게 묻는다.
      docent_brief: 모스 부호가 모스 혼자의 작품이 아니라는 것이 핵심 훅 — 동료 앨프리드 베일이 알파벳 코드로 확장했고, 지금 쓰는 국제 모스 부호는 1848년 게르케의
        개량을 거쳐 1865년에 국제 표준이 됐다. 자주 쓰는 글자에 짧은 부호를 준 설계(E 는 점 하나)와, SOS 는 세 글자가 아니라 끊지 않고 이어 치는 하나의 신호라는
        것. 헤르츠는 유도코일로 만든 고전압을 불꽃 간극에 튀겨 전파를 쏘고, 떨어진 고리 안테나의 미세한 불꽃으로 그것을 받았다는 것. 라이덴 병은 1745년에 발견된 **축전기(콘덴서)의
        원형** 이라는 것 — '축전지' 라고 말하지 않는다. 헤르츠가 그 방전 실험에서 장치의 실마리를 얻었다는 연결까지.
    전문가:
      mc_brief: 이론이 실험 장치로 내려오는 지점이라는 전제를 깔고, 이 체험이 무엇을 재현하는 것인지 도슨트에게 묻는다.
      docent_brief: 국제 모스 부호의 현행 표준이 ITU-R 권고 M.1677-1(2009년 10월)이고, 타이밍이 선=점 셋 / 글자 안 간격=점 하나 / 글자 사이=점
        셋 / 낱말 사이=점 일곱으로 규정돼 있다는 것. s=··· , o=--- 이고 SOS 는 글자 간격 없이 이어 치는 프로사인이며 1906년 11월 3일 제1차 국제무선전신협약에서
        채택돼 1908년 7월 1일 발효했다는 것. 지금의 국제 부호는 1848년 게르케의 '함부르크 알파벳' 에서 나와 1865년 5월 17일 파리 국제전신협약에서 표준화됐고
        그 회의가 ITU 의 전신을 만들었으며, 모스·베일 원본과 부호가 같은 글자는 E·H·K·N 넷뿐이라는 것. 헤르츠는 1886년 가을 카를스루에에서 리스 나선에 라이덴
        병을 방전시키다 착상했고, 룸코르프 유도코일의 5~30 kV 펄스로 1 m 쌍극자의 불꽃 간극을 때려 50~450 MHz 를 발생시켰으며 마이크로미터 불꽃 간극이 달린
        공진 고리로 수신했다는 것. 아연 반사판을 12 m 떨어뜨려 파장 약 4 m 의 정상파를 만들어 반사·굴절·회절·편광·간섭과 빛과 같은 전파 속도를 보였다는 것. 라이덴
        병은 폰 클라이스트(1745년 10월 11일)와 뮈스헨브룩·쿠나에우스(1745~46, 라이던)가 독립 발견한 축전기의 원형이고 20세기 전환기 불꽃간극 송신기에 널리 쓰였다는
        것. **'전기가 아닌 정전기' 라는 표현은 쓰지 않는다** — 정전기도 전기다.
- id: 05-donor
  title: 기증자 — 장황남 박사
  mc: 이 체험관 정식 이름에는 사람 이름이 하나 들어 있습니다. 도슨트, 장황남 박사가 누구인지 소개해 주세요.
  mc_after: 의사가 통신 장비를 모았다는 게 뜻밖이죠. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 체험관 정식 명칭에 이름이 들어간 기증자라는 것과, 원장 §5 에 적힌 생애·기증 내역을 그대로 옮긴다. 상대연도('몇 년 전')를 쓰지 않고 절대연도로만
    말한다. 원장에 없는 사실을 덧붙이지 않는다.
  gaze: partner
  topic: 의사가 평생 모은 통신기기를 기증했다는 대비
  briefs:
    초등:
      mc_brief: 이 많은 물건을 한 사람이 모아서 주었다는 사실에 놀라는 반응으로 열고, 그 사람이 누구인지 도슨트에게 묻는다. 어려운 직업 이름이나 학교 이름은 쓰지 않는다.
      docent_brief: 병을 고치는 의사 선생님이 통신 기계를 좋아해서 아주 오랫동안 하나씩 모았고, 그걸 혼자 갖지 않고 우리가 볼 수 있게 내놓았다는 것이 핵심 훅.
        이름은 장황남이라는 것까지만. 연도·숫자·호출부호·학교 이름은 말하지 않는다. **'의학박사' 라고 하지 않고 '의사' 라고 한다.**
    중고등:
      mc_brief: 전시품이 한 사람의 기증에서 나왔다는 점을 짚고 그 사람을 도슨트에게 묻는다.
      docent_brief: 본업이 전파가 아닌 사람이 평생 통신 장비를 모았다는 대비가 핵심 훅. 전남 완도에서 태어나 의과대학을 다녔고, 1963년 전남에서 처음으로 아마추어
        무선국을 연 사람이라는 것. 1972년 미국으로 건너가 의사로 일하면서 수집을 이어갔고, 모은 것을 기증해 2014년 조선대학교에 그의 이름을 딴 정보통신박물관이 세워졌다는
        것. 연도는 1963·1972·2014 만 쓰고 수량은 말하지 않는다. **'의학박사' 가 아니라 '의사' 다. '동아리' 라고 하지 않는다 — 본인이 무선국을 열었다.**
    일반:
      mc_brief: 체험관의 전시품 상당수가 한 사람의 기증이라는 점을 언급하고, 장황남이 누구인지 도슨트에게 소개를 청한다.
      docent_brief: 전파·통신이 본업이 아닌 의사가 평생 통신 장비를 모았다는 대비가 핵심 훅. 전남 완도 출생, 광주고등학교와 전남의과대학을 나왔고 전남의대 약리학교실에서
        석사과정을 마쳤다는 것. 1963년 전남 최초의 아마추어 무선 통신사로 자기 무선국을 운영했고(호출부호 HM4DF), 1972년 미국으로 이주해 뉴욕주 뉴어크에서 내과를
        개업하며 수십 년에 걸쳐 수집을 이어갔다는 것. 그 수집품 4천5백여 점을 조선대학교에 기증해 2014년 9월 30일 **장황남정보통신박물관** 이 문을 열었다는 것.
        **4,500여 점은 조선대학교 기증분이다 — 이 체험관 전시품 수와 섞지 않는다.** 생몰년·학위·기증 동기는 확인되지 않았으므로 말하지 않는다.
    전문가:
      mc_brief: 수집가 한 사람의 컬렉션이 공공 전시로 옮겨간 사례라는 전제를 깔고, 그 인물의 이력을 도슨트에게 묻는다.
      docent_brief: 핵심은 아마추어 무선(HAM)이 전문가와 비전문가의 경계를 허문 경로였다는 것. 전남 완도 출생, 광주고등학교·전남의과대학 졸업, 전남의대 약리학교실
        석사과정 수료. 1963년 전남 최초의 아마추어 무선 통신사로 호출부호 HM4DF(HL 이전에 한국에 배정됐던 접두사) 무선국을 운영했다는 것. 군 복무 후 1972년
        도미, 뉴욕주 뉴어크에서 내과를 개업하고 병원 과장·의사협회장을 역임했으며 미국 아마추어 무선 잡지 QST 에 기술 기사가 실렸다는 것. 1920년대부터 최근까지를 아우르는
        유무선 정보통신기기 4천5백여 점을 조선대학교에 기증해 구 대학원 건물을 리모델링한 **장황남정보통신박물관** 이 2014년 9월 30일 개관했다는 것. 수집 기간은 출처가
        30여 년(조선대)과 40년(언론)으로 갈리므로 숫자를 말하지 않는다. **박사학위·생몰년은 출처가 없어 말하지 않고, 호칭은 '의사' 로 한다.**
- id: 06-bands
  title: 주파수 대역별 기증품 — 초장파에서 밀리미터파까지
  mc: 그 기증품을 주파수 대역별로 둘러볼 차례입니다. 도슨트, 어떤 대역의 장비들이 전시돼 있나요?
  mc_after: 초장파부터 밀리미터파까지, 범위가 정말 넓네요. 어느 대역이 제일 궁금하신가요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: ITU가 전파를 낮은 주파수부터 높은 주파수까지 10개 대역으로 분류하는데 체험관에는 그중 8개 대역 장비가 전시돼 있다는 것, 대역 이름은 파장 길이(100km~1mm)와
    연관된다는 것. 1920년 제작 진공관 라디오 'Masterpiece'나 1980년대 무선호출기(삐삐) 같은 구체적인 전시품을 한두 개 예로 들어도 좋다. 원장 표에 없는 대역
    성질은 지어내지 않는다. 절대연도로만 말한다.
  gaze: audience
  topic: ITU 주파수 대역 구분과 대역별 전시 장비
  briefs:
    초등:
      mc_brief: 전파에도 여러 종류가 있다는 사실에 놀라는 반응으로 열고, 이 코너에 무엇이 놓여 있는지 도슨트에게 묻는다. '주파수'·'대역' 같은 말은 쓰지 않는다.
      docent_brief: 전파에는 아주 길게 출렁이는 것부터 아주 짧게 떨리는 것까지 여러 종류가 있고, 길이가 다르면 잘하는 일도 다르다는 것. 이 코너에 놓인 기계들은
        서로 다른 종류의 전파를 쓰던 옛날 기계라는 것. 숫자·기호·기관 이름은 하나도 말하지 않는다. 비유는 '아주 긴 파' 와 '쌀알만큼 짧은 파' 정도까지만 — 거리 비유를
        지어내지 않는다.
      points:
        - 전파에는 아주 길게 출렁이는 것부터 아주 짧게 떨리는 것까지 여러 종류가 있고, 길이가 다르면 잘하는 일도 다르다는 것
        - 이 코너에 놓인 기계들은 서로 다른 종류의 전파를 쓰던 옛날 기계라는 것
    중고등:
      mc_brief: 전파를 왜 굳이 여러 대역으로 나눠 놓았는지 도슨트에게 묻는다.
      docent_brief: 주파수가 낮을수록 파장이 길고 장애물을 돌아 멀리 가며, 높을수록 파장이 짧고 곧게 나아간다는 대비가 핵심 훅. 성질이 다르니 국제기구가 구간을 나누고
        쓰임새를 정해 뒀다는 것, 전시된 기계들이 그 서로 다른 구간을 쓰던 것들이라는 것. **대역이 몇 개인지는 말하지 않는다** — 세는 기준마다 달라서 지금 큐시트 숫자가
        틀렸다. 정확한 주파수 값도 생략한다.
      points:
        - 주파수가 낮을수록 파장이 길고 장애물을 돌아 멀리 가며, 높을수록 파장이 짧고 곧게 나아간다는 대비
        - 성질이 다르니 국제기구가 구간을 나누고 쓰임새를 정해 뒀다는 것
        - 전시된 기계들이 그 서로 다른 구간을 쓰던 것들이라는 것
    일반:
      mc_brief: 전시가 주파수 순서로 늘어서 있다는 점을 짚고, 양쪽 끝이 무엇인지 도슨트에게 묻는다.
      docent_brief: 국제전기통신연합(ITU)이 전파를 주파수 순서로 구간을 나누고 이름을 붙였다는 것, 이 전시의 낮은 쪽 끝이 초장파(VLF)이고 높은 쪽 끝이 밀리미터파(EHF)
        라는 것, 그 사이가 파장으로 100킬로미터에서 1밀리미터까지라는 것, 파장이 길수록 멀리 돌아가고 짧을수록 직진한다는 것. **'10개 대역' 이라고 말하지 않는다**
        — ITU 무선규칙 표는 9개, ITU-R 권고 V.431 표는 13개다. 개수 대신 '낮은 쪽부터 높은 쪽까지' 로 말한다. 전시품 개수·연도는 현장 확인 전이므로 단정하지
        않는다.
      points:
        - 국제전기통신연합(ITU)이 전파를 주파수 순서로 구간을 나누고 이름을 붙였다는 것
        - 이 전시의 낮은 쪽 끝이 초장파(VLF)이고 높은 쪽 끝이 밀리미터파(EHF), 그 사이가 파장으로 100킬로미터에서 1밀리미터까지라는 것
        - 파장이 길수록 멀리 돌아가고 짧을수록 직진한다는 것
    전문가:
      mc_brief: 대역 구분의 근거 문서가 무엇인지, 그리고 명명 체계가 하나인지 도슨트에게 묻는다.
      docent_brief: ITU-R 권고 V.431-8 Table 1 이 대역번호 3(ULF, 300~3,000 Hz)부터 15(300~3,000 THz)까지를 정의하고,
        무선규칙(RR) No. 2.1 의 표는 그중 4번(VLF, 3~30 kHz)부터 12번(300~3,000 GHz)까지를 싣는다는 것. Note 1 의 규칙 '대역번호 N
        은 0.3×10^N Hz ~ 3×10^N Hz' 를 그대로 말해도 된다. 전시 범위인 VLF(4번)~EHF(11번)는 8개 대역, 주파수 3 kHz~300 GHz, 파장
        100 km~1 mm 라는 것. **명명 체계가 둘**이라는 점을 반드시 짚는다 — VLF/LF/MF/HF/VHF/UHF/SHF/EHF 는 주파수 기준 기호이고 미리어미터파·킬로미터파·…·밀리미터파는
        파장 기준 이름이라, '초장파에서 밀리미터파까지' 는 두 계열을 섞은 표현이다. 한국어 중파·단파·초단파의 주파수 범위는 전파법 시행령 제2조에 그대로 있다는 것도 덧붙일
        수 있다. '10개 대역' 은 근거가 없으니 쓰지 않는다.
      points:
        - ITU-R 권고 V.431-8 Table 1이 대역번호 3(ULF, 300~3,000 Hz)부터 15(300~3,000 THz)까지를 정의하고, 무선규칙(RR) No. 2.1의 표는 4번(VLF)부터 12번(300~3,000 GHz)까지를 싣는다는 것
        - 전시 범위인 VLF(4번)~EHF(11번)는 8개 대역, 주파수 3 kHz~300 GHz, 파장 100 km~1 mm 라는 것
        - 명명 체계가 둘이라는 점 — VLF/LF/MF/HF/VHF/UHF/SHF/EHF 는 주파수 기준 기호이고, 미리어미터파부터 밀리미터파까지는 파장 기준 이름이라는 것
        - 한국어 중파·단파·초단파의 주파수 범위는 전파법 시행령 제2조에 그대로 있다는 것
- id: 07-maritime
  title: 해상무선통신
  mc: 이번 주제는 바다 위의 무선통신입니다. 도슨트, 타이타닉호 이야기를 들려주세요.
  mc_after: 마지막까지 구조 신호를 보낸 전신기사 이야기가 뭉클하네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 1912년 4월 타이타닉호가 침몰할 때 전신기사 잭 필립스가 죽는 순간까지 모스부호로 구조를 요청했고, 세 시간 거리에 있던 여객선이 이를 듣고 695명을
    구조했다는 것. 이 사고가 계기가 되어 국제해상조난안전시스템(GMDSS)이 만들어졌고 1992년에 도입됐다는 것. 절대연도로만 말한다. '바다에 빠진 사람'처럼 구조 대상을 단정하는
    수식어는 쓰지 않는다.
  gaze: partner
  topic: 타이타닉 침몰이 해상 무선통신 규칙을 어떻게 바꿨나 — 1912년 런던 회의·SOLAS·GMDSS
  briefs:
    초등:
      mc_brief: 배가 바다 한가운데서 큰일이 났을 때 어떻게 도움을 부르는지 궁금하다는 투로 열고 도슨트에게 넘긴다. 배 이름과 연도, 사람 수는 말하지 않는다.
      docent_brief: 아주 옛날 큰 배가 바다에서 가라앉을 때, 한 사람이 끝까지 자리를 지키며 '도와주세요' 신호를 전파로 계속 보냈다는 것. 그 신호를 들은 다른 배가
        달려와 많은 사람을 구했다는 것. 그때부터 배들은 언제나 서로의 구조 신호를 듣고 있기로 약속했다는 것. 숫자·연도·배 이름·죽음은 말하지 않는다.
    중고등:
      mc_brief: 이번 주제는 바다 위의 무선통신이라고 알리고, 타이타닉 이야기를 도슨트에게 청한다. '그 사고가 바꾼 것' 에 초점이 있다는 걸 미리 깔아 준다.
      docent_brief: 핵심 훅은 '사고가 사람을 바꾼 게 아니라 규칙을 바꿨다' 는 것. 1912년 타이타닉이 침몰할 때 무선통신사가 마지막까지 구조 신호를 보냈고, 그
        신호를 들은 다른 배가 달려와 구명정의 사람들을 구했다는 것. 그 뒤 조사위원회가 '모든 배는 밤낮 끊기지 않게 무선을 지켜야 한다' 고 권고했고, 그 권고가 국제 규칙이
        됐다는 것. 연도는 1912년만 말한다. 구조 인원 수는 말하지 않는다.
    일반:
      mc_brief: 이번 주제는 바다 위의 무선통신이라고 알리고 타이타닉 이야기를 청한다. 뒤에 '그래서 지금 규칙이 이렇게 됐다' 가 올 것을 예고한다.
      docent_brief: 핵심 훅은 '전파가 사람을 구했고, 그 경험이 제도가 됐다'. 1912년 4월 타이타닉 침몰 때 수석 무선통신사 잭 필립스가 마지막까지 CQD 와
        SOS 를 보냈다는 것. 그 신호를 받은 카르파티아호가 달려와 구명정의 사람들을 구했고, 공식 조사 기준으로 승선자 2,201명 중 약 700명이 살아남았다는 것. 사고
        몇 달 뒤 1912년 런던 국제무선전신회의가 조난신호의 공통 주파수를 정하고 선박이 정해진 시간마다 조난 호출을 듣도록 했으며, 1914년에는 해상인명안전협약(SOLAS)이
        처음 채택됐다는 것. 지금 쓰는 국제해상조난안전시스템(GMDSS)은 그 SOLAS 의 1988년 개정으로 들어와 1999년에 전면 시행됐다는 것. **'695명' 과 '타이타닉
        때문에 GMDSS가 생겼다' 는 말하지 않는다** — 둘 다 틀렸다.
    전문가:
      mc_brief: 제도사의 관점을 전제로 깔고 — 사고 하나가 국제 규칙을 어디까지 바꿨는지 — 도슨트에게 타이타닉의 규제사적 유산을 묻는다.
      docent_brief: '영국 난파위원회 보고서의 숫자로 연다: 승선 2,201명 중 711명 생존(32.30%), 카르파티아호가 구명정에서 712명을 올렸고 4시 5분
        정선 — 침몰(2시 20분) 1시간 45분 뒤다. 같은 보고서 권고 제20항이 ''충분한 수의 훈련된 통신사로 밤낮 끊기지 않는 당직'' 을 요구했다는 것. 그 권고가
        두 갈래로 흘렀다는 것 — ITU 쪽은 1912년 런던 국제무선전신회의의 공통 조난파장과 청취 의무(SOS 자체는 1906년 회의에서 이미 정해졌다), IMO 쪽은 1914년
        최초 SOLAS. GMDSS 는 1988년 SOLAS 개정으로 채택돼 1992년 2월 1일부터 단계 도입, 1999년 2월 1일 전면 시행이며 SOLAS 제IV장에 담긴다는
        것. GMDSS 는 해역을 A1(VHF 약 30해리)·A2(MF 약 100~300해리)·A3(정지위성)·A4(그 밖, HF)로 나누고 406MHz EPIRB 와 9GHz
        SART 를 필수 장비로 두며, 주파수는 ITU 전파규칙 제31조와 부록 15, 운용절차는 제32조가 정한다는 것. 국내법으로는 선박안전법 제29조가 ''세계 해상조난
        및 안전제도'' 설비를 의무화하고 전파법 제28조제2항이 조난통신에 ''다른 모든 무선통신에 우선하여 즉시 응답'' 할 의무를 지운다는 것 — 1912년 권고가 지금 우리
        법 조문에 그대로 살아 있다. 조항 번호와 정확한 값을 그대로 말해도 된다.'
- id: 08-aviation
  title: 항공무선통신과 시뮬레이터
  mc: 바다 다음은 하늘입니다. 도슨트, 항공무선통신 코너와 시뮬레이터에서는 무엇을 해볼 수 있나요?
  mc_after: 조종석에 앉아 이륙까지 해볼 수 있다니 인기가 많겠어요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 실제 조종사 교육용 장비를 이착륙 체험용으로 개조한 항공 시뮬레이터가 있고, 조종석은 계기 본체(속도·고도·방향)·패들(브레이크·지상 방향 전환)·요크(고도
    상승·하강, 방향 전환)·스로틀(엔진 출력 제어)로 구성된다는 것. 실제 이륙 절차는 미리 세팅해 두고 체험한다는 것과, 착륙 체험은 시간관계상 생략한다는 것만 말한다. 시뮬레이터의
    기종은 언급하지 않는다 — 확인되지 않았다.
  gaze: audience
  topic: 하늘의 무선 규칙은 누가 정하나 — ICAO 부속서 10과 항공안전법, 그리고 조종석 체험
  briefs:
    초등:
      mc_brief: 바다 다음은 하늘이라고 넘기면서, 비행기 조종석에 앉아볼 수 있다는 것을 기대되는 투로 알리고 도슨트에게 묻는다. 기종·숫자·기관 이름은 말하지 않는다.
      docent_brief: 비행기는 하늘에서 땅에 있는 사람과 전파로 이야기하면서 날아간다는 것, 항공무선통신 코너에서는 진짜 조종석에 앉아 손잡이를 당겨 비행기를 띄워볼 수
        있다는 것. 비유를 쓴다 — 비행기와 땅이 보이지 않는 실로 이어져 있는 것 같다는 식. 주파수·기종·법·부품 이름은 말하지 않는다.
    중고등:
      mc_brief: 바다 다음은 하늘이라고 넘기고, 항공무선통신 코너와 시뮬레이터에서 무엇을 해볼 수 있는지 도슨트에게 묻는다.
      docent_brief: 핵심 훅은 '하늘의 규칙은 한 나라가 못 정한다'. 비행기는 어느 나라 하늘을 날든 같은 방식으로 통신해야 해서 국제민간항공기구(ICAO)가 표준을
        정하고 각 나라가 그걸 법으로 받아 쓴다는 것. 그래서 항공기에는 관제소와 말할 무선기, 위치를 알리는 장비, 사고 시 위치를 쏘는 비상 신호기가 반드시 실린다는 것.
        시뮬레이터는 실제 조종사 교육용 장비를 체험용으로 고친 것이고 조종석에서 이륙까지 해볼 수 있다는 것. 연도는 시카고 협약 1944년 정도만. 주파수 숫자는 말하지 않는다.
        기종은 절대 말하지 않는다.
    일반:
      mc_brief: 바다 다음은 하늘이라고 넘기고, 항공무선통신 코너와 시뮬레이터에서 무엇을 해볼 수 있는지 묻는다. 체험 이야기로 끝날 것을 예고한다.
      docent_brief: 핵심 훅은 '국제 표준이 우리 하늘의 법이 된다'. 1944년 시카고 협약으로 만들어진 국제민간항공기구(ICAO)가 협약의 부속서로 항공통신 표준을
        정하고, 우리 항공안전법이 제1조에서 그 부속서를 따른다고 스스로 밝힌다는 것. 그래서 항공기에는 관제기관과 교신할 무선전화 송수신기, 위치를 응답하는 트랜스폰더, 사고
        시 위치를 알리는 비상위치지시용 무선표지설비(ELT)가 법으로 의무화돼 있고, 무선기는 하나가 고장나도 나머지가 살아 있도록 두 벌을 따로 설치한다는 것. 코너 안쪽에는
        항공기 어느 위치에 어떤 통신 안테나가 붙는지 볼 수 있다는 것. 시뮬레이터는 실제 조종사 교육용 장비를 이착륙 체험용으로 개조한 것이고, 실제 이륙은 수많은 절차를 거치지만
        체험에서는 미리 세팅해 두며 착륙은 시간관계상 생략한다는 것. **기종은 말하지 않는다.** 조종석 부품은 기능으로 설명하고 이름을 단정하지 않는다.
    전문가:
      mc_brief: 국제 표준과 국내 법령의 관계를 전제로 깔고, 항공무선의 근거 체계와 시뮬레이터 체험이 각각 어디에 해당하는지 도슨트에게 묻는다.
      docent_brief: 시카고 협약(1944.12.7 서명, 52개국 / 1947.4.4 ICAO 발족, 현 193개국)의 19개 부속서 중 **부속서 10 Aeronautical
        Telecommunications** 이 통신·항법·감시를 규율하며, 1949년 5월 30일 채택·1950년 3월 1일 발효 후 1995년 개정 70호로 5권 체제 (I
        무선항법보조, II 통신절차, III 통신시스템, IV 감시레이더·충돌회피, V 주파수 이용)가 됐다는 것. ICAO Doc 9718 기준 공대지 음성은 117.975~137MHz(AM(R)S),
        비상주파수는 121.5·123.1·243MHz, 수색구조는 406~406.1MHz, SSR·ACAS·ADS-B 는 1,030/1,090MHz 라는 것. 국내로 내려오면
        항공안전법 제1조가 협약 부속서를 따른다고 명시하고, 제51조와 시행규칙 제107조가 VHF/UHF 무선전화 송수신기 각 2대·트랜스폰더·ADF·ILS·VOR·DME·기상레이더·
        ELT·ADS-B 를 의무화하며, ELT 는 121.5MHz 와 406MHz 로 송신하고 무선설비는 항공비상주파수 121.5MHz 또는 243.0MHz 로 관제기관과 통신
        가능해야 한다는 것 — ICAO 표의 숫자가 국내 시행규칙에 그대로 박혀 있다. 전파법 제28조제2항은 항공국·항공기국에 조난통신 우선 응답 의무를 지우는데, 같은 조문이
        해안국·선박국도 함께 묶는다는 것. 조종면은 FAA 기준 요크가 pitch(엘리베이터)와 roll(에일러론)을, 러더 페달이 yaw(러더)를 맡으며 고도와 선회는 그 결과라는
        것. 조종사 훈련용 모의비행장치의 국제 자격기준은 ICAO Doc 9625 라는 것. **기종과 체험관 장비의 자격 여부는 말하지 않는다** — 확인되지 않았다.
- id: 09-special-exhibit
  title: 특별교류전시
  mc: 특별교류전시라는 코너도 있다고 들었습니다. 도슨트, 지금은 어떤 것이 전시돼 있나요?
  mc_after: 기간마다 바뀌는 전시라 올 때마다 다르겠네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 유관기관과 교류해 특별 전시품을 일정 기간 전시하는 공간이라는 것, 지금은 조선대학교 장황남 전파통신박물관에서 전시되던 전쟁 관련 군사장비 — 군용 헤드셋과
    마이크, 간첩이 사용했던 무전기 등 — 가 전시돼 있다는 것, 군사장비는 내구도를 높이느라 튼튼하지만 무겁다는 것. 전시 시작·종료 연도는 원장에 없으니 지어내지 않는다.
  gaze: audience
  topic: 유관기관 교류 특별전시 — 현재 전시품
  briefs:
    초등:
      mc_brief: 특별교류전시에는 가끔 바뀌는 전시가 있다고 알리고 도슨트에게 넘긴다.
      docent_brief: 이 코너는 전시품이 때때로 바뀐다는 것과, 지금 눈앞에 보이는 것을 가리켜 설명한다는 것. **구체적인 물건 이름을 미리 말하지 않는다** — 무엇이
        전시 중인지 확인되지 않았다.
    중고등:
      mc_brief: 다른 기관과 교류해 꾸미는 특별전시라는 점을 짚고 넘긴다.
      docent_brief: 유관기관과 교류해 일정 기간만 여는 전시 공간이라는 것. 지금 무엇이 있는지는 눈앞의 것을 보고 말한다. 목록을 외워 말하지 않는다.
    일반:
      mc_brief: 특별교류전시의 성격을 소개하고 지금 무엇이 있는지 도슨트에게 묻는다.
      docent_brief: 유관기관과 교류해 특별 전시품을 일정 기간 전시하는 공간이라는 것. 전시품 목록·전시 기간·교류 기관은 확인되지 않았으므로 단정하지 않고, 관람객이
        직접 보고 있는 것을 중심으로 말한다.
    전문가:
      mc_brief: 상설전시와 교류전시의 운영 차이를 짚고 도슨트에게 넘긴다.
      docent_brief: 상설전시와 달리 기간 한정이라 소장·대여 주체가 갈린다는 점. **구체 전시품과 소장기관은 확인되지 않았으므로 말하지 않는다.**
- id: 10-ham
  title: 아마추어 무선통신 (HAM)
  mc: 이번엔 취미로 즐기는 무선통신, 아마추어 무선입니다. 도슨트, 햄이 뭔가요?
  mc_after: 취미가 재난 때는 통신망이 된다는 게 멋지네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 직업이 아니라 취미로 즐기는 무선 통신이 아마추어 무선(HAM)이라는 것, 영화 '동감'(2000)에서 두 주인공이 햄으로 교감한 것이 훅이 될 수 있다는
    것, 전파를 이용하는 전기적 설비가 무선설비, 이를 운용하는 사람이 무선종사자, 둘을 합쳐 무선국이라 전파법이 규정한다는 것, 아마추어 무선은 비상시 재난통신망으로도 쓸 수 있어
    KCA가 9개 지역본부에 아마추어 무선국을 개설해 두었다는 것. 절대연도로만 말한다.
  gaze: partner
  topic: 취미로서의 아마추어 무선과 그것을 떠받치는 국제·국내 제도
  briefs:
    초등:
      mc_brief: 무선으로 모르는 사람과 이야기를 나누는 취미가 있다는 점을 신기해하며 도슨트에게 넘긴다. '아마추어'·'무선국' 같은 말은 풀어서 쓴다.
      docent_brief: 돈을 벌려고가 아니라 그냥 재미있어서 무선으로 멀리 있는 사람과 이야기를 나누는 사람들이 있다는 것, 전화나 인터넷이 끊기는 큰일이 나면 그 사람들의
        무선이 대신 소식을 전해 줄 수 있다는 것. 법 조항·기관 이름·주파수·출력 숫자는 말하지 않는다.
    중고등:
      mc_brief: 취미인데 왜 나라가 자격시험까지 보게 하는지 도슨트에게 묻는다.
      docent_brief: 돈벌이가 아니라 스스로 익히고 기술을 시험해 보려는 목적이라는 점이 아마추어 무선의 정의라는 것, 그래도 전파는 남과 나눠 쓰는 자원이라 나라가 자격을
        확인하고 허가한 뒤에야 쓸 수 있다는 것, 재난으로 통신망이 끊길 때를 대비하도록 국제 규칙이 각국에 권장한다는 것. 영화 '동감'(2000)을 훅으로 써도 좋다 — 연도만
        말하고 날짜는 말하지 않는다. 주파수·출력 수치는 생략한다.
    일반:
      mc_brief: 햄이 정확히 무엇인지, 그리고 취미와 제도가 어떻게 이어지는지 도슨트에게 묻는다.
      docent_brief: 국제전기통신연합(ITU)이 아마추어업무를 '금전적 이익 없이 개인적 관심에서 하는 자기훈련·상호통신·기술연구' 로 정의한다는 것이 핵심 훅. 그래서
        각국이 자격을 검정하고 허가한다는 것, 우리나라는 전파법이 무선설비(전파를 보내거나 받는 전기적 시설)·무선국(무선설비와 그것을 조작하는 자의 총체)·무선종사자(기술자격증을
        받은 사람)를 나눠 규정한다는 것, 국제 규칙이 아마추어국을 재난구호 통신에 대비시키도록 각국에 권장하고 있어 취미가 비상망이 된다는 것. 영화 '동감'(2000)으로
        열어도 좋다. **'9개 지역본부' 같은 기관 수치는 말하지 않는다** — 틀렸고, 정정된 숫자도 확인 중이다.
    전문가:
      mc_brief: 아마추어업무의 국제 정의와 국내 자격 체계가 어떻게 맞물리는지 도슨트에게 묻는다.
      docent_brief: RR No. 1.56 의 아마추어업무 정의(self-training·intercommunication· technical investigations,
        without pecuniary interest)를 원문 개념 그대로 말한다. RR 제25조가 그 운용 규칙이라는 것 — 25.6 자격 검증 의무, 25.5 모스 요구
        여부는 각국 재량(WRC-03), 25.7 최대 출력도 각국이 결정, 25.9 송신 중 짧은 간격의 호출부호 송신 의무, 25.2A 뜻을 감추는 부호화 금지, 25.3
        제3자 대리 국제통신은 비상·재난구호에 한정, 25.9A 재난구호 대비 권장. 국내는 전파법 제2조의 무선설비·무선국·무선종사자 정의와 제70조의 자격검정, 시행령 별표
        17 의 네 등급 — 제1급 1 kW 이하, 제2급 200 W 이하, 제3급 100 W 이하(21 MHz 이상 또는 8 MHz 이하), 제4급 10 W 이하(30 MHz
        이상, 모스 제외). 검정 업무가 전파법 제78조제2항에 따라 진흥원(KCA)에 위탁된다는 고리까지 말한다. ITU-R M.1544-1 이 최소 자격 기준의 권고라는 표준번호도
        꺼낼 수 있다.
- id: 11-iot
  title: 사물인터넷
  mc: 다음 주제는 사물인터넷입니다. 도슨트, 체험관에서는 무엇을 해볼 수 있나요?
  mc_after: 태블릿으로 전구 색을 바꾸는 체험, 아이들이 좋아하겠어요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 사람·사물·공간이 모두 인터넷으로 연결돼 정보를 공유·활용하는 초연결 인터넷이라는 것, 전시된 전구를 태블릿으로 밝기와 색상을 바꿀 수 있다는 것, 지금은
    무선으로 불을 켜고 끄는 정도지만 5G와 접목되면 완전 자율주행·능동 제어로 나아간다는 것.
  gaze: audience
  topic: 사물인터넷이란 무엇이며 5G 가 그것을 어디까지 바꾸는가
  briefs:
    초등:
      mc_brief: 물건들끼리 서로 이야기를 주고받는다는 상상으로 호기심을 열고 도슨트에게 넘긴다. '사물인터넷' 이라는 말은 써도 되지만 풀어서 설명해 달라고 부탁한다.
      docent_brief: 전등·시계·자동차 같은 물건들이 인터넷으로 서로 연결돼서 서로에게 말을 걸 수 있게 됐다는 것, 그래서 멀리서도 물건을 켜고 끄고 상태를 알 수 있다는
        것. 비유 중심으로. 숫자·연도·표준 이름은 말하지 않는다.
    중고등:
      mc_brief: 인터넷에 연결되는 것이 컴퓨터와 휴대폰만은 아니라는 점을 짚고 도슨트에게 넘긴다.
      docent_brief: 사물인터넷은 사물에 통신 기능을 붙여 서로 연결하고 그 데이터로 서비스를 만드는 것이라는 원리. 핵심 훅은 '사람이 일일이 입력하지 않아도 사물이
        스스로 상태를 알린다' 는 대비. 5G 이야기를 꺼낼 때는 '기기를 훨씬 많이, 훨씬 빠른 응답으로 연결할 수 있게 설계된 세대' 까지만 — **완전 자율주행이 된다고
        말하지 않는다.** 연도만 말하고 구체 수치는 말하지 않는다.
    일반:
      mc_brief: 체험관에서 직접 만져볼 수 있는 사물인터넷이 무엇인지 도슨트에게 묻는다.
      docent_brief: 국제 표준(ITU)의 정의는 사물을 서로 연결해 진보된 서비스를 가능하게 하는 글로벌 인프라라는 것, 이 정의에서 '사물' 은 물리적인 것뿐 아니라
        가상의 것도 포함한다는 것, 5G 는 이 사물들을 훨씬 촘촘하게(1제곱킬로미터에 백만 대 규모) 훨씬 빠른 응답으로(밀리초 단위) 연결하는 것을 목표로 설계된 세대라는
        것. 수치는 개략으로만. **'5G 가 되면 완전 자율주행' 이라는 인과는 말하지 않는다** — 자율주행 수준은 차량이 스스로 무엇을 하느냐로 정해지고 통신은 이를 돕는
        쪽이라는 정도로 정리한다.
    전문가:
      mc_brief: 표준 정의와 5G 의 사용 시나리오 구분을 전제로 깔고, IoT 가 그중 어디에 해당하는지 도슨트에게 묻는다.
      docent_brief: ITU-T Y.4000/Y.2060(2012-06)의 IoT 정의와 thing/device 구분을 그대로 말한다. IMT-2020 의 세 사용 시나리오(eMBB·URLLC·mMTC)
        중 IoT 에 대응하는 것은 mMTC 와 URLLC 이며, Report ITU-R M.2410-0 의 최소 요구조건이 연결밀도 100만 대/km2(mMTC), 사용자평면
        지연 URLLC 1 ms·eMBB 4 ms, 제어평면 지연 20 ms, URLLC 신뢰도 32바이트 L2 PDU 를 1 ms 안에 1 − 10^-5 성공확률이라는 것.
        **조건을 반드시 함께 말한다** — 지연 값은 무부하·단일 사용자· 소형 IP 패킷 가정의 무선 구간 편도 기여분이고, 연결밀도는 제한된 대역폭과 TRxP 수 조건이다.
        끝으로 이 요구조건들은 성능 목표이지 특정 응용(완전 자율주행)의 달성을 규정하지 않는다는 점을 분명히 한다.
- id: 12-multimedia
  title: KCA 멀티미디어실
  mc: KCA가 방송 콘텐츠도 지원한다고 하던데요. 도슨트, 멀티미디어실에서는 어떤 것을 볼 수 있나요?
  mc_after: 전파를 관리하는 일만 하는 게 아니었군요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 방송통신 진흥과 관련된 콘텐츠를 볼 수 있는 공간이라는 것, KCA가 제작을 지원한 방송프로그램 '아마존의 눈물', '남극의 눈물', '최후의 제국', '슈퍼
    피쉬'를 예로 든다는 것, 전국 6개소 스마트미디어센터와 매년 여는 스마트미디어 X캠프, 일산 빛마루방송지원센터로 제작 전 과정을 지원한다는 것, 키오스크로 지원 작품을 시청할
    수 있다는 것. 원장에 없는 프로그램명을 지어내지 않는다.
  gaze: audience
  topic: KCA 방송콘텐츠 제작지원과 멀티미디어실
  briefs:
    초등:
      mc_brief: 멀티미디어실에서는 방송 프로그램을 볼 수 있다고 알리고 도슨트에게 넘긴다.
      docent_brief: 멀티미디어실은 방송 프로그램을 직접 볼 수 있는 곳이라는 것. **프로그램 이름을 말하지 않는다** — 어떤 작품이 있는지 확인되지 않았다.
    중고등:
      mc_brief: KCA 가 방송 콘텐츠 제작도 돕는다는 점을 짚고 넘긴다.
      docent_brief: 전파를 관리하는 일만 하는 게 아니라 그 위에 실리는 방송 콘텐츠 제작도 돕는다는 것. 구체 작품명과 시설 수치는 확인 전이므로 말하지 않는다.
    일반:
      mc_brief: KCA 의 콘텐츠 지원 역할을 소개하고 도슨트에게 넘긴다.
      docent_brief: 방송통신 진흥과 관련된 콘텐츠를 볼 수 있는 공간이라는 것과, KCA 가 제작 지원 사업을 한다는 것. **작품명·센터 개소 수는 확인 전이라 말하지
        않는다** — 기관 내부 수치는 이 큐시트에서 반복해서 틀린 자리다.
    전문가:
      mc_brief: 기금 기반 콘텐츠 제작지원이 진흥원 사업 어디에 해당하는지 묻는다.
      docent_brief: 전파법 제66조④의 진흥 사업과 방송통신발전기금 운용이 이 공간의 배경이라는 것(`_law-basis.yaml` 참고). 구체 지원작과 시설 수치는
        확인 전이다.
- id: 13-chromakey
  title: 크로마키 체험
  mc: 크로마키 체험 코너 이야기도 해 보죠. 도슨트, 크로마키가 뭔가요?
  mc_after: 가만히 서 있어도 다른 곳에 간 것처럼 보이는 거네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 크로마키는 다른 카메라로 촬영한 배경에 전경을 합성하는 기법으로 SF 영화나 뉴스 날씨예보에 많이 쓰인다는 것, 그린스크린 앞에서 화면 합성을 체험할 수
    있고 촬영한 사진은 메신저나 메일로 받을 수 있다는 것.
  gaze: audience
  topic: 크로마키 합성 기법과 체험
  briefs:
    초등:
      mc_brief: 초록 천 앞에서 사진을 찍으면 무슨 일이 생기는지 궁금하게 만들고 넘긴다.
      docent_brief: 초록색 천 앞에 서면 그 초록색만 쏙 빼고 다른 그림을 넣을 수 있다는 것. 그래서 가만히 서 있어도 다른 곳에 간 것처럼 보인다는 것.
    중고등:
      mc_brief: 크로마키가 뭔지 도슨트에게 묻는다.
      docent_brief: 특정 색을 골라내 투명하게 만들고 그 자리에 다른 영상을 합성하는 기법이라는 것과, 날씨예보·영화에서 쓰인다는 것.
    일반:
      mc_brief: 크로마키 체험 코너를 소개하고 원리를 도슨트에게 묻는다.
      docent_brief: 다른 카메라로 찍은 배경에 전경을 합성하는 기법이고 SF 영화나 뉴스 날씨예보에 많이 쓰인다는 것. 체험 운영 방식(사진 전송 등)은 확인 전이라
        단정하지 않는다.
    전문가:
      mc_brief: 왜 하필 초록·파랑인지로 화제를 연다.
      docent_brief: 색상 키잉의 원리와 배경색 선택의 이유. **다만 그 이유(피부색과의 색상 거리)는 이번 라운드에서 출처를 확보하지 않았으므로, 확인 전에는 원리만
        말하고 색 선택 이유는 말하지 않는다.**
- id: 14-mobile
  title: 이동통신
  mc: 이번 주제는 휴대폰의 발전, 이동통신입니다. 도슨트, 1세대부터 5세대까지 어떻게 달라졌나요?
  mc_after: 카폰 한 대가 자동차 한 대보다 비쌌다니 놀랍네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 1세대는 들고 다닌 게 아니라 차량에 싣고 다닌 카폰으로 아파트 한 채 값이었고 이어 '벽돌폰'이 나왔다는 것, 2세대는 통화와 문자가 되고 1세대보다 크기·무게가
    크게 줄었다는 것, 3세대는 영상통화까지 가능해 카메라를 돌리거나 전면에 단 모델이 많았다는 것, 4세대는 LTE라는 것, 5세대는 2019년 세계 최초로 상용화됐고 완전히 구축되면
    LTE보다 최대 20배 빠르고 초저지연이라는 것. SKT가 지원한 기지국 장비도 전시돼 있다는 것. 절대연도로만 말한다.
  gaze: audience
  topic: 1세대부터 5세대까지 — 무엇이 언제, 어디서 처음이었나
  briefs:
    초등:
      mc_brief: 옛날 휴대폰은 어떻게 생겼을까 하는 호기심으로 열고 도슨트에게 넘긴다. '몇 세대' 같은 말은 쓰되 숫자를 따지지 않는다.
      docent_brief: 맨 처음 전화기는 들고 다닐 수 없어서 자동차에 싣고 다녔다는 것, 그게 자동차 한 대보다 비쌌다는 것, 그 뒤로 점점 작아지고 목소리뿐 아니라 글자와
        얼굴까지 주고받게 됐다는 것. 비유와 크기 변화 중심. **연도·속도·배수는 하나도 말하지 않는다.** '아파트 한 채 값' 이라고 말하지 않는다.
    중고등:
      mc_brief: 1세대부터 5세대까지 무엇이 달라졌는지 도슨트에게 묻는다.
      docent_brief: 세대 구분의 핵심 훅은 '무엇을 실어 날랐는가' — 1세대는 음성만(그것도 차에 실린 카폰), 2세대는 디지털로 바뀌어 음성과 문자, 3세대는 영상통화,
        4세대는 LTE 로 데이터, 5세대는 기기를 아주 많이·아주 빠른 응답으로 연결. 연도는 국내 기준으로 1984년(카폰), 1996년(CDMA), 2011년(LTE),
        2019년(5G)만. **각 연도가 국내 기준임을 밝힌다.** 속도 배수와 월·일은 말하지 않는다. '아파트 한 채 값' 이라고 말하지 않는다.
    일반:
      mc_brief: 세대가 바뀔 때마다 무엇이 새로 가능해졌는지 도슨트에게 묻고, 카폰 가격에 놀랄 준비를 한다.
      docent_brief: 국내 1세대는 1984년 차량전화로 시작했고 총비용이 약 400만 원이라 당시 승용차(포니2 347만 원)보다 비쌌다는 것, 1996년 국내에서 CDMA
        방식 디지털 이동통신이 상용화됐다는 것, 2000년대 초 3세대에서 영상통화가 가능해졌다는 것, 2011년 국내에서 LTE 가 상용화됐다는 것, 2019년 4월 대한민국이
        **스마트폰 기반** 5G 를 세계 최초로 상용화했다는 것. 연도는 개략 수치로만 쓰고 '국내 최초' 와 '세계 최초' 를 분명히 갈라 말한다. **속도 배수는 말하지
        않거나 '이론상 최대 기준' 이라는 조건을 반드시 붙인다.**
    전문가:
      mc_brief: 세대 구분이 ITU 규격 기준인지 사업자 마케팅 기준인지를 전제로 깔고, '세계 최초' 라는 말의 대상이 무엇이었는지 도슨트에게 묻는다.
      docent_brief: 국내 1984년 카폰(약 400만 원, 포니2 347만 원 대비)에서 시작해, ETRI 가 1989년 국책과제로 착수해 1991년 퀄컴과 공동개발하고
        1994년 첫 통화·1995년 시연을 거쳐 1996년 CDMA 를 상용화한 경위. 3세대는 2001년 10월 NTT도코모 FOMA 가 세계 최초이고 국내는 2003년 12월
        W-CDMA. 4세대는 2009년 12월 TeliaSonera 가 세계 최초 LTE, 국내는 2011년 7월. **다만 ITU-R 가 2010년 10월 IMT-Advanced
        로 공식 지정한 것은 LTE-Advanced 와 WirelessMAN-Advanced 뿐이고, 초기 LTE 는 2010년 12월에 '4G' 호칭이 허용된 전신 기술**이라는
        구분을 짚는다. 5세대는 2018년 12월 1일 국내 B2B 상용, 2019년 4월 3일 스마트폰 기반 세계 최초 상용화(과기정통부). 속도는 반드시 조건과 함께 — Report
        ITU-R M.2410-0 의 하향 피크 20 Gbit/s / 상향 10 Gbit/s, 체감 데이터율 하향 100 Mbit/s(Dense Urban-eMBB, CDF 5%
        지점), Report ITU-R M.2134 의 IMT-Advanced 피크 1 Gbit/s. '20배' 는 이 두 피크값의 비라는 점까지 말한다. 1차 출처가 없는 연도(세계
        최초 1세대 등)는 말하지 않는다.
- id: 15-emf
  title: 전자파 측정
  mc: 지금부터는 KCA가 정부에서 위탁받은 전파품질 관리 업무 이야기입니다. 도슨트, 전자파는 안전한가요?
  mc_after: 세기가 발생원에서 멀어질수록 빠르게 줄어든다는 게 핵심이군요. 궁금한 점 있으시면 말씀해 주시고, 아니면 '다음'이요.
  docent_brief: 전자파 강도는 인체보호기준에 맞춰 1등급부터 경고등급까지 4단계로 나뉜다는 것, 주변 전자파를 실시간 측정해 세 가지 불빛으로 표시하는 모니터링 장비가 전시돼
    있다는 것, 초단파 무전기를 장비 바로 옆에서 송신하면 불빛이 빨간색으로 바뀌지만 거리를 조금만 떨어뜨리면 변하지 않는다는 것 — 전자파 강도가 거리에 따라 급격히 감소해 일정
    거리를 두면 인체에 유해하지 않다는 뜻.
  gaze: audience
  topic: 전자파 인체보호기준과 전자파 등급제 — 무엇을 어떤 기준으로 재는가
  briefs:
    초등:
      mc_brief: 전자파는 눈에 보이지도 않는데 어떻게 세기를 알 수 있느냐고 궁금해하며 도슨트에게 넘긴다. '안전한가요' 같은 예·아니오 질문으로 단답을 끌어내지 않는다.
        숫자·등급 이름·기관 이름은 쓰지 않는다.
      docent_brief: 전자파는 멀어질수록 빠르게 약해진다는 것이 핵심 훅 — 난롯불에서 한 걸음 물러나면 덜 뜨거운 것에 빗댄다. 나라가 정해 둔 선이 있고 어른들이 그
        선을 넘지 않는지 계속 재고 있다는 것까지만 말한다. **안전하다고도 위험하다고도 말하지 않는다.** 숫자·등급 이름·법 이름은 쓰지 않는다.
    중고등:
      mc_brief: 전자파 세기를 누가 무슨 기준으로 판단하는지 도슨트에게 묻는다. 안전 여부를 단정적으로 물어 단답을 유도하지 않는다.
      docent_brief: 세기가 거리에 따라 빠르게 줄어든다는 원리, 그래서 '얼마나 센가' 는 언제나 '어디서 쟀나' 와 함께여야 한다는 점이 핵심 훅. 국가가 일반인 기준과
        직업인 기준을 따로 정해 두었고, 기지국 같은 설비에는 그 기준 대비 세기를 등급 라벨로 표시하게 돼 있다는 것(2014년부터 시행). 국제기구의 정리를 '기준 이하에서
        건강에 나쁜 영향이 확인된 적은 없다' 는 표현 **그대로** 전하고, 동시에 연구가 아직 진행 중이라는 점도 덧붙인다 — '안전하다' 로 바꾸지 않는다. 연도 외의 수치는
        말하지 않는다.
    일반:
      mc_brief: 전파품질 관리 업무를 소개하면서, 전자파 세기를 어떻게 재고 무엇을 기준으로 판단하는지 도슨트에게 묻는다.
      docent_brief: ① 국가가 전파법에 따라 전자파 인체보호기준(고시)을 정해 두었고 일반인 기준과 직업인 기준이 따로 있다는 것. ② 일정 규모 이상의 무선국(기지국·
        방송국 등)은 세기를 측정해 보고하고 1등급·2등급·주의·경고 네 가지 등급 라벨을 붙이게 돼 있으며, 1등급은 일반인 기준의 절반 이하라는 것 — 등급은 설비에 붙는
        것이지 체험관 장비의 불빛이 아니라는 구분을 명확히 한다. ③ 세기는 발생원에서 멀어질수록 빠르게 줄어든다는 것(WHO 표현). ④ 실제 생활환경 측정에서 기준 대비 수
        % 수준으로 나오는 사례가 있다는 것 — 측정 대상과 시점을 함께 말한다. ⑤ 건강 영향은 '기준 이하 노출에서 인과적으로 확인된 악영향은 없다' 와 '국제암연구소가 무선주파수
        전자기장을 발암 가능(2B)으로 분류해 두었다' 를 **반드시 한 묶음으로** 말한다. 어느 쪽으로도 단정하지 않는다.
    전문가:
      mc_brief: 인체보호기준과 등급제의 관계를 전제로 깔고, 등급의 경계가 정확히 어디에 그어져 있는지 도슨트에게 묻는다.
      docent_brief: 전파법 제47조의2 제1항이 인체보호기준·등급기준·측정기준의 고시 근거이고, 같은 조 제2항이 기준 초과 장소의 출입 차단 안전시설을 의무화한다는
        것. 「전자파인체보호기준」(과기정통부 고시 제2019-4호) 별표1 일반인 기준으로 10~400㎒ 는 전기장 28 V/m·전력밀도 2 W/㎡, 2~300㎓ 는 61 V/m·10
        W/㎡ 이고, 별표3의 일반인 SAR 은 전신 0.08·머리/몸통 1.6·사지 4 W/kg 이라는 것. 「전자파 등급기준, 표시대상 및 표시방법 고시」 별표1의 경계 —
        1등급 일반인 기준의 50% 이하, 2등급 50% 초과~기준 이하, 주의등급 일반인 기준 초과~직업인 기준 이하, 경고등급 직업인 기준 초과 — 를 정확히 말하고, 라벨은
        연두·파랑·주황· 빨강 4색이며 표시대상은 시행령 제65조·별표6의 보고대상 무선국(이동통신 기지국은 안테나공급전력 합 30W 초과 등)이라는 것. 휴대기기의 전자파흡수율
        등급은 별개 체계로 2단계(1등급 ≤0.8, 2등급 ≤1.6 W/kg, 머리 1g 평균)라는 구분까지. 건강 영향은 WHO 의 '인과적으로 확인된 악영향 없음'(2020)과
        IARC 2B 분류(2011)를 병렬로 제시하고, ICNIRP 가 2020년 가이드라인을 개정한 반면 국내 고시 현행판은 2019년판이라는 시차를 짚되 국내 기준이 그것을
        반영했는지는 단정하지 않는다.
- id: 16-inspection
  title: 무선국 검사
  mc: 전파품질 관리의 또 다른 축, 무선국 검사입니다. 도슨트, 무선국 검사가 뭔가요?
  mc_after: 전파가 한정된 자원이라 관리가 필요하다는 말이 와닿네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 전파는 한정된 자원이라 많은 사람이 함께 쓰려면 관리가 필요하고, 전파를 법적 기준에 맞게 쓰고 있는지 확인하는 것이 무선국 검사라는 것, KCA는 1981년부터
    정부 위탁을 받아 무선국 검사를 시행해 왔다는 것, 선박·항공기·이동통신 등의 전파를 검사하기 위해 KCA가 예전부터 사용한 장비들이 전시돼 있다는 것. 절대연도로만 말한다.
  gaze: audience
  topic: 전파를 법적 기준에 맞게 쓰고 있는지 누가 어떻게 확인하나 — 전파법 제24조와 KCA 위탁
  briefs:
    초등:
      mc_brief: 전파를 잘 쓰고 있는지 누가 확인하는지 궁금하다는 투로 열고 도슨트에게 넘긴다. 법 이름·연도·기관 이름은 말하지 않는다.
      docent_brief: 전파는 모두가 나눠 쓰는 것이라서, 한 사람이 너무 세게 쓰거나 엉뚱한 자리를 쓰면 다른 사람 것이 안 들린다는 것. 그래서 기계가 약속대로 만들어졌는지
        사람이 직접 가서 확인한다는 것. 전시된 장비들이 그 확인에 쓰던 것들이라는 것. 비유를 쓴다 — 여러 사람이 같이 쓰는 놀이터에서 차례를 지키는 것처럼. 연도·법 조항·기관
        이름은 말하지 않는다.
    중고등:
      mc_brief: 전파품질 관리의 또 다른 축이라고 짚고, 무선국 검사가 무엇인지 도슨트에게 묻는다.
      docent_brief: 핵심 훅은 '전파는 공유 자원이라 허가만으로는 부족하고 확인이 필요하다'. 전파는 한정돼 있어 혼신이 생기면 남의 통신이 끊기기 때문에 법이 무선국을
        허가제로 두고, 설비를 다 만든 뒤에 기준에 맞는지 검사를 받아야 비로소 쓸 수 있게 한다는 것. 검사는 한 번으로 끝나지 않고 정기적으로 다시 받으며, 배나 비행기가
        외국으로 나갈 때도 따로 검사한다는 것. 이 일을 정부가 직접 다 하지 않고 이 기관이 1981년부터 위탁받아 해 왔다는 것. 연도는 1981년만. 법 조항 번호는 생략한다.
        'KCA 가 1981년부터' 라고 말해도 된다 — 공식 연혁이 그렇게 적는다. 이 수준에서는 옛 이름을 굳이 꺼내지 않는다.
    일반:
      mc_brief: 전파품질 관리의 또 다른 축이 무선국 검사라고 짚고, 그게 무엇인지 도슨트에게 묻는다.
      docent_brief: 핵심 훅은 '허가는 시작이고 검사가 마무리다'. 전파는 한정된 자원이고 법도 '남의 전파이용을 방해하지 않도록 써야 한다' 고 적기 때문에, 무선국은
        설비를 다 갖춘 뒤 준공검사를 받아야 비로소 운용할 수 있다는 것. 검사는 네 가지 — 준공검사, 5년 범위에서 받는 정기검사, 허가받은 대로 바꿨는지 보는 변경검사,
        특별히 필요할 때 하는 수시검사 — 이고, 배나 항공기가 외국으로 출항할 때도 검사 대상이 된다는 것. 검사는 장비의 기술기준만이 아니라 **무선종사자의 자격과 정원**도
        함께 본다는 것 — 기계와 사람을 같이 본다. 이 업무를 정부가 이 기관에 위탁해 왔고 그 시작이 1981년이라는 것, 그때 쓰던 검사 장비들이 전시돼 있다는 것. 'KCA
        가 1981년부터' 라고 말해도 된다 — 이름을 바꿔 온 같은 기관이고 공식 연혁이 1981년 수탁을 자기 역사로 싣는다.
    전문가:
      mc_brief: 허가·검사·감독의 삼분 구조를 전제로 깔고, 무선국 검사의 법적 근거와 수행 주체가 어떻게 나뉘는지 도슨트에게 묻는다.
      docent_brief: 근거는 **전파법 제24조(검사)** 라는 것 — 제1항 준공검사(기술기준 + 무선종사자 자격·정원배치기준 적합 여부, 일부는 표본검사), 제3항
        검사증명서 발급과 불합격 시 재검사, 제4항 5년의 범위에서 무선국별 정기검사, 제5항 선박·항공기의 외국 출항 등 수시검사. 판정 기준은 제45조 기술기준과 제71조
        무선종사자 자격·정원배치기준 둘이며, 제25조제1항이 '준공검사를 받은 후 운용' 을 못박아 검사를 운용의 전제 조건으로 만든다는 것. 수행 주체는 나뉜다 — **전파법
        시행령 제123조제2항제4호**가 법 제24조 검사를 중앙전파관리소장에게 위임하고, **제78조제2항 → 시행령 제123조제3항제3호**가 고시된 무선국의 준공검사 등을
        진흥원에 위탁하며, 같은 조 제2항제26호가 그 진흥원에 대한 지도·감독을 중앙전파관리소장에게 둔다는 것. 진흥원의 설립 근거인 제66조제1항 자체가 '정부로부터 위탁받은
        업무 수행' 을 설립 목적에 담고 있다는 것. 연혁상 이 기관이 무선국 검사를 수탁한 것은 1981년 5월 18일이고, 당시 법인명은 사단법인 한국무선종사자협회이며 한국방송통신전파진흥원(KCA)이
        된 것은 2011년 1월 24일이라는 것 — **기관명을 소급해 쓰지 않는다.** 사람 쪽 기준은 시행령 제117조가 무선국 종류별 별표로 정하는데, 항공기국은 전파전자통신
        기사·산업기사 또는 항공무선통신사 1명, GMDSS 대상 선박국은 별표 20 을 따른다는 것 — 앞서 본 해상·항공 무선국이 이 코너에서 다시 만난다.
- id: 17-rover
  title: 원격 무선조종 차량 — 행성 탐사
  mc: 체험관에는 행성 탐사 체험도 있다고 들었어요. 도슨트, 원격 무선조종 차량 코너는 무엇을 하는 곳인가요?
  mc_after: 지연 때문에 로봇이 스스로 판단해야 한다는 게 인상적이네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 증강현실로 미지의 행성을 탐사하는 체험이고 아폴로호의 월면차와 달 표면을 형상화해 현실감을 높였다는 것, 미래의 초저지연 전파응용 원격조종을 상상하며 지구에서
    탐사로봇을 조종해 물·생명체·광물자원의 흔적을 찾는 미션을 게임처럼 수행한다는 것.
  gaze: audience
  topic: 전파로 다른 천체의 차량을 움직인다는 것 — 그리고 빛의 속도라는 한계
  briefs:
    초등:
      mc_brief: 이 코너에서 우주 자동차를 몰아볼 수 있다는 것으로 기대를 열고 도슨트에게 넘긴다.
      docent_brief: 아주 멀리 있는 자동차를 전파로 움직인다는 것, 그런데 너무 멀면 '가!' 라고 말해도 그 말이 도착하는 데 한참 걸려서 차가 스스로 조심하며 가야
        한다는 것. 비유 중심 — 소리를 질러도 한참 뒤에야 들리는 아주 먼 친구. **숫자·연도·이름은 하나도 말하지 않는다.** '아폴로 월면차를 지구에서 조종했다' 고 말하지
        않는다.
    중고등:
      mc_brief: 지구에서 다른 천체의 차를 조종한다는 게 정말 가능한지 도슨트에게 묻는다.
      docent_brief: 핵심 훅은 '전파는 빛의 속도라서 빠르지만, 우주에서는 그것도 느리다' 는 대비. 달은 왕복 2~3초라 사람이 화면을 보며 조종할 수 있어서 1970년
        소련의 루노호트가 실제로 그렇게 움직였다는 것, 화성은 편도로도 몇 분에서 20분대가 걸려 실시간 조종이 불가능하고 그래서 로버가 스스로 길을 찾는다는 것. **아폴로
        월면차는 우주비행사가 직접 탄 차이지 원격조종이 아니라는 구분**을 짚는다. 연도만 말하고 정확한 수치는 말하지 않는다.
    일반:
      mc_brief: 원격조종 차량 코너가 무엇을 하는 곳인지 묻고, 실시간 조종이 되는지 되짚어 묻는다.
      docent_brief: 전파가 빛의 속도로 가도 지구와 화성 사이는 거리에 따라 편도로 약 3분에서 20분대가 걸린다는 것(**반드시 범위로 말한다**), 그래서 화성 로버는
        조이스틱으로 몰 수 없고 미리 보낸 계획을 다음 날 실행하며 스스로 장애물을 피해 간다는 것, 달은 왕복 2~3초 수준이라 사정이 달라서 1970년 루노호트 1호는 지구의
        관제팀이 화면을 보며 실제로 몰았다는 것, **아폴로 월면차는 그와 달리 우주비행사가 직접 타고 운전한 차**라는 것. 개략 수치까지만 쓰고 정확한 값은 전문가 수준에
        남긴다.
    전문가:
      mc_brief: 빛의 속도가 만드는 지연 예산을 전제로 깔고, 원격조종과 자율성의 경계가 어디서 갈리는지 도슨트에게 묻는다.
      docent_brief: 지구-화성 거리 5,460만 km(약 3분 광행시간)~4억 20만 km(약 22.4분)라는 NASA 수치를 그대로 말하고, 편도·왕복을 구분한다.
        화성 로버는 이 지연 때문에 실시간 조종이 불가능해 AutoNav 로 전방 3D 지형도를 만들어 경로를 스스로 계획하며, 그 대가로 퍼서비어런스 잠재 최고속도가 시속 120
        m(큐리오시티는 시속 약 20 m)에 그친다는 것. 직접 송신 대신 궤도선 중계를 쓰며 최대 2 Mbps, 자전 때문에 하루 약 12시간 지구 가시선이 없다는 것, 2년마다
        약 2주간 태양합으로 명령 송신을 중단한다는 것까지. 달은 평균 384,400 km 로 광행시간 편도 약 1.3초·왕복 약 2.6초(거리를 광속으로 나눈 계산값)라 원격조종이
        성립했고, 루노호트 1호는 1970년 11월 17일 착륙해 10,540 m 를 주행했으며 지구의 5인 관제팀이 몰았다는 것. **아폴로 LRV 는 승무원 탑승 조종 차량**(15호
        27.8 km, 16호 26.7 km, 17호 35.9 km)이라는 구분을 분명히 한다. 마지막으로 '초저지연 원격조종' 은 지상 응용의 개념이고 행성 탐사의 설계 목표는
        정반대로 지연을 견디는 자율성이라는 점을 정리한다.
- id: 18-science
  title: 과학 원리 실험 도구
  mc: 마지막 주제는 전파와 관련된 기초 과학 실험 도구들입니다. 도슨트, 무엇이 있나요?
  mc_after: 손을 대지 않고, 전선을 꽂지 않고도 되는 것들이 이렇게 많군요. 마지막으로 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.
  docent_brief: 정전기 발생 장치, 전자기 유도(패러데이의 법칙), 호모폴라 전동기, 오실로스코프(목소리를 파동의 형태로 봄), 코히러 전파 검출기(초창기 전파 검출 방식),
    테슬라 코일(형광등을 가까이 대면 전기 없이 불이 켜짐), 테레민(1924년 러시아 음향물리학자 레온 테레민이 발명한, 연주자가 접촉하지 않고 연주하는 악기 — 두 고주파의 간섭으로
    소리를 내고 긴 안테나에 손이 가까우면 높은 음, 멀어지면 낮은 음, 왼쪽은 볼륨 조절)이 있다는 것. 이 중 한두 가지를 골라 소개한다. 절대연도로만 말한다.
  gaze: audience
  topic: 전파의 바탕이 되는 기초 과학 원리 — 정전기·전자기 유도·공진·검파, 그리고 테레민
  briefs:
    초등:
      mc_brief: 마지막으로 직접 해볼 수 있는 신기한 장치들이 남아 있다고 들뜬 투로 소개하고, 무엇이 있는지 도슨트에게 묻는다. 장치 이름을 사회자가 먼저 줄줄이 읊지
        않는다.
      docent_brief: 도구를 나열하지 말고 **딱 하나만** 골라 이야기한다. 손을 대지 않고 허공에서 손만 움직여 연주하는 악기(테레민)가 가장 잘 먹힌다 — 손을 가까이
        가져가면 소리가 높아지고 멀리 하면 낮아진다는 것까지. 또는 전선을 꽂지 않았는데 가까이 대기만 하면 불이 켜지는 형광등. **숫자·연도·사람 이름·전문용어는 하나도 말하지
        않는다.** '마법 같지만 마법이 아니라 눈에 보이지 않는 전기의 힘 때문' 이라는 마무리.
    중고등:
      mc_brief: 전파의 바탕이 되는 과학 원리를 직접 확인할 수 있는 도구들이 있다고 짚고, 그중 무엇이 있는지 도슨트에게 묻는다.
      docent_brief: 도구 전체를 훑지 말고 **한두 가지만** 골라 원리까지 간다. 테레민을 고른다면 — 1920년에 발명됐고, 악기를 만들려던 게 아니라 **가까이
        온 것을 알아채는 센서 연구에서 나왔다**는 뒤집기가 핵심 훅. 두 개의 금속 막대가 안테나처럼 생겼지만 전파를 주고받는 안테나가 아니라 손과 함께 '축전기'가 되어 손의
        거리를 감지한다는 것. 코히러를 고른다면 — 금속가루가 전파를 받으면 달라붙어 전류가 흐르는데, 신호마다 사람이 톡 쳐서 되돌려야 했다는 것. 연도만 말하고 다른 수치는
        말하지 않는다.
    일반:
      mc_brief: 마지막 주제로 전파와 관련된 기초 과학 실험 도구들을 꺼내고, 무엇이 있는지 도슨트에게 묻는다.
      docent_brief: 도구 이름을 두세 개만 스치듯 언급하고 **한 가지에 집중**한다. 테레민이 가장 좋다 — 1920년 러시아 물리학자 레온 테레민이 발명했고(미국
        특허는 1928년), 소련의 **근접 센서 연구**에서 나왔다는 것이 핵심 훅. 두 금속 막대는 전파용 안테나가 아니라 축전기 극판으로 작동해 손의 거리를 정전용량으로
        읽고, 음정 안테나에 손이 가까울수록 음이 높아진다는 것. 곁들일 것이 있다면 전자기 유도 — 자석을 가만히 두면 아무 일도 없고 **움직여야** 전류가 생긴다는 것(1831년
        패러데이), 그게 오늘날 모든 발전기와 변압기의 원리라는 것. 연도와 개략 수치까지만, 정확한 주파수 값은 말하지 않는다. ⚠️ '전기 없이 켜진다'고 말하지 않는다 —
        **전선 없이** 켜지는 것이다.
    전문가:
      mc_brief: 이 도구들이 앞에서 다룬 전파 이야기의 물리적 바탕에 해당한다는 점을 전제로 깔고, 어떤 원리들이 모여 있는지 도슨트에게 묻는다.
      docent_brief: 도구들을 **원리 축으로 묶어서** 말한다 — 정전기(전하의 축적), 전자기 유도(1831년 패러데이, 변하는 자기장이 기전력을 만든다), 전자기
        회전 (1821년 패러데이의 호모폴라 전동기 — 최초로 만들어진 전동기, 정류자가 없다), 공진(1891년 테슬라 코일 — 고전압·저전류·고주파 교류를 내는 공진 변압기),
        검파(1890년 브랑리의 발견에 기반한 코히러 — 금속가루가 응집해 저항이 떨어지고, 신호마다 두드려 되돌려야 했으며 1907년경 더 민감한 검파기로 대체됐다), 표시(오실로스코프
        — 전압을 시간의 함수로 그린다. 그 화면의 조상인 음극선관은 **1897년 페르디난트 브라운**이 만들었고, 브라운은 1909년 마르코니와 노벨 물리학상을 공동 수상했다
        — 첫 섹션의 이야기로 고리가 닫힌다). 테레민은 **헤테로다인 원리**로, 500kHz 미만으로 맞춘 발진기 둘의 주파수 차를 가청음으로 쓰며 안테나는 전파용이 아니라
        커패시터 극판이라는 점까지. 연도·원리 명칭을 그대로 말해도 된다. ⚠️ 체험관에 어떤 기종이 실제로 놓여 있는지는 미확인이므로, 눈앞에 보이는 것만 이름으로 부르고 없는
        것을 있다고 말하지 않는다.
- id: 19-closing
  title: 마무리
  mc: 오늘의 전파체험관 이야기는 이것으로 마칩니다. 도슨트, 마무리 인사 부탁해요.
  mc_after: 저도 감사드립니다. 질문이 남았다면 지금 말씀해 주세요. 오늘 이야기가 전파를 조금 더 가깝게 느끼는 계기가 되었기를 바랍니다. 고맙습니다.
  docent_brief: 관람해 주셔서 감사하다는 인사를 하고, 궁금한 점이 있으면 질문을 받는다고 안내하고, 해상무선통신 부스 앞에서 기념촬영을 안내한다는 것. 원장에 없는 안내(다른
    장소·다른 절차)를 덧붙이지 않는다.
  gaze: audience
  topic: 해설 종료 인사와 되짚기 — 새 정보 없이 닫는다
  briefs:
    초등:
      mc_brief: 오늘 이야기가 끝났다는 것을 밝게 알리고 도슨트에게 마지막 인사를 부탁한다. 새로운 이야기를 덧붙이지 않는다.
      docent_brief: 와 줘서 고맙다는 인사와, 오늘 본 것 가운데 **딱 하나**만 되짚는다 — 눈에 보이지 않는 전파를 사람이 찾아내서 지금처럼 쓰게 됐다는 것. 새로운
        사실· 숫자·장소 안내를 덧붙이지 않는다. 마지막은 밝은 인사로 닫는다.
    중고등:
      mc_brief: 해설을 마무리하며 도슨트에게 인사를 넘긴다. 요약을 사회자가 대신 해 버리지 않는다.
      docent_brief: 감사 인사와 함께 오늘의 줄기를 한 문장으로 되짚는다 — 전파는 발명이 아니라 발견이었고, 그것을 통신에 쓰기 시작하면서 방송과 이동통신으로 이어졌으며,
        지금은 국가가 기준을 두고 관리한다는 흐름. **앞 섹션에서 말하지 않은 사실은 꺼내지 않는다.** 안내는 원장에 있는 것만 한다.
    일반:
      mc_brief: 오늘 해설이 끝났음을 알리고 도슨트에게 마무리 인사를 넘긴다. 새 주제를 열지 않는다.
      docent_brief: ① 관람해 주셔서 감사하다는 인사. ② 오늘의 줄기를 짧게 되짚기 — 발견에서 실용화로, 방송과 이동통신으로, 그리고 전파품질 관리와 인체보호기준으로
        이어지는 순서. ③ 궁금한 점이 남았으면 지금 물어봐도 된다는 안내. ④ 원장에 있는 기념촬영 안내. 되짚기에서 **연도나 수치를 새로 꺼내지 않는다** — 앞에서 이미
        말한 것만 재사용한다. 확인되지 않은 장소·절차 안내를 덧붙이지 않는다.
    전문가:
      mc_brief: 오늘 다룬 범위를 한 줄로 정리하고 도슨트에게 마무리를 넘긴다. 마지막에 새 쟁점을 던져 해설을 다시 열지 않는다.
      docent_brief: 감사 인사와 함께 오늘 다룬 축을 제도의 관점에서 되짚는다 — 이론(맥스웰)·실증(헤르츠)·실용화(마르코니)로 이어지는 발견의 계보, 그것이 방송과
        이동통신 세대 전환으로 이어진 경로, 그리고 전파법 제47조의2를 축으로 한 전자파 인체보호기준·전자파 등급제·무선국 검사라는 관리 체계. 남은 쟁점은 '기준 이하 노출의
        장기 영향은 국제적으로도 연구가 계속되고 있다' 정도로 **열어 둔 채** 닫고, 결론을 내리지 않는다. 새 수치·새 고시 번호를 추가하지 않는다 — 전부 앞 섹션에서
        이미 말한 것의 재배열이어야 한다. 마지막은 원장에 있는 안내와 인사로 마친다.
