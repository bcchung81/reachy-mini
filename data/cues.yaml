# 전파체험관 큐시트 — 기계 판독 계층.
#
# 정본은 docs/exhibit-guide.md 다. 이 파일은 그 위에 얹은 **진행 단위**다.
#   mc            고정 대사. 사회자가 화제를 열고 넘긴다. 결정적이어야 한다
#   docent_brief  LLM 에게 주는 지시이지 대사가 아니다. 여기서 살이 붙는다
#   mc_after      도슨트 뒤 사회자의 받아치기 + 관람객 창구 안내. 고정 대사.
#                 마이크가 열려도 관람객은 모른다 — 말로 연다(리뷰 B2)
#   gaze          partner(상대를 본다) | audience(관람객을 본다)
#
# 사회자 대사는 **대담 프레임**이다. 두 로봇은 책상 위에 고정돼 있고 관람객이
# 움직이므로 "여기는 ~존입니다" 같은 위치 지시어를 쓰지 않는다(원장 「걷어낸 것」,
# 리뷰 B4). 주제를 넘기는 말로 연다.
#
# 사회자 대사가 고정이라 관람객이 "다음"이라 말한 즉시 받아칠 수 있고,
# 그 3~5초 동안 도슨트 대사를 생성한다 — LLM 지연이 전환에 실리지 않는다.

- id: "01-intro"
  title: "체험관 개요"
  mc: "안녕하세요, 전파체험관 이야기 시간에 오신 것을 환영합니다. 오늘 진행은 제가, 해설은 제 옆의 도슨트가 맡습니다. 도슨트, 먼저 이 체험관이 어떤 곳인지 소개해 줄래요?"
  mc_after: "네, 소개 고마워요. 궁금한 점은 언제든 저에게 말씀해 주세요. 다음 주제로 가려면 '다음'이라고 말씀해 주시면 됩니다."
  docent_brief: "KCA가 방송·통신·전파 분야의 교육·홍보, 자료 보존, 연구를 위해 세운 곳이고 2020년 11월에 개관했다는 것. 3문장 이내. 상대연도('몇 년 전')를 쓰지 말고 절대연도로만 말한다."
  gaze: partner

- id: "02-history"
  title: "전파의 발견 역사"
  mc: "첫 주제는 전파의 발견 역사입니다. 도슨트, 전파는 발명일까요, 발견일까요?"
  mc_after: "발명이 아니라 발견이라니, 저도 처음엔 헷갈렸어요. 질문 있으시면 말씀해 주시고, 이어가려면 '다음'이라고 해 주세요."
  docent_brief: "전파는 발명이 아니라 발견이라는 대비가 핵심 훅. 1785년에 존재가 처음 발견됐고, 1901년 마르코니가 영국에서 캐나다까지 1600마일 떨어진 곳으로 모스 신호를 보내 장거리 무선전신에 성공했다는 것. 4문장 이내."
  gaze: partner

- id: "03-theory"
  title: "전파 이론 — 주파수와 파장"
  mc: "그럼 전파가 정확히 무엇인지 원리로 들어가 보죠. 도슨트, 주파수와 파장을 쉽게 풀어 주세요."
  mc_after: "퐁당퐁당 물결 비유가 쏙 들어오네요. 궁금한 게 있으면 지금 물어보셔도 좋습니다. 아니면 '다음'이요."
  docent_brief: "전파는 전기와 자기가 파동의 형태로 퍼져나가는 것이고 볼 수도 만질 수도 없다는 것. '퐁당퐁당'처럼 돌로 일으킨 물결이 건너편 손등에 닿는 비유를 쓴다. 단위는 주파수, 표기는 헤르츠 — 1초에 1회 진동하면 1헤르츠, 1000회면 1킬로헤르츠. 4문장 이내."
  gaze: partner

- id: "04-morse"
  title: "전파이야기 체험 — 모스부호·헤르츠 실험·라이덴 병"
  mc: "체험관에는 직접 만져볼 수 있는 장치들도 있다고 들었어요. 도슨트, 전파이야기 체험존에서는 무엇을 해볼 수 있나요?"
  mc_after: "모스부호를 직접 쳐볼 수 있다니 재미있겠어요. 질문 있으신가요? 없으면 '다음'이라고 말씀해 주세요."
  docent_brief: "모스부호 변환기(문구를 넣으면 부호가 표시되고 송신키로 직접 쳐볼 수 있음), 헤르츠 실험 도구(스위치를 켜면 구리판으로 고전압이 흘러 전파가 발사되고 원형 고리에서 검출돼 네온전구가 켜짐), 라이덴 병(정전기를 저장하는 최초의 축전지). 4문장 이내."
  gaze: audience

- id: "05-donor"
  title: "기증자 — 장황남 박사"
  mc: "이 체험관 정식 이름에는 사람 이름이 하나 들어 있습니다. 도슨트, 장황남 박사가 누구인지 소개해 주세요."
  mc_after: "의학박사가 통신 장비를 모았다는 게 뜻밖이죠. 궁금한 점 있으시면 말씀해 주시고, 이어가려면 '다음'이요."
  docent_brief: "체험관 정식 명칭에 이름이 들어간 기증자라는 것과, 원장 §5 에 적힌 생애·기증 내역을 그대로 옮긴다. 3문장 이내. 상대연도('몇 년 전')를 쓰지 않고 절대연도로만 말한다. 원장에 없는 사실을 덧붙이지 않는다."
  gaze: partner

- id: "06-bands"
  title: "주파수 대역별 기증품 — 초장파에서 밀리미터파까지"
  mc: "그 기증품을 주파수 대역별로 둘러볼 차례입니다. 도슨트, 어떤 대역의 장비들이 전시돼 있나요?"
  mc_after: "초장파부터 밀리미터파까지, 범위가 정말 넓네요. 질문 있으면 말씀해 주세요. 다음으로 가려면 '다음'입니다."
  docent_brief: "ITU가 전파를 낮은 주파수부터 높은 주파수까지 10개 대역으로 분류하는데 체험관에는 그중 8개 대역 장비가 전시돼 있다는 것, 대역 이름은 파장 길이(100km~1mm)와 연관된다는 것. 1920년 제작 진공관 라디오 'Masterpiece'나 1980년대 무선호출기(삐삐) 같은 구체적인 전시품을 한두 개 예로 들어도 좋다. 5문장 이내. 원장 표에 없는 대역 성질은 지어내지 않는다. 절대연도로만 말한다."
  gaze: audience

- id: "07-maritime"
  title: "해상무선통신"
  mc: "이번 주제는 바다 위의 무선통신입니다. 도슨트, 타이타닉호 이야기를 들려주세요."
  mc_after: "마지막까지 구조 신호를 보낸 전신기사 이야기가 뭉클하네요. 궁금한 점 있으신가요? 없으면 '다음'이라고 해 주세요."
  docent_brief: "1912년 4월 타이타닉호가 침몰할 때 전신기사 잭 필립스가 죽는 순간까지 모스부호로 구조를 요청했고, 세 시간 거리에 있던 여객선이 이를 듣고 695명을 구조했다는 것. 이 사고가 계기가 되어 국제해상조난안전시스템(GMDSS)이 만들어졌고 1992년에 도입됐다는 것. 4문장 이내. 절대연도로만 말한다. '바다에 빠진 사람'처럼 구조 대상을 단정하는 수식어는 쓰지 않는다."
  gaze: partner

- id: "08-aviation"
  title: "항공무선통신과 시뮬레이터"
  mc: "바다 다음은 하늘입니다. 도슨트, 항공무선통신 코너와 시뮬레이터에서는 무엇을 해볼 수 있나요?"
  mc_after: "조종석에 앉아 이륙까지 해볼 수 있다니 인기가 많겠어요. 질문 있으시면 말씀해 주시고, 이어가려면 '다음'이요."
  docent_brief: "실제 조종사 교육용 장비를 이착륙 체험용으로 개조한 항공 시뮬레이터가 있고, 조종석은 계기 본체(속도·고도·방향)·패들(브레이크·지상 방향 전환)·요크(고도 상승·하강, 방향 전환)·스로틀(엔진 출력 제어)로 구성된다는 것. 실제 이륙 절차는 미리 세팅해 두고 체험한다는 것과, 착륙 체험은 시간관계상 생략한다는 것만 말한다. 시뮬레이터의 기종은 언급하지 않는다 — 확인되지 않았다. 5문장 이내."
  gaze: audience

- id: "09-special-exhibit"
  title: "특별교류전시"
  mc: "특별교류전시라는 코너도 있다고 들었습니다. 도슨트, 지금은 어떤 것이 전시돼 있나요?"
  mc_after: "군용 장비는 튼튼한 대신 무겁다는 점이 인상적이네요. 궁금한 점은 말씀해 주시고, 다음 주제로 가려면 '다음'입니다."
  docent_brief: "유관기관과 교류해 특별 전시품을 일정 기간 전시하는 공간이라는 것, 지금은 조선대학교 장황남 전파통신박물관에서 전시되던 전쟁 관련 군사장비 — 군용 헤드셋과 마이크, 간첩이 사용했던 무전기 등 — 가 전시돼 있다는 것, 군사장비는 내구도를 높이느라 튼튼하지만 무겁다는 것. 3문장 이내. 전시 시작·종료 연도는 원장에 없으니 지어내지 않는다."
  gaze: audience

- id: "10-ham"
  title: "아마추어 무선통신 (HAM)"
  mc: "이번엔 취미로 즐기는 무선통신, 아마추어 무선입니다. 도슨트, 햄이 뭔가요?"
  mc_after: "취미가 재난 때는 통신망이 된다는 게 멋지네요. 질문 있으신가요? 없으면 '다음'이라고 말씀해 주세요."
  docent_brief: "직업이 아니라 취미로 즐기는 무선 통신이 아마추어 무선(HAM)이라는 것, 영화 '동감'(2000)에서 두 주인공이 햄으로 교감한 것이 훅이 될 수 있다는 것, 전파를 이용하는 전기적 설비가 무선설비, 이를 운용하는 사람이 무선종사자, 둘을 합쳐 무선국이라 전파법이 규정한다는 것, 아마추어 무선은 비상시 재난통신망으로도 쓸 수 있어 KCA가 9개 지역본부에 아마추어 무선국을 개설해 두었다는 것. 5문장 이내. 절대연도로만 말한다."
  gaze: partner

- id: "11-iot"
  title: "사물인터넷"
  mc: "다음 주제는 사물인터넷입니다. 도슨트, 체험관에서는 무엇을 해볼 수 있나요?"
  mc_after: "태블릿으로 전구 색을 바꾸는 체험, 아이들이 좋아하겠어요. 궁금한 점 있으면 말씀해 주시고, 이어가려면 '다음'이요."
  docent_brief: "사람·사물·공간이 모두 인터넷으로 연결돼 정보를 공유·활용하는 초연결 인터넷이라는 것, 전시된 전구를 태블릿으로 밝기와 색상을 바꿀 수 있다는 것, 지금은 무선으로 불을 켜고 끄는 정도지만 5G와 접목되면 완전 자율주행·능동 제어로 나아간다는 것. 3문장 이내."
  gaze: audience

- id: "12-multimedia"
  title: "KCA 멀티미디어실"
  mc: "KCA가 방송 콘텐츠도 지원한다고 하던데요. 도슨트, 멀티미디어실에서는 어떤 콘텐츠를 볼 수 있나요?"
  mc_after: "아마존의 눈물이 KCA 지원작이었군요. 질문 있으시면 말씀해 주세요. 다음으로 가려면 '다음'입니다."
  docent_brief: "방송통신 진흥과 관련된 콘텐츠를 볼 수 있는 공간이라는 것, KCA가 제작을 지원한 방송프로그램 '아마존의 눈물', '남극의 눈물', '최후의 제국', '슈퍼 피쉬'를 예로 든다는 것, 전국 6개소 스마트미디어센터와 매년 여는 스마트미디어 X캠프, 일산 빛마루방송지원센터로 제작 전 과정을 지원한다는 것, 키오스크로 지원 작품을 시청할 수 있다는 것. 5문장 이내. 원장에 없는 프로그램명을 지어내지 않는다."
  gaze: audience

- id: "13-chromakey"
  title: "크로마키 체험"
  mc: "크로마키 체험 코너 이야기도 해 보죠. 도슨트, 크로마키가 뭔가요?"
  mc_after: "찍은 사진을 메일로 받을 수 있다니 기념이 되겠네요. 궁금한 점 있으신가요? 없으면 '다음'이라고 해 주세요."
  docent_brief: "크로마키는 다른 카메라로 촬영한 배경에 전경을 합성하는 기법으로 SF 영화나 뉴스 날씨예보에 많이 쓰인다는 것, 그린스크린 앞에서 화면 합성을 체험할 수 있고 촬영한 사진은 메신저나 메일로 받을 수 있다는 것. 3문장 이내."
  gaze: audience

- id: "14-mobile"
  title: "이동통신"
  mc: "이번 주제는 휴대폰의 발전, 이동통신입니다. 도슨트, 1세대부터 5세대까지 어떻게 달라졌나요?"
  mc_after: "카폰이 아파트 한 채 값이었다니 놀랍네요. 질문 있으시면 말씀해 주시고, 이어가려면 '다음'이요."
  docent_brief: "1세대는 들고 다닌 게 아니라 차량에 싣고 다닌 카폰으로 아파트 한 채 값이었고 이어 '벽돌폰'이 나왔다는 것, 2세대는 통화와 문자가 되고 1세대보다 크기·무게가 크게 줄었다는 것, 3세대는 영상통화까지 가능해 카메라를 돌리거나 전면에 단 모델이 많았다는 것, 4세대는 LTE라는 것, 5세대는 2019년 세계 최초로 상용화됐고 완전히 구축되면 LTE보다 최대 20배 빠르고 초저지연이라는 것. SKT가 지원한 기지국 장비도 전시돼 있다는 것. 6문장 이내. 절대연도로만 말한다."
  gaze: audience

- id: "15-emf"
  title: "전자파 측정"
  mc: "지금부터는 KCA가 정부에서 위탁받은 전파품질 관리 업무 이야기입니다. 도슨트, 전자파는 안전한가요?"
  mc_after: "거리를 조금만 두면 괜찮다는 게 핵심이군요. 이 주제는 질문이 많을 것 같아요. 말씀해 주시고, 아니면 '다음'입니다."
  docent_brief: "전자파 강도는 인체보호기준에 맞춰 1등급부터 경고등급까지 4단계로 나뉜다는 것, 주변 전자파를 실시간 측정해 세 가지 불빛으로 표시하는 모니터링 장비가 전시돼 있다는 것, 초단파 무전기를 장비 바로 옆에서 송신하면 불빛이 빨간색으로 바뀌지만 거리를 조금만 떨어뜨리면 변하지 않는다는 것 — 전자파 강도가 거리에 따라 급격히 감소해 일정 거리를 두면 인체에 유해하지 않다는 뜻. 4문장 이내."
  gaze: audience

- id: "16-inspection"
  title: "무선국 검사"
  mc: "전파품질 관리의 또 다른 축, 무선국 검사입니다. 도슨트, 무선국 검사가 뭔가요?"
  mc_after: "전파가 한정된 자원이라 관리가 필요하다는 말이 와닿네요. 궁금한 점 있으신가요? 없으면 '다음'이라고 해 주세요."
  docent_brief: "전파는 한정된 자원이라 많은 사람이 함께 쓰려면 관리가 필요하고, 전파를 법적 기준에 맞게 쓰고 있는지 확인하는 것이 무선국 검사라는 것, KCA는 1981년부터 정부 위탁을 받아 무선국 검사를 시행해 왔다는 것, 선박·항공기·이동통신 등의 전파를 검사하기 위해 KCA가 예전부터 사용한 장비들이 전시돼 있다는 것. 4문장 이내. 절대연도로만 말한다."
  gaze: audience

- id: "17-rover"
  title: "원격 무선조종 차량 — 행성 탐사"
  mc: "체험관에는 행성 탐사 체험도 있다고 들었어요. 도슨트, 원격 무선조종 차량 코너는 무엇을 하는 곳인가요?"
  mc_after: "월면차를 몰고 미션을 수행한다니 게임 같네요. 질문 있으시면 말씀해 주시고, 이어가려면 '다음'이요."
  docent_brief: "증강현실로 미지의 행성을 탐사하는 체험이고 아폴로호의 월면차와 달 표면을 형상화해 현실감을 높였다는 것, 미래의 초저지연 전파응용 원격조종을 상상하며 지구에서 탐사로봇을 조종해 물·생명체·광물자원의 흔적을 찾는 미션을 게임처럼 수행한다는 것. 3문장 이내."
  gaze: audience

- id: "18-science"
  title: "과학 원리 실험 도구"
  mc: "마지막 주제는 전파와 관련된 기초 과학 실험 도구들입니다. 도슨트, 무엇이 있나요?"
  mc_after: "손을 대지 않고 연주하는 테레민, 꼭 들어보고 싶네요. 마지막으로 궁금한 점 있으신가요? 없으면 '다음'이라고 해 주세요."
  docent_brief: "정전기 발생 장치, 전자기 유도(패러데이의 법칙), 호모폴라 전동기, 오실로스코프(목소리를 파동의 형태로 봄), 코히러 전파 검출기(초창기 전파 검출 방식), 테슬라 코일(형광등을 가까이 대면 전기 없이 불이 켜짐), 테레민(1924년 러시아 음향물리학자 레온 테레민이 발명한, 연주자가 접촉하지 않고 연주하는 악기 — 두 고주파의 간섭으로 소리를 내고 긴 안테나에 손이 가까우면 높은 음, 멀어지면 낮은 음, 왼쪽은 볼륨 조절)이 있다는 것. 이 중 한두 가지를 골라 소개한다. 5문장 이내. 절대연도로만 말한다."
  gaze: audience

- id: "19-closing"
  title: "마무리"
  mc: "오늘의 전파체험관 이야기는 이것으로 마칩니다. 도슨트, 마무리 인사 부탁해요."
  mc_after: "저도 감사드립니다. 질문이 남았다면 지금 말씀해 주세요. 즐거운 관람 되시길 바랍니다."
  docent_brief: "관람해 주셔서 감사하다는 인사를 하고, 궁금한 점이 있으면 질문을 받는다고 안내하고, 해상무선통신 부스 앞에서 기념촬영을 안내한다는 것. 3문장 이내. 원장에 없는 안내(다른 장소·다른 절차)를 덧붙이지 않는다."
  gaze: audience
