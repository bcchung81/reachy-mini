# ElevenLabs 읽기 표기 사전 — 원문 낱말 → 소리 내 읽는 표기.
#
# 쓰는 곳: tts_elevenlabs.el_request(굽기·캐시 프록시의 관람객 답). 합성 직전에만 바꾼다 —
# 대본(data/cues.yaml)·캐시 키·검증기·교육자료 카드는 원문 그대로다. 그래서 발음을 고치려고 대본을 고치지 않는다.
#
# 넣는 법: 재청취에서 틀리게 읽은 낱말만 넣고, 그 낱말이 든 문장만 다시 굽는다.
#   TTS_ENGINE=elevenlabs ./reachy.sh bake --retake-readings   ← 이 사전의 낱말이 든 문장만(앞 테이크는 .prev/ 에)
#   TTS_ENGINE=elevenlabs ./reachy.sh bake --retake 노슨트     ← 사전 없이 테이크만 다시(낱말이 든 문장)
# 읽기 표기는 캐시 키에 들어가지 않는다 — 사전만 고치고 다시 굽지 않으면 옛 소리가 그대로 나간다.
# 긴 낱말부터 바꾼다(겹치는 짧은 낱말이 먼저 바뀌어 긴 낱말이 깨지지 않게).
#
# 예:
#   GMDSS: 지엠디에스에스
#   VLF: 브이엘에프
#
# 넣지 않은 것(기록): '넣는데 → 넌는데'(13-chromakey 1턴 일반) — STT 가 테이크 4개 모두 '놓는데'로 받아써 시도했으나
# 표기를 바꾼 테이크 3개도 똑같이 '놓는데'였다. 소리가 아니라 STT 가 흔한 말('합성해 놓는데')로 끌린 것으로 보고 뺐다(2026-11-12).
readings: {}
