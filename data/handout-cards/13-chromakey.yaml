id: 13-chromakey
levels:
  초등:
    headline: 초록색만 쏙 빼고 다른 그림을 넣는 기술이에요
    items:
    - t: 크로마키
      b: 초록색 천 앞에 서면 그 초록색만 쏙 빼고 다른 그림을 넣을 수 있어요. 가만히 서 있어도 다른 곳에 간 것처럼 보여요.
    - t: 쓰이는 곳
      b: 날씨를 알려 주는 방송이나 영화에서 많이 써요. 기상 캐스터 뒤에 지도가 나오는 것도 이 기술이에요.
    remember: 가만히 서 있어도 다른 곳에 간 것처럼 보여요.
    visual:
      type: keyfact
      at: 0
      facts:
      - big: 초록색 천
        label: 초록색만 쏙 빼고 다른 그림을 넣어요
  중고등:
    headline: 특정 색을 투명하게 만들고 다른 영상을 합성해요
    items:
    - t: 크로마키 기법
      b: 특정 색을 골라내 투명하게 만들고, 그 자리에 다른 영상을 합성하는 기법이에요. 그래서 초록 천 앞에 서면 배경만 쏙 바뀌어요.
    - t: 쓰이는 곳
      b: 날씨예보나 영화에서 많이 쓰여요. 실제로는 아무것도 없는 천 앞에 서 있는데 화면에는 다른 배경이 보여요.
    remember: 실제로는 천 앞에 서 있는데 화면에는 다른 배경이 보여요.
    visual:
      type: steps
      at: 0
      steps:
      - k: 고르기
        v: 특정 색을 골라내요
      - k: 투명
        v: 그 색을 투명하게 만들어요
      - k: 합성
        v: 그 자리에 다른 영상을 넣어요
  일반:
    headline: 같은 자리에서 전혀 다른 장면을 만들 수 있어요
    items:
    - t: 크로마키 합성
      b: 다른 카메라로 찍은 배경 위에 전경을 합성하는 기법이에요. 특정 색을 골라 투명하게 만든 뒤 그 자리에 다른 화면을 넣어요.
    - t: 쓰이는 곳
      b: 뉴스 날씨예보나 공상과학 영화에서 많이 쓰여요. 촬영장에는 초록 천만 있고 배경은 나중에 합성해 넣어요.
    remember: 같은 자리에서 전혀 다른 장면을 만들 수 있어요.
    visual:
      type: steps
      at: 0
      steps:
      - k: 고르기
        v: 특정 색을 골라요
      - k: 투명
        v: 골라낸 색을 투명하게
      - k: 합성
        v: 그 자리에 다른 화면을 넣어요
  전문가:
    headline: 색상 키잉으로 특정 색 영역을 투명하게 처리해 합성한다
    items:
    - t: 색상 키잉
      b: 색상 키잉으로 특정 색 영역을 투명하게 처리하고 그 자리에 다른 영상을 합성한다. 전경과 배경을 따로 촬영해 합치는 구조이다.
    - t: 방송과 영화
      b: 방송 날씨예보와 영화 시각효과에서 널리 쓰인다. 배경을 따로 만들어 합성하므로 촬영이 끝난 뒤에도 장면을 바꿀 수 있다.
    remember: 전경과 배경을 따로 촬영해 합치므로 배경을 바꿔 끼우기가 자유롭다.
    visual:
      type: steps
      at: 0
      steps:
      - k: 촬영
        v: 전경과 배경을 따로 촬영
      - k: 키잉
        v: 특정 색 영역을 투명 처리
      - k: 합성
        v: 그 자리에 다른 영상을 합성
