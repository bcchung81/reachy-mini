id: 11-iot
levels:
  초등:
    headline: 물건들이 인터넷으로 연결돼 서로 말을 걸어요
    items:
    - t: 사물인터넷
      b: 전등이나 시계, 자동차 같은 물건들이 인터넷으로 서로 연결돼서, 물건들끼리 서로 말을 걸 수 있어요.
    - t: 멀리서 켜고 끄기
      b: 멀리 있어도 물건을 켜고 끄고, 지금 어떤지 알 수 있어요. 집에 가지 않아도 전등을 끌 수 있어요.
    - t: 많은 물건 연결
      b: 5세대 이동통신은 한꺼번에 아주 많은 물건을 연결할 수 있게 만들어졌어요. 앞으로 더 많은 물건이 서로 이야기하게 될 거예요.
    remember: 멀리 있어도 물건을 켜고 끄고, 지금 어떤지 알 수 있어요.
    visual:
      type: keyfact
      at: 0
      facts:
      - {big: 말을 걸어요, label: 인터넷으로 연결된 물건들}
  중고등:
    headline: 사물이 스스로 상태를 알리는 게 사물인터넷이에요
    items:
    - t: 사물인터넷
      b: 사물에 통신 기능을 붙여 서로 연결하고, 모인 정보로 서비스를 만들어요. 물건이 인터넷에 접속하는 셈이에요.
    - t: 스스로 알리는 사물
      b: 사람이 일일이 입력하지 않아도 사물이 스스로 상태를 알려요. 그래서 멀리서도 켜고 끄거나 상태를 확인할 수 있어요.
    - t: 5세대의 역할
      b: 5세대는 기기를 훨씬 많이, 훨씬 빠른 응답으로 연결할 수 있게 설계된 세대예요. 다만 5세대가 됐다고 뭐든 저절로 되는 건 아니에요.
    remember: 5세대가 됐다고 뭐든 저절로 되는 건 아니에요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 스스로 알림, label: 입력하지 않아도 사물이 상태를 알려요}
  일반:
    headline: 사물인터넷은 사물을 잇는 글로벌 인프라예요
    items:
    - t: 국제 표준의 정의
      b: 사물을 서로 연결해 진보된 서비스를 가능하게 하는 글로벌 인프라예요. 사물은 물리적인 것뿐 아니라 가상의 것도 포함해요.
    - t: 스스로 알리는 사물
      b: 사람이 하나하나 확인하지 않아도 사물이 스스로 상태를 알려 줘요. 그 정보를 모아 관리하거나 자동으로 반응하게 만들 수도 있어요.
    - t: 5세대의 성능 목표
      b: 5세대는 1제곱킬로미터에 백만 대 규모로 연결하고 밀리초 단위로 응답하는 걸 목표로 설계됐어요. 이건 성능 목표이지 자율주행의 달성을 뜻하진 않아요.
    remember: 5세대는 성능 목표일 뿐, 자율주행의 달성을 뜻하진 않아요.
    visual:
      type: keyfact
      at: 2
      facts:
      - {big: 백만 대, label: 1제곱킬로미터에 연결하는 목표 규모}
      - {big: 밀리초, label: 응답 속도 목표의 단위}
  전문가:
    headline: 사물인터넷은 정보사회를 위한 글로벌 인프라다
    items:
    - t: ITU-T Y.4000 정의
      b: 사물인터넷을 정보사회를 위한 글로벌 인프라로 정의한다. 물리적 사물과 가상 사물을 구분하고, 기기는 통신 기능을 가진 장치로 따로 규정한다.
    - t: 사물이 출발점
      b: 사람의 개입 없이 사물이 상태를 보고하고 제어되는 구조다. 표준은 이를 사물 간 통신과 그 위의 서비스 계층으로 나눠 규정한다.
    - t: 5세대 요구조건
      b: 대규모 기기 연결과 초저지연이 사물인터넷에 대응한다. 연결밀도 1제곱킬로미터당 백만 대, 사용자평면 지연 1밀리초는 무부하 단일 사용자 가정의 무선 구간 값이다.
    remember: 수치는 조건과 함께 읽는 성능 목표이지, 응용의 달성이 아니다.
    visual:
      type: keyfact
      at: 2
      facts:
      - {big: 백만 대, label: 1제곱킬로미터당 · mMTC 평가용}
      - {big: 1밀리초, label: URLLC 지연 · 무부하 무선 구간 편도}
    facts_used: [0, 1, 2, 3, 4]
