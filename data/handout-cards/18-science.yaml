id: 18-science
levels:
  초등:
    headline: 손을 대지 않고도 소리가 나는 악기가 있어요
    items:
    - t: 손만 움직이는 악기
      b: 손을 대지 않고 허공에서 손만 움직여 연주하는 악기가 있어요. 손을 가까이 가져가면 소리가 높아지고, 멀리 하면 낮아져요.
    - t: 눈에 보이지 않는 힘
      b: 마법 같지만 마법이 아니에요. 눈에 보이지 않는 전기의 힘이 손이 가까이 왔는지 알아채는 거예요.
    remember: 마법 같지만 마법이 아니에요. 보이지 않는 전기의 힘이에요.
    visual:
      type: keyfact
      at: 0
      facts:
      - big: 가까이
        label: 손을 가까이 가져가면 소리가 높아져요
      - big: 멀리
        label: 손을 멀리 하면 소리가 낮아져요
  중고등:
    headline: 테레민은 센서 연구에서 나온 악기예요
    items:
    - t: 테레민
      b: 1920년에 만들어졌어요. 악기를 만들려던 게 아니라 가까이 온 것을 알아채는 센서 연구에서 나온 물건이에요.
    - t: 손과 축전기
      b: 두 금속 막대는 안테나처럼 생겼지만 전파를 주고받는 안테나가 아니에요. 손과 함께 축전기가 돼서 손의 거리를 알아채요.
    remember: 안테나처럼 생겼지만, 손과 함께 축전기가 돼서 거리를 알아채요.
    visual:
      type: keyfact
      at: 0
      facts:
      - big: 1920년
        label: 테레민이 만들어진 해
      - big: 센서 연구
        label: 가까이 온 것을 알아채는 연구에서 나왔어요
  일반:
    headline: 테레민은 근접 센서 연구에서 나온 악기예요
    items:
    - t: 테레민
      b: 1920년 러시아 물리학자 레온 테레민이 만들었어요. 원래는 근접 센서 연구에서 나온 물건이고, 미국 특허는 1928년이에요.
    - t: 축전기 극판
      b: 전파용 안테나가 아니라 축전기 극판으로 작동해요. 손이 가까워지면 정전용량이 달라지고, 음정 안테나에 손이 가까울수록 음이 높아져요.
    remember: 두 금속 막대는 안테나가 아니라 축전기 극판이에요.
    visual:
      type: keyfact
      at: 0
      facts:
      - big: 1920년
        label: 레온 테레민이 만들었어요
      - big: 1928년
        label: 미국 특허를 받았어요
  전문가:
    headline: 기초 과학 실험 도구는 원리별로 묶인다
    items:
    - t: 원리별 구성
      b: 정전기, 전자기 유도, 전자기 회전, 공진, 검파, 표시까지 원리별로 모여 있다. 1831년 패러데이의 전자기 유도에서 오실로스코프까지 이어진다.
    - t: 헤테로다인 원리
      b: 500kHz 미만으로 맞춘 발진기 두 개의 주파수 차를 가청음으로 쓴다. 안테나는 전파용이 아니라 커패시터 극판으로, 손의 거리를 정전용량으로 읽는다.
    remember: 안테나는 전파용이 아니라 커패시터 극판이다.
    visual:
      type: steps
      at: 0
      title: 원리별로 모인 실험 도구
      steps:
      - k: 정전기
        v: 전하의 축적
      - k: 전자기 유도
        v: 1831년 패러데이
      - k: 전자기 회전
        v: 1821년 패러데이
      - k: 공진
        v: 1891년 테슬라 코일
      - k: 검파·표시
        v: 코히러 · 오실로스코프
    facts_used: [3, 4, 6, 10, 12, 15, 18]
