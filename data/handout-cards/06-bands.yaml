id: 06-bands
levels:
  초등:
    headline: 길이가 다르면 전파가 잘하는 일도 달라요
    items:
    - t: 여러 종류의 전파
      b: 아주 길게 출렁이는 것부터 쌀알만큼 짧게 떨리는 것까지 여러 종류가 있어요.
    - t: 긴 전파와 짧은 전파
      b: 긴 전파는 언덕을 빙 돌아서 넘어가고, 짧은 전파는 곧게 쭉 나아가요.
    - t: 세계의 약속
      b: 세계가 함께 쓰는 약속으로 구간을 나누고 이름을 붙여 뒀어요.
    remember: 길이가 다르면 잘하는 일도 달라서 나눠 놓았어요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 긴 전파, label: 언덕을 빙 돌아서 넘어가요}
      - {big: 짧은 전파, label: 곧게 쭉 나아가요}
  중고등:
    headline: 주파수에 따라 전파의 성질이 달라요
    items:
    - t: 주파수와 파장
      b: 주파수가 낮을수록 한 번 출렁이는 길이, 즉 파장이 길고, 높을수록 짧아져요.
    - t: 멀리 가는 전파, 곧게 가는 전파
      b: 파장이 긴 전파는 장애물을 휘돌아 땅을 따라 지평선 너머까지 가요. 짧은 전파는 빛처럼 곧게 나아가요.
    - t: 국제기구의 구분
      b: 성질이 다르니까 국제기구가 구간을 나누고 이름과 쓰임새를 정해 뒀어요.
    remember: 주파수가 낮을수록 파장이 길고, 높을수록 짧아요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 긴 파장, label: 장애물을 휘돌아 넘어가요}
      - {big: 짧은 파장, label: 빛처럼 곧게 나아가요}
  일반:
    headline: 전파는 주파수 순서로 나눠 이름을 붙여요
    items:
    - t: 주파수와 파장
      b: 초장파는 주파수가 아주 낮은 쪽, 밀리미터파는 아주 높은 쪽이에요. 파장으로는 100km에서 1mm까지예요.
    - t: 대역별 전파 방식
      b: 낮은 주파수는 언덕을 휘돌아 지평선 너머까지 가요. 초단파부터는 곧게 가고, 단파는 전리층에서 꺾여 멀리 가기도 해요.
    - t: ITU의 구분
      b: 국제전기통신연합, ITU가 전파를 주파수 순서로 나누고 구간마다 이름을 붙였어요. 초장파는 VLF, 밀리미터파는 EHF처럼 영어 기호도 있어요.
    remember: 파장이 길수록 멀리 돌아가고, 짧을수록 곧게 가요.
    visual:
      type: keyfact
      at: 0
      facts:
      - {big: VLF, label: 초장파 · 주파수가 낮은 쪽 끝}
      - {big: EHF, label: 밀리미터파 · 주파수가 높은 쪽 끝}
      - {big: 100km~1mm, label: 이 코너가 다루는 파장 범위}
  전문가:
    headline: 대역 이름은 주파수 기준과 파장 기준 두 계열이다
    items:
    - t: 파장과 주파수
      b: 파장은 주파수에 반비례한다. 제목의 범위는 3kHz~300GHz이고, 파장으로는 100km~1mm이다.
    - t: 전파 방식
      b: VLF~MF는 회절로 장애물을 넘는 지표파, VHF 이상은 가시선 전파가 주를 이룬다. 중파와 단파는 전리층 굴절로 대륙 간 거리까지 가기도 한다.
    - t: ITU-R 권고 V.431-8
      b: 대역번호 N은 0.3×10^N Hz에서 3×10^N Hz로 정한다. 초장파는 주파수 기준, 밀리미터파는 파장 기준 이름이다.
    remember: 파장이 길수록 멀리 간다고 단정할 수는 없다.
    visual:
      type: keyfact
      at: 2
      facts:
      - {big: 주파수 기준, label: VLF·LF·MF·HF·VHF·UHF·SHF·EHF}
      - {big: 파장 기준, label: 미리어미터파 ~ 밀리미터파}
      - {big: 100km~1mm, label: VLF~EHF 구간의 파장}
    facts_used: [2, 4, 10, 11, 12, 13, 14]
