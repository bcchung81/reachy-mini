id: 15-emf
levels:
  초등:
    headline: 전자파는 멀어질수록 빠르게 약해져요
    items:
    - t: 멀어질수록
      b: 전자파는 멀어질수록 빠르게 약해져요. 그래서 정해 둔 선을 넘지 않는지 계속 재고 있어요.
    - t: 세기 표시
      b: 커다란 안테나가 있는 곳에는 얼마나 센지 보여 주는 표시가 붙어 있어요. 어른들이 정해진 때마다 재서 확인해요.
    - t: 나라가 정한 선
      b: 안전하다거나 위험하다고 딱 잘라 말하긴 어려워요. 다만 나라가 정해 둔 선이 있고, 그 선을 넘지 않게 계속 확인해요.
    remember: 나라가 정해 둔 선을 넘지 않는지 계속 확인하고 있어요.
    visual:
      type: keyfact
      at: 0
      facts:
      - {big: 난롯불, label: 한 걸음 물러나면 덜 뜨거운 것처럼}
  중고등:
    headline: 얼마나 센지는 어디서 쟀는지도 함께 말해요
    items:
    - t: 거리와 기준
      b: 세기가 거리에 따라 빠르게 줄어요. 나라가 일반인 기준과 직업인 기준을 따로 두고 판단해요.
    - t: 등급 라벨
      b: 기지국 같은 설비에는 기준 대비 세기를 보여 주는 등급 라벨을 붙이게 돼 있어요. 2014년부터 시행됐어요.
    - t: 건강 영향
      b: 국제기구는 기준 이하에서 건강에 나쁜 영향이 확인된 적은 없다고 정리해요. 다만 연구가 아직 진행 중이라 안전하다고 단정하지는 않아요.
    remember: 기준 이하에서 나쁜 영향이 확인된 적은 없지만, 안전하다고 단정하지는 않아요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 2014년, label: 기지국 같은 설비의 등급 라벨 시행}
  일반:
    headline: 기준이 따로 있고, 어디서 쟀는지가 늘 함께 가요
    items:
    - t: 인체보호기준
      b: 전파법에 따라 국가가 정했고, 일반인 기준과 직업인 기준이 따로 있어요. 세기는 발생원에서 멀어질수록 빠르게 줄어요.
    - t: 등급 라벨
      b: 일정 규모 이상의 무선국은 세기를 재서 보고하고 네 가지 라벨을 붙여요. 설비에 붙는 것이지 체험관 불빛은 아니에요.
    - t: 건강 영향
      b: 기준 이하에서 인과적으로 확인된 악영향은 없다는 게 국제기구의 정리예요. 동시에 국제암연구소는 무선주파수 전자기장을 발암 가능으로 분류해 뒀어요.
    remember: 기준 이하에서 확인된 악영향은 없다는 정리와 발암 가능 분류를 함께 봐야 해요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 네 가지, label: 1등급·2등급·주의·경고 라벨}
      - {big: 1등급, label: 일반인 기준의 절반 이하}
  전문가:
    headline: 기준·등급·측정 고시의 근거는 전파법 제47조의2다
    items:
    - t: 전파법 제47조의2
      b: 제1항이 인체보호기준과 등급기준, 측정기준의 고시 근거다. 제2항은 기준을 넘는 장소에 출입을 막는 안전시설을 두도록 의무화한다.
    - t: 등급 경계와 표시 대상
      b: 1등급은 일반인 기준의 50% 이하, 경고등급은 직업인 기준 초과다. 표시 대상은 보고대상 무선국이다.
    - t: 건강 영향과 시차
      b: 세계보건기구의 정리와 국제암연구소 2B 분류를 함께 본다. 국제 가이드라인은 2020년 개정, 국내 고시 현행판은 2019년판이라 반영 여부는 단정하지 않는다.
    remember: "'인과적으로 확인된 악영향 없음'과 국제암연구소 2B를 병렬로 본다."
    visual:
      type: steps
      at: 1
      title: 전자파강도 등급 경계
      steps:
      - {k: 1등급, v: 일반인 기준의 50% 이하}
      - {k: 2등급, v: 50% 초과~일반인 기준 이하}
      - {k: 주의등급, v: 일반인 기준 초과~직업인 기준 이하}
      - {k: 경고등급, v: 직업인 기준 초과}
    facts_used: [0, 1, 6, 8, 14, 15, 16]
    source: 근거 · 법제처 국가법령정보센터 — 전파법 제47조의2 · 법제처 — 행정규칙 「전자파인체보호기준」 별표1 · IARC Press Release N° 208 · ICNIRP (신뢰 등급 A)
