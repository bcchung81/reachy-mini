id: 12-multimedia
levels:
  초등:
    headline: 멀티미디어실은 방송 프로그램을 볼 수 있는 곳이에요
    items:
    - t: 방송 보는 곳
      b: 방송 프로그램을 직접 볼 수 있는 곳이에요. 어떤 걸 볼 수 있는지는 화면에서 골라 보시면 돼요.
    - t: 전파와 방송
      b: 전파를 돌보는 일만 하는 게 아니라 방송을 만드는 일도 도와줘요. 전파 위에 실려 오는 게 바로 방송이니까요.
    remember: 전파 위에 실려 오는 게 바로 방송이에요.
    visual:
      type: keyfact
      at: 1
      facts:
      - big: 방송
        label: 전파 위에 실려 오는 것
  중고등:
    headline: 전파는 길이고, 방송은 그 길 위를 달려요
    items:
    - t: 방송 콘텐츠 공간
      b: 방송 콘텐츠를 볼 수 있는 공간이에요. 전파를 관리하는 일만 하는 게 아니라, 그 위에 실리는 방송 콘텐츠 제작도 돕고 있어요.
    - t: 전파와 방송
      b: 전파는 길이고 방송은 그 길 위를 달리는 셈이라 둘이 이어져 있어요. 그래서 길을 관리하는 곳이 콘텐츠 제작도 돕는 거예요.
    remember: 길을 관리하는 곳이 그 위에 실리는 콘텐츠 제작도 도와요.
    visual:
      type: keyfact
      at: 1
      facts:
      - big: 전파는 길
        label: 방송은 그 길 위를 달려요
  일반:
    headline: 전파 관리와 방송통신 진흥을 함께 맡고 있어요
    items:
    - t: 멀티미디어실
      b: 방송통신 진흥과 관련된 콘텐츠를 볼 수 있는 공간이에요. 한국방송통신전파진흥원이 제작 지원 사업도 하고 있어서, 그 결과물을 함께 소개해요.
    - t: 진흥 사업
      b: 한국방송통신전파진흥원은 전파 관리와 함께 방송통신 진흥도 맡고 있어요. 콘텐츠 제작 지원은 그 진흥 사업 가운데 하나예요.
    remember: 콘텐츠 제작 지원은 방송통신 진흥 사업 가운데 하나예요.
    visual:
      type: keyfact
      at: 1
      facts:
      - big: KCA
        label: 한국방송통신전파진흥원
      - big: 제작 지원
        label: 진흥 사업 가운데 하나
  전문가:
    headline: 전파법 제66조가 정한 진흥 사업이 이 공간의 배경이다
    items:
    - t: 진흥 사업의 결과물
      b: 방송통신 진흥 사업의 결과물을 보여 주는 공간이다. 전파법 제66조가 정한 진흥 사업과 방송통신발전기금 운용이 배경이다.
    - t: 진흥 사업의 한 갈래
      b: 전파법 제66조가 정한 진흥 사업의 한 갈래이다. 방송통신발전기금을 운용해 콘텐츠 제작을 지원하는 구조이다.
    remember: 전파 관리와 진흥이 한 기관 안에 함께 있다.
    visual:
      type: keyfact
      at: 1
      facts:
      - big: 제66조
        label: 전파법이 정한 진흥 사업
      - big: 기금 운용
        label: 방송통신발전기금
