id: 19-closing
levels:
  초등:
    headline: 눈에 보이지 않는 전파를 사람이 찾아냈어요
    items:
    - t: 오늘 기억할 것
      b: 눈에 보이지 않는 전파를 사람이 찾아내서, 지금처럼 쓰게 됐어요.
    remember: 그거 하나만 기억해 주세요. 사람이 전파를 찾아냈어요.
    visual:
      type: keyfact
      at: 0
      facts:
      - big: 전파
        label: 눈에 보이지 않지만 사람이 찾아냈어요
      - big: 지금처럼
        label: 찾아내서 지금처럼 쓰게 됐어요
  중고등:
    headline: 전파는 발명이 아니라 발견이었어요
    items:
    - t: 오늘의 줄기
      b: 전파는 발명이 아니라 발견이었고, 통신에 쓰면서 방송과 이동통신으로 이어졌어요. 지금은 나라가 기준을 두고 관리하고 있어요.
    remember: 발견이 방송과 이동통신으로 이어졌고, 지금은 나라가 기준을 두고 관리해요.
    visual:
      type: steps
      at: 0
      title: 오늘의 줄기
      steps:
      - k: 발견
        v: 발명이 아니라 발견이었어요
      - k: 통신
        v: 통신에 쓰기 시작했어요
      - k: 방송·이동통신
        v: 방송과 이동통신으로 이어졌어요
      - k: 관리
        v: 나라가 기준을 두고 관리해요
  일반:
    headline: 발견에서 실용화, 그리고 관리까지 이어진 하루였어요
    items:
    - t: 오늘의 줄기
      b: 발견에서 실용화로, 방송과 이동통신으로, 그리고 전파품질 관리와 인체보호기준으로 이어졌어요. 궁금한 점은 지금 물어보셔도 좋아요.
    remember: 발견, 방송과 이동통신, 전파품질 관리와 인체보호기준.
    visual:
      type: steps
      at: 0
      title: 오늘의 줄기
      steps:
      - k: 발견
        v: 발견에서 시작해요
      - k: 실용화
        v: 실용화로 이어져요
      - k: 방송·이동통신
        v: 방송과 이동통신으로
      - k: 관리
        v: 전파품질 관리와 인체보호기준
  전문가:
    headline: 발견의 계보 위에 관리 체계가 놓였다
    items:
    - t: 발견에서 관리까지
      b: 이론과 실증, 실용화로 이어진 발견의 계보가 방송과 이동통신으로 이어졌다. 그 위에 인체보호기준과 무선국 검사라는 관리 체계가 놓였다.
    remember: 기준 이하 노출의 장기 영향은 아직 연구가 계속되고 있다.
    visual:
      type: steps
      at: 0
      title: 제도의 관점에서 되짚기
      steps:
      - k: 발견의 계보
        v: 맥스웰 · 헤르츠 · 마르코니
      - k: 방송·이동통신
        v: 발견의 계보가 이어졌다
      - k: 관리 체계
        v: 인체보호기준 · 무선국 검사
      - k: 남은 쟁점
        v: 장기 영향은 연구가 계속
