id: 02-history
levels:
  초등:
    headline: 전파는 누가 만든 게 아니라, 원래 있던 걸 찾아낸 거예요
    items:
    - t: 계산
      b: 한 과학자가 계산해 보고 ‘이런 게 있을 거야!’ 하고 알아냈어요.
    - t: 실험
      b: 다른 과학자가 실험으로 진짜 있다는 걸 보여 줬어요.
    - t: 신호 보내기
      b: 전파에 신호를 실어 넓은 바다 건너편까지 보냈어요.
    remember: 눈에 안 보여도 전파는 원래 있었고, 과학자들이 찾아냈어요.
    visual:
      type: route
      at: 2
      label: 넓은 바다 건너편까지
      from: 여기서 보내면
      to: 저기서 받았어요
  중고등:
    headline: 전파는 발명이 아니라 발견이에요
    items:
    - t: 맥스웰 · 예언
      b: 수식만으로 이런 파동이 있을 거라고 내다봤어요.
    - t: 헤르츠 · 증명
      b: 실험으로 처음 증명했어요.
    - t: 마르코니 · 실용화
      b: 무선전신을 실용화했어요. 1901년에는 대서양 건너 약 3,500km에서 모스 부호를 받았다고 발표했어요.
    remember: 발명은 없던 걸 새로 만드는 것, 발견은 원래 있던 걸 알아내는 것이에요.
    visual:
      type: route
      at: 2
      label: 대서양 건너 약 3,500km
      from: 송신
      to: 수신
  일반:
    headline: 예언한 사람, 증명한 사람, 써먹은 사람이 따로 있었어요
    items:
    - t: 맥스웰 · 이론
      b: 전기·자기·빛이 한 가지 현상이라는 이론을 세웠고, 그 방정식이 전자기파를 예언했어요.
    - t: 헤르츠 · 증명
      b: 그 전자기파를 실험으로 처음 확실하게 증명했어요.
    - t: 마르코니 · 무선전신
      b: 1901년 12월 12일, 영국 폴듀에서 보낸 모스 부호를 약 3,500km 떨어진 대서양 건너 뉴펀들랜드에서 받았대요. 그때 뉴펀들랜드는 영국 식민지였어요.
    remember: 전파는 발명이 아니라 발견이에요.
    visual:
      type: route
      at: 2
      label: 약 3,500km · 1901.12.12
      from: 폴듀 (영국)
      to: 뉴펀들랜드
  전문가:
    headline: 전파를 발견한 사람을 한 명으로 꼽기는 어렵다
    items:
    - t: 맥스웰 방정식 · 이론적 예언
      b: 전자기파의 존재를 예언했다.
    - t: 헤르츠 · 실험적 증명
      b: 처음으로 결정적인 실험으로 증명했다. 흔히 드는 1785년은 쿨롱 법칙이 나온 해로, 전자기학의 출발점이지 전파의 발견은 아니다.
    - t: 마르코니 · 실용화
      b: 1909년 브라운과 노벨 물리학상을 공동 수상했다. 1901년 폴듀에서 세인트존스까지 약 3,500km 수신은 지금도 논쟁거리다.
    remember: 이론적 예언, 실험적 증명, 실용화는 각각 다른 사람의 일이었다.
    visual:
      type: route
      at: 2
      label: 약 3,500km (2,200마일)
      from: 폴듀 (영국 콘월)
      to: 세인트존스 (뉴펀들랜드)
    facts_used: [0, 1, 2, 6]
