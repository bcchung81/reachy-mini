id: 01-intro
levels:
  초등:
    headline: 전파체험관은 눈에 안 보이는 전파를 만져 보는 곳이에요
    items:
    - t: 전파체험관
      b: 전파는 눈에 안 보이지만 우리가 날마다 쓰고 있어요. 그 전파를 직접 보고 만져 보게 만든 곳이에요.
    - t: 만든 곳
      b: 한국방송통신전파진흥원이 만들었어요. 전파는 모두가 함께 쓰는 거라서 사이좋게 나눠 주고 지켜 줘야 해요.
    remember: 전파는 모두가 함께 쓰는 거라서 지켜 줘야 해요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 함께 쓰는 전파, label: 사이좋게 나눠 주고 지켜 줘야 해요}
  중고등:
    headline: 전파는 나라가 관리하는 공공 자원이에요
    items:
    - t: 전파체험관
      b: 눈에 보이지 않는 전파를 직접 보고 체험해 볼 수 있게 만든 곳이에요. 전파가 뭔지, 어디에 쓰이는지 하나씩 만나 봐요.
    - t: 공공 자원
      b: 한국방송통신전파진흥원이라는 공공기관이 만들었어요. 전파는 아무나 마음대로 쓰는 게 아니라 나라가 관리하는 공공 자원이에요.
    remember: 전파는 아무나 마음대로 쓰는 게 아니라 공공 자원이에요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 공공 자원, label: 나라가 관리하는 전파}
      - {big: 관리 · 인력, label: 전파를 관리하고 인력도 키워요}
  일반:
    headline: 전파를 효율적으로 관리하려고 세운 기관이 만들었어요
    items:
    - t: 전파체험관
      b: 전파를 직접 체험할 수 있게 만든 곳으로, 2020년 11월에 문을 열었어요. 전파가 무엇인지부터 생활 곳곳의 쓰임까지 차례로 둘러봐요.
    - t: 한국방송통신전파진흥원
      b: 전파를 효율적으로 관리하고, 방송과 통신, 전파를 진흥하고, 인력을 키우려고 세운 기관이에요.
    remember: 효율적인 전파 관리, 진흥, 인력 양성을 위해 세운 기관이에요.
    visual:
      type: keyfact
      at: 0
      facts:
      - {big: 2020년 11월, label: 전파체험관이 문을 열었어요}
  전문가:
    headline: 전파법 제66조에 따라 설립된 기관이 만든 체험관이다
    items:
    - t: 대국민 접점
      b: 전파를 직접 체험하도록 만든 대국민 전시 공간으로, 2020년 11월에 개관했다. 진흥과 인력양성 기능이 시민과 직접 만나는 자리이다.
    - t: 설립 근거와 사업
      b: 한국방송통신전파진흥원은 전파법 제66조에 따라 설립됐고, 사업은 방송통신융합 산업진흥, ICT기금 운용, 전파산업진흥, 전파자원관리 넷이다.
    remember: 설립 근거는 전파법 제66조이고, 사업은 넷으로 나뉜다.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 제66조, label: 전파법 — 설립 근거}
      - {big: 사업 넷, label: 방송통신융합·ICT기금·전파산업·전파자원}
    facts_used: [0, 2, 3]
