id: 05-donor
levels:
  초등:
    headline: 의사 선생님이 모은 통신 기계로 박물관이 생겼어요
    items:
    - t: 의사 선생님
      b: 병을 고치는 의사 선생님이에요. 통신 기계를 무척 좋아해서 아주 오랫동안 하나씩 모았어요.
    - t: 이름을 딴 박물관
      b: 혼자 갖지 않고 대학교에 내놓아서 그분 이름을 딴 박물관이 생겼어요. 많은 사람이 옛날 통신 기계를 볼 수 있어요.
    remember: 혼자 갖지 않고 우리가 볼 수 있게 내놓았어요.
    visual:
      type: steps
      at: 1
      steps:
      - {k: 모으기, v: 통신 기계를 하나씩 모았어요}
      - {k: 내놓기, v: 혼자 갖지 않고 대학교에 내놓았어요}
      - {k: 박물관, v: 그분 이름을 딴 박물관이 생겼어요}
  중고등:
    headline: 본업이 의사인 분이 통신 장비를 모아 기증했어요
    items:
    - t: 본업은 의사
      b: 전남 완도에서 태어나 의과대학을 다녔어요. 1963년에는 전남에서 처음으로 아마추어 무선국을 열었어요.
    - t: 수집과 기증
      b: 1972년 미국으로 건너가 의사로 일하면서도 수집을 이어 갔어요. 기증해서 2014년 조선대학교에 박물관이 세워졌어요.
    remember: 본업이 의사인 사람이 통신 장비를 모았어요.
    visual:
      type: steps
      at: 1
      steps:
      - {k: 1963년, v: 전남에서 처음 아마추어 무선국}
      - {k: 1972년, v: 미국으로 건너가 의사로 일함}
      - {k: 2014년, v: 조선대학교에 박물관이 세워짐}
  일반:
    headline: 의사가 모은 통신 장비가 조선대학교 박물관이 됐어요
    items:
    - t: 본업은 의사
      b: 전남 완도에서 태어나 전남의과대학을 나왔어요. 1963년에는 전남 최초의 아마추어 무선 통신사로 자기 무선국을 운영했어요.
    - t: 수집과 기증
      b: 뉴욕주 뉴어크에서 내과를 개업하고도 수집을 이어 갔어요. 4천5백여 점을 조선대학교에 기증해 박물관이 문을 열었어요.
    remember: 4천5백여 점은 조선대학교에 기증한 수량이에요.
    visual:
      type: steps
      at: 1
      steps:
      - {k: 1963년, v: 전남 최초 아마추어 무선 통신사}
      - {k: 1972년, v: 뉴욕주 뉴어크에서 내과 개업}
      - {k: 2014년, v: 9월 30일 박물관 개관}
  전문가:
    headline: 의사이자 아마추어 무선 통신사가 통신기기를 기증했다
    items:
    - t: 의사와 무선 통신사
      b: 전남의과대학을 나와 약리학교실에서 석사과정을 마친 의사이다. 1963년 전남 최초의 아마추어 무선 통신사로 호출부호 HM4DF 무선국을 운영했다.
    - t: 도미와 기증
      b: 1972년 뉴욕주 뉴어크에서 내과를 개업해 의사협회장을 지냈고, QST에 기술 기사도 실었다. 4천5백여 점을 조선대학교에 기증했다.
    remember: 4천5백여 점은 조선대학교에 기증한 수량이다.
    visual:
      type: steps
      at: 1
      steps:
      - {k: 1963년, v: 전남 최초 아마추어 무선 통신사}
      - {k: 1972년, v: 뉴욕주 뉴어크에서 내과 개업}
      - {k: 2014년, v: 9월 30일 장황남정보통신박물관 개관}
    facts_used: [1, 4, 5, 6]
