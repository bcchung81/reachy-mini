id: 09-special-exhibit
levels:
  초등:
    headline: 특별 전시는 오늘과 다음에 오셨을 때가 달라요
    items:
    - t: 특별한 전시
      b: 이 코너의 물건들은 가끔씩 바뀌는 특별한 전시예요. 오늘 보이는 것과 다음에 오셨을 때 보이는 게 다를 수 있어요.
    remember: 오늘 보이는 것과 다음에 오셨을 때 보이는 게 다를 수 있어요.
    visual:
      type: keyfact
      at: 0
      facts:
      - {big: 특별한 전시, label: 가끔씩 바뀌는 물건들}
  중고등:
    headline: 일정 기간만 여는 교류 전시예요
    items:
    - t: 특별교류전시
      b: 다른 기관과 교류해서 일정 기간만 여는 전시 공간이에요. 지금 무엇이 있는지는 눈앞에 보이는 것을 보는 게 정확해요.
    remember: 지금 무엇이 있는지는 눈앞에 보이는 것을 보고 확인해요.
    visual:
      type: keyfact
      at: 0
      facts:
      - {big: 일정 기간, label: 다른 기관과 교류해서 여는 전시}
  일반:
    headline: 유관기관과 교류해 일정 기간 선보이는 전시예요
    items:
    - t: 유관기관 교류 전시
      b: 유관기관과 교류해 특별 전시품을 일정 기간 선보이는 공간이에요. 전시품과 기간은 그때그때 달라져요.
    remember: 지금 보고 계신 것을 중심으로 봐 주세요.
    visual:
      type: keyfact
      at: 0
      facts:
      - {big: 일정 기간, label: 유관기관과 교류하는 특별 전시}
  전문가:
    headline: 상설전시와 달리 기간 한정이라 소장·대여 주체가 갈린다
    items:
    - t: 기간 한정 전시
      b: 상설전시와 달리 기간 한정이라 소장과 대여의 주체가 갈린다. 전시품 목록과 교류 기관은 시기마다 달라진다.
    remember: 지금 놓인 실물을 기준으로 보는 것이 맞다.
    visual:
      type: keyfact
      at: 0
      facts:
      - {big: 기간 한정, label: 소장과 대여의 주체가 갈린다}
