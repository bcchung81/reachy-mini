id: 14-mobile
levels:
  초등:
    headline: 전화기는 점점 작아지고 더 많은 걸 주고받게 됐어요
    items:
    - t: 처음 전화기
      b: 맨 처음 전화기는 들고 다닐 수 없어서 자동차에 싣고 다녔어요. 그게 자동차 한 대보다 비쌌대요.
    - t: 작아진 전화기
      b: 점점 작아져서 손에 들고 다닐 수 있게 됐어요. 목소리만 주고받다가 글자도 보내고, 나중엔 얼굴까지 보면서 이야기해요.
    - t: 지금의 전화
      b: 지금은 훨씬 빠르고, 한꺼번에 아주 많은 기기를 연결할 수 있어요. 영상도 끊기지 않고 볼 수 있어요.
    remember: 처음엔 자동차에 싣고 다녔는데 지금은 손에 들고 다녀요.
    visual:
      type: steps
      at: 1
      title: 주고받는 것이 늘어났어요
      steps:
      - k: 목소리
        v: 목소리만 주고받았어요
      - k: 글자
        v: 글자도 보냈어요
      - k: 얼굴
        v: 얼굴까지 보면서 이야기해요
  중고등:
    headline: 처음엔 차에 싣고 다니는 카폰, 지금은 5세대예요
    items:
    - t: 카폰
      b: 처음엔 차에 싣고 다니는 카폰이었어요. 국내 기준으로 1984년에 시작됐고, 자동차 한 대 값보다 비쌌어요.
    - t: 2세대부터 4세대
      b: 2세대에서 디지털로 바뀌어 음성과 문자를, 3세대에선 영상통화를, 4세대 LTE부터 데이터를 쓰게 됐어요. 국내 기준 1996년과 2011년이 시작이에요.
    - t: 5세대
      b: 기기를 훨씬 많이, 훨씬 빠른 응답으로 연결할 수 있게 설계됐어요. 국내에서는 2019년에 시작됐어요.
    remember: 음성과 문자에서 영상통화와 데이터까지, 연도는 국내 기준이에요.
    visual:
      type: steps
      at: 1
      title: 국내 기준 세대별 변화
      steps:
      - k: 카폰
        v: 1984년 · 차에 싣는 전화
      - k: 2세대
        v: 1996년 · 음성과 문자
      - k: 3세대
        v: 영상통화
      - k: 4세대
        v: 2011년 · LTE 데이터
      - k: 5세대
        v: 2019년 · 많은 기기 연결
  일반:
    headline: 차량전화에서 스마트폰 기반 5G까지 이어졌어요
    items:
    - t: 1984년 차량전화
      b: 국내 1세대는 1984년 차량전화로 시작했어요. 총비용이 약 400만 원이라 당시 승용차보다 비쌌어요.
    - t: CDMA에서 LTE로
      b: 1996년 국내에서 CDMA 방식 디지털 이동통신이 상용화됐어요. 2000년대 초 3세대에서 영상통화가, 2011년 국내에서 LTE가 상용화됐어요.
    - t: 스마트폰 기반 5G
      b: 2019년 4월 대한민국이 스마트폰 기반 5G를 세계 최초로 상용화했어요. 속도는 이론상 최대 기준으로 4세대보다 훨씬 빨라요.
    remember: 5G 속도는 이론상 최대 기준이고, 세계 최초는 스마트폰 기반이에요.
    visual:
      type: steps
      at: 1
      title: 연도별 이동통신
      steps:
      - k: 1984년
        v: 국내 차량전화
      - k: 1996년
        v: 국내 CDMA 상용화
      - k: 2000년대 초
        v: 3세대 영상통화
      - k: 2011년
        v: 국내 LTE 상용화
      - k: 2019년
        v: 스마트폰 기반 5G 상용화
  전문가:
    headline: 차량전화에서 스마트폰 기반 세계 최초 5G까지
    items:
    - t: 1984년 차량전화
      b: 국내 1세대는 1984년 차량전화로 시작했다. 총비용 약 400만 원으로, 포니2의 347만 원보다 비쌌다.
    - t: CDMA에서 LTE로
      b: 1996년 CDMA를 상용화했다. 국내 4세대는 2011년 7월 LTE이나, IMT-Advanced 공식 지정은 LTE-Advanced뿐이다.
    - t: 5G 상용화
      b: 2019년 4월 3일 스마트폰 기반 5G가 세계 최초로 상용화됐다. 20배는 하향 피크 20기가비트와 4세대 피크 1기가비트의 비다.
    remember: ‘20배’는 이론 최대값의 비교이지 체감 속도의 비가 아니다.
    visual:
      type: steps
      at: 1
      title: 이동통신 연표
      steps:
      - k: 1984년
        v: 국내 차량전화
      - k: 1996년
        v: CDMA 상용화
      - k: 2003년 12월
        v: 국내 3세대 W-CDMA
      - k: 2011년 7월
        v: 국내 4세대 LTE
      - k: 2019년 4월
        v: 스마트폰 기반 세계 최초 5G
    facts_used: [0, 1, 3, 6, 9, 10, 13, 14, 16, 17]
    source: 근거 · 서울생활사박물관 · ETRI · 정책브리핑(과기정통부) · Report ITU-R M.2410-0 · Report ITU-R M.2134 (신뢰 등급 C)
