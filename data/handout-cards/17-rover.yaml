id: 17-rover
levels:
  초등:
    headline: 너무 멀면 말이 도착하는 데 한참 걸려요
    items:
    - t: 전파로 움직여요
      b: 아주 멀리 있는 자동차를 전파로 움직여 보는 곳이에요. 다른 천체 위를 달리는 차를 직접 몰아 보는 기분을 느낄 수 있어요.
    - t: 한참 걸리는 말
      b: 너무 멀면 가라고 말해도 그 말이 도착하는 데 한참 걸려요. 그래서 차가 스스로 조심하며 가야 해요.
    - t: 가까운 달
      b: 달은 훨씬 가까워서 말이 금방 도착해요. 그래서 옛날에 사람들이 지구에서 달 위의 차를 직접 몰아 본 적도 있어요.
    remember: 너무 멀면 말이 한참 늦게 도착해서 차가 스스로 조심하며 가야 해요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 너무 멀면, label: 가라고 말해도 한참 걸려요}
      - {big: 가까운 달, label: 말이 금방 도착해요}
  중고등:
    headline: 전파는 빛의 속도인데도 우주에서는 느려요
    items:
    - t: 탐사차 체험
      b: 증강현실로 다른 천체를 다니며 탐사차를 조종해 보는 코너예요. 전파로 멀리 있는 차를 움직인다는 게 어떤 일인지 몸으로 느껴 보는 거예요.
    - t: 달과 화성의 차이
      b: 달은 왕복 2초에서 3초라 화면을 보며 몰 수 있었지만, 화성은 편도로도 몇 분이 걸려 실시간 조종이 안 돼요.
    - t: 루노호트와 월면차
      b: 1970년 루노호트 1호는 지구 관제팀이 화면을 보며 몰았어요. 아폴로 월면차는 우주비행사가 직접 타고 운전한 차예요.
    remember: 달은 화면을 보며 몰 수 있고, 화성은 실시간 조종이 안 돼요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 2초에서 3초, label: 달은 왕복 시간}
      - {big: 몇 분, label: 화성은 편도로도 걸려요}
  일반:
    headline: 화성 로버는 지연 때문에 스스로 장애물을 피해요
    items:
    - t: 탐사 체험 코너
      b: 증강현실로 다른 천체의 표면을 다니며 탐사로봇을 조종해 보는 코너예요.
    - t: 화성의 지연
      b: 지구와 화성 사이는 편도로 약 3분에서 20분대라 로버를 조이스틱으로 몰 수 없어요. 미리 보낸 계획을 다음 날 실행하며 스스로 장애물을 피해요.
    - t: 달과 월면차
      b: 달은 왕복 2초에서 3초 수준이라 원격조종이 성립했어요. 1970년 루노호트 1호는 지구의 관제팀이 몰았고, 아폴로 월면차는 우주비행사가 직접 탄 차예요.
    remember: 화성은 편도 약 3분에서 20분대라 로버가 스스로 판단해야 해요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 3분에서 20분대, label: 지구와 화성 사이 편도}
      - {big: 2초에서 3초, label: 달은 왕복 수준}
  전문가:
    headline: 지연 때문에 화성 로버는 자율항법으로 달린다
    items:
    - t: 체험 코너
      b: 증강현실 기반으로 탐사차를 조종해 보는 체험 코너다. 실제 행성 탐사의 조건, 특히 통신 지연이 조종을 어떻게 제약하는지를 체감하는 자리다.
    - t: 광행시간과 자율항법
      b: 거리 5,460만 km에서 4억 20만 km, 편도 약 3분에서 22.4분이다. 로버는 자율항법으로 경로를 스스로 계획하고, 그 대가로 속도가 아주 느리다.
    - t: 달과 월면차
      b: 달은 편도 약 1.3초, 왕복 약 2.6초다. 루노호트 1호는 1970년 11월 착륙해 5인 관제팀이 몰았고, 아폴로 월면차는 승무원이 탑승해 조종했다.
    remember: 달은 편도 약 1.3초, 화성은 편도 약 3분에서 22.4분이다.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 3분~22.4분, label: 지구와 화성 편도 광행시간}
      - {big: 약 1.3초, label: 지구와 달 편도 광행시간}
    facts_used: [0, 2, 6, 8, 9, 10]
