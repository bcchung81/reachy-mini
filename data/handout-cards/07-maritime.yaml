id: 07-maritime
levels:
  초등:
    headline: 구조 신호를 전파로 보내 사람들을 구했어요
    items:
    - t: 구조 신호
      b: 큰 배가 바다에서 가라앉을 때, 한 사람이 끝까지 도와 달라는 신호를 전파로 보냈어요. 그걸 들은 다른 배가 달려와 사람들을 구했어요.
    - t: 서로 듣기로 한 약속
      b: 그때부터 배들은 언제나 서로의 구조 신호를 듣고 있기로 약속했어요.
    - t: 대신 외쳐 주는 장치
      b: 요즘은 배에 자동으로 위치를 알리는 장치가 있어서, 사람이 못 보내도 구조 신호가 저절로 나가요.
    remember: 지금도 누가 도움을 부르면 가까운 배가 달려갈 수 있어요.
    visual:
      type: steps
      at: 1
      title: 구조 신호 이야기
      steps:
      - {k: 신호, v: 도와 달라고 전파로 보내요}
      - {k: 구조, v: 다른 배가 달려와요}
      - {k: 약속, v: 서로의 신호를 언제나 들어요}
      - {k: 지금, v: 장치가 저절로 알려 줘요}
  중고등:
    headline: 사고가 사람이 아니라 규칙을 바꿨어요
    items:
    - t: 1912년 타이타닉
      b: 무선통신사가 마지막까지 구조 신호를 보냈고, 그 신호를 들은 다른 배가 달려와 구명정의 사람들을 구했어요.
    - t: 무선을 지키는 규칙
      b: 조사위원회가 모든 배는 밤낮 끊기지 않게 무선을 지켜야 한다고 권고했고, 그 권고가 국제 규칙이 됐어요.
    - t: 국제해상조난안전시스템
      b: 조난 신호를 장비가 자동으로 주고받아요. 1999년 전면 시행되면서 모스 부호는 바다에서 물러났어요.
    remember: 모든 배는 밤낮 끊기지 않게 무선을 지켜야 해요.
    visual:
      type: steps
      at: 2
      title: 구조 신호에서 규칙까지
      steps:
      - {k: 1912년, v: 마지막까지 구조 신호를 보냈어요}
      - {k: 그 뒤, v: 밤낮 무선을 지키는 국제 규칙}
      - {k: 1999년, v: 장비가 자동으로 주고받아요}
  일반:
    headline: 전파가 사람을 구했고, 그 경험이 제도가 됐어요
    items:
    - t: 1912년 타이타닉
      b: 무선통신사 잭 필립스가 마지막까지 구조 신호를 보냈어요. 카르파티아호가 달려와 구명정의 사람들을 구했고, 공식 조사로는 약 700명이 살아남았어요.
    - t: 런던 회의와 협약
      b: 1912년 런던 국제무선전신회의가 조난신호의 공통 주파수를 정하고, 정해진 시간마다 조난 호출을 듣게 했어요. 1914년에는 해상인명안전협약이 처음 채택됐어요.
    - t: GMDSS 도입
      b: 국제해상조난안전시스템은 그 협약의 1988년 개정으로 들어와 1992년부터 단계 도입, 1999년에 전면 시행됐어요. 그날부터 모스 부호가 해상에서 물러났어요.
    remember: GMDSS는 협약의 1988년 개정으로 들어왔어요.
    visual:
      type: steps
      at: 1
      title: 타이타닉에서 GMDSS까지
      steps:
      - {k: 1912년 4월, v: 타이타닉 침몰}
      - {k: 1912년, v: 런던 국제무선전신회의}
      - {k: 1914년, v: 해상인명안전협약 채택}
      - {k: 1988년, v: 협약 개정으로 GMDSS 도입}
      - {k: 1999년, v: 전면 시행 · 모스 부호 퇴장}
  전문가:
    headline: 711명이 살아남았고, 권고는 제도가 됐다
    items:
    - t: 영국 난파위원회 보고서
      b: 승선 2,201명 중 711명이 살아남았다. 카르파티아호가 구명정에서 712명을 올렸고, 정선은 침몰 1시간 45분 뒤인 4시 5분이었다.
    - t: 권고 제20항
      b: 충분한 수의 훈련된 통신사로 밤낮 끊기지 않는 당직을 요구했다. 이 권고가 1912년 런던 회의의 공통 조난파장과 청취 의무, 1914년 최초 협약이 됐다.
    - t: GMDSS 도입
      b: 1988년 협약 개정으로 채택돼 1992년 2월 1일 단계 도입, 1999년 2월 1일 전면 시행됐다. 406MHz 비상위치표지를 필수로 둔다.
    remember: GMDSS는 1988년 SOLAS 개정으로 채택됐다.
    visual:
      type: steps
      at: 2
      title: 협약에서 GMDSS까지
      steps:
      - {k: 1914년, v: 최초 해상인명안전협약}
      - {k: 1988년, v: 협약 개정으로 채택}
      - {k: 1992년, v: 2월 1일 단계 도입}
      - {k: 1999년, v: 2월 1일 전면 시행}
    facts_used: [0, 1, 4, 5, 7, 8, 9, 10]
