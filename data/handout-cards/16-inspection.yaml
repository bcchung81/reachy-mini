id: 16-inspection
levels:
  초등:
    headline: 전파는 나눠 쓰는 거라서 약속대로 확인해요
    items:
    - t: 나눠 쓰는 전파
      b: 전파는 나눠 쓰는 거라서 한 사람이 너무 세게 쓰면 다른 사람 것이 안 들려요. 그래서 기계가 약속대로 만들어졌는지 직접 가서 확인해요.
    - t: 다시 확인
      b: 처음 만들었을 때 한 번 보고, 그 뒤에도 정해진 때마다 다시 확인해요. 배나 비행기가 먼 나라로 떠날 때도 따로 살펴봐요.
    - t: 전파를 돌보는 곳
      b: 전파를 돌보는 곳의 사람들이 직접 가서 확인해요. 이 코너에 있는 장비들이 그 확인에 쓰던 것들이에요.
    remember: 전파는 나눠 쓰는 거라서 정해진 때마다 직접 가서 확인해요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 처음 한 번, label: 만들었을 때 보고 그 뒤에도 다시 확인}
      - {big: 배나 비행기, label: 먼 나라로 떠날 때도 따로 살펴봐요}
  중고등:
    headline: 전파는 한정돼서 검사를 받아야 쓸 수 있어요
    items:
    - t: 허가와 검사
      b: 혼신이 생기면 남의 통신이 끊겨서, 법이 무선국을 허가제로 두고 설비를 다 만든 뒤 기준에 맞는지 검사를 받아야 쓸 수 있게 했어요.
    - t: 정해진 주기의 검사
      b: 한 번으로 끝나지 않고 정해진 주기마다 다시 받아요. 허가받은 대로 바꿨는지 보는 검사도 있고, 배나 비행기가 외국으로 나갈 때도 따로 받아요.
    - t: 위탁과 전시 장비
      b: 정부가 직접 다 하지 않고 한국방송통신전파진흥원이 1981년부터 위탁받아 해 왔어요. 이 코너의 장비들이 그때 쓰던 검사 장비예요.
    remember: 허가에 더해, 설비를 만든 뒤 기준에 맞는지 검사를 받아야 해요.
    visual:
      type: keyfact
      at: 2
      facts:
      - {big: 1981년, label: 위탁받아 검사를 해 오기 시작한 해}
  일반:
    headline: 허가는 시작이고 검사가 마무리예요
    items:
    - t: 준공검사
      b: 설비를 다 갖춘 뒤 준공검사를 받아야 운용할 수 있어요. 검사는 기술기준만이 아니라 무선종사자의 자격과 정원까지 함께 봐요.
    - t: 검사 네 가지
      b: 준공검사, 5년 범위에서 받는 정기검사, 변경검사, 수시검사 네 가지예요. 배나 항공기가 외국으로 출항할 때도 대상이에요.
    - t: 위탁과 1981년
      b: 정부가 이 업무를 한국방송통신전파진흥원에 위탁해 왔고, 시작이 1981년이에요. 검사에 쓰던 장비들이 이 코너에 전시돼 있어요.
    remember: 검사는 기술기준만이 아니라 무선종사자의 자격과 정원까지 봐요.
    visual:
      type: steps
      at: 1
      title: 무선국 검사 네 가지
      steps:
      - {k: 준공검사, v: 설비를 다 갖춘 뒤}
      - {k: 정기검사, v: 5년 범위에서 받아요}
      - {k: 변경검사, v: 허가받은 대로 바꿨는지}
      - {k: 수시검사, v: 필요할 때}
  전문가:
    headline: 검사는 운용의 전제이고, 근거는 전파법 제24조다
    items:
    - t: 전파법 제24조
      b: 준공검사에서 기술기준과 무선종사자 자격, 정원 배치기준 적합 여부를 본다. 제25조 제1항이 준공검사 후 운용을 못박아 검사를 운용의 전제로 만든다.
    - t: 정기검사와 수시검사
      b: 제4항이 5년 범위의 정기검사를, 제5항이 선박·항공기의 외국 출항 같은 수시검사를 둔다. 판정은 제45조 기술기준과 제71조 자격·정원 배치기준에 따른다.
    - t: 위임과 위탁
      b: 검사는 중앙전파관리소장에게 위임되고, 고시된 무선국의 준공검사는 한국방송통신전파진흥원에 위탁된다. 수탁은 1981년 5월 18일이다.
    remember: 1981년 수탁 당시 법인명은 한국무선종사자협회, 현재 명칭은 2011년부터다.
    visual:
      type: keyfact
      at: 2
      facts:
      - {big: 1981년, label: 수탁 당시 한국무선종사자협회}
      - {big: 2011년, label: 현재 명칭 한국방송통신전파진흥원}
    facts_used: [2, 5, 6, 7, 11, 13, 14]
    source: 근거 · 전파법 제24조 · 전파법 제25조제1항 · 전파법 시행령 제123조제3항·제5항 · KCA 공식 — 연혁 (신뢰 등급 A)
