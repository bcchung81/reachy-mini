id: 08-aviation
levels:
  초등:
    headline: 비행기는 하늘에서도 전파로 땅과 이야기해요
    items:
    - t: 조종석 체험
      b: 진짜 조종석에 앉아서 손잡이를 당겨 비행기를 띄워 볼 수 있어요.
    - t: 보이지 않는 실
      b: 비행기와 땅이 보이지 않는 실로 이어져 있다고 생각하면 돼요. 그 실이 전파라서 조종사는 하늘에서도 땅의 목소리를 들을 수 있어요.
    - t: 나라들의 약속
      b: 하늘은 여러 나라가 함께 쓰는 길이라, 나라들이 모여 같은 약속을 정해 뒀어요.
    remember: 어느 나라 하늘에서도 같은 방법으로 이야기할 수 있어요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 보이지 않는 실, label: 그 실이 바로 전파예요}
      - {big: 같은 약속, label: 어느 나라 하늘에서도 같은 방법}
  중고등:
    headline: 하늘의 규칙은 한 나라가 정할 수 없어요
    items:
    - t: 조종석 체험
      b: 실제 조종사 교육용 장비를 체험용으로 고친 시뮬레이터가 있어서 조종석에서 이륙까지 해 볼 수 있어요.
    - t: 항공기의 통신 장비
      b: 관제소와 말할 무선기, 위치를 알리는 장비, 사고 때 위치를 쏘는 비상 신호기가 실려 있어요.
    - t: 국제민간항공기구
      b: 국제민간항공기구가 표준을 정하고 각 나라가 그걸 법으로 받아 써요. 1944년 시카고 협약으로 만들어진 기구예요.
    remember: 어느 나라 하늘을 날든 같은 방식으로 통신해야 해요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 무선기, label: 관제소와 말해요}
      - {big: 위치 장비, label: 위치를 알려요}
      - {big: 비상 신호기, label: 사고 때 위치를 쏴요}
  일반:
    headline: 국제 표준이 우리 하늘의 법이 돼요
    items:
    - t: 조종석 체험
      b: 실제 조종사 교육용 장비를 이착륙 체험용으로 개조한 시뮬레이터가 있어요.
    - t: 법으로 의무인 장비
      b: 관제기관과 교신할 무선전화 송수신기, 위치를 응답하는 트랜스폰더, 사고 시 위치를 알리는 비상위치표지가 법으로 의무예요. 무선기는 두 벌을 싣고요.
    - t: 1944년 시카고 협약
      b: 이 협약으로 만들어진 국제민간항공기구(ICAO)가 부속서로 항공통신 표준을 정해요. 우리 항공안전법은 제1조에서 그 부속서를 따른다고 밝히고 있어요.
    remember: 항공안전법 제1조가 협약 부속서를 따른다고 밝혀요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 무선전화, label: 관제기관과 교신 · 두 벌}
      - {big: 트랜스폰더, label: 위치를 응답해요}
      - {big: 비상위치표지, label: 사고 시 위치를 알려요}
  전문가:
    headline: ICAO 부속서 10이 통신·항법·감시를 규율한다
    items:
    - t: 시뮬레이터 · 조종면
      b: 조종사 교육용 장비를 개조한 시뮬레이터로 이륙을 체험할 수 있다. 요크가 피치와 롤을, 러더 페달이 요를 맡는다.
    - t: 항공안전법 제51조
      b: 제51조와 시행규칙 제107조가 무선전화 송수신기 두 대와 트랜스폰더, 비상위치지시용 무선표지설비를 의무화한다.
    - t: 시카고 협약 부속서 10
      b: 항공통신이 통신과 항법, 감시를 규율한다. 공대지 음성은 117.975~137MHz, 비상주파수는 121.5MHz이다.
    remember: 국제 표의 숫자가 우리 시행규칙에 그대로 박혀 있다.
    visual:
      type: keyfact
      at: 2
      facts:
      - {big: 부속서 10, label: 통신 · 항법 · 감시를 규율}
      - {big: 공대지 음성, label: 117.975~137MHz}
      - {big: 비상주파수, label: 121.5MHz}
    facts_used: [1, 3, 4, 5, 6, 7, 9]
