id: 04-morse
levels:
  초등:
    headline: 점과 선만으로 글자를 보내는 약속이 모스 부호예요
    items:
    - t: 모스 부호
      b: 짧게 똑, 길게 뚜우. 점과 선 두 가지만으로 글자를 보내는 약속이에요. 직접 손으로 쳐 볼 수 있어요.
    - t: 글자마다 약속
      b: 짧은 신호와 긴 신호를 섞어 글자마다 약속을 정했어요. 자주 쓰는 글자일수록 짧은 신호를 줘요.
    - t: 불꽃으로 만든 전파
      b: 옛날 한 과학자가 불꽃을 튀겨 전파를 만들고, 떨어진 곳에서 받아 냈어요. 라이덴 병은 전기를 잠깐 담아 두는 병이에요.
    remember: 짧은 신호와 긴 신호만 섞어도 글자를 보낼 수 있어요.
    visual:
      type: keyfact
      at: 0
      facts:
      - {big: 점과 선, label: 두 가지만으로 글자를 보내요}
      - {big: 똑 · 뚜우, label: 짧게 똑, 길게 뚜우}
  중고등:
    headline: 모스 부호는 점과 선의 길이 차이로 글자를 나타내요
    items:
    - t: 체험 세 가지
      b: 모스 부호, 헤르츠의 전파 실험, 라이덴 병을 직접 체험해요. 전파를 처음 만들고 쓰던 방법을 손으로 따라가 봐요.
    - t: 모스 부호의 설계
      b: 점과 선의 길이 차이로 글자를 나타내요. 자주 쓰는 글자일수록 짧은 부호를 받아서 가장 흔한 E가 점 하나예요.
    - t: 헤르츠 실험
      b: 헤르츠가 불꽃을 튀겨 전파를 만들고 떨어진 고리에서 받아 내 존재를 확인했어요. 라이덴 병은 축전기의 원형이에요.
    remember: 자주 쓰는 글자일수록 짧은 부호를 받았어요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: E = 점 하나, label: 영어에서 가장 흔한 글자}
      - {big: 김학우, label: 한글 전신 부호를 만든 사람}
  일반:
    headline: 모스 부호는 모스 혼자 만든 게 아니에요
    items:
    - t: 직접 해 볼 세 가지
      b: 모스 부호, 헤르츠의 전파 실험, 라이덴 병을 직접 해 볼 수 있어요. 전파를 처음 증명하고 통신에 쓰기까지를 손으로 따라가요.
    - t: 모스 부호의 내력
      b: 동료 베일이 알파벳 부호로 넓혔고, 지금의 국제 모스 부호는 1865년에 표준이 됐어요. SOS는 끊지 않고 이어 치는 하나의 신호예요.
    - t: 헤르츠 실험
      b: 유도코일의 고전압을 불꽃 간극에 튀겨 전파를 쏘고, 떨어진 고리 안테나의 작은 불꽃으로 받았어요.
    remember: SOS는 세 글자가 아니라 이어 치는 하나의 신호예요.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 1865년, label: 국제 모스 부호가 표준이 된 해}
      - {big: SOS, label: 끊지 않고 이어 치는 하나의 신호}
  전문가:
    headline: 현행 표준은 ITU-R 권고 M.1677-1이다
    items:
    - t: 출발점의 재현
      b: 국제 모스 부호 송신, 헤르츠의 불꽃간극 실험, 라이덴 병 방전으로 전파 기술의 출발점을 재현한다.
    - t: 표준화의 경로
      b: 베일이 확장한 코드가 1848년 게르케의 개량을 거쳐 1865년 파리 국제전신협약에서 표준화됐다. 현행 표준은 ITU-R 권고 M.1677-1이다.
    - t: 헤르츠의 장치
      b: 1886년 가을 리스 나선에 라이덴 병을 방전시키다 장치를 착상했다. 룸코르프 유도코일의 고전압으로 1미터 쌍극자의 불꽃 간극을 때려 전파를 만들었다.
    remember: 선은 점 셋, 낱말 사이 간격은 점 일곱이다.
    visual:
      type: keyfact
      at: 1
      facts:
      - {big: 1865년, label: 파리 국제전신협약에서 표준화}
      - {big: M.1677-1, label: ITU-R 현행 표준 권고}
      - {big: 점 일곱, label: 낱말 사이 간격(선은 점 셋)}
    facts_used: [3, 5, 6, 13, 14]
