id: 10-ham
levels:
  초등:
    headline: 햄은 재미로 무선 이야기를 나누는 사람들이에요
    items:
    - t: 햄
      b: 돈을 벌려고가 아니라 재미있어서, 무선으로 멀리 있는 사람과 이야기를 나누는 사람들이에요.
    - t: 먼저 확인하고 쓰기
      b: 전파는 모두가 나눠 쓰는 거라서, 아무나 마음대로 쓰면 서로 방해가 돼요. 그래서 잘 쓸 수 있는지 먼저 확인해요.
    - t: 큰일이 났을 때
      b: 전화나 인터넷이 끊기는 큰일이 났을 때, 그 사람들의 무선이 대신 소식을 전해 줄 수 있어요.
    remember: 취미가 이웃을 돕는 일이 되기도 해요.
    visual:
      type: keyfact
      at: 0
      facts:
      - {big: 햄, label: 재미로 무선 이야기를 나누는 사람들}
  중고등:
    headline: 취미 무선도 자격을 확인하고 허가한 뒤에 쓸 수 있어요
    items:
    - t: 아마추어 무선과 햄
      b: 돈벌이가 아니라 스스로 익히고 기술을 시험해 보려고 하는 무선통신이에요. 그런 무선을 즐기는 사람들을 햄이라고 불러요.
    - t: 자격 확인
      b: 전파는 남과 나눠 쓰는 자원이라 나라가 자격을 확인하고 허가한 뒤에야 쓸 수 있어요. 시험은 방해 없이 제대로 쓰라는 약속이에요.
    - t: 비상시의 통신망
      b: 재난으로 통신망이 끊길 때를 대비하도록 국제 규칙이 각국에 권장해요. 평소의 취미가 비상시에는 통신망이 되기도 해요.
    remember: 전파는 나눠 쓰는 자원이라 자격을 확인한 뒤에 써요.
    visual:
      type: keyfact
      at: 0
      facts:
      - {big: 햄, label: 아마추어 무선을 즐기는 사람들}
  일반:
    headline: 금전적 이익 없는 무선이, 통신망이 끊기면 비상망이 돼요
    items:
    - t: 아마추어업무와 햄
      b: 국제전기통신연합은 금전적 이익 없이 개인적 관심에서 하는 자기훈련과 상호통신, 기술연구라고 정의해요. 그런 무선을 즐기는 사람이 햄이에요.
    - t: 무선설비·무선국·무선종사자
      b: 전파를 보내거나 받는 시설이 무선설비, 그 설비와 조작하는 사람을 합쳐 무선국이에요. 자격을 받은 사람이 무선종사자예요.
    - t: 재난구호 대비
      b: 국제 규칙이 아마추어국을 재난구호 통신에 대비시키도록 각국에 권장해요. 평소엔 취미지만 통신망이 끊기면 실제 비상망이 돼요.
    remember: 평소엔 취미지만, 통신망이 끊기면 비상망이 돼요.
    visual:
      type: steps
      at: 1
      title: 전파법의 세 낱말
      steps:
      - {k: 무선설비, v: 전파를 보내거나 받는 시설}
      - {k: 무선국, v: 설비와 조작하는 사람}
      - {k: 무선종사자, v: 자격을 받은 사람}
  전문가:
    headline: 금전적 이익 없는 무선이 제도 안에서 비상망이 된다
    items:
    - t: 전파규칙 제1.56조
      b: 아마추어업무를 금전적 이익 없는 자기훈련, 상호통신, 기술연구로 정의한다. 영리 목적이 아니라는 점이 핵심이고, 운용 규칙은 제25조가 따로 둔다.
    - t: 자격검정과 네 등급
      b: 제25.6조가 각국에 자격 검증 의무를 지운다. 국내는 전파법 제70조의 자격검정과 시행령 별표 17의 네 등급이 있고, 검정은 한국방송통신전파진흥원에 위탁된다.
    - t: 재난구호 대비
      b: 제25.9A조가 재난구호 대비를 권장하고, 제25.3조는 제3자 대리 국제통신을 비상과 재난구호에 한정한다. 취미 무선국이 제도 안에서 비상망이 된다.
    remember: 핵심은 영리 목적이 아니라는 점이고, 자격 검증은 각국의 의무다.
    visual:
      type: steps
      at: 1
      title: 등급별 안테나공급전력 상한
      steps:
      - {k: 제1급, v: 1kW 이하}
      - {k: 제2급, v: 200W 이하}
      - {k: 제3급, v: 100W 이하 (주파수 조건)}
      - {k: 제4급, v: 10W 이하 (30MHz 이상)}
    facts_used: [0, 2, 5, 6, 7, 10, 11]
