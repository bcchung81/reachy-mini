<title>전파체험관 교육자료 — 발표형</title>
<!--
  전파체험관 교육자료(발표형) — `python -m scripts.handout_hud.build` 가 만든 파일이다. 직접 고치지 않는다.
  카드는 `data/handout-cards/<큐>.yaml`, 대사는 `data/cues.yaml`, 이 틀은 `scripts/handout_hud/template.html`.

  사용자 요구(2026-10-06): ① 교육 자료는 화면 가득. ② 사회자는 콘텐츠의 왼쪽·도슨트는 오른쪽 **고정 구역**에 말풍선으로.
  ③ HUD 방식 — 가리는 면적을 최소로(말하는 문장 하나만, 반투명, 말이 끝나면 사라지고 아이콘만 남는다). ④ 아이콘은 사용자가 준 로봇 이미지.

  화면의 글은 검수한 고정 대본을 줄여 쓴 카드뿐이다(새 사실 없음 — 빌드가 대본·조사 자료와 대조한다).
  외부 리소스를 부르지 않는다(전시장은 오프라인). 모든 글자는 textContent 로만 넣는다.
  실서비스 연결 지점은 맨 아래 `window.hud`.
-->
<style>
:root{
  /* 1280×720 을 기준으로 한 길이 단위 — 창이 커지면 글자·간격이 같이 커지고, 남는 세로는 flex 가 나눠 가진다 */
  --u:min(calc(100vw / 1280), calc(100vh / 720));
  --ink:#0E2433; --sig:#0B7FB5; --mist:#E8F3F8; --rule:#C3D9E6; --bg:#F3F7FA;
  --mc:#0A6F84; --mcbg:#DDF1F5; --doc:#8F5300; --docbg:#FFEFD6; --amber:#B96F00; --muted:#52636F;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;

.stage{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── 위 도구줄: 장·수준·코스·시뮬레이션. 콘텐츠를 가리지 않는 크롬이다 */
.bar{flex:0 0 calc(var(--u)*42);display:flex;align-items:center;gap:calc(var(--u)*12);padding:0 calc(var(--u)*16);
  background:var(--ink);color:#fff;font-size:calc(var(--u)*13);position:relative;z-index:6}
.nav{display:flex;align-items:center;gap:calc(var(--u)*6);min-width:0}
.nav select{width:calc(var(--u)*270);background:#1B3A4F;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:calc(var(--u)*4) calc(var(--u)*10);min-height:calc(var(--u)*30);text-overflow:ellipsis}
.round{width:calc(var(--u)*30);height:calc(var(--u)*30);border-radius:50%;border:1px solid rgba(255,255,255,.55);background:transparent;padding:0;font-size:calc(var(--u)*16);line-height:1}
.round:disabled{opacity:.35;cursor:default}
.pos{font-variant-numeric:tabular-nums;opacity:.8;white-space:nowrap}
.seg{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:calc(var(--u)*4) calc(var(--u)*12);min-height:calc(var(--u)*30);white-space:nowrap}
.seg button+button{border-left:1px solid rgba(255,255,255,.3)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:800}
.pill{border:1px solid rgba(255,255,255,.55);background:transparent;border-radius:999px;padding:calc(var(--u)*4) calc(var(--u)*13);min-height:calc(var(--u)*30);white-space:nowrap}
.pill.go{background:#fff;color:var(--ink);font-weight:800}
.sim{margin-left:auto;display:flex;align-items:center;gap:calc(var(--u)*8)}
.sim label{display:flex;align-items:center;gap:calc(var(--u)*5);white-space:nowrap}
.sim select{background:#1B3A4F;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:2px 6px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #7FD3F5;outline-offset:2px}

/* ── 장 */
.slide{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto;row-gap:calc(var(--u)*12);
  padding:calc(var(--u)*16) calc(var(--u)*52) calc(var(--u)*14)}
.headline{margin:0;font-size:calc(var(--u)*50);line-height:1.22;font-weight:800;letter-spacing:-.01em}
[data-turns]{transition:background-color .35s,opacity .35s,box-shadow .35s}
.headline.now{box-shadow:inset 0 calc(var(--u)*-10) 0 rgba(11,127,181,.22)}

/* 가운데 띠: [사회자 구역 | 그림 | 도슨트 구역]. 구역은 화면 끝까지 닿는다 */
.band{display:grid;grid-template-columns:minmax(calc(var(--u)*290),24%) minmax(0,1fr) minmax(calc(var(--u)*290),24%);
  align-items:center;margin:0 calc(var(--u)*-52);min-height:0}
.lane{align-self:stretch;display:flex;align-items:center;padding:0 calc(var(--u)*14)}
.lane-mc{background:repeating-radial-gradient(circle at 0% 50%,transparent 0,transparent calc(var(--u)*68),rgba(11,127,181,.13) calc(var(--u)*68),rgba(11,127,181,.13) calc(var(--u)*70))}
.lane-docent{background:repeating-radial-gradient(circle at 100% 50%,transparent 0,transparent calc(var(--u)*68),rgba(185,111,0,.17) calc(var(--u)*68),rgba(185,111,0,.17) calc(var(--u)*70))}
.visual{min-width:0;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*6);padding:0 calc(var(--u)*8)}

/* 폴듀 → 뉴펀들랜드 */
.km{font-size:calc(var(--u)*42);font-weight:800;color:#0B6A99;line-height:1.2;text-align:center}
.line{position:relative;width:100%;display:flex;align-items:center;margin-top:calc(var(--u)*16)}
.dot{flex:0 0 calc(var(--u)*24);width:calc(var(--u)*24);height:calc(var(--u)*24);border-radius:50%}
.dash{flex:1;border-top:calc(var(--u)*6) dashed var(--sig)}
.pulse{position:absolute;left:0;top:50%;width:calc(var(--u)*22);height:calc(var(--u)*22);margin-top:calc(var(--u)*-11);border-radius:50%;background:var(--sig);opacity:0}
.route.go .pulse{animation:travel 3.2s ease-in-out 1 forwards}
@keyframes travel{0%{left:0;opacity:1}92%{opacity:1}100%{left:calc(100% - var(--u)*22);opacity:0}}
.ends{width:100%;display:flex;justify-content:space-between;gap:calc(var(--u)*12);font-size:calc(var(--u)*26);font-weight:800;line-height:1.3}
.note{font-size:calc(var(--u)*13);color:var(--muted);margin-top:calc(var(--u)*4)}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;font-weight:800;padding:calc(var(--u)*6) calc(var(--u)*20);font-size:calc(var(--u)*16);min-height:calc(var(--u)*36)}
.btn.ghost{background:#fff;color:var(--ink)}
.route{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*6)}

/* 핵심 수치(keyfact)·단계(steps) — 02·03 장 말고 나머지 장의 그림 */
.vwrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*8)}
.vtitle{margin:0;font-size:calc(var(--u)*19);font-weight:800;text-align:center;color:var(--muted)}
.facts{width:100%;display:flex;justify-content:center;gap:calc(var(--u)*14)}
.fact{flex:1;min-width:0;max-width:calc(var(--u)*320);text-align:center;padding:calc(var(--u)*14) calc(var(--u)*12);border-radius:calc(var(--u)*14);background:#fff;border:1px solid #D3E1EA}
.fact .big{font-size:calc(var(--u)*46);font-weight:800;color:#0B6A99;line-height:1.15}
.facts.n1 .big{font-size:calc(var(--u)*70)}
.facts.n3 .big{font-size:calc(var(--u)*38)}
.fact .lab{margin-top:calc(var(--u)*6);font-size:calc(var(--u)*21);line-height:1.4}
.steps{width:100%;display:flex;justify-content:center;gap:calc(var(--u)*4)}
.step{flex:1;min-width:0;text-align:center;padding:calc(var(--u)*12) calc(var(--u)*8);border-radius:calc(var(--u)*12);background:#fff;border:1px solid #D3E1EA}
.step .k{font-size:calc(var(--u)*29);font-weight:800;color:#0B6A99;line-height:1.2}
.step .k.long{font-size:calc(var(--u)*21);overflow-wrap:normal}   /* 긴 이름(예: 2000년대 초)은 낱말 중간에서 끊지 않는다 */
.step .v{margin-top:calc(var(--u)*4);font-size:calc(var(--u)*18);line-height:1.4}
.arr{flex:0 0 auto;align-self:center;font-size:calc(var(--u)*20);color:var(--muted)}
.vwrap.now .fact,.vwrap.now .step{background:#DCEEF7;border-color:var(--sig)}
.vwrap.later{opacity:.72}

/* 주파수 다이얼 */
.dial{width:100%;display:flex;flex-direction:column;gap:calc(var(--u)*3)}
.wave{display:block;width:100%;height:calc(var(--u)*66)}
.wave path{fill:none;stroke:var(--sig);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.wl{display:flex;justify-content:space-between;font-size:calc(var(--u)*14);color:var(--muted);font-weight:700}
.dtitle{margin:0;text-align:center;font-size:calc(var(--u)*15);font-weight:800}
.freq{-webkit-appearance:none;appearance:none;display:block;width:100%;height:calc(var(--u)*30);margin:0;background:transparent;cursor:pointer}
.freq::-webkit-slider-runnable-track{height:calc(var(--u)*10);border-radius:6px;background:linear-gradient(90deg,var(--sig),var(--amber))}
.freq::-moz-range-track{height:calc(var(--u)*10);border-radius:6px;background:linear-gradient(90deg,var(--sig),var(--amber))}
.freq::-webkit-slider-thumb{-webkit-appearance:none;width:calc(var(--u)*22);height:calc(var(--u)*34);margin-top:calc(var(--u)*-12);border-radius:7px;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ink)}
.freq::-moz-range-thumb{width:calc(var(--u)*16);height:calc(var(--u)*28);border-radius:7px;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ink)}
.ticks{position:relative;height:calc(var(--u)*40);margin:0 calc(var(--u)*11)}
.tick{position:absolute;top:0;transform:translateX(-50%);font-size:calc(var(--u)*12);color:var(--muted);white-space:nowrap;text-align:center;line-height:1.3}
.tick::before{content:"";display:block;width:1px;height:calc(var(--u)*6);background:var(--ink);margin:0 auto calc(var(--u)*2)}
.tick.row2{top:calc(var(--u)*20)}
.tick.hl{color:var(--ink);font-weight:800}
.out{display:flex;gap:calc(var(--u)*30);justify-content:center;flex-wrap:wrap;font-size:calc(var(--u)*28);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.dyn{margin:0;min-height:1.5em;text-align:center;font-size:calc(var(--u)*16);font-weight:800;color:var(--amber)}
.fine{margin:0;text-align:center;font-size:calc(var(--u)*12);color:var(--muted)}
.dialrow{display:flex;justify-content:center;gap:calc(var(--u)*14);align-items:center}

/* 카드·기억해 두기 */
.cards{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:calc(var(--u)*16)}
.card{padding:calc(var(--u)*13) calc(var(--u)*18);border-radius:calc(var(--u)*12);background:#fff;border:1px solid #D3E1EA}
.card .hd{display:flex;align-items:center;gap:calc(var(--u)*10)}
.card .no{flex:0 0 calc(var(--u)*32);width:calc(var(--u)*32);height:calc(var(--u)*32);border-radius:50%;background:var(--muted);color:#fff;font-weight:800;font-size:calc(var(--u)*17);display:flex;align-items:center;justify-content:center}
.card .tt{font-size:calc(var(--u)*22);font-weight:800;line-height:1.3}
.card .bd{margin:calc(var(--u)*4) 0 0;font-size:calc(var(--u)*17);line-height:1.5}
.cards.n1 .bd{font-size:calc(var(--u)*21)}
.card.now{background:#DCEEF7;border-color:var(--sig)}
.card.now .no{background:var(--sig)}
.card.seen{background:var(--mist)}
.card.later{opacity:.62}
.remember{display:flex;align-items:center;gap:calc(var(--u)*12);padding:calc(var(--u)*8) calc(var(--u)*18);border-radius:calc(var(--u)*12);background:var(--ink);color:#fff}
.remember.now{box-shadow:0 0 0 3px var(--sig)}
.remember .tag{font-size:calc(var(--u)*12);font-weight:800;background:#fff;color:var(--ink);border-radius:999px;padding:0 calc(var(--u)*10);white-space:nowrap}
.remember .tx{font-size:calc(var(--u)*18);font-weight:800}
.src{margin:0;font-size:calc(var(--u)*12);color:var(--muted)}
.src:empty{display:none}

/* ── HUD: 말하는 문장 하나만, 반투명. 말이 끝나면 사라지고 아이콘만 남는다 */
.hud{display:flex;align-items:center;gap:calc(var(--u)*8);width:100%;min-width:0}
.hud.docent{flex-direction:row-reverse}

해 보고 '이런 게 있을 거야' 하고 알아냈어요. 그다음에 다른 과학자가 실험으로 진짜 있다는 걸 보여 줬답니다.", "전파에 신호를 실어서 멀리 보내는 데 처음 쓰였어요. 글쎄, 넓은 바다 건너편까지 신호가 닿았대요!"]}, "l2": {"headline": "전파는 발명이 아니라 발견이에요", "items": [{"t": "맥스웰 · 예언", "b": "수식만으로 이런 파동이 있을 거라고 내다봤어요."}, {"t": "헤르츠 · 증명", "b": "실험으로 처음 증명했어요."}, {"t": "마르코니 · 실용화", "b": "무선전신을 실용화했어요. 1901년에는 대서양 건너 약 3,500km에서 모스 부호를 받았다고 발표했어요."}], "remember": "발명은 없던 걸 새로 만드는 것, 발견은 원래 있던 걸 알아내는 것이에요.", "source": "", "visual": {"type": "route", "label": "대서양 건너 약 3,500km", "from": "송신", "to": "수신"}, "ask": [null, "와, 원래 있던 거였다니 신기하네요! 그럼 눈에 안 보이는 전파를 어떻게 찾아낸 거예요?", "그렇군요! 그럼 전파는 처음에 어디에 쓰였어요?"], "ans": ["사실 전파는 누가 만든 게 아니라 찾아낸 거예요. 없던 걸 새로 만드는 게 발명이라면, 전파는 원래 있던 걸 알아낸 거라서 발견이라고 부르거든요.", "그게 재밌는 부분이에요. 맥스웰이라는 과학자가 먼저 수식만으로 이런 파동이 있을 거라고 예언했거든요. 그리고 헤르츠가 실험으로 처음 증명했죠.", "마르코니가 전파로 신호를 주고받는 무선전신을 실용화했어요. 1901년에는 무려 대서양 건너 약 3,500킬로미터 떨어진 곳에서 모스 부호를 받았다고 발표했죠."]}, "l3": {"headline": "예언한 사람, 증명한 사람, 써먹은 사람이 따로 있었어요", "items": [{"t": "맥스웰 · 이론", "b": "전기·자기·빛이 한 가지 현상이라는 이론을 세웠고, 그 방정식이 전자기파를 예언했어요."}, {"t": "헤르츠 · 증명", "b": "그 전자기파를 실험으로 처음 확실하게 증명했어요."}, {"t": "마르코니 · 무선전신", "b": "1901년 12월 12일, 영국 폴듀에서 보낸 모스 부호를 약 3,500km 떨어진 대서양 건너 뉴펀들랜드에서 받았대요. 그때 뉴펀들랜드는 영국 식민지였어요."}], "remember": "전파는 발명이 아니라 발견이에요.", "source": "", "visual": {"type": "route", "label": "약 3,500km · 1901.12.12", "from": "폴듀 (영국)", "to": "뉴펀들랜드"}, "ask": [null, "와, 원래 있던 거였다니 신기하네요! 그럼 눈에 안 보이는 전파를 어떻게 찾아낸 거예요?", "그렇군요! 그럼 전파는 처음에 어디에 쓰였어요?"], "ans": ["재밌게도 전파는 발명이 아니라 발견이에요. 머리로 예언한 사람, 실험으로 증명한 사람, 통신에 쓴 사람이 다 따로 있었다는 게 이 이야기의 재미거든요.", "맥스웰은 전기와 자기, 빛이 한 가지 현상이라는 이론을 세웠는데요, 그 방정식이 전자기파가 있다고 예언했어요. 그걸 실험으로 처음 확실하게 증명한 사람이 헤르츠예요.", "마르코니가 만든 무선전신이에요. 1901년 12월 12일 영국 폴듀에서 보낸 모스 부호를 약 3,500킬로미터 떨어진 대서양 건너 뉴펀들랜드에서 받았대요. 그때 뉴펀들랜드는 영국 식민지였고요."]}, "l4": {"headline": "전파를 발견한 사람을 한 명으로 꼽기는 어렵다", "items": [{"t": "맥스웰 방정식 · 이론적 예언", "b": "전자기파의 존재를 예언했다."}, {"t": "헤르츠 · 실험적 증명", "b": "처음으로 결정적인 실험으로 증명했다. 흔히 드는 1785년은 쿨롱 법칙이 나온 해로, 전자기학의 출발점이지 전파의 발견은 아니다."}, {"t": "마르코니 · 실용화", "b": "1909년 브라운과 노벨 물리학상을 공동 수상했다. 1901년 폴듀에서 세인트존스까지 약 3,500km 수신은 지금도 논쟁거리다."}], "remember": "이론적 예언, 실험적 증명, 실용화는 각각 다른 사람의 일이었다.", "source": "근거 · Wikipedia — James Clerk Maxwell · Wikipedia — Heinrich Hertz · Wikipedia — Guglielmo Marconi · Wikipedia — Coulomb's law (신뢰 등급 B)", "visual": {"type": "route", "label": "약 3,500km (2,200마일)", "from": "폴듀 (영국 콘월)", "to": "세인트존스 (뉴펀들랜드)"}, "ask": [null, "와, 원래 있던 거였다니 신기하네요! 그럼 눈에 안 보이는 전파를 어떻게 찾아낸 거예요?", "그렇군요! 그럼 전파는 처음에 어디에 쓰였어요?"], "ans": ["발명이 아니라 발견이에요. 다만 발견한 사람을 딱 한 명으로 꼽기는 어렵습니다. 이론적 예언, 실험적 증명, 실용화가 각각 다른 사람의 일이었거든요.", "맥스웰 방정식이 전자기파의 존재를 예언했고, 헤르츠가 처음으로 결정적인 실험으로 증명했어요. 흔히 출발점으로 꼽는 1785년은 쿨롱 법칙이 나온 해라서, 전자기학의 출발점이지 전파의 발견은 아니에요.", "마르코니의 실용 무선전신이에요. 그는 1909년 브라운과 함께 노벨 물리학상도 받았죠. 1901년 폴듀에서 보낸 모스 부호를 약 3,500킬로미터 떨어진 세인트존스에서 받았다고 했는데, 그 수신은 지금도 논쟁거리예요."]}}, "turns": {"headline": "open docent0", "visual": "docent2"}, "actions": {"docent2": [{"type": "pulse"}]}}, {"id": "03-theory", "no": "03", "title": "전파 이론 — 주파수와 파장", "n": 3, "open": "이제 전파가 정확히 뭔지 원리로 들어가 볼게요. 도슨트, 전파는 도대체 뭐예요?", "after": "보이지 않는 것을 이렇게 풀어 주시니 훨씬 가깝게 느껴지네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.", "lv": {"l1": {"headline": "전파는 눈에 안 보이는 물결이에요", "items": [{"t": "물결", "b": "연못의 물결처럼 멀리 퍼져 가요. 전파는 물이 없는 텅 빈 곳도 지나가요."}, {"t": "주파수", "b": "물결이 얼마나 빠르게 출렁이는지예요."}, {"t": "파장", "b": "물결 하나의 길이예요. 빠르게 출렁일수록 짧아져요."}], "remember": "빠르게 출렁일수록 물결 하나는 짧아져요.", "source": "", "visual": {"type": "dial", "mode": "words", "low": "천천히 출렁여요 · 물결 하나 — 길어요", "high": "빠르게 출렁여요 · 물결 하나 — 짧아요", "title": "다이얼을 돌려 보세요. 물결이 어떻게 바뀔까요?", "endLabels": ["느리게", "빠르게"], "caption": "그림은 느낌만 보여 줘요."}, "ask": [null, "아하, 그렇군요! 그럼 주파수는 뭐예요?", "그럼 파장은 뭐고, 주파수랑은 어떤 사이예요?"], "ans": ["전파는 눈에 보이지도 않고 만져지지도 않는 물결 같은 거예요. 연못의 물결처럼 멀리 퍼져 가는데요, 전파는 물이 없는 텅 빈 곳도 지나가요.", "주파수는 전파가 얼마나 빠르게 출렁이는지를 말해요. 아주 빠르게 출렁이는 전파도 있고, 느릿느릿 천천히 출렁이는 전파도 있답니다.", "파장은 물결 하나의 길이예요. 빠르게 출렁이는 전파일수록 물결 하나가 짧아지고, 천천히 출렁일수록 길어지거든요."]}, "l2": {"headline": "주파수가 높을수록 파장은 짧아져요", "items": [{"t": "전자기파", "b": "전기와 자기가 서로를 밀어 주며 퍼져 나가요. 소리와 달리 텅 빈 우주 공간에서도 가요."}, {"t": "주파수 (Hz)", "b": "1초에 몇 번 출렁이는지예요. 단위 헤르츠는 전파를 처음 증명한 헤르츠에서 왔어요."}, {"t": "파장", "b": "한 번 출렁이는 동안 나아간 거리예요. 주파수와 반비례해요."}], "remember": "주파수가 높아지면 파장은 짧아져요. 둘은 반비례예요.", "source": "", "visual": {"type": "dial", "mode": "num", "low": "주파수 낮음 · 파장 길다", "high": "주파수 높음 · 파장 짧다", "title": "주파수 다이얼 — 돌려서 파장을 확인해 보세요", "ticks": [{"e": 3, "label": "1kHz"}, {"e": 6, "label": "1MHz"}, {"e": 9, "label": "1GHz"}, {"e": 12, "label": "1THz"}], "fLabel": "주파수", "lLabel": "파장 약", "sf": 1, "formula": "주파수 ↑ → 파장 ↓ (반비례)", "caption": "그림의 물결 수는 느낌을 보여 주려고 줄여 그렸어요(실제 비율 아님). 숫자는 파장 = 빛의 속도 ÷ 주파수로 계산했어요."}, "ask": [null, "아하, 그렇군요! 그럼 주파수는 뭐예요?", "그럼 파장은 뭐고, 주파수랑은 어떤 사이예요?"], "ans": ["전파는 전기와 자기가 서로를 밀어 주며 퍼져 나가는 전자기파의 한 갈래예요. 소리는 공기가 없으면 못 가잖아요? 그런데 전파는 텅 빈 우주 공간에서도 퍼져 나가요.", "주파수는 전파가 1초에 몇 번 출렁이는지를 나타내는 양이고, 단위는 헤르츠예요. 재밌는 건 이 이름이 앞에서 전파를 처음 증명한 헤르츠에서 왔다는 거예요.", "파장은 전파가 한 번 출렁이는 동안 나아간 거리예요. 빨리 출렁일수록, 그러니까 주파수가 높을수록 파장은 짧아지죠. 둘은 서로 반비례하는 사이예요."]}, "l3": {"headline": "파장은 빛의 속도를 주파수로 나눈 값이에요", "items": [{"t": "전파", "b": "빛과 같은 전자기파의 한 갈래예요. 진공에서도 가고, 그때는 빛의 속도로 달려요."}, {"t": "주파수", "b": "1초 동안 진동하는 횟수예요. 1회가 1헤르츠, 1,000회가 1킬로헤르츠예요."}, {"t": "파장", "b": "빛의 속도 ÷ 주파수예요. 100메가헤르츠 FM 라디오 전파의 파장은 약 3m예요."}], "remember": "주파수가 높을수록 파장은 짧아져요.", "source": "", "visual": {"type": "dial", "mode": "num", "low": "주파수 낮음 · 파장 길다", "high": "주파수 높음 · 파장 짧다", "title": "주파수 다이얼 — 돌려서 파장을 확인해 보세요", "ticks": [{"e": 3, "label": "1kHz"}, {"e": 6, "label": "1MHz"}, {"e": 9, "label": "1GHz"}, {"e": 12, "label": "1THz"}, {"e": 8, "label": "FM 라디오 100MHz", "row2": true, "hl": true}], "fLabel": "주파수", "lLabel": "파장 = 약", "sf": 1, "fmSentence": "100메가헤르츠 FM 라디오 전파는 파장이 약 3미터예요.", "fmButton": "FM 라디오 100MHz 로 맞추기", "formula": "파장 = 빛의 속도 ÷ 주파수 · 예) 100MHz FM 라디오 → 약 3m", "caption": "그림의 물결 수는 느낌을 보여 주려고 줄여 그렸어요(실제 비율 아님). 숫자는 파장 = 빛의 속도 ÷ 주파수로 계산했어요."}, "ask": [null, "아하, 그렇군요! 그럼 주파수는 뭐예요?", "그럼 파장은 뭐고, 주파수랑은 어떤 사이예요?"], "ans": ["전파는 빛과 같은 전자기파의 한 갈래로, 아무것도 없는 공간에서도 스스로 퍼져 나가요. 소리는 공기가 있어야 들리잖아요. 전파는 진공에서도 가고, 그때는 빛의 속도로 달려요.", "주파수는 1초 동안 진동하는 횟수를 나타내는 물리량이고, 단위가 헤르츠예요. 1초에 한 번 진동하면 1헤르츠, 천 번이면 1킬로헤르츠라고 부르죠.", "파장은 파동이 한 번 진동하는 동안 나아간 거리로, 빛의 속도를 주파수로 나눈 값이에요. 그래서 주파수가 높을수록 짧아지는데요, 100메가헤르츠 FM 라디오 전파는 파장이 약 3미터나 돼요."]}, "l4": {"headline": "전파는 3,000GHz보다 낮은 주파수의 전자기파다", "items": [{"t": "전파법상 정의", "b": "인공적인 유도 없이 공간에 퍼져 나가는 전자파로서 국제전기통신연합이 정한 범위의 주파수를 가진 것."}, {"t": "ITU 전파규칙", "b": "그 범위를 3,000GHz보다 낮은 주파수로 잡는다."}, {"t": "빛의 속도 c", "b": "299,792,458m/s. 측정값이 아니라 미터의 정의가 고정한 값이라 정확하다."}], "remember": "λ = c ÷ f 이고, c 는 근삿값이 아니라 정의로 고정된 정확한 값이다.", "source": "근거 · 국가법령정보센터 — 전파법 제2조 · ITU Radio Regulations No. 1.5 · Wikipedia — Speed of light (신뢰 등급 B)", "visual": {"type": "dial", "mode": "num", "low": "주파수 낮음 · 파장 길다", "high": "주파수 높음 · 파장 짧다", "title": "주파수 다이얼 — 돌려서 파장을 확인해 보세요", "ticks": [{"e": 3, "label": "1kHz"}, {"e": 6, "label": "1MHz"}, {"e": 9, "label": "1GHz"}, {"e": 12, "label": "1THz"}, {"e": 8, "label": "FM 라디오 100MHz", "row2": true, "hl": true}, {"e": 12.4771, "label": "3,000GHz", "row2": true, "hl": true}], "fLabel": "f =", "lLabel": "λ = c ÷ f =", "sf": 4, "fmSentence": "FM 라디오 100MHz 근처다. 파장은 약 3m다.", "fmButton": "FM 라디오 100MHz 로 맞추기", "formula": "λ = c ÷ f · c = 299,792,458 m/s (정확값)", "caption": "그림의 물결 수는 느낌을 보여 주려고 줄여 그렸어요(실제 비율 아님). 숫자는 파장 = 빛의 속도 ÷ 주파수로 계산했어요."}, "ask": [null, "아하, 그렇군요! 그럼 주파수는 뭐예요?", "그럼 파장은 뭐고, 주파수랑은 어떤 사이예요?"], "ans": ["전파법은 전파를 인공적인 유도 없이 공간에 퍼져 나가는 전자파로서 국제전기통신연합이 정한 범위의 주파수를 가진 것으로 정의해요. 그 범위는 ITU 전파규칙이 3,000기가헤르츠보다 낮은 주파수로 잡고 있고요.", "주파수는 단위시간당 반복 횟수를 나타내는 물리량이고, 헤르츠는 그 SI 단위로 초의 역수예요. 주기적인 현상에만 쓰고, 이름은 전자기파를 처음 결정적으로 증명한 하인리히 헤르츠에서 왔습니다.", "파장은 빛의 속도를 주파수로 나눈 값이고, 진공에서 빛의 속도는 정확히 초속 299,792,458미터예요. 재밌는 건 이게 측정값이 아니라, 미터의 정의가 이 값을 고정해 뒀기 때문에 정확하다는 거예요."]}}, "turns": {"headline": "open", "visual": "docent1 docent2"}, "actions": {"docent1": [{"type": "dial", "from": 3, "to": 12.3}], "docent2": [{"type": "dial", "to": 8, "ms": 2400}]}}, {"id": "04-morse", "no": "04", "title": "전파이야기 체험 — 모스부호·헤르츠 실험·라이덴 병", "n": 3, "open": "체험관에는 직접 만져볼 수 있는 장치들도 있다고 들었어요. 도슨트, 전파이야기 체험존에서는 무엇을 해볼 수 있나요?", "after": "모스부호를 직접 쳐볼 수 있다니 재미있겠어요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.", "lv": {"l1": {"headline": "점과 선만으로 글자를 보내는 약속이 모스 부호예요", "items": [{"t": "모스 부호", "b": "짧게 똑, 길게 뚜우. 점과 선 두 가지만으로 글자를 보내는 약속이에요. 직접 손으로 쳐 볼 수 있어요."}, {"t": "글자마다 약속", "b": "짧은 신호와 긴 신호를 섞어 글자마다 약속을 정했어요. 자주 쓰는 글자일수록 짧은 신호를 줘요."}, {"t": "불꽃으로 만든 전파", "b": "옛날 한 과학자가 불꽃을 튀겨 전파를 만들고, 떨어진 곳에서 받아 냈어요. 라이덴 병은 전기를 잠깐 담아 두는 병이에요."}], "remember": "짧은 신호와 긴 신호만 섞어도 글자를 보낼 수 있어요.", "source": "", "visual": {"type": "keyfact", "at": 0, "facts": [{"big": "점과 선", "label": "두 가지만으로 글자를 보내요"}, {"big": "똑 · 뚜우", "label": "짧게 똑", "길게 뚜우": null}]}, "ask": [null, "재밌겠네요! 그럼 모스 부호는 어떻게 만들어진 거예요?", "그럼 헤르츠 실험은 무엇을 보여 주는 거예요?"], "ans": ["점과 선으로 글자를 보내는 모스 부호를 직접 손으로 쳐 볼 수 있어요! 짧게 똑, 길게 뚜우, 이 두 소리만으로 편지를 쓰는 셈이에요.", "짧은 신호와 긴 신호를 섞어서 글자마다 약속을 정해 둔 거예요. 자주 쓰는 글자일수록 짧은 신호를 줘서 빨리 보낼 수 있게 했답니다.", "옛날 한 과학자가 불꽃을 튀겨서 전파를 만들고, 떨어진 곳에서 그 전파를 받아 낸 실험이에요. 라이덴 병은 전기를 잠깐 담아 두는 병이고요."]}, "l2": {"headline": "모스 부호는 점과 선의 길이 차이로 글자를 나타내요", "items": [{"t": "체험 세 가지", "b": "모스 부호, 헤르츠의 전파 실험, 라이덴 병을 직접 체험해요. 전파를 처음 만들고 쓰던 방법을 손으로 따라가 봐요."}, {"t": "모스 부호의 설계", "b": "점과 선의 길이 차이로 글자를 나타내요. 자주 쓰는 글자일수록 짧은 부호를 받아서 가장 흔한 E가 점 하나예요."}, {"t": "헤르츠 실험", "b": "헤르츠가 불꽃을 튀겨 전파를 만들고 떨어진 고리에서 받아 내 존재를 확인했어요. 라이덴 병은 축전기의 원형이에요."}], "remember": "자주 쓰는 글자일수록 짧은 부호를 받았어요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "E = 점 하나", "label": "영어에서 가장 흔한 글자"}, {"big": "김학우", "label": "한글 전신 부호를 만든 사람"}]}, "ask": [null, "재밌겠네요! 그럼 모스 부호는 어떻게 만들어진 거예요?", "그럼 헤르츠 실험은 무엇을 보여 주는 거예요?"], "ans": ["모스 부호랑 헤르츠의 전파 실험, 라이덴 병을 직접 체험해 볼 수 있어요. 전파를 처음 만들고 쓰던 방법을 손으로 하나씩 따라가 보는 거죠.", "점과 선의 길이 차이로 글자를 나타내는데, 자주 쓰는 글자일수록 짧은 부호를 받았어요. 그래서 영어에서 가장 흔한 E가 점 하나예요. 한글 전신 부호는 김학우가 만들었죠.", "헤르츠가 불꽃을 튀겨 전파를 만들고 떨어진 고리에서 받아 내 존재를 확인한 실험이에요. 라이덴 병은 전기를 담는 축전기의 원형인데, 그 방전 실험이 실마리가 됐어요."]}, "l3": {"headline": "모스 부호는 모스 혼자 만든 게 아니에요", "items": [{"t": "직접 해 볼 세 가지", "b": "모스 부호, 헤르츠의 전파 실험, 라이덴 병을 직접 해 볼 수 있어요. 전파를 처음 증명하고 통신에 쓰기까지를 손으로 따라가요."}, {"t": "모스 부호의 내력", "b": "동료 베일이 알파벳 부호로 넓혔고, 지금의 국제 모스 부호는 1865년에 표준이 됐어요. SOS는 끊지 않고 이어 치는 하나의 신호예요."}, {"t": "헤르츠 실험", "b": "유도코일의 고전압을 불꽃 간극에 튀겨 전파를 쏘고, 떨어진 고리 안테나의 작은 불꽃으로 받았어요."}], "remember": "SOS는 세 글자가 아니라 이어 치는 하나의 신호예요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "1865년", "label": "국제 모스 부호가 표준이 된 해"}, {"big": "SOS", "label": "끊지 않고 이어 치는 하나의 신호"}]}, "ask": [null, "재밌겠네요! 그럼 모스 부호는 어떻게 만들어진 거예요?", "그럼 헤르츠 실험은 무엇을 보여 주는 거예요?"], "ans": ["모스 부호, 헤르츠의 전파 실험, 그리고 라이덴 병까지 세 가지를 직접 해 볼 수 있어요. 전파를 처음 증명하고 통신에 쓰기까지의 과정을 손으로 따라가 보는 코너예요.", "사실 이건 모스 혼자 만든 게 아니에요. 동료 베일이 알파벳 부호로 넓혔고, 지금의 국제 모스 부호는 1865년에 표준이 됐어요. SOS도 세 글자가 아니라 끊지 않고 이어 치는 하나의 신호예요.", "헤르츠는 유도코일의 고전압을 불꽃 간극에 튀겨 전파를 쏘고, 떨어진 고리 안테나의 작은 불꽃으로 받았어요. 라이덴 병은 1745년에 발견된 축전기의 원형이고, 그 방전 실험이 실마리가 됐어요."]}, "l4": {"headline": "현행 표준은 ITU-R 권고 M.1677-1이다", "items": [{"t": "출발점의 재현", "b": "국제 모스 부호 송신, 헤르츠의 불꽃간극 실험, 라이덴 병 방전으로 전파 기술의 출발점을 재현한다."}, {"t": "표준화의 경로", "b": "베일이 확장한 코드가 1848년 게르케의 개량을 거쳐 1865년 파리 국제전신협약에서 표준화됐다. 현행 표준은 ITU-R 권고 M.1677-1이다."}, {"t": "헤르츠의 장치", "b": "1886년 가을 리스 나선에 라이덴 병을 방전시키다 장치를 착상했다. 룸코르프 유도코일의 고전압으로 1미터 쌍극자의 불꽃 간극을 때려 전파를 만들었다."}], "remember": "선은 점 셋, 낱말 사이 간격은 점 일곱이다.", "source": "근거 · Wikipedia — Morse code · ITU 원문 PDF — Recommendation ITU-R M.1677-1 (10/2009) · ITU-R M.1677-1, Annex 1, §2.1~2.4 · Wikipedia — Heinrich Hertz / Spark-gap transmitter · Wikipedia — Heinrich Hertz / Spark-gap transmitter (원문: metal balls or plates for capacitance (C) ... an induction coil (Ruhmkorff coil) (T) ... 5 to 30 kV) (신뢰 등급 B)", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "1865년", "label": "파리 국제전신협약에서 표준화"}, {"big": "M.1677-1", "label": "ITU-R 현행 표준 권고"}, {"big": "점 일곱", "label": "낱말 사이 간격(선은 점 셋)"}]}, "ask": [null, "재밌겠네요! 그럼 모스 부호는 어떻게 만들어진 거예요?", "그럼 헤르츠 실험은 무엇을 보여 주는 거예요?"], "ans": ["국제 모스 부호 송신, 헤르츠의 불꽃간극 실험, 라이덴 병 방전까지 전파 기술의 출발점을 재현해 볼 수 있어요. 이론이 실험 장치로 내려오는 지점을 직접 만져 보는 셈이죠.", "베일이 알파벳 부호로 확장한 코드가 1848년 게르케의 개량을 거쳐 1865년 5월 17일 파리 국제전신협약에서 표준화됐어요. 현행 표준은 ITU-R 권고 M.1677-1이고, 선은 점 셋, 낱말 사이 간격은 점 일곱이에요.", "헤르츠는 1886년 가을 리스 나선에 라이덴 병을 방전시키다 장치를 착상했고, 룸코르프 유도코일의 고전압으로 1미터 쌍극자의 불꽃 간극을 때려 전파를 만들었어요. 재밌는 건 본인은 쓸모를 묻자 없을 것 같다고 답했대요."]}}}, {"id": "05-donor", "no": "05", "title": "기증자 — 장황남 박사", "n": 2, "open": "이 체험관 전시품 중에는 한 분이 기증한 것들이 있다고 들었어요. 도슨트, 장황남 박사가 누구인지 소개해 주세요.", "after": "의사가 통신 장비를 모았다는 게 뜻밖이죠. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.", "lv": {"l1": {"headline": "의사 선생님이 모은 통신 기계로 박물관이 생겼어요", "items": [{"t": "의사 선생님", "b": "병을 고치는 의사 선생님이에요. 통신 기계를 무척 좋아해서 아주 오랫동안 하나씩 모았어요."}, {"t": "이름을 딴 박물관", "b": "혼자 갖지 않고 대학교에 내놓아서 그분 이름을 딴 박물관이 생겼어요. 많은 사람이 옛날 통신 기계를 볼 수 있어요."}], "remember": "혼자 갖지 않고 우리가 볼 수 있게 내놓았어요.", "source": "", "visual": {"type": "steps", "at": 1, "steps": [{"k": "모으기", "v": "통신 기계를 하나씩 모았어요"}, {"k": "내놓기", "v": "혼자 갖지 않고 대학교에 내놓았어요"}, {"k": "박물관", "v": "그분 이름을 딴 박물관이 생겼어요"}]}, "ask": [null, "의사 선생님이 통신 기계를요? 그럼 모은 기계들은 어떻게 됐어요?"], "ans": ["병을 고치는 의사 선생님이에요! 통신 기계를 무척 좋아해서 아주 오랫동안 하나씩 모았고, 그걸 혼자 갖지 않고 우리가 볼 수 있게 내놓았어요.", "모은 기계들을 대학교에 내놓아서, 그분 이름을 딴 박물관이 생겼어요. 덕분에 많은 사람이 옛날 통신 기계를 볼 수 있게 됐답니다."]}, "l2": {"headline": "본업이 의사인 분이 통신 장비를 모아 기증했어요", "items": [{"t": "본업은 의사", "b": "전남 완도에서 태어나 의과대학을 다녔어요. 1963년에는 전남에서 처음으로 아마추어 무선국을 열었어요."}, {"t": "수집과 기증", "b": "1972년 미국으로 건너가 의사로 일하면서도 수집을 이어 갔어요. 기증해서 2014년 조선대학교에 박물관이 세워졌어요."}], "remember": "본업이 의사인 사람이 통신 장비를 모았어요.", "source": "", "visual": {"type": "steps", "at": 1, "steps": [{"k": "1963년", "v": "전남에서 처음 아마추어 무선국"}, {"k": "1972년", "v": "미국으로 건너가 의사로 일함"}, {"k": "2014년", "v": "조선대학교에 박물관이 세워짐"}]}, "ask": [null, "의사 선생님이 통신 기계를요? 그럼 모은 기계들은 어떻게 됐어요?"], "ans": ["놀랍게도 본업이 의사였던 분이에요. 전남 완도에서 태어나 의과대학을 다녔고, 1963년 전남에서 처음으로 아마추어 무선국을 연 사람이기도 해요.", "1972년 미국으로 건너가 의사로 일하면서도 수집을 이어 갔어요. 모은 것을 기증해서 2014년 조선대학교에 그의 이름을 딴 정보통신박물관이 세워졌어요."]}, "l3": {"headline": "의사가 모은 통신 장비가 조선대학교 박물관이 됐어요", "items": [{"t": "본업은 의사", "b": "전남 완도에서 태어나 전남의과대학을 나왔어요. 1963년에는 전남 최초의 아마추어 무선 통 쭉 나아가요."}, {"t": "세계의 약속", "b": "세계가 함께 쓰는 약속으로 구간을 나누고 이름을 붙여 뒀어요."}], "remember": "길이가 다르면 잘하는 일도 달라서 나눠 놓았어요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "긴 전파", "label": "언덕을 빙 돌아서 넘어가요"}, {"big": "짧은 전파", "label": "곧게 쭉 나아가요"}]}, "ask": [null, "아, 그렇구나! 그럼 길이가 다르면 실제로 뭐가 달라져요?", "그럼 그 구분은 누가 정하는 거예요?"], "ans": ["전파에도 아주 길게 출렁이는 것부터 쌀알만큼 짧게 떨리는 것까지 여러 종류가 있거든요. 길이가 다르면 잘하는 일도 달라서 나눠 놓은 거예요.", "신기하게도 긴 전파는 언덕을 빙 돌아서 넘어가고, 짧은 전파는 곧게 쭉 나아가요. 그래서 하는 일도 서로 달라요.", "세계가 함께 쓰는 약속으로 구간을 나누고 이름을 붙여 뒀어요. 이 코너 기계들은 서로 다른 전파를 쓰던 옛날 기계들이고요."]}, "l2": {"headline": "주파수에 따라 전파의 성질이 달라요", "items": [{"t": "주파수와 파장", "b": "주파수가 낮을수록 한 번 출렁이는 길이, 즉 파장이 길고, 높을수록 짧아져요."}, {"t": "멀리 가는 전파, 곧게 가는 전파", "b": "파장이 긴 전파는 장애물을 휘돌아 땅을 따라 지평선 너머까지 가요. 짧은 전파는 빛처럼 곧게 나아가요."}, {"t": "국제기구의 구분", "b": "성질이 다르니까 국제기구가 구간을 나누고 이름과 쓰임새를 정해 뒀어요."}], "remember": "주파수가 낮을수록 파장이 길고, 높을수록 짧아요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "긴 파장", "label": "장애물을 휘돌아 넘어가요"}, {"big": "짧은 파장", "label": "빛처럼 곧게 나아가요"}]}, "ask": [null, "아, 그렇구나! 그럼 길이가 다르면 실제로 뭐가 달라져요?", "그럼 그 구분은 누가 정하는 거예요?"], "ans": ["주파수에 따라 전파의 성질이 달라서예요. 주파수가 낮을수록 한 번 출렁이는 길이, 즉 파장이 길고, 높을수록 짧아지거든요.", "파장이 긴 전파는 언덕 같은 장애물을 휘돌아 넘어가고 땅을 따라 지평선 너머까지 가요. 반대로 짧은 전파는 빛처럼 곧게 나아가서 앞이 트여 있어야 잘 닿죠.", "성질이 다르니까 국제기구가 구간을 나누고 이름과 쓰임새를 정해 뒀어요. 이 코너의 기계들이 바로 그 서로 다른 구간을 쓰던 것들이에요."]}, "l3": {"headline": "전파는 주파수 순서로 나눠 이름을 붙여요", "items": [{"t": "주파수와 파장", "b": "초장파는 주파수가 아주 낮은 쪽, 밀리미터파는 아주 높은 쪽이에요. 파장으로는 100km에서 1mm까지예요."}, {"t": "대역별 전파 방식", "b": "낮은 주파수는 언덕을 휘돌아 지평선 너머까지 가요. 초단파부터는 곧게 가고, 단파는 전리층에서 꺾여 멀리 가기도 해요."}, {"t": "ITU의 구분", "b": "국제전기통신연합, ITU가 전파를 주파수 순서로 나누고 구간마다 이름을 붙였어요. 초장파는 VLF, 밀리미터파는 EHF처럼 영어 기호도 있어요."}], "remember": "파장이 길수록 멀리 돌아가고, 짧을수록 곧게 가요.", "source": "", "visual": {"type": "keyfact", "at": 0, "facts": [{"big": "VLF", "label": "초장파 · 주파수가 낮은 쪽 끝"}, {"big": "EHF", "label": "밀리미터파 · 주파수가 높은 쪽 끝"}, {"big": "100km~1mm", "label": "이 코너가 다루는 파장 범위"}]}, "ask": [null, "아, 그렇구나! 그럼 길이가 다르면 실제로 뭐가 달라져요?", "그럼 그 구분은 누가 정하는 거예요?"], "ans": ["주파수에 따라 파장과 성질이 달라서예요. 이 코너 제목의 초장파는 주파수가 아주 낮은 쪽, 밀리미터파는 아주 높은 쪽이고, 파장으로 치면 100킬로미터에서 1밀리미터까지예요.", "장파나 중파 같은 낮은 주파수는 언덕을 휘돌아 넘고 땅을 따라 지평선 너머까지 가요. 초단파부터는 빛처럼 곧게 가서 보이는 거리 안에서 쓰이고, 단파는 하늘의 전리층에서 꺾여 멀리 가기도 해요.", "국제전기통신연합, ITU가 전파를 주파수 순서로 나누고 구간마다 이름을 붙였어요. 초장파는 VLF, 밀리미터파는 EHF처럼 영어 기호도 함께 있죠."]}, "l4": {"headline": "대역 이름은 주파수 기준과 파장 기준 두 계열이다", "items": [{"t": "파장과 주파수", "b": "파장은 주파수에 반비례한다. 제목의 범위는 3kHz~300GHz이고, 파장으로는 100km~1mm이다."}, {"t": "전파 방식", "b": "VLF~MF는 회절로 장애물을 넘는 지표파, VHF 이상은 가시선 전파가 주를 이룬다. 중파와 단파는 전리층 굴절로 대륙 간 거리까지 가기도 한다."}, {"t": "ITU-R 권고 V.431-8", "b": "대역번호 N은 0.3×10^N Hz에서 3×10^N Hz로 정한다. 초장파는 주파수 기준, 밀리미터파는 파장 기준 이름이다."}], "remember": "파장이 길수록 멀리 간다고 단정할 수는 없다.", "source": "근거 · Recommendation ITU-R V.431-8 (08/2015), Table 1 — · Recommendation ITU-R V.431-8 (08/2015), Table 1 표제 및 NOTE 1 · ITU-R V.431-8 Table 1 에서 직접 계산 (3 kHz → 100 km, 300 GHz → 1 mm) · Recommendation ITU-R V.431-8 (08/2015), Table 1 의 열 구성 · Wikipedia — Radio propagation (신뢰 등급 B)", "visual": {"type": "keyfact", "at": 2, "facts": [{"big": "주파수 기준", "label": "VLF·LF·MF·HF·VHF·UHF·SHF·EHF"}, {"big": "파장 기준", "label": "미리어미터파 ~ 밀리미터파"}, {"big": "100km~1mm", "label": "VLF~EHF 구간의 파장"}]}, "ask": [null, "아, 그렇구나! 그럼 길이가 다르면 실제로 뭐가 달라져요?", "그럼 그 구분은 누가 정하는 거예요?"], "ans": ["주파수에 따라 전파 특성이 달라서 구간별로 다뤄야 하거든요. 파장은 주파수에 반비례해서, 제목의 범위인 3킬로헤르츠에서 300기가헤르츠는 파장으로 100킬로미터에서 1밀리미터예요.", "VLF에서 MF까지는 회절로 장애물을 넘는 지표파가 주된 전파 방식이고, VHF 이상은 가시선 전파가 주를 이뤄요. 중파와 단파는 전리층 굴절로 대륙 간 거리까지 가기도 해서, 파장이 길수록 멀리 간다고 단정할 순 없어요.", "기준은 ITU-R 권고 V.431-8의 표로, 대역번호 N을 0.3 곱하기 10의 N승에서 3 곱하기 10의 N승 헤르츠로 정해요. 다만 초장파는 주파수 기준, 밀리미터파는 파장 기준 이름이라 제목은 두 계열이 섞인 표현이에요."]}}}, {"id": "07-maritime", "no": "07", "title": "해상무선통신", "n": 3, "open": "이번엔 바다 위의 무선통신 이야기예요. 도슨트, 타이타닉호 이야기를 들려주실래요?", "after": "마지막까지 구조 신호를 보낸 전신기사 이야기가 뭉클하네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.", "lv": {"l1": {"headline": "구조 신호를 전파로 보내 사람들을 구했어요", "items": [{"t": "구조 신호", "b": "큰 배가 바다에서 가라앉을 때, 한 사람이 끝까지 도와 달라는 신호를 전파로 보냈어요. 그걸 들은 다른 배가 달려와 사람들을 구했어요."}, {"t": "서로 듣기로 한 약속", "b": "그때부터 배들은 언제나 서로의 구조 신호를 듣고 있기로 약속했어요."}, {"t": "대신 외쳐 주는 장치", "b": "요즘은 배에 자동으로 위치를 알리는 장치가 있어서, 사람이 못 보내도 구조 신호가 저절로 나가요."}], "remember": "지금도 누가 도움을 부르면 가까운 배가 달려갈 수 있어요.", "source": "", "visual": {"type": "steps", "at": 1, "title": "구조 신호 이야기", "steps": [{"k": "신호", "v": "도와 달라고 전파로 보내요"}, {"k": "구조", "v": "다른 배가 달려와요"}, {"k": "약속", "v": "서로의 신호를 언제나 들어요"}, {"k": "지금", "v": "장치가 저절로 알려 줘요"}]}, "ask": [null, "그 사고가 바꾼 게 있다고 들었어요. 무엇이 달라졌나요?", "그럼 지금은 어떤 규칙으로 바뀌었어요?"], "ans": ["옛날 큰 배가 바다에서 가라앉을 때, 한 사람이 끝까지 도와 달라는 신호를 전파로 보냈어요. 그걸 들은 다른 배가 달려와 사람들을 구했답니다.", "그때부터 배들은 언제나 서로의 구조 신호를 듣고 있기로 약속했어요. 덕분에 지금도 바다에서 누가 도움을 부르면 가까운 배가 달려갈 수 있답니다.", "요즘은 배에 자동으로 위치를 알리는 장치가 있어요. 사람이 못 보내도 구조 신호가 저절로 나가서, 기계가 대신 외쳐 주는 셈이죠."]}, "l2": {"headline": "사고가 사람이 아니라 규칙을 바꿨어요", "items": [{"t": "1912년 타이타닉", "b": "무선통신사가 마지막까지 구조 신호를 보냈고, 그 신호를 들은 다른 배가 달려와 구명정의 사람들을 구했어요."}, {"t": "무선을 지키는 규칙", "b": "조사위원회가 모든 배는 밤낮 끊기지 않게 무선을 지켜야 한다고 권고했고, 그 권고가 국제 규칙이 됐어요."}, {"t": "국제해상조난안전시스템", "b": "조난 신호를 장비가 자동으로 주고받아요. 1999년 전면 시행되면서 모스 부호는 바다에서 물러났어요."}], "remember": "모든 배는 밤낮 끊기지 않게 무선을 지켜야 해요.", "source": "", "visual": {"type": "steps", "at": 2, "title": "구조 신호에서 규칙까지", "steps": [{"k": "1912년", "v": "마지막까지 구조 신호를 보냈어요"}, {"k": "그 뒤", "v": "밤낮 무선을 지키는 국제 규칙"}, {"k": "1999년", "v": "장비가 자동으로 주고받아요"}]}, "ask": [null, "그 사고가 바꾼 게 있다고 들었어요. 무엇이 달라졌나요?", "그럼 지금은 어떤 규칙으로 바뀌었어요?"], "ans": ["1912년 타이타닉이 침몰할 때 무선통신사가 마지막까지 구조 신호를 보냈어요. 그 신호를 들은 다른 배가 달려와 구명정에 있던 사람들을 구했죠.", "사고 뒤 조사위원회가 모든 배는 밤낮 끊기지 않게 무선을 지켜야 한다고 권고했어요. 그 권고가 국제 규칙이 됐으니, 사고가 사람이 아니라 규칙을 바꾼 셈이죠.", "지금은 국제해상조난안전시스템이라는 규칙이 있어서 조난 신호를 장비가 자동으로 주고받아요. 1999년 전면 시행되면서 모스 부호는 바다에서 물러났죠."]}, "l3": {"headline": "전파가 사람을 구했고, 그 경험이 제도가 됐어요", "items": [{"t": "1912년 타이타닉", "b": "무선통신사 잭 필립스가 마지막까지 구조 신호를 보냈어요. 카르파티아호가 달려와 구명정의 사람들을 구했고, 공식 조사로는 약 700명이 살아남았어요."}, {"t": "런던 회의와 협약", "b": "1912년 런던 국제무선전신회의가 조난신호의 공통 주파수를 정하고, 정해진 시간마다 조난 호출을 듣게 했어요. 1914년에는 해상인명안전협약이 처음 채택됐어요."}, {"t": "GMDSS 도입", "b": "국제해상조난안전시스템은 그 협약의 1988년 개정으로 들어와 1992년부터 단계 도입, 1999년에 전면 시행됐어요. 그날부터 모스 부호가 해상에서 물러났어요."}], "remember": "GMDSS는 협약의 1988년 개정으로 들어왔어요.", "source": "", "visual": {"type": "steps", "at": 1, "title": "타이타닉에서 GMDSS까지", "steps": [{"k": "1912년 4월", "v": "타이타닉 침몰"}, {"k": "1912년", "v": "런던 국제무선전신회의"}, {"k": "1914년", "v": "해상인명안전협약 채택"}, {"k": "1988년", "v": "협약 개정으로 GMDSS 도입"}, {"k": "1999년", "v": "전면 시행 · 모스 부호 퇴장"}]}, "ask": [null, "그 사고가 바꾼 게 있다고 들었어요. 무엇이 달라졌나요?", "그럼 지금은 어떤 규칙으로 바뀌었어요?"], "ans": ["1912년 4월 타이타닉이 침몰할 때 무선통신사 잭 필립스가 마지막까지 구조 신호를 보냈어요. 카르파티아호가 달려와 구명정의 사람들을 구했고, 공식 조사로는 약 700명이 살아남았죠.", "사고 몇 달 뒤 1912년 런던 국제무선전신회의가 조난신호의 공통 주파수를 정하고, 배가 정해진 시간마다 조난 호출을 듣도록 했어요. 1914년에는 해상인명안전협약이 처음 채택됐고요.", "지금 쓰는 국제해상조난안전시스템은 그 협약의 1988년 개정으로 들어와 1992년부터 단계 도입되고 1999년에 전면 시행됐어요. 그날부터 모스 부호가 해상에서 물러났죠."]}, "l4": {"headline": "711명이 살아남았고, 권고는 제도가 됐다", "items": [{"t": "영국 난파위원회 보고서", "b": "승선 2,201명 중 711명이 살아남았다. 카르파티아호가 구명정에서 712명을 올렸고, 정선은 침몰 1시간 45분 뒤인 4시 5분이었다."}, {"t": "권고 제20항", "b": "충분한 수의 훈련된 통신사로 밤낮 끊기지 않는 당직을 요구했다. 이 권고가 1912년 런던 회의의 공통 조난파장과 청취 의무, 1914년 최초 협약이 됐다."}, {"t": "GMDSS 도입", "b": "1988년 협약 개정으로 채택돼 1992년 2월 1일 단계 도입, 1999년 2월 1일 전면 시행됐다. 406MHz 비상위치표지를 필수로 둔다."}], "remember": "GMDSS는 1988년 SOLAS 개정으로 채택됐다.", "source": "근거 · British Wreck Commissioner's Inquiry Report (1912), 'Number of Persons Saved' · British Wreck Commissioner's Inquiry Report (1912), 'The Rescue by the S.S. Carpathia' · British Wreck Commissioner's Inquiry Report (1912), Recommendations · ITU — Overview of ITU's History · IMO — International Convention for the Safety of Life at Sea (SOLAS), 1974 · IMO — GMDSS Introduction / History · IMO — SOLAS 1974, Chapter IV 설명 · ITU World Radiocommunication Seminar 2024 — Maritime Communications (신뢰 등급 A)", "visual": {"type": "steps", "at": 2, "title": "협약에서 GMDSS까지", "steps": [{"k": "1914년", "v": "최초 해상인명안전협약"}, {"k": "1988년", "v": "협약 개정으로 채택"}, {"k": "1992년", "v": "2월 1일 단계 도입"}, {"k": "1999년", "v": "2월 1일 전면 시행"}]}, "ask": [null, "그 사고가 바꾼 게 있다고 들었어요. 무엇이 달라졌나요?", "그럼 지금은 어떤 규칙으로 바뀌었어요?"], "ans": ["영국 난파위원회 보고서 기준으로 승선 2,201명 중 711명이 살아남았어요. 카르파티아호가 구명정에서 712명을 올렸고, 정선 시각은 새벽 4시 5분으로 침몰 1시간 45분 뒤였죠.", "같은 보고서 권고 제20항이 충분한 수의 훈련된 통신사로 밤낮 끊기지 않는 당직을 요구했어요. 그 권고가 두 갈래로 흘러 1912년 런던 국제무선전신회의의 공통 조난파장과 청취 의무, 1914년 최초 해상인명안전협약이 됐고요.", "국제해상조난안전시스템은 1988년 협약 개정으로 채택돼 1992년 2월 1일 단계 도입, 1999년 2월 1일 전면 시행됐어요. 해역을 네 구간으로 나누고 406메가헤르츠 비상위치표지와 수색구조 트랜스폰더를 필수로 둡니다."]}}}, {"id": "08-aviation", "no": "08", "title": "항공무선통신과 시뮬레이터", "n": 3, "open": "바다 다음은 하늘이에요! 도슨트, 항공무선통신 코너에서는 무엇을 해볼 수 있어요?", "after": "조종석에 앉아 이륙까지 해볼 수 있다니 인기가 많겠어요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.", "lv": {"l1": {"headline": "비행기는 하늘에서도 전파로 땅과 이야기해요", "items": [{"t": "조종석 체험", "b": "진짜 조종석에 앉아서 손잡이를 당겨 비행기를 띄워 볼 수 있어요."}, {"t": "보이지 않는 실", "b": "비행기와 땅이 보이지 않는 실로 이어져 있다고 생각하면 돼요. 그 실이 전파라서 조종사는 하늘에서도 땅의 목소리를 들을 수 있어요."}, {"t": "나라들의 약속", "b": "하늘은 여러 나라가 함께 쓰는 길이라, 나라들이 모여 같은 약속을 정해 뒀어요."}], "remember": "어느 나라 하늘에서도 같은 방법으로 이야기할 수 있어요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "보이지 않는 실", "label": "그 실이 바로 전파예요"}, {"big": "같은 약속", "label": "어느 나라 하늘에서도 같은 방법"}]}, "ask": [null, "비행기는 어떻게 땅이랑 이야기하는 거예요?", "그런 규칙은 누가 정해요?"], "ans": ["진짜 조종석에 앉아서 손잡이를 당겨 비행기를 띄워 볼 수 있어요! 비행기는 하늘에서도 땅에 있는 사람과 전파로 이야기하면서 날아가거든요.", "비행기와 땅이 보이지 않는 실로 이어져 있다고 생각하면 돼요. 그 실이 전파라서, 조종사는 하늘에서도 땅의 목소리를 들을 수 있어요.", "하늘은 여러 나라가 함께 쓰는 길이라, 나라들이 모여 같은 약속을 정해 뒀어요. 그래서 어느 나라 하늘에서도 같은 방법으로 이야기할 수 있어요."]}, "l2": {"headline": "하늘의 규칙은 한 나라가 정할 수 없어요", "items": [{"t": "조종석 체험", "b": "실제 조종사 교육용 장비를 체험용으로 고친 시뮬레이터가 있어서 조종석에서 이륙까지 해 볼 수 있어요."}, {"t": "항공기의 통신 장비", "b": "관제소와 말할 무선기, 위치를 알리는 장비, 사고 때 위치를 쏘는 비상 신호기가 실려 있어요."}, {"t": "국제민간항공기구", "b": "국제민간항공기구가 표준을 정하고 각 나라가 그걸 법으로 받아 써요. 1944년 시카고 협약으로 만들어진 기구예요."}], "remember": "어느 나라 하늘을 날든 같은 방식으로 통신해야 해요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "무선기", "label": "관제소와 말해요"}, {"big": "위치 장비", "label": "위치를 알려요"}, {"big": "비상 신호기", "label": "사고 때 위치를 쏴요"}]}, "ask": [null, "비행기는 어떻게 땅이랑 이야기하는 거예요?", "그런 규칙은 누가 정해요?"], "ans": ["실제 조종사 교육용 장비를 체험용으로 고친 시뮬레이터가 있어서 조종석에서 이륙까지 해 볼 수 있어요. 비행기가 관제소와 어떻게 통신하는지도 함께 볼 수 있고요.", "비행기에는 관제소와 말할 무선기, 위치를 알리는 장비, 사고 때 위치를 쏘는 비상 신호기가 실려 있어요. 어느 나라 하늘을 날든 같은 방식으로 통신해야 하거든요.", "국제민간항공기구가 표준을 정하고 각 나라가 그걸 법으로 받아 써요. 1944년 시카고 협약으로 만들어진 기구인데, 하늘의 규칙은 한 나라가 정할 수 없으니까요."]}, "l3": {"headline": "국제 표준이 우리 하늘의 법이 돼요", "items": [{"t": "조종석 체험", "b": "실제 조종사 교육용 장비를 이착륙 체험용으로 개조한 시뮬레이터가 있어요."}, {"t": "법으로 의무인 장비", "b": "관제기관과 교신할 무선전화 송수신기, 위치를 응답하는 트랜스폰더, 사고 시 위치를 알리는 비상위치표지가 법으로 의무예요. 무선기는 두 벌을 싣고요."}, {"t": "1944년 시카고 협약", "b": "이 협약으로 만들어진 국제민간항공기구(ICAO)가 부속서로 항공통신 표준을 정해요. 우리 항공안전법은 제1조에서 그 부속서를 따른다고 밝히고 있어요."}], "remember": "항공안전법 제1조가 협약 부속서를 따른다고 밝혀요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "무선전화", "label": "관제기관과 교신 · 두 벌"}, {"big": "트랜스폰더", "label": "위치를 응답해요"}, {"big": "비상위치표지", "label": "사고 시 위치를 알려요"}]}, "ask": [null, "비행기는 어떻게 땅이랑 이야기하는 거예요?", "그런 규칙은 누가 정해요?"], "ans": ["실제 조종사 교육용 장비를 이착륙 체험용으로 개조한 시뮬레이터가 있어요. 코너 안쪽에서는 항공기 어느 위치에 어떤 통신 안테나가 붙는지도 볼 수 있고요.", "항공기에는 관제기관과 교신할 무선전화 송수신기, 위치를 응답하는 트랜스폰더, 사고 시 위치를 알리는 비상위치표지가 법으로 의무예요. 무선기는 하나가 고장나도 되도록 두 벌을 싣고요.", "1944년 시카고 협약으로 만들어진 국제민간항공기구가 부속서로 항공통신 표준을 정해요. 우리 항공안전법은 제1조에서 그 부속서를 따른다고 스스로 밝히고 있고요."]}, "l4": {"headline": "ICAO 부속서 10이 통신·항법·감시를 규율한다", "items": [{"t": "시뮬레이터 · 조종면", "b": "조종사 교육용 장비를 개조한 시뮬레이터로 이륙을 체험할 수 있다. 요크가 피치와 롤을, 러더 페달이 요를 맡는다."}, {"t": "항공안전법 제51조", "b": "제51조와 시행규칙 제107조가 무선전화 송수신기 두 대와 트랜스폰더, 비상위치지시용 무선표지설비를 의무화한다."}, {"t": "시카고 협약 부속서 10", "b": "항공통신이 통신과 항법, 감시를 규율한다. 공대지 음성은 117.975~137MHz, 비상주파수는 121.5MHz이다."}], "remember": "국제 표의 숫자가 우리 시행규칙에 그대로 박혀 있다.", "source": "근거 · ICAO — Annex 10: Aeronautical Telecommunications · ICAO Doc 9718, Handbook on Radio Frequency Spectrum Requirements for Civil Aviation, Vol I, Section 7-I List of Frequency Bands · 법제처 국가법령정보센터 — 항공안전법 제1조 · 법제처 국가법령정보센터 — 항공안전법 제51조 · 법제처 국가법령정보센터 — 항공안전법 시행규칙 제107조제1항 · 법제처 국가법령정보센터 — 항공안전법 시행규칙 제107조제1항제8호·제2항 · FAA, Pilot's Handbook of Aeronautical Knowledge, Chapter 6 Flight Controls (신뢰 등급 A)", "visual": {"type": "keyfact", "at": 2, "facts": [{"big": "부속서 10", "label": "통신 · 항법 · 감시를 규율"}, {"big": "공대지 음성", "label": "117.975~137MHz"}, {"big": "비상주파수", "label": "121.5MHz"}]}, "ask": [null, "비행기는 어떻게 땅이랑 이야기하는 거예요?", "그런 규칙은 누가 정해요?"], "ans": ["조종사 교육용 장비를 개조한 시뮬레이터로 이륙을 체험할 수 있고, 항공기 통신 안테나 배치도 함께 볼 수 있어요. 조종면은 요크가 피치와 롤을, 페달이 요를 맡습니다.", "항공안전법 제51조와 시행규칙 제107조가 무선전화 송수신기 두 대와 트랜스폰더, 비상위치지시용 무선표지설비를 의무화해요. 비상표지는 121.5메가헤르츠와 406메가헤르츠로 송신하고요.", "시카고 협약 부속서 10 항공통신이 통신과 항법, 감시를 규율하고, 공대지 음성은 117.975에서 137메가헤르츠, 비상주파수는 121.5메가헤르츠예요. 국제 표의 숫자가 우리 시행규칙에 그대로 박혀 있는 셈이죠."]}}}, {"id": "09-special-exhibit", "no": "09", "title": "특별교류전시", "n": 1, "open": "특별교류전시라는 코너도 있다고 들었어요. 도슨트, 그건 어떤 코너예요?", "after": "기간마다 바뀌는 전시라 올 때마다 다르겠네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.", "lv": {"l1": {"headline": "특별 전시는 오늘과 다음에 오셨을 때가 달라요", "items": [{"t": "특별한 전시", "b": "이 코너의 물건들은 가끔씩 바뀌는 특별한 전시예요. 오늘 보이는 것과 다음에 오셨을 때 보이는 게 다를 수 있어요."}], "remember": "오늘 보이는 것과 다음에 오셨을 때 보이는 게 다를 수 있어요.", "source": "", "visual": {"type": "keyfact", "at": 0, "facts": [{"big": "특별한 전시", "label": "가끔씩 바뀌는 물건들"}]}, "ask": [null], "ans": ["이 코너의 물건들은 가끔씩 바뀌는 특별한 전시예요. 그래서 오늘 보이는 것과 다음에 오셨을 때 보이는 게 다를 수 있답니다."]}, "l2": {"headline": "일정 기간만 여는 교류 전시예요", "items": [{"t": "특별교류전시", "b": "다른 기관과 교류해서 일정 기간만 여는 전시 공간이에요. 지금 무엇이 있는지는 눈앞에 보이는 것을 보는 게 정확해요."}], "remember": "지금 무엇이 있는지는 눈앞에 보이는 것을 보고 확인해요.", "source": "", "visual": {"type": "keyfact", "at": 0, "facts": [{"big": "일정 기간", "label": "다른 기관과 교류해서 여는 전시"}]}, "ask": [null], "ans": ["다른 기관과 교류해서 일정 기간만 여는 전시 공간이에요. 그래서 지금 무엇이 있는지는 눈앞에 보이는 것을 보고 말씀드리는 게 정확해요."]}, "l3": {"headline": "유관기관과 교류해 일정 기간 선보이는 전시예요", "items": [{"t": "유관기관 교류 전시", "b": "유관기관과 교류해 특별 전시품을 일정 기간 선보이는 공간이에요. 전시품과 기간은 그때그때 달라져요."}], "remember": "지금 보고 계신 것을 중심으로 봐 주세요.", "source": "", "visual": {"type": "keyfact", "at": 0, "facts": [{"big": "일정 기간", "label": "유관기관과 교류하는 특별 전시"}]}, "ask": [null], "ans": ["유관기관과 교류해 특별 전시품을 일정 기간 선보이는 공간이에요. 전시품과 기간은 그때그때 달라지니, 지금 보고 계신 것을 중심으로 봐 주시면 좋겠어요."]}, "l4": {"headline": "상설전시와 달리 기간 한정이라 소장·대여 주체가 갈린다", "items": [{"t": "기간 한정 전시", "b": "상설전시와 달리 기간 한정이라 소장과 대여의 주체가 갈린다. 전시품 목록과 교류 기관은 시기마다 달라진다."}], "remember": "지금 놓인 실물을 기준으로 보는 것이 맞다.", "source": "", "visual": {"type": "keyfact", "at": 0, "facts": [{"big": "기간 한정", "label": "소장과 대여의 주체가 갈린다"}]}, "ask": [null], "ans": ["상설전시와 달리 기간 한정이라 소장과 대여의 주체가 갈리는 공간이에요. 그래서 전시품 목록과 교류 기관은 시기마다 달라지고, 지금 놓인 실물을 기준으로 보시는 게 맞습니다."]}}}, {"id": "10-ham", "no": "10", "title": "아마추어 무선통신 (HAM)", "n": 3, "open": "이번엔 취미로 즐기는 무선통신, 아마추어 무선이에요. 도슨트, 햄이 뭐예요?", "after": "취미가 재난 때는 통신망이 된다는 게 멋지네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.", "lv": {"l1": {"headline": "햄은 재미로 무선 이야기를 나누는 사람들이에요", "items": [{"t": "햄", "b": "돈을 벌려고가 아니라 재미있어서, 무선으로 멀리 있는 사람과 이야기를 나누는 사람들이에요."}, {"t": "먼저 확인하고 쓰기", "b": "전파는 모두가 나눠 쓰는 거라서, 아무나 마음대로 쓰면 서로 방해가 돼요. 그래서 잘 쓸 수 있는지 먼저 확인해요."}, {"t": "큰일이 났을 때", "b": "전화나 인터넷이 끊기는 큰일이 났을 때, 그 사람들의 무선이 대신 소식을 전해 줄 수 있어요."}], "remember": "취미가 이웃을 돕는 일이 되기도 해요.", "source": "", "visual": {"type": "keyfact", "at": 0, "facts": [{"big": "햄", "label": "재미로 무선 이야기를 나누는 사람들"}]}, "ask": [null, "아, 그렇군요. 그런데 취미인데 왜 자격시험까지 봐야 해요?", "그럼 이 취미가 실제로 쓸모 있을 때도 있어요?"], "ans": ["돈을 벌려고가 아니라 그냥 재미있어서, 무선으로 멀리 있는 사람과 이야기를 나누는 사람들이 있어요. 그 사람들을 햄이라고 부른답니다.", "전파는 모두가 나눠 쓰는 거라서, 아무나 마음대로 쓰면 서로 방해가 되거든요. 그래서 잘 쓸 수 있는지 먼저 확인하고 쓰게 해요.", "전화나 인터넷이 끊기는 큰일이 났을 때, 그 사람들의 무선이 대신 소식을 전해 줄 수 있어요. 취미가 이웃을 돕는 일이 되는 거죠."]}, "l2": {"headline": "취미 무선도 자격을 확인하고 허가한 뒤에 쓸 수 있어요", "items": [{"t": "아마추어 무선과 햄", "b": "돈벌이가 아니라 스스로 익히고 기술을 시험해 보려고 하는 무선통신이에요. 그런 무선을 즐기는 사람들을 햄이라고 불러요."}, {"t": "자격 확인", "b": "전파는 남과 나눠 쓰는 자원이라 나라가 자격을 확인하고 허가한 뒤에야 쓸 수 있어요. 시험은 방해 없이 제대로 쓰라는 약속이에요."}, {"t": "비상시의 통신망", "b": "재난으로 통신망이 끊길 때를 대비하도록 국제 규칙이 각국에 권장해요. 평소의 취미가 비상시에는 통신망이 되기도 해요."}], "remember": "전파는 나눠 쓰는 자원이라 자격을 확인한 뒤에 써요.", "source": "", "visual": {"type": "keyfact", "at": 0, "facts": [{"big": "햄", "label": "아마추어 무선을 즐기는 사람들"}]}, "ask": [null, "아, 그렇군요. 그런데 취미인데 왜 자격시험까지 봐야 해요?", "그럼 이 취미가 실제로 쓸모 있을 때도 있어요?"], "ans": ["돈벌이가 아니라 스스로 익히고 기술을 시험해 보려고 하는 무선통신이 아마추어 무선이에요. 그런 무선을 즐기는 사람들을 햄이라고 부르고요.", "전파는 남과 나눠 쓰는 자원이라 나라가 자격을 확인하고 허가한 뒤에야 쓸 수 있어요. 시험은 방해 없이 제대로 쓰라는 약속인 셈이죠.", "재난으로 통신망이 끊길 때를 대비하도록 국제 규칙이 각국에 권장하고 있어요. 그래서 평소의 취미가 비상시에는 통신망이 되기도 해요."]}, "l3": {"headline": "금전적 이익 없는 무선이, 통신망이 끊기면 비상망이 돼요", "items": [{"t": "아마추어업무와 햄", "b": "국제전기통신연합은 금전적 이익 없이 개인적 관심에서 하는 자기훈련과 상호통신, 기술연구라고 정의해요. 그런 무선을 즐기는 사람이 햄이에요."}, {"t": "무선설비·무선국·무선종사자", "b": "전파를 보내거나 받는 시설이 무선설비, 그 설비와 조작하는 사람을 합쳐 무선국이에요. 자격을 받은 사람이 무선종사자예요."}, {"t": "재난구호 대비", "b": "국제 규칙이 아마추어국을 재난구호 통신에 대비시키도록 각국에 권장해요. 평소엔 취미지만 통신망이 끊기면 실제 비상망이 돼요."}], "remember": "평소엔 취미지만, 통신망이 끊기면 비상망이 돼요.", "source": "", "visual": {"type": "steps", "at": 1, "title": "전파법의 세 낱말", "steps": [{"k": "무선설비", "v": "전파를 보내거나 받는 시설"}, {"k": "무선국", "v": "설비와 조작하는 사람"}, {"k": "무선종사자", "v": "자격을 받은 사람"}]}, "ask": [null, "아, 그렇군요. 그런데 취미인데 왜 자격시험까지 봐야 해요?", "그럼 이 취미가 실제로 쓸모 있을 때도 있어요?"], "ans": ["국제전기통신연합은 아마추어업무를 금전적 이익 없이 개인적 관심에서 하는 자기훈련과 상호통신, 기술연구라고 정의해요. 그런 무선을 즐기는 사람을 햄이라고 부르고요.", "전파법이 무선설비와 무선국, 무선종사자를 나눠 규정하고 있어요. 전파를 보내거나 받는 시설이 무선설비, 그 설비와 조작하는 사람을 합쳐 무선국, 자격을 받은 사람이 무선종사자예요.", "국제 규칙이 아마추어국을 재난구호 통신에 대비시키도록 각국에 권장하고 있어요. 그래서 평소엔 취미지만, 통신망이 끊긴 상황에서는 실제 비상망이 되죠."]}, "l4": {"headline": "금전적 이익 없는 무선이 제도 안에서 비상망이 된다", "items": [{"t": "전파규칙 제1.56조", "b": "아마추어업무를 금전적 이익 없는 자기훈련, 상호통신, 기술연구로 정의한다. 영리 목적이 아니라는 점이 핵심이고, 운용 규칙은 제25조가 따로 둔다."}, {"t": "자격검정과 네 등급", "b": "제25.6조가 각국에 자격 검증 의무를 지운다. 국내는 전파법 제70조의 자격검정과 시행령 별표 17의 네 등급이 있고, 검정은 한국방송통신전파진흥원에 위탁된다."}, {"t": "재난구호 대비", "b": "제25.9A조가 재난구호 대비를 권장하고, 제25.3조는 제3자 대리 국제통신을 비상과 재난구호에 한정한다. 취미 무선국이 제도 안에서 비상망이 된다."}], "remember": "핵심은 영리 목적이 아니라는 점이고, 자격 검증은 각국의 의무다.", "source": "근거 · Recommendation ITU-R M.1544-1 (09/2015) considering a) 가 RR No. 1.56 을 직접 인용 — · ITU RR Article 25 전문 (ANCOM 게재본) — · ITU RR Article 25, Nos. 25.2 / 25.2A / 25.3 · ITU RR Article 25, No. 25.9A · ITU RR Article 25, No. 25.7 · 전파법 시행령 별표 17 '무선종사자의 자격종목 및 자격종목별 종사범위' (제115조 관련, 개정 2016-06-21) — 법제처 · 전파법 제78조제2항 (신뢰 등급 A)", "visual": {"type": "steps", "at": 1, "title": "등급별 안테나공급전력 상한", "steps": [{"k": "제1급", "v": "1kW 이하"}, {"k": "제2급", "v": "200W 이하"}, {"k": "제3급", "v": "100W 이하 (주파수 조건)"}, {"k": "제4급", "v": "10W 이하 (30MHz 이상)"}]}, "ask": [null, "아, 그렇군요. 그런데 취미인데 왜 자격시험까지 봐야 해요?", "그럼 이 취미가 실제로 쓸모 있을 때도 있어요?"], "ans": ["국제 전파규칙 제1.56조가 아마추어업무를 금전적 이익 없는 자기훈련, 상호통신, 기술연구로 정의해요. 영리 목적이 아니라는 점이 정의의 핵심이고, 운용 규칙은 전파규칙 제25조가 따로 둡니다.", "전파규칙 제25.6조가 각국에 자격 검증 의무를 지우고, 출력 상한은 제25.7조에 따라 각국이 정해요. 우리는 전파법 제70조의 자격검정과 시행령 별표 17의 네 등급이 있고, 검정 업무는 한국방송통신전파진흥원에 위탁돼 있습니다.", "전파규칙 제25.9A조가 재난구호 대비를 권장하고, 제25.3조는 제3자 대리 국제통신을 비상과 재난구호에 한정해요. 취미로 운영되는 무선국이 제도 안에서 비상망으로 자리 잡은 셈입니다."]}}}, {"id": "11-iot", "no": "11", "title": "사물인터넷", "n": 3, "open": "다음 주제는 사물인터넷이에요. 도슨트, 사물인터넷이 뭐예요?", "after": "물건들끼리 서로 말을 걸다니 신기하네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.", "lv": {"l1": {"headline": "물건들이 인터넷으로 연결돼 서로 말을 걸어요", "items": [{"t": "사물인터넷", "b": "전등이나 시계, 자동차 같은 물건들이 인터넷으로 서로 연결돼서, 물건들끼리 서로 말을 걸 수 있어요."}, {"t": "멀리서 켜고 끄기", "b": "멀리 있어도 물건을 켜고 끄고, 지금 어떤지 알 수 있어요. 집에 가지 않아도 전등을 끌 수 있어요."}, {"t": "많은 물건 연결", "b": "5세대 이동통신은 한꺼번에 아주 많은 물건을 연결할 수 있게 만들어졌어요. 앞으로 더 많은 물건이 서로 이야기하게 될 거예요."}], "remember": "멀리 있어도 물건을 켜고 끄고, 지금 어떤지 알 수 있어요.", "source": "", "visual": {"type": "keyfact", "at": 0, "facts": [{"big": "말을 걸어요", "label": "인터넷으로 연결된 물건들"}]}, "ask": [null, "아, 그렇군요. 그럼 우리한테 뭐가 좋아지는 거예요?", "5세대 이동통신이랑도 관계가 있어요?"], "ans": ["전등이나 시계, 자동차 같은 물건들이 인터넷으로 서로 연결된 거예요. 그래서 물건들끼리 서로 말을 걸 수 있게 됐답니다.", "멀리 있어도 물건을 켜고 끄고, 지금 어떤지 알 수 있어요. 집에 가지 않아도 전등을 끌 수 있는 거죠.", "네, 5세대 이동통신은 한꺼번에 아주 많은 물건을 연결할 수 있게 만들어졌어요. 그래서 앞으로 더 많은 물건이 서로 이야기하게 될 거예요."]}, "l2": {"headline": "사물이 스스로 상태를 알리는 게 사물인터넷이에요", "items": [{"t": "사물인터넷", "b": "사물에 통신 기능을 붙여 서로 연결하고, 모인 정보로 서비스를 만들어요. 물건이 인터넷에 접속하는 셈이에요."}, {"t": "스스로 알리는 사물", "b": "사람이 일일이 입력하지 않아도 사물이 스스로 상태를 알려요. 그래서 멀리서도 켜고 끄거나 상태를 확인할 수 있어요."}, {"t": "5세대의 역할", "b": "5세대는 기기를 훨씬 많이, 훨씬 빠른 응답으로 연결할 수 있게 설계된 세대예요. 다만 5세대가 됐다고 뭐든 저절로 되는 건 아니에요."}], "remember": "5세대가 됐다고 뭐든 저절로 되는 건 아니에요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "스스로 알림", "label": "입력하지 않아도 사물이 상태를 알려요"}]}, "ask": [null, "아, 그렇군요. 그럼 우리한테 뭐가 좋아지는 거예요?", "5세대 이동통신이랑도 관계가 있어요?"], "ans": ["사물에 통신 기능을 붙여 서로 연결하고, 거기서 모인 정보로 서비스를 만드는 걸 사물인터넷이라고 해요. 물건이 인터넷에 접속하는 셈이죠.", "사람이 일일이 입력하지 않아도 사물이 스스로 상태를 알린다는 게 가장 큰 차이예요. 그래서 멀리서도 켜고 끄거나 상태를 확인할 수 있고요.", "5세대는 기기를 훨씬 많이, 훨씬 빠른 응답으로 연결할 수 있게 설계된 세대예요. 다만 5세대가 됐다고 뭐든 저절로 되는 건 아니고요."]}, "l3": {"headline": "사물인터넷은 사물을 잇는 글로벌 인프라예요", "items": [{"t": "국제 표준의 정의", "b": "사물을 서로 연결해 진보된 서비스를 가능하게 하는 글로벌 인프라예요. 사물은 물리적인 것뿐 아니라 가상의 것도 포함해요."}, {"t": "스스로 알리는 사물", "b": "사람이 하나하나 확인하지 않아도 사물이 스스로 상태를 알려 줘요. 그 정보를 모아 관리하거나 자동으로 반응하게 만들 수도 있어요."}, {"t": "5세대의 성능 목표", "b": "5세대는 1제곱킬로미터에 백만 대 규모로 연결하고 밀리초 단위로 응답하는 걸 목표로 설계됐어요. 이건 성능 목표이지 자율주행의 달성을 뜻하진 않아요."}], "remember": "5세대는 성능 목표일 뿐, 자율주행의 달성을 뜻하진 않아요.", "source": "", "visual": {"type": "keyfact", "at": 2, "facts": [{"big": "백만 대", "label": "1제곱킬로미터에 연결하는 목표 규모"}, {"big": "밀리초", "label": "응답 속도 목표의 단위"}]}, "ask": [null, "아, 그렇군요. 그럼 우리한테 뭐가 좋아지는 거예요?", "5세대 이동통신이랑도 관계가 있어요?"], "ans": ["국제 표준에서는 사물을 서로 연결해 진보된 서비스를 가능하게 하는 글로벌 인프라라고 정의해요. 이때 사물은 물리적인 것뿐 아니라 가상의 것도 포함하고요.", "사람이 하나하나 확인하지 않아도 사물이 스스로 상태를 알려 준다는 점이에요. 그 정보를 모아 관리하거나 자동으로 반응하게 만들 수도 있고요.", "5세대는 사물을 훨씬 촘촘하게, 1제곱킬로미터에 백만 대 규모로 연결하고 응답도 밀리초 단위로 빠르게 하는 걸 목표로 설계됐어요. 다만 그건 성능 목표이지 자율주행의 달성을 뜻하진 않고요."]}, "l4": {"headline": "사물인터넷은 정보사회를 위한 글로벌 인프라다", "items": [{"t": "ITU-T Y.4000 정의", "b": "사물인터넷을 정보사회를 위한 글로벌 인프라로 정의한다. 물리적 사물과 가상 사물을 구분하고, 기기는 통신 기능을 가진 장치로 따로 규정한다."}, {"t": "사물이 출발점", "b": "사람의 개입 없이 사물이 상태를 보고하고 제어되는 구조다. 표준은 이를 사물 간 통신과 그 위의 서비스 계층으로 나눠 규정한다."}, {"t": "5세대 요구조건", "b": "대규모 기기 연결과 초저지연이 사물인터넷에 대응한다. 연결밀도 1제곱킬로미터당 백만 대, 사용자평면 지연 1밀리초는 무부하 단일 사용자 가정의 무선 구간 값이다."}], "remember": "수치는 조건과 함께 읽는 성능 목표이지, 응용의 달성이 아니다.", "source": "근거 · ITU-T Recommendation Y.400 차에 싣는 전화"}, {"k": "2세대", "v": "1996년 · 음성과 문자"}, {"k": "3세대", "v": "영상통화"}, {"k": "4세대", "v": "2011년 · LTE 데이터"}, {"k": "5세대", "v": "2019년 · 많은 기기 연결"}]}, "ask": [null, "아, 그렇군요. 그 뒤로는 뭐가 달라졌어요?", "그럼 지금 쓰는 5세대는 뭐가 다른 거예요?"], "ans": ["처음엔 차에 싣고 다니는 카폰이었어요. 국내 기준으로 1984년에 시작됐는데, 자동차 한 대 값보다 비쌌죠.", "2세대에서 디지털로 바뀌어 음성과 문자를 쓰게 됐어요. 3세대에선 영상통화가, 4세대 LTE부터 데이터가 가능해졌죠. 국내 기준 1996년과 2011년이 시작이고요.", "5세대는 기기를 훨씬 많이, 훨씬 빠른 응답으로 연결할 수 있게 설계됐어요. 국내에서는 2019년에 시작됐고요."]}, "l3": {"headline": "차량전화에서 스마트폰 기반 5G까지 이어졌어요", "items": [{"t": "1984년 차량전화", "b": "국내 1세대는 1984년 차량전화로 시작했어요. 총비용이 약 400만 원이라 당시 승용차보다 비쌌어요."}, {"t": "CDMA에서 LTE로", "b": "1996년 국내에서 CDMA 방식 디지털 이동통신이 상용화됐어요. 2000년대 초 3세대에서 영상통화가, 2011년 국내에서 LTE가 상용화됐어요."}, {"t": "스마트폰 기반 5G", "b": "2019년 4월 대한민국이 스마트폰 기반 5G를 세계 최초로 상용화했어요. 속도는 이론상 최대 기준으로 4세대보다 훨씬 빨라요."}], "remember": "5G 속도는 이론상 최대 기준이고, 세계 최초는 스마트폰 기반이에요.", "source": "", "visual": {"type": "steps", "at": 1, "title": "연도별 이동통신", "steps": [{"k": "1984년", "v": "국내 차량전화"}, {"k": "1996년", "v": "국내 CDMA 상용화"}, {"k": "2000년대 초", "v": "3세대 영상통화"}, {"k": "2011년", "v": "국내 LTE 상용화"}, {"k": "2019년", "v": "스마트폰 기반 5G 상용화"}]}, "ask": [null, "아, 그렇군요. 그 뒤로는 뭐가 달라졌어요?", "그럼 지금 쓰는 5세대는 뭐가 다른 거예요?"], "ans": ["국내 1세대는 1984년 차량전화로 시작했어요. 들고 다니는 게 아니라 차에 싣는 전화였는데, 총비용이 약 400만 원이라 당시 승용차보다 비쌌고요.", "1996년 국내에서 CDMA 방식 디지털 이동통신이 상용화됐어요. 2000년대 초 3세대에서 영상통화가 가능해졌고, 2011년에는 국내에서 LTE가 상용화됐죠.", "2019년 4월 대한민국이 스마트폰 기반 5G를 세계 최초로 상용화했어요. 속도는 이론상 최대 기준으로 4세대보다 훨씬 빠르고, 응답도 짧아졌고요."]}, "l4": {"headline": "차량전화에서 스마트폰 기반 세계 최초 5G까지", "items": [{"t": "1984년 차량전화", "b": "국내 1세대는 1984년 차량전화로 시작했다. 총비용 약 400만 원으로, 포니2의 347만 원보다 비쌌다."}, {"t": "CDMA에서 LTE로", "b": "1996년 CDMA를 상용화했다. 국내 4세대는 2011년 7월 LTE이나, IMT-Advanced 공식 지정은 LTE-Advanced뿐이다."}, {"t": "5G 상용화", "b": "2019년 4월 3일 스마트폰 기반 5G가 세계 최초로 상용화됐다. 20배는 하향 피크 20기가비트와 4세대 피크 1기가비트의 비다."}], "remember": "‘20배’는 이론 최대값의 비교이지 체감 속도의 비가 아니다.", "source": "근거 · 서울생활사박물관 · ETRI · 정책브리핑(과기정통부) · Report ITU-R M.2410-0 · Report ITU-R M.2134 (신뢰 등급 C)", "visual": {"type": "steps", "at": 1, "title": "이동통신 연표", "steps": [{"k": "1984년", "v": "국내 차량전화"}, {"k": "1996년", "v": "CDMA 상용화"}, {"k": "2003년 12월", "v": "국내 3세대 W-CDMA"}, {"k": "2011년 7월", "v": "국내 4세대 LTE"}, {"k": "2019년 4월", "v": "스마트폰 기반 세계 최초 5G"}]}, "ask": [null, "아, 그렇군요. 그 뒤로는 뭐가 달라졌어요?", "그럼 지금 쓰는 5세대는 뭐가 다른 거예요?"], "ans": ["국내 1세대는 1984년 차량전화로 시작했어요. 총비용이 약 400만 원이었는데 그해 포니2가 347만 원이었으니, 자동차보다 비쌌던 셈입니다.", "1989년 국책과제로 시작해 1991년 퀄컴과 공동개발하고 1996년 CDMA를 상용화했어요. 3세대 국내 상용은 2003년 12월 W-CDMA, 4세대는 2011년 7월 LTE고요.", "2018년 12월 기업용 상용에 이어 2019년 4월 3일 스마트폰 기반 세계 최초 상용화가 있었어요. 흔히 말하는 20배는 하향 피크 초당 20기가비트와 4세대 피크 초당 1기가비트의 비라는 조건이 붙습니다."]}}}, {"id": "15-emf", "no": "15", "title": "전자파 측정", "n": 3, "open": "지금부터는 한국방송통신전파진흥원이 정부에서 위탁받은 전파품질 관리 이야기예요. 도슨트, 눈에 보이지도 않는 전자파를 어떻게 재고 관리해요?", "after": "세기가 발생원에서 멀어질수록 빠르게 줄어든다는 게 핵심이군요. 궁금한 점 있으시면 말씀해 주시고, 아니면 '다음'이요.", "lv": {"l1": {"headline": "전자파는 멀어질수록 빠르게 약해져요", "items": [{"t": "멀어질수록", "b": "전자파는 멀어질수록 빠르게 약해져요. 그래서 정해 둔 선을 넘지 않는지 계속 재고 있어요."}, {"t": "세기 표시", "b": "커다란 안테나가 있는 곳에는 얼마나 센지 보여 주는 표시가 붙어 있어요. 어른들이 정해진 때마다 재서 확인해요."}, {"t": "나라가 정한 선", "b": "안전하다거나 위험하다고 딱 잘라 말하긴 어려워요. 다만 나라가 정해 둔 선이 있고, 그 선을 넘지 않게 계속 확인해요."}], "remember": "나라가 정해 둔 선을 넘지 않는지 계속 확인하고 있어요.", "source": "", "visual": {"type": "keyfact", "at": 0, "facts": [{"big": "난롯불", "label": "한 걸음 물러나면 덜 뜨거운 것처럼"}]}, "ask": [null, "아, 그래서 어디서 쟀는지가 중요하군요. 그럼 기준을 넘는지는 어떻게 알아요?", "그럼 건강에는 괜찮은 거예요?"], "ans": ["전자파는 멀어질수록 빠르게 약해져요. 난롯불에서 한 걸음 물러나면 덜 뜨거운 것처럼요. 그래서 정해 둔 선을 넘지 않는지 계속 재고 있답니다.", "커다란 안테나가 있는 곳에는 얼마나 센지 보여 주는 표시가 붙어 있어요. 어른들이 정해진 때마다 재서 확인하고요.", "안전하다거나 위험하다고 딱 잘라 말하긴 어려워요. 다만 나라가 정해 둔 선이 있고, 그 선을 넘지 않게 계속 확인하고 있답니다."]}, "l2": {"headline": "얼마나 센지는 어디서 쟀는지도 함께 말해요", "items": [{"t": "거리와 기준", "b": "세기가 거리에 따라 빠르게 줄어요. 나라가 일반인 기준과 직업인 기준을 따로 두고 판단해요."}, {"t": "등급 라벨", "b": "기지국 같은 설비에는 기준 대비 세기를 보여 주는 등급 라벨을 붙이게 돼 있어요. 2014년부터 시행됐어요."}, {"t": "건강 영향", "b": "국제기구는 기준 이하에서 건강에 나쁜 영향이 확인된 적은 없다고 정리해요. 다만 연구가 아직 진행 중이라 안전하다고 단정하지는 않아요."}], "remember": "기준 이하에서 나쁜 영향이 확인된 적은 없지만, 안전하다고 단정하지는 않아요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "2014년", "label": "기지국 같은 설비의 등급 라벨 시행"}]}, "ask": [null, "아, 그래서 어디서 쟀는지가 중요하군요. 그럼 기준을 넘는지는 어떻게 알아요?", "그럼 건강에는 괜찮은 거예요?"], "ans": ["세기가 거리에 따라 빠르게 줄어서, 얼마나 센지를 말하려면 어디서 쟀는지도 함께 말해야 해요. 나라가 일반인 기준과 직업인 기준을 따로 두고 판단하고요.", "기지국 같은 설비에는 기준 대비 세기를 보여 주는 등급 라벨을 붙이게 돼 있어요. 2014년부터 시행됐고요.", "국제기구는 기준 이하에서 건강에 나쁜 영향이 확인된 적은 없다고 정리해요. 다만 연구가 아직 진행 중이라서, 안전하다고 단정하지는 않고요."]}, "l3": {"headline": "기준이 따로 있고, 어디서 쟀는지가 늘 함께 가요", "items": [{"t": "인체보호기준", "b": "전파법에 따라 국가가 정했고, 일반인 기준과 직업인 기준이 따로 있어요. 세기는 발생원에서 멀어질수록 빠르게 줄어요."}, {"t": "등급 라벨", "b": "일정 규모 이상의 무선국은 세기를 재서 보고하고 네 가지 라벨을 붙여요. 설비에 붙는 것이지 체험관 불빛은 아니에요."}, {"t": "건강 영향", "b": "기준 이하에서 인과적으로 확인된 악영향은 없다는 게 국제기구의 정리예요. 동시에 국제암연구소는 무선주파수 전자기장을 발암 가능으로 분류해 뒀어요."}], "remember": "기준 이하에서 확인된 악영향은 없다는 정리와 발암 가능 분류를 함께 봐야 해요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "네 가지", "label": "1등급·2등급·주의·경고 라벨"}, {"big": "1등급", "label": "일반인 기준의 절반 이하"}]}, "ask": [null, "아, 그래서 어디서 쟀는지가 중요하군요. 그럼 기준을 넘는지는 어떻게 알아요?", "그럼 건강에는 괜찮은 거예요?"], "ans": ["국가가 전파법에 따라 전자파 인체보호기준을 정해 두었고, 일반인 기준과 직업인 기준이 따로 있어요. 세기는 발생원에서 멀어질수록 빠르게 줄어들기 때문에, 어디서 쟀는지가 늘 함께 가야 하고요.", "일정 규모 이상의 무선국은 세기를 재서 보고하고 1등급과 2등급, 주의, 경고 네 가지 라벨을 붙여요. 1등급은 일반인 기준의 절반 이하죠. 이 등급은 설비에 붙는 것이지 체험관 불빛은 아니에요.", "기준 이하 노출에서 인과적으로 확인된 악영향은 없다는 게 국제기구의 정리예요. 동시에 국제암연구소는 무선주파수 전자기장을 발암 가능으로 분류해 뒀고요. 두 가지를 함께 보셔야 정확합니다."]}, "l4": {"headline": "기준·등급·측정 고시의 근거는 전파법 제47조의2다", "items": [{"t": "전파법 제47조의2", "b": "제1항이 인체보호기준과 등급기준, 측정기준의 고시 근거다. 제2항은 기준을 넘는 장소에 출입을 막는 안전시설을 두도록 의무화한다."}, {"t": "등급 경계와 표시 대상", "b": "1등급은 일반인 기준의 50% 이하, 경고등급은 직업인 기준 초과다. 표시 대상은 보고대상 무선국이다."}, {"t": "건강 영향과 시차", "b": "세계보건기구의 정리와 국제암연구소 2B 분류를 함께 본다. 국제 가이드라인은 2020년 개정, 국내 고시 현행판은 2019년판이라 반영 여부는 단정하지 않는다."}], "remember": "'인과적으로 확인된 악영향 없음'과 국제암연구소 2B를 병렬로 본다.", "source": "근거 · 법제처 국가법령정보센터 — 전파법 제47조의2 · 법제처 — 행정규칙 「전자파인체보호기준」 별표1 · IARC Press Release N° 208 · ICNIRP (신뢰 등급 A)", "visual": {"type": "steps", "at": 1, "title": "전자파강도 등급 경계", "steps": [{"k": "1등급", "v": "일반인 기준의 50% 이하"}, {"k": "2등급", "v": "50% 초과~일반인 기준 이하"}, {"k": "주의등급", "v": "일반인 기준 초과~직업인 기준 이하"}, {"k": "경고등급", "v": "직업인 기준 초과"}]}, "ask": [null, "아, 그래서 어디서 쟀는지가 중요하군요. 그럼 기준을 넘는지는 어떻게 알아요?", "그럼 건강에는 괜찮은 거예요?"], "ans": ["전파법 제47조의2 제1항이 인체보호기준과 등급기준, 측정기준의 고시 근거예요. 같은 조 제2항은 기준을 넘는 장소에 출입을 막는 안전시설을 두도록 의무화하고 있고요.", "등급 경계는 1등급이 일반인 기준의 50퍼센트 이하, 2등급이 그 초과에서 기준 이하, 주의등급이 일반인 기준 초과에서 직업인 기준 이하, 경고등급이 직업인 기준 초과예요. 표시 대상은 보고대상 무선국이고요.", "세계보건기구의 정리와 국제암연구소의 2B 분류를 함께 놓고 봐야 해요. 국제 가이드라인은 2020년에 개정됐는데 국내 고시 현행판은 2019년판이라, 그 시차를 어떻게 반영했는지는 단정하지 않는 게 맞고요."]}}}, {"id": "16-inspection", "no": "16", "title": "무선국 검사", "n": 3, "open": "전파품질 관리의 또 다른 축은 무선국 검사예요. 도슨트, 무선국 검사가 뭐예요?", "after": "전파가 한정된 자원이라 관리가 필요하다는 말이 와닿네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.", "lv": {"l1": {"headline": "전파는 나눠 쓰는 거라서 약속대로 확인해요", "items": [{"t": "나눠 쓰는 전파", "b": "전파는 나눠 쓰는 거라서 한 사람이 너무 세게 쓰면 다른 사람 것이 안 들려요. 그래서 기계가 약속대로 만들어졌는지 직접 가서 확인해요."}, {"t": "다시 확인", "b": "처음 만들었을 때 한 번 보고, 그 뒤에도 정해진 때마다 다시 확인해요. 배나 비행기가 먼 나라로 떠날 때도 따로 살펴봐요."}, {"t": "전파를 돌보는 곳", "b": "전파를 돌보는 곳의 사람들이 직접 가서 확인해요. 이 코너에 있는 장비들이 그 확인에 쓰던 것들이에요."}], "remember": "전파는 나눠 쓰는 거라서 정해진 때마다 직접 가서 확인해요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "처음 한 번", "label": "만들었을 때 보고 그 뒤에도 다시 확인"}, {"big": "배나 비행기", "label": "먼 나라로 떠날 때도 따로 살펴봐요"}]}, "ask": [null, "아, 그렇군요. 검사는 한 번만 받으면 되는 거예요?", "그 일은 누가 하는 거예요?"], "ans": ["전파는 나눠 쓰는 거라서 한 사람이 너무 세게 쓰면 다른 사람 것이 안 들려요. 그래서 기계가 약속대로 만들어졌는지 직접 가서 확인한답니다.", "아니에요. 처음 만들었을 때 한 번 보고, 그 뒤에도 정해진 때마다 다시 확인해요. 배나 비행기가 먼 나라로 떠날 때도 따로 살펴보고요.", "전파를 돌보는 곳의 사람들이 직접 가서 확인해요. 이 코너에 있는 장비들이 그 확인에 쓰던 것들이랍니다."]}, "l2": {"headline": "전파는 한정돼서 검사를 받아야 쓸 수 있어요", "items": [{"t": "허가와 검사", "b": "혼신이 생기면 남의 통신이 끊겨서, 법이 무선국을 허가제로 두고 설비를 다 만든 뒤 기준에 맞는지 검사를 받아야 쓸 수 있게 했어요."}, {"t": "정해진 주기의 검사", "b": "한 번으로 끝나지 않고 정해진 주기마다 다시 받아요. 허가받은 대로 바꿨는지 보는 검사도 있고, 배나 비행기가 외국으로 나갈 때도 따로 받아요."}, {"t": "위탁과 전시 장비", "b": "정부가 직접 다 하지 않고 한국방송통신전파진흥원이 1981년부터 위탁받아 해 왔어요. 이 코너의 장비들이 그때 쓰던 검사 장비예요."}], "remember": "허가에 더해, 설비를 만든 뒤 기준에 맞는지 검사를 받아야 해요.", "source": "", "visual": {"type": "keyfact", "at": 2, "facts": [{"big": "1981년", "label": "위탁받아 검사를 해 오기 시작한 해"}]}, "ask": [null, "아, 그렇군요. 검사는 한 번만 받으면 되는 거예요?", "그 일은 누가 하는 거예요?"], "ans": ["전파는 한정돼 있어서 혼신이 생기면 남의 통신이 끊겨요. 그래서 법이 무선국을 허가제로 두고, 설비를 다 만든 뒤에 기준에 맞는지 검사를 받아야 쓸 수 있게 했죠.", "한 번으로 끝나지 않고 정해진 주기마다 다시 받아요. 허가받은 대로 바꿨는지 보는 검사도 있고, 배나 비행기가 외국으로 나갈 때도 따로 받고요.", "정부가 직접 다 하지 않고 한국방송통신전파진흥원이 1981년부터 위탁받아 해 왔어요. 이 코너의 장비들이 그때 쓰던 검사 장비고요."]}, "l3": {"headline": "허가는 시작이고 검사가 마무리예요", "items": [{"t": "준공검사", "b": "설비를 다 갖춘 뒤 준공검사를 받아야 운용할 수 있어요. 검사는 기술기준만이 아니라 무선종사자의 자격과 정원까지 함께 봐요."}, {"t": "검사 네 가지", "b": "준공검사, 5년 범위에서 받는 정기검사, 변경검사, 수시검사 네 가지예요. 배나 항공기가 외국으로 출항할 때도 대상이에요."}, {"t": "위탁과 1981년", "b": "정부가 이 업무를 한국방송통신전파진흥원에 위탁해 왔고, 시작이 1981년이에요. 검사에 쓰던 장비들이 이 코너에 전시돼 있어요."}], "remember": "검사는 기술기준만이 아니라 무선종사자의 자격과 정원까지 봐요.", "source": "", "visual": {"type": "steps", "at": 1, "title": "무선국 검사 네 가지", "steps": [{"k": "준공검사", "v": "설비를 다 갖춘 뒤"}, {"k": "정기검사", "v": "5년 범위에서 받아요"}, {"k": "변경검사", "v": "허가받은 대로 바꿨는지"}, {"k": "수시검사", "v": "필요할 때"}]}, "ask": [null, "아, 그렇군요. 검사는 한 번만 받으면 되는 거예요?", "그 일은 누가 하는 거예요?"], "ans": ["허가는 시작이고 검사가 마무리예요. 무선국은 설비를 다 갖춘 뒤 준공검사를 받아야 비로소 운용할 수 있고, 검사는 기술기준만이 아니라 무선종사자의 자격과 정원까지 함께 봅니다.", "검사는 네 가지예요. 준공검사, 5년 범위에서 받는 정기검사, 허가받은 대로 바꿨는지 보는 변경검사, 필요할 때 하는 수시검사죠. 배나 항공기가 외국으로 출항할 때도 검사 대상이 되고요.", "정부가 이 업무를 한국방송통신전파진흥원에 위탁해 왔고, 그 시작이 1981년이에요. 그때부터 쓰던 검사 장비들이 이 코너에 전시돼 있고요."]}, "l4": {"headline": "검사는 운용의 전제이고, 근거는 전파법 제24조다", "items": [{"t": "전파법 제24조", "b": "준공검사에서 기술기준과 무선종사자 자격, 정원 배치기준 적합 여부를 본다. 제25조 제1항이 준공검사 후 운용을 못박아 검사를 운용의 전제로 만든다."}, {"t": "정기검사와 수시검사", "b": "제4항이 5년 범위의 정기검사를, 제5항이 선박·항공기의 외국 출항 같은 수시검사를 둔다. 판정은 제45조 기술기준과 제71조 자격·정원 배치기준에 따른다."}, {"t": "위임과 위탁", "b": "검사는 중앙전파관리소장에게 위임되고, 고시된 무선국의 준공검사는 한국방송통신전파진흥원에 위탁된다. 수탁은 1981년 5월 18일이다."}], "remember": "1981년 수탁 당시 법인명은 한국무선종사자협회, 현재 명칭은 2011년부터다.", "source": "근거 · 전파법 제24조 · 전파법 제25조제1항 · 전파법 시행령 제123조제3항·제5항 · KCA 공식 — 연혁 (신뢰 등급 A)", "visual": {"type": "keyfact", "at": 2, "facts": [{"big": "1981년", "label": "수탁 당시 한국무선종사자협회"}, {"big": "2011년", "label": "현재 명칭 한국방송통신전파진흥원"}]}, "ask": [null, "아, 그렇군요. 검사는 한 번만 받으면 되는 거예요?", "그 일은 누가 하는 거예요?"], "ans": ["근거는 전파법 제24조예요. 준공검사에서 기술기준과 무선종사자 자격, 정원 배치기준 적합 여부를 보고, 제25조 제1항이 준공검사를 받은 뒤에 운용하도록 못박아 검사를 운용의 전제로 만듭니다.", "제24조 제4항이 5년 범위의 정기검사를, 제5항이 선박과 항공기의 외국 출항 같은 수시검사를 둡니다. 판정 기준은 제45조 기술기준과 제71조 무선종사자 자격, 정원 배치기준 둘이고요.", "전파법 시행령이 제24조 검사를 중앙전파관리소장에게 위임하고, 고시된 무선국의 준공검사는 한국방송통신전파진흥원에 위탁해요. 수탁 시작은 1981년 5월 18일인데, 당시 법인명은 한국무선종사자협회였고 지금 이름은 2011년부터고요."]}}}, {"id": "17-rover", "no": "17", "title": "원격 무선조종 차량 — 행성 탐사", "n": 3, "open": "체험관에는 행성 탐사 체험도 있다고 들었어요. 도슨트, 원격 무선조종 차량 코너는 뭘 하는 곳이에요?", "after": "지연 때문에 로봇이 스스로 판단해야 한다는 게 인상적이네요. 궁금한 점 있으실까요? 이어가려면 '다음'이라고 해 주세요.", "lv": {"l1": {"headline": "너무 멀면 말이 도착하는 데 한참 걸려요", "items": [{"t": "전파로 움직여요", "b": "아주 멀리 있는 자동차를 전파로 움직여 보는 곳이에요. 다른 천체 위를 달리는 차를 직접 몰아 보는 기분을 느낄 수 있어요."}, {"t": "한참 걸리는 말", "b": "너무 멀면 가라고 말해도 그 말이 도착하는 데 한참 걸려요. 그래서 차가 스스로 조심하며 가야 해요."}, {"t": "가까운 달", "b": "달은 훨씬 가까워서 말이 금방 도착해요. 그래서 옛날에 사람들이 지구에서 달 위의 차를 직접 몰아 본 적도 있어요."}], "remember": "너무 멀면 말이 한참 늦게 도착해서 차가 스스로 조심하며 가야 해요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "너무 멀면", "label": "가라고 말해도 한참 걸려요"}, {"big": "가까운 달", "label": "말이 금방 도착해요"}]}, "ask": [null, "실제로도 지구에서 실시간으로 조종할 수 있어요?", "그럼 달에서는 어땠어요?"], "ans": ["아주 멀리 있는 자동차를 전파로 움직여 보는 곳이에요. 다른 천체 위를 달리는 차를 직접 몰아 보는 기분을 느낄 수 있답니다.", "너무 멀면 가라고 말해도 그 말이 도착하는 데 한참 걸려요. 그래서 차가 스스로 조심하며 가야 한답니다.", "달은 훨씬 가까워서 말이 금방 도착해요. 그래서 옛날에 사람들이 지구에서 달 위의 차를 직접 몰아 본 적도 있답니다."]}, "l2": {"headline": "전파는 빛의 속도인데도 우주에서는 느려요", "items": [{"t": "탐사차 체험", "b": "증강현실로 다른 천체를 다니며 탐사차를 조종해 보는 코너예요. 전파로 멀리 있는 차를 움직인다는 게 어떤 일인지 몸으로 느껴 보는 거예요."}, {"t": "달과 화성의 차이", "b": "달은 왕복 2초에서 3초라 화면을 보며 몰 수 있었지만, 화성은 편도로도 몇 분이 걸려 실시간 조종이 안 돼요."}, {"t": "루노호트와 월면차", "b": "1970년 루노호트 1호는 지구 관제팀이 화면을 보며 몰았어요. 아폴로 월면차는 우주비행사가 직접 타고 운전한 차예요."}], "remember": "달은 화면을 보며 몰 수 있고, 화성은 실시간 조종이 안 돼요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "2초에서 3초", "label": "달은 왕복 시간"}, {"big": "몇 분", "label": "화성은 편도로도 걸려요"}]}, "ask": [null, "실제로도 지구에서 실시간으로 조종할 수 있어요?", "그럼 달에서는 어땠어요?"], "ans": ["증강현실로 다른 천체를 다니며 탐사차를 조종해 보는 코너예요. 전파로 멀리 있는 차를 움직인다는 게 어떤 일인지 몸으로 느껴 보는 거죠.", "전파는 빛의 속도인데도 우주에서는 그게 느려요. 달은 왕복 2초에서 3초라 화면을 보며 몰 수 있었지만, 화성은 편도로도 몇 분이 걸려 실시간 조종이 안 되죠.", "달은 왕복 2초에서 3초 수준이라 사정이 달라요. 1970년 루노호트 1호는 지구 관제팀이 화면을 보며 몰았고요. 아폴로 월면차는 우주비행사가 직접 타고 운전한 차고요."]}, "l3": {"headline": "화성 로버는 지연 때문에 스스로 장애물을 피해요", "items": [{"t": "탐사 체험 코너", "b": "증강현실로 다른 천체의 표면을 다니며 탐사로봇을 조종해 보는 코너예요."}, {"t": "화성의 지연", "b": "지구와 화성 사이는 편도로 약 3분에서 20분대라 로버를 조이스틱으로 몰 수 없어요. 미리 보낸 계획을 다음 날 실행하며 스스로 장애물을 피해요."}, {"t": "달과 월면차", "b": "달은 왕복 2초에서 3초 수준이라 원격조종이 성립했어요. 1970년 루노호트 1호는 지구의 관제팀이 몰았고, 아폴로 월면차는 우주비행사가 직접 탄 차예요."}], "remember": "화성은 편도 약 3분에서 20분대라 로버가 스스로 판단해야 해요.", "source": "", "visual": {"type": "keyfact", "at": 1, "facts": [{"big": "3분에서 20분대", "label": "지구와 화성 사이 편도"}, {"big": "2초에서 3초", "label": "달은 왕복 수준"}]}, "ask": [null, "실제로도 지구에서 실시간으로 조종할 수 있어요?", "그럼 달에서는 어땠어요?"], "ans": ["증강현실로 다른 천체의 표면을 다니며 탐사로봇을 조종해 보는 코너예요. 물이나 생명체, 광물자원의 흔적을 찾는 미션을 게임처럼 수행하고요.", "전파가 빛의 속도로 가도 지구와 화성 사이는 편도로 약 3분에서 20분대가 걸려요. 그래서 화성 로버는 조이스틱으로 몰 수 없고, 미리 보낸 계획을 다음 날 실행하며 스스로 장애물을 피해요.", "달은 왕복 2초에서 3초 수준이라 원격조종이 성립했어요. 1970년 루노호트 1호는 지구의 관제팀이 화면을 보며 실제로 몰았죠. 아폴로 월면차는 그와 달리 우주비행사가 직접 타고 운전한 차예요."]}, "l4": {"headline": "지연 때문에 화성 로버는 자율항법으로 달린다", "items": [{"t": "체험 코너", "b": "증강현실 기반으로 탐사차를 조종해 보는 체험 코너다. 실제 행성 탐사의 조건, 특히 통신 지연이 조종을 어떻게 제약하는지를 체감하는 자리다."}, {"t": "광행시간과 자율항법", "b": "거리 5,460만 km에서 4억 20만 km, 편도 약 3분에서 22.4분이다. 로버는 자율항법으로 경로를 스스로 계획하고, 그 대가로 속도가 아주 느리다."}, {"t": "달과 월면차", "b": "달은 편도 약 1.3초, 왕복 약 2.6초다. 루노호트 1호는 1970년 11월 착륙해 5인 관제팀이 몰았고, 아폴로 월면차는 승무원이 탑승해 조종했다."}], "remember": "달은 편도 약 1.3초, 화성은 편도 약 3분에서 22.4분이다.", "source": "근거 ·
