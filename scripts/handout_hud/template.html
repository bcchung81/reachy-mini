<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전파체험관 교육자료 — 발표형</title>
<!--
  전파체험관 교육자료(발표형) — `python -m scripts.handout_hud.build` 가 만든 파일이다. 직접 고치지 않는다.
  카드는 `data/handout-cards/<큐>.yaml`, 대사는 `data/cues.yaml`, 이 틀은 `scripts/handout_hud/template.html`.

  사용자 요구(2026-10-06): ① 교육 자료는 화면 가득. ② 사회자는 콘텐츠의 왼쪽·도슨트는 오른쪽 **고정 구역**에 말풍선으로.
  ③ HUD 방식 — 가리는 면적을 최소로(말하는 문장 하나만, 반투명, 말이 끝나면 사라지고 아이콘만 남는다). ④ 아이콘은 사용자가 준 로봇 이미지.

  화면의 글은 검수한 고정 대본을 줄여 쓴 카드뿐이다(새 사실 없음 — 빌드가 대본·조사 자료와 대조한다).
  외부 리소스를 부르지 않는다(전시장은 오프라인). 모든 글자는 textContent 로만 넣는다.
  실서비스 연결 지점은 맨 아래 `window.hud`.
-->
<style>
:root{
  /* 1280×720 을 기준으로 한 길이 단위 — 창이 커지면 글자·간격이 같이 커지고, 남는 세로는 flex 가 나눠 가진다 */
  --u:min(calc(100vw / 1280), calc(100vh / 720));
  --ink:#0E2433; --sig:#0B7FB5; --mist:#E8F3F8; --rule:#C3D9E6; --bg:#F3F7FA;
  --mc:#0A6F84; --mcbg:#DDF1F5; --doc:#8F5300; --docbg:#FFEFD6; --amber:#B96F00; --muted:#52636F;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;
  font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
.rm{display:block;background:url(__ICON__) center/contain no-repeat}

.stage{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── 위 도구줄: 장·수준·코스·시뮬레이션. 콘텐츠를 가리지 않는 크롬이다 */
.bar{flex:0 0 calc(var(--u)*42);display:flex;align-items:center;gap:calc(var(--u)*12);padding:0 calc(var(--u)*16);
  background:var(--ink);color:#fff;font-size:calc(var(--u)*13);position:relative;z-index:6}
.nav{display:flex;align-items:center;gap:calc(var(--u)*6);min-width:0}
.nav select{width:calc(var(--u)*270);background:#1B3A4F;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:calc(var(--u)*4) calc(var(--u)*10);min-height:calc(var(--u)*30);text-overflow:ellipsis}
.round{width:calc(var(--u)*30);height:calc(var(--u)*30);border-radius:50%;border:1px solid rgba(255,255,255,.55);background:transparent;padding:0;font-size:calc(var(--u)*16);line-height:1}
.round:disabled{opacity:.35;cursor:default}
.pos{font-variant-numeric:tabular-nums;opacity:.8;white-space:nowrap}
.seg{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:calc(var(--u)*4) calc(var(--u)*12);min-height:calc(var(--u)*30);white-space:nowrap}
.seg button+button{border-left:1px solid rgba(255,255,255,.3)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:800}
.pill{border:1px solid rgba(255,255,255,.55);background:transparent;border-radius:999px;padding:calc(var(--u)*4) calc(var(--u)*13);min-height:calc(var(--u)*30);white-space:nowrap}
.pill.go{background:#fff;color:var(--ink);font-weight:800}
.sim{margin-left:auto;display:flex;align-items:center;gap:calc(var(--u)*8)}
.sim label{display:flex;align-items:center;gap:calc(var(--u)*5);white-space:nowrap}
.sim select{background:#1B3A4F;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:2px 6px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #7FD3F5;outline-offset:2px}

/* ── 장 */
.slide{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto;row-gap:calc(var(--u)*12);
  padding:calc(var(--u)*16) calc(var(--u)*52) calc(var(--u)*14)}
.headline{margin:0;font-size:calc(var(--u)*50);line-height:1.22;font-weight:800;letter-spacing:-.01em}
[data-turns]{transition:background-color .35s,opacity .35s,box-shadow .35s}
.headline.now{box-shadow:inset 0 calc(var(--u)*-10) 0 rgba(11,127,181,.22)}

/* 가운데 띠: [사회자 구역 | 그림 | 도슨트 구역]. 구역은 화면 끝까지 닿는다 */
.band{display:grid;grid-template-columns:minmax(calc(var(--u)*290),24%) minmax(0,1fr) minmax(calc(var(--u)*290),24%);
  align-items:center;margin:0 calc(var(--u)*-52);min-height:0}
.lane{align-self:stretch;display:flex;align-items:center;padding:0 calc(var(--u)*14)}
.lane-mc{background:repeating-radial-gradient(circle at 0% 50%,transparent 0,transparent calc(var(--u)*68),rgba(11,127,181,.13) calc(var(--u)*68),rgba(11,127,181,.13) calc(var(--u)*70))}
.lane-docent{background:repeating-radial-gradient(circle at 100% 50%,transparent 0,transparent calc(var(--u)*68),rgba(185,111,0,.17) calc(var(--u)*68),rgba(185,111,0,.17) calc(var(--u)*70))}
.visual{min-width:0;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*6);padding:0 calc(var(--u)*8)}

/* 폴듀 → 뉴펀들랜드 */
.km{font-size:calc(var(--u)*42);font-weight:800;color:#0B6A99;line-height:1.2;text-align:center}
.line{position:relative;width:100%;display:flex;align-items:center;margin-top:calc(var(--u)*16)}
.dot{flex:0 0 calc(var(--u)*24);width:calc(var(--u)*24);height:calc(var(--u)*24);border-radius:50%}
.dash{flex:1;border-top:calc(var(--u)*6) dashed var(--sig)}
.pulse{position:absolute;left:0;top:50%;width:calc(var(--u)*22);height:calc(var(--u)*22);margin-top:calc(var(--u)*-11);border-radius:50%;background:var(--sig);opacity:0}
.route.go .pulse{animation:travel 3.2s ease-in-out 1 forwards}
@keyframes travel{0%{left:0;opacity:1}92%{opacity:1}100%{left:calc(100% - var(--u)*22);opacity:0}}
.ends{width:100%;display:flex;justify-content:space-between;gap:calc(var(--u)*12);font-size:calc(var(--u)*26);font-weight:800;line-height:1.3}
.note{font-size:calc(var(--u)*13);color:var(--muted);margin-top:calc(var(--u)*4)}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;font-weight:800;padding:calc(var(--u)*6) calc(var(--u)*20);font-size:calc(var(--u)*16);min-height:calc(var(--u)*36)}
.btn.ghost{background:#fff;color:var(--ink)}
.route{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*6)}

/* 핵심 수치(keyfact)·단계(steps) — 02·03 장 말고 나머지 장의 그림 */
.vwrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*8)}
.vtitle{margin:0;font-size:calc(var(--u)*19);font-weight:800;text-align:center;color:var(--muted)}
.facts{width:100%;display:flex;justify-content:center;gap:calc(var(--u)*14)}
.fact{flex:1;min-width:0;max-width:calc(var(--u)*320);text-align:center;padding:calc(var(--u)*14) calc(var(--u)*12);border-radius:calc(var(--u)*14);background:#fff;border:1px solid #D3E1EA}
.fact .big{font-size:calc(var(--u)*46);font-weight:800;color:#0B6A99;line-height:1.15}
.facts.n1 .big{font-size:calc(var(--u)*70)}
.facts.n3 .big{font-size:calc(var(--u)*38)}
.fact .lab{margin-top:calc(var(--u)*6);font-size:calc(var(--u)*21);line-height:1.4}
.steps{width:100%;display:flex;justify-content:center;gap:calc(var(--u)*4)}
.step{flex:1;min-width:0;text-align:center;padding:calc(var(--u)*12) calc(var(--u)*8);border-radius:calc(var(--u)*12);background:#fff;border:1px solid #D3E1EA}
.step .k{font-size:calc(var(--u)*29);font-weight:800;color:#0B6A99;line-height:1.2}
.step .k.long{font-size:calc(var(--u)*21);overflow-wrap:normal}   /* 긴 이름(예: 2000년대 초)은 낱말 중간에서 끊지 않는다 */
.step .v{margin-top:calc(var(--u)*4);font-size:calc(var(--u)*18);line-height:1.4}
.arr{flex:0 0 auto;align-self:center;font-size:calc(var(--u)*20);color:var(--muted)}
.vwrap.now .fact,.vwrap.now .step{background:#DCEEF7;border-color:var(--sig)}
.vwrap.later{opacity:.72}

/* 주파수 다이얼 */
.dial{width:100%;display:flex;flex-direction:column;gap:calc(var(--u)*3)}
.wave{display:block;width:100%;height:calc(var(--u)*66)}
.wave path{fill:none;stroke:var(--sig);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.wl{display:flex;justify-content:space-between;font-size:calc(var(--u)*14);color:var(--muted);font-weight:700}
.dtitle{margin:0;text-align:center;font-size:calc(var(--u)*15);font-weight:800}
.freq{-webkit-appearance:none;appearance:none;display:block;width:100%;height:calc(var(--u)*30);margin:0;background:transparent;cursor:pointer}
.freq::-webkit-slider-runnable-track{height:calc(var(--u)*10);border-radius:6px;background:linear-gradient(90deg,var(--sig),var(--amber))}
.freq::-moz-range-track{height:calc(var(--u)*10);border-radius:6px;background:linear-gradient(90deg,var(--sig),var(--amber))}
.freq::-webkit-slider-thumb{-webkit-appearance:none;width:calc(var(--u)*22);height:calc(var(--u)*34);margin-top:calc(var(--u)*-12);border-radius:7px;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ink)}
.freq::-moz-range-thumb{width:calc(var(--u)*16);height:calc(var(--u)*28);border-radius:7px;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ink)}
.ticks{position:relative;height:calc(var(--u)*40);margin:0 calc(var(--u)*11)}
.tick{position:absolute;top:0;transform:translateX(-50%);font-size:calc(var(--u)*12);color:var(--muted);white-space:nowrap;text-align:center;line-height:1.3}
.tick::before{content:"";display:block;width:1px;height:calc(var(--u)*6);background:var(--ink);margin:0 auto calc(var(--u)*2)}
.tick.row2{top:calc(var(--u)*20)}
.tick.hl{color:var(--ink);font-weight:800}
.out{display:flex;gap:calc(var(--u)*30);justify-content:center;flex-wrap:wrap;font-size:calc(var(--u)*28);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.dyn{margin:0;min-height:1.5em;text-align:center;font-size:calc(var(--u)*16);font-weight:800;color:var(--amber)}
.fine{margin:0;text-align:center;font-size:calc(var(--u)*12);color:var(--muted)}
.dialrow{display:flex;justify-content:center;gap:calc(var(--u)*14);align-items:center}

/* 카드·기억해 두기 */
.cards{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:calc(var(--u)*16)}
.card{padding:calc(var(--u)*13) calc(var(--u)*18);border-radius:calc(var(--u)*12);background:#fff;border:1px solid #D3E1EA}
.card .hd{display:flex;align-items:center;gap:calc(var(--u)*10)}
.card .no{flex:0 0 calc(var(--u)*32);width:calc(var(--u)*32);height:calc(var(--u)*32);border-radius:50%;background:var(--muted);color:#fff;font-weight:800;font-size:calc(var(--u)*17);display:flex;align-items:center;justify-content:center}
.card .tt{font-size:calc(var(--u)*22);font-weight:800;line-height:1.3}
.card .bd{margin:calc(var(--u)*4) 0 0;font-size:calc(var(--u)*17);line-height:1.5}
.cards.n1 .bd{font-size:calc(var(--u)*21)}
.card.now{background:#DCEEF7;border-color:var(--sig)}
.card.now .no{background:var(--sig)}
.card.seen{background:var(--mist)}
.card.later{opacity:.62}
.remember{display:flex;align-items:center;gap:calc(var(--u)*12);padding:calc(var(--u)*8) calc(var(--u)*18);border-radius:calc(var(--u)*12);background:var(--ink);color:#fff}
.remember.now{box-shadow:0 0 0 3px var(--sig)}
.remember .tag{font-size:calc(var(--u)*12);font-weight:800;background:#fff;color:var(--ink);border-radius:999px;padding:0 calc(var(--u)*10);white-space:nowrap}
.remember .tx{font-size:calc(var(--u)*18);font-weight:800}
.src{margin:0;font-size:calc(var(--u)*12);color:var(--muted)}
.src:empty{display:none}

/* ── HUD: 말하는 문장 하나만, 반투명. 말이 끝나면 사라지고 아이콘만 남는다 */
.hud{display:flex;align-items:center;gap:calc(var(--u)*8);width:100%;min-width:0}
.hud.docent{flex-direction:row-reverse}
.hud .who{flex:0 0 calc(var(--u)*62);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2)}
.hud .rm{width:calc(var(--u)*60);height:calc(var(--u)*60);transition:opacity .4s}
.hud.docent .rm{transform:scaleX(-1)}
.hud.idle .rm{opacity:.55}
.hud .name{font-size:calc(var(--u)*12);font-weight:800}
.hud.mc .name{color:var(--mc)} .hud.docent .name{color:var(--doc)}
.eq{display:flex;align-items:flex-end;gap:2px;height:calc(var(--u)*12);visibility:hidden}
.eq i{display:block;width:3px;border-radius:2px;background:var(--amber);height:50%}
.hud.mc .eq i{background:var(--mc)}
.hud.speaking .eq{visibility:visible}
.hud.speaking .eq i{animation:eq .7s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.15s!important}.eq i:nth-child(3){animation-delay:.3s!important}
@keyframes eq{from{height:30%}to{height:100%}}
.bubble{flex:1;min-width:0;padding:calc(var(--u)*10) calc(var(--u)*13) calc(var(--u)*9);border-radius:calc(var(--u)*16);
  background:rgba(221,241,245,.86);border:1px solid rgba(138,196,210,.95);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s;pointer-events:none}
.hud.mc .bubble{border-top-left-radius:4px}
.hud.docent .bubble{background:rgba(255,239,214,.9);border-color:rgba(224,184,119,.95);border-top-right-radius:4px}
.hud.speaking .bubble{opacity:1;transform:none}
.hud.fading .bubble{opacity:.5;transform:none}
.bubble .t{margin:0;font-size:calc(var(--u)*17);line-height:1.45}
.bubble .done{font-weight:800}
.bubble .rest{opacity:.5}
.prog{height:3px;margin-top:calc(var(--u)*8);border-radius:2px;background:rgba(14,36,51,.12)}
.prog i{display:block;height:100%;width:0;border-radius:2px;background:var(--sig)}

@media (prefers-reduced-motion:reduce){
  .bubble,.hud .rm,[data-turns]{transition:none}
  .route.go .pulse,.hud.speaking .eq i{animation:none}
  .route.go .pulse{opacity:.9;left:calc(100% - var(--u)*22)}
}

/* 좁은 화면(폰)은 임시 대체다 — 구역을 위아래로 쌓는다. 세로 화면용은 따로 설계한다 */
@media (max-width:820px){
  :root{--u:calc(100vw / 480)}
  .stage{height:auto;min-height:100vh;overflow:visible}
  .bar{flex:0 0 auto;flex-wrap:wrap;padding:8px 12px;gap:8px}
  .nav select{width:calc(var(--u)*230)}
  .sim{margin-left:0}
  .slide{display:flex;flex-direction:column;padding:16px 16px 24px}
  .band{display:flex;flex-direction:column;margin:0;gap:8px}
  .lane{padding:0;order:1;background:none}
  .lane-docent{order:2}
  .visual{order:3;padding:12px 0}
  .hud{width:92%}
  .hud.docent{margin-left:auto}
  .cards{grid-template-columns:1fr}
  .facts,.steps{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <header class="bar">
    <div class="nav">
      <button type="button" class="round" id="prev" aria-label="이전 장">‹</button>
      <select id="slidesel" aria-label="장 고르기"></select>
      <button type="button" class="round" id="nextslide" aria-label="다음 장">›</button>
      <span class="pos" id="pos"></span>
    </div>
    <div class="seg" id="levels" role="group" aria-label="관람객 수준"></div>
    <div class="seg" id="courses" role="group" aria-label="코스"></div>
    <div class="sim">
      <button type="button" class="pill go" id="play">▶ 시뮬레이션</button>
      <button type="button" class="pill" id="next">다음 발화 ›</button>
      <label>속도
        <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="3" selected>3×</option><option value="6">6×</option></select>
      </label>
      <button type="button" class="pill" id="reset">종료</button>
    </div>
  </header>
  <main class="slide" id="slide"></main>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var CUES = DATA.cues, LEVELS = DATA.levels, COURSES = DATA.courses;
  var TURNS = [];                                // 장마다 포인트 수에 맞춰 다시 만든다
  var CPS = 4.0;                                 // 감독의 CHARS_PER_SEC — 글자 수로 말하는 시간을 어림한다
  var C = 299792458;                             // 빛의 속도(m/s, 정확값)
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var state = { slide: 0, lv: 'l3', course: COURSES[0].name, turn: null, running: false };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function speed() { return parseFloat($('#speed').value) || 1; }
  function courseIds() { return COURSES.filter(function (c) { return c.name === state.course; })[0].ids; }
  function visibleIdx() {
    var ids = courseIds();
    return CUES.map(function (c, i) { return ids.indexOf(c.id) >= 0 ? i : -1; }).filter(function (i) { return i >= 0; });
  }

  // 포인트 n 개인 큐의 말 순서: open, docent0, ask1, docent1, … , docent(n-1), after
  function turnsFor(n) {
    var t = ['open', 'docent0'];
    for (var i = 1; i < n; i++) { t.push('ask' + i); t.push('docent' + i); }
    t.push('after');
    return t;
  }
  function itemTurns(i) { return i === 0 ? 'open docent0' : 'ask' + i + ' docent' + i; }

  // ── HUD: 두 구역은 한 번 만들어 장이 바뀔 때마다 그 자리로 옮겨 꽂는다 ────────────────
  var huds = {};
  function makeHud(role, label) {
    var root = el('div', 'hud ' + role + ' idle');
    var who = el('div', 'who');
    who.appendChild(el('span', 'rm'));
    who.appendChild(el('span', 'name', label));
    var eq = el('span', 'eq'); eq.appendChild(el('i')); eq.appendChild(el('i')); eq.appendChild(el('i'));
    who.appendChild(eq);
    var bubble = el('div', 'bubble');
    var t = el('p', 't'); t.setAttribute('aria-live', 'polite');
    var done = el('span', 'done'), rest = el('span', 'rest');
    t.appendChild(done); t.appendChild(rest);
    var prog = el('div', 'prog'), bar = el('i'); prog.appendChild(bar);
    bubble.appendChild(t); bubble.appendChild(prog);
    root.appendChild(who); root.appendChild(bubble);
    huds[role] = { el: root, done: done, rest: rest, bar: bar, mode: 'idle', timer: null };
  }
  makeHud('mc', '사회자');
  makeHud('docent', '도슨트');

  function setMode(h, mode) {
    clearTimeout(h.timer);
    h.mode = mode;
    h.el.classList.remove('idle', 'speaking', 'fading');
    h.el.classList.add(mode);
    if (mode === 'fading') h.timer = setTimeout(function () { setMode(h, 'idle'); }, 2400);
  }
  function hudClear() {
    ['mc', 'docent'].forEach(function (r) {
      var h = huds[r]; setMode(h, 'idle'); h.done.textContent = ''; h.rest.textContent = ''; h.bar.style.width = '0%';
    });
  }
  function hudShow(role, text) {
    var me = huds[role], other = huds[role === 'mc' ? 'docent' : 'mc'];
    if (other.mode === 'speaking') setMode(other, 'fading');
    setMode(me, 'speaking');
    me.done.textContent = ''; me.rest.textContent = text; me.bar.style.width = '0%';
  }
  function hudProgress(role, text, p) {
    var h = huds[role], n = Math.round(text.length * p);
    h.done.textContent = text.slice(0, n); h.rest.textContent = text.slice(n); h.bar.style.width = (p * 100) + '%';
  }

  // 한 번에 보이는 말은 한 문장(길면 쉼표에서 끊은 절)이다 — 가리는 면적을 줄이는 핵심
  function chunksOf(text, max) {
    max = max || 40;
    var out = [];
    // 뒤돌아보기(lookbehind) 없이 쪼갠다 — 전시장 브라우저가 오래된 사파리여도 돈다
    (text.match(/[^.?!]+[.?!]+\s*|[^.?!]+$/g) || [text]).forEach(function (s0) {
      var s = s0.trim();
      if (s.length <= max) { out.push(s); return; }
      var parts = (s.match(/[^,]+,?\s*/g) || [s]).map(function (x) { return x.trim(); }), cur = '';
      parts.forEach(function (p) {
        if (cur && (cur + ' ' + p).length > max) { out.push(cur); cur = p; } else { cur = cur ? cur + ' ' + p : p; }
      });
      if (cur) out.push(cur);
    });
    return out;
  }

  // ── 장 그리기 ───────────────────────────────────────────────────────
  var dialEls = null;
  function turnsAttr(e, turns) { if (turns) e.setAttribute('data-turns', turns); return e; }

  function renderSlide() {
    var cue = CUES[state.slide], L = cue.lv[state.lv], n = cue.n;
    TURNS = turnsFor(n);
    var turns = cue.turns || {};
    var root = $('#slide'); root.textContent = '';
    dialEls = null;
    root.appendChild(turnsAttr(el('h1', 'headline', L.headline), turns.headline || 'open docent0'));

    var band = el('div', 'band');
    var laneMc = el('div', 'lane lane-mc'), laneDoc = el('div', 'lane lane-docent');
    laneMc.appendChild(huds.mc.el); laneDoc.appendChild(huds.docent.el);
    var vis = el('div', 'visual');
    vis.appendChild(visualView(L.visual, cue, turns));
    band.appendChild(laneMc); band.appendChild(vis); band.appendChild(laneDoc);
    root.appendChild(band);

    var cards = el('div', 'cards n' + n);
    cards.style.setProperty('--n', n);
    L.items.forEach(function (it, i) {
      var c = turnsAttr(el('div', 'card'), (turns.items && turns.items[i]) || itemTurns(i));
      var hd = el('div', 'hd');
      hd.appendChild(el('span', 'no', String(i + 1)));
      hd.appendChild(el('span', 'tt', it.t));
      c.appendChild(hd); c.appendChild(el('p', 'bd', it.b));
      cards.appendChild(c);
    });
    root.appendChild(cards);

    var rem = turnsAttr(el('div', 'remember'), turns.remember || 'after');
    rem.appendChild(el('span', 'tag', '기억해 두기'));
    rem.appendChild(el('span', 'tx', L.remember));
    root.appendChild(rem);
    root.appendChild(el('p', 'src', L.source || ''));
    applyHighlight();
  }

  function visualView(v, cue, turns) {
    var t = turns.visual || (v.at != null ? itemTurns(v.at) : '');
    if (v.type === 'route') return routeView(v, t);
    if (v.type === 'dial') return dialView(v, t);
    if (v.type === 'steps') return stepsView(v, t);
    return factsView(v, t);
  }

  function factsView(v, t) {
    var w = turnsAttr(el('div', 'vwrap'), t);
    var f = el('div', 'facts n' + v.facts.length);
    v.facts.forEach(function (x) {
      var d = el('div', 'fact');
      d.appendChild(el('div', 'big', x.big)); d.appendChild(el('div', 'lab', x.label));
      f.appendChild(d);
    });
    w.appendChild(f);
    return w;
  }
  function stepsView(v, t) {
    var w = turnsAttr(el('div', 'vwrap'), t);
    if (v.title) w.appendChild(el('p', 'vtitle', v.title));
    var s = el('div', 'steps');
    v.steps.forEach(function (x, i) {
      if (i) s.appendChild(el('span', 'arr', '›'));
      var d = el('div', 'step');
      d.appendChild(el('div', x.k.length > 5 ? 'k long' : 'k', x.k)); d.appendChild(el('div', 'v', x.v));
      s.appendChild(d);
    });
    w.appendChild(s);
    return w;
  }

  function routeView(v, t) {
    var r = turnsAttr(el('div', 'route'), t);
    r.appendChild(el('div', 'km', v.label));
    var line = el('div', 'line');
    var d1 = el('span', 'dot'); d1.style.background = '#0E2433';
    var d2 = el('span', 'dot'); d2.style.background = '#B96F00';
    line.appendChild(d1); line.appendChild(el('span', 'dash')); line.appendChild(d2); line.appendChild(el('span', 'pulse'));
    r.appendChild(line);
    var ends = el('div', 'ends');
    ends.appendChild(el('span', '', v.from)); ends.appendChild(el('span', '', v.to));
    r.appendChild(ends);
    r.appendChild(el('div', 'note', '개념도 — 실제 지도·축척이 아니에요'));
    var b = el('button', 'btn', '신호 보내 보기'); b.type = 'button';
    b.addEventListener('click', function () { sendPulse(); });
    r.appendChild(b);
    return r;
  }
  function sendPulse() {
    var r = $('.route'); if (!r) return;
    r.classList.remove('go'); void r.offsetWidth; r.classList.add('go');
  }

  // 주파수 다이얼 — 지수 e 는 log10(Hz). 3(1kHz) ~ 12.5(약 3,000GHz)
  var E_MIN = 3, E_MAX = 12.5, E_FM = 8;
  function trimNum(x, sf) { return Number(x.toPrecision(sf)).toString(); }
  function fmtFreq(e) {
    var f = Math.pow(10, e), v, u;
    if (f < 1e6) { v = f / 1e3; u = 'kHz'; } else if (f < 1e9) { v = f / 1e6; u = 'MHz'; }
    else if (f < 1e12) { v = f / 1e9; u = 'GHz'; } else { v = f / 1e12; u = 'THz'; }
    return trimNum(v, 3) + ' ' + u;
  }
  function fmtLen(e, sf) {
    var m = C / Math.pow(10, e), v, u;
    if (m >= 1000) { v = m / 1000; u = 'km'; } else if (m >= 1) { v = m; u = 'm'; }
    else if (m >= 0.01) { v = m * 100; u = 'cm'; } else if (m >= 0.001) { v = m * 1000; u = 'mm'; }
    else { v = m * 1e6; u = 'μm'; }
    return trimNum(v, sf) + ' ' + u;
  }
  function wavePath(e) {
    var cycles = 1.5 + (e - E_MIN) / (E_MAX - E_MIN) * 11.5, W = 1000, H = 100, n = 320, d = '';
    for (var i = 0; i <= n; i++) {
      var x = W * i / n, y = H / 2 - 40 * Math.sin(2 * Math.PI * cycles * i / n);
      d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
    }
    return d;
  }
  function dialView(D, t) {
    var wrap = turnsAttr(el('div', 'dial'), t);
    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'wave'); svg.setAttribute('viewBox', '0 0 1000 100'); svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    var path = document.createElementNS(svgNS, 'path'); svg.appendChild(path); wrap.appendChild(svg);

    var wl = el('div', 'wl');
    wl.appendChild(el('span', '', D.low)); wl.appendChild(el('span', '', D.high)); wrap.appendChild(wl);
    wrap.appendChild(el('p', 'dtitle', D.title));

    var slider = el('input', 'freq'); slider.type = 'range'; slider.min = E_MIN; slider.max = E_MAX; slider.step = 0.01; slider.value = E_FM;
    slider.setAttribute('aria-label', '주파수 다이얼');
    wrap.appendChild(slider);

    var ticks = el('div', 'ticks');
    (D.ticks || []).forEach(function (tk) {
      var s = el('span', 'tick' + (tk.row2 ? ' row2' : '') + (tk.hl ? ' hl' : ''), tk.label);
      s.style.left = ((tk.e - E_MIN) / (E_MAX - E_MIN) * 100) + '%';
      ticks.appendChild(s);
    });
    if (D.endLabels) {
      var a = el('span', 'tick', D.endLabels[0]); a.style.left = '0%'; ticks.appendChild(a);
      var b = el('span', 'tick', D.endLabels[1]); b.style.left = '100%'; ticks.appendChild(b);
    }
    wrap.appendChild(ticks);

    var out = el('div', 'out'), o1 = el('span'), o2 = el('span');
    out.appendChild(o1); out.appendChild(o2); wrap.appendChild(out);
    var dyn = el('p', 'dyn'); dyn.setAttribute('aria-live', 'polite'); wrap.appendChild(dyn);
    if (D.fmButton) {
      var row = el('div', 'dialrow');
      var fm = el('button', 'btn ghost', D.fmButton); fm.type = 'button';
      fm.addEventListener('click', function () { dialTo(E_FM, 1200); });
      row.appendChild(fm); wrap.appendChild(row);
    }
    if (D.formula) wrap.appendChild(el('p', 'fine', D.formula));
    wrap.appendChild(el('p', 'fine', D.caption));

    dialEls = { slider: slider, path: path, o1: o1, o2: o2, dyn: dyn, D: D };
    slider.addEventListener('input', function () { cancelDial(); paintDial(parseFloat(slider.value)); });
    paintDial(E_FM);
    return wrap;
  }
  function paintDial(e) {
    if (!dialEls) return;
    var D = dialEls.D;
    dialEls.slider.value = e;
    dialEls.path.setAttribute('d', wavePath(e));
    var nearFm = Math.abs(e - E_FM) < 0.12;
    if (D.mode === 'words') {
      var fast = e >= (E_MIN + E_MAX) / 2;
      dialEls.o1.textContent = fast ? '물결이 빠르게 출렁여요' : '물결이 천천히 출렁여요';
      dialEls.o2.textContent = fast ? '물결 하나가 짧아요' : '물결 하나가 길어요';
      dialEls.dyn.textContent = '';
    } else {
      dialEls.o1.textContent = D.fLabel + ' ' + fmtFreq(e);
      dialEls.o2.textContent = D.lLabel + ' ' + fmtLen(e, D.sf);
      dialEls.dyn.textContent = nearFm && D.fmSentence ? D.fmSentence : '';
    }
  }
  var dialRaf = null;
  function cancelDial() { if (dialRaf) { cancelAnimationFrame(dialRaf); dialRaf = null; } }
  function dialTo(target, ms) {
    if (!dialEls) return;
    cancelDial();
    var from = parseFloat(dialEls.slider.value), t0 = performance.now();
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { paintDial(target); return; }
    (function step(now) {
      var p = Math.min(1, (now - t0) / ms), k = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      paintDial(from + (target - from) * k);
      dialRaf = p < 1 ? requestAnimationFrame(step) : null;
    })(t0);
  }

  // ── 말하는 대목에 맞춘 강조 ────────────────────────────────────────
  function applyHighlight() {
    var cur = state.turn ? TURNS.indexOf(state.turn) : -1;
    $$('[data-turns]').forEach(function (e) {
      e.classList.remove('now', 'seen', 'later');
      if (cur < 0) return;
      var idx = e.getAttribute('data-turns').split(' ').map(function (t) { return TURNS.indexOf(t); });
      if (idx.indexOf(cur) >= 0) e.classList.add('now');
      else if (Math.max.apply(null, idx) < cur) e.classList.add('seen');
      else if (Math.min.apply(null, idx) > cur) e.classList.add('later');
    });
  }
  function runActions(turn, ms) {
    var cue = CUES[state.slide];
    ((cue.actions || {})[turn] || []).forEach(function (a) {
      if (a.type === 'pulse') sendPulse();
      if (a.type === 'dial') {
        if (a.from != null && dialEls) paintDial(a.from);
        dialTo(a.to, a.ms != null ? a.ms : ms * 0.9);
      }
    });
  }

  // ── 공연 시뮬레이션(감독의 say 흐름을 흉내 낸다) ───────────────────────
  var seq = [], run = null, gap = null, ticker = null;
  function buildSeq() {
    var cue = CUES[state.slide], L = cue.lv[state.lv], s = [{ role: 'mc', turn: 'open', text: cue.open }];
    for (var i = 0; i < cue.n; i++) {
      if (i > 0) s.push({ role: 'mc', turn: 'ask' + i, text: L.ask[i] });
      s.push({ role: 'docent', turn: 'docent' + i, text: L.ans[i] });
    }
    s.push({ role: 'mc', turn: 'after', text: cue.after });
    return s;
  }
  function chunkMs(t) { return Math.max(1100, t.length / CPS * 1000) / speed(); }
  function startUtter(i) {
    var u = seq[i]; state.turn = u.turn; applyHighlight();
    var chunks = chunksOf(u.text), total = chunks.reduce(function (a, c) { return a + chunkMs(c); }, 0);
    run = { i: i, role: u.role, chunks: chunks, k: 0, t0: performance.now(), dur: chunkMs(chunks[0]) };
    hudShow(u.role, chunks[0]);
    runActions(u.turn, total);
    if (!ticker) ticker = setInterval(tick, 50);
  }
  function tick() {
    if (!run) return;
    var now = performance.now(), p = Math.min(1, (now - run.t0) / run.dur);
    hudProgress(run.role, run.chunks[run.k], p);
    if (p < 1) return;
    run.k++;
    if (run.k < run.chunks.length) { run.t0 = now; run.dur = chunkMs(run.chunks[run.k]); hudShow(run.role, run.chunks[run.k]); return; }
    endUtter();
  }
  function endUtter() {
    var i = run.i; setMode(huds[run.role], 'fading'); run = null;
    if (i + 1 < seq.length) gap = setTimeout(function () { startUtter(i + 1); }, 500 / speed());
    else { state.running = false; paintBtns(); }
  }
  function stopSim() { clearTimeout(gap); gap = null; clearInterval(ticker); ticker = null; run = null; cancelDial(); }
  function playSim() {
    stopSim(); hudClear(); seq = buildSeq(); state.running = true; paintBtns(); startUtter(0);
  }
  function nextUtter() {
    if (!state.running) { playSim(); return; }
    var i = run ? run.i : -1; clearTimeout(gap); gap = null;
    if (run) { setMode(huds[run.role], 'idle'); run = null; }
    if (i + 1 < seq.length) startUtter(i + 1); else { state.running = false; paintBtns(); }
  }
  function resetSim() {
    stopSim(); state.running = false; state.turn = null; hudClear(); applyHighlight(); paintBtns();
    if (dialEls) paintDial(E_FM);
  }

  // ── 위 도구줄 ──────────────────────────────────────────────────────
  function paintBtns() {
    var vis = visibleIdx(), at = vis.indexOf(state.slide);
    $('#slidesel').value = String(state.slide);
    $('#prev').disabled = at <= 0;
    $('#nextslide').disabled = at < 0 || at >= vis.length - 1;
    $('#pos').textContent = (at + 1) + ' / ' + vis.length;
    $$('#levels button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lv') === state.lv)); });
    $$('#courses button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-c') === state.course)); });
    $('#play').textContent = state.running ? '↻ 처음부터' : '▶ 시뮬레이션';
  }
  function fillSelect() {
    var sel = $('#slidesel'); sel.textContent = '';
    visibleIdx().forEach(function (i) {
      var o = el('option', '', CUES[i].no + ' ' + CUES[i].title); o.value = String(i); sel.appendChild(o);
    });
  }
  function buildBar() {
    LEVELS.forEach(function (l) {
      var b = el('button', '', l.name); b.type = 'button'; b.setAttribute('data-lv', l.key);
      b.addEventListener('click', function () { setLevel(l.key); });
      $('#levels').appendChild(b);
    });
    COURSES.forEach(function (c) {
      var b = el('button', '', c.name + ' ' + c.ids.length); b.type = 'button'; b.setAttribute('data-c', c.name);
      b.addEventListener('click', function () { setCourse(c.name); });
      $('#courses').appendChild(b);
    });
    $('#slidesel').addEventListener('change', function (ev) { setSlide(parseInt(ev.target.value, 10)); });
    $('#prev').addEventListener('click', function () { stepSlide(-1); });
    $('#nextslide').addEventListener('click', function () { stepSlide(1); });
    $('#play').addEventListener('click', playSim);
    $('#next').addEventListener('click', nextUtter);
    $('#reset').addEventListener('click', resetSim);
    fillSelect();
  }
  function stepSlide(d) {
    var vis = visibleIdx(), at = vis.indexOf(state.slide) + d;
    if (at >= 0 && at < vis.length) setSlide(vis[at]);
  }
  function setSlide(i) { stopSim(); state.running = false; state.turn = null; hudClear(); state.slide = i; renderSlide(); paintBtns(); }
  function setLevel(k) { stopSim(); state.running = false; state.turn = null; hudClear(); state.lv = k; renderSlide(); paintBtns(); }
  function setCourse(name) {
    state.course = name; fillSelect();
    var vis = visibleIdx();
    if (vis.indexOf(state.slide) < 0) { setSlide(vis[0]); return; }   // 코스에 없는 장이면 코스의 첫 장으로
    paintBtns();
  }

  document.addEventListener('keydown', function (ev) {
    if (/^(INPUT|SELECT|TEXTAREA)$/.test((ev.target || {}).tagName || '')) return;
    if (ev.key === 'ArrowRight') stepSlide(1);
    else if (ev.key === 'ArrowLeft') stepSlide(-1);
    else if (ev.key === 'n' || ev.key === 'N') nextUtter();
  });

  buildBar();
  var q = new URLSearchParams(location.search);
  if (q.get('level') && CUES[0].lv[q.get('level')]) state.lv = q.get('level');
  if (q.get('course') && COURSES.some(function (c) { return c.name === q.get('course'); })) { state.course = q.get('course'); fillSelect(); }
  if (q.get('cue')) { var ci = CUES.map(function (c) { return c.id; }).indexOf(q.get('cue')); if (ci >= 0) state.slide = ci; }
  else if (q.get('slide') && CUES[+q.get('slide')]) state.slide = +q.get('slide');
  if (visibleIdx().indexOf(state.slide) < 0) state.slide = visibleIdx()[0];
  renderSlide(); paintBtns();

  // 화면 확인·실서비스 연결용. `freeze` 는 시간을 멈춘 채 한 순간을 그린다(스크린샷), 나머지는 감독 연결 지점이다.
  window.hud = {
    freeze: function (i, k, p, prevRole) {
      stopSim(); hudClear(); seq = buildSeq(); var u = seq[i], ch = chunksOf(u.text);
      state.turn = u.turn; applyHighlight();
      if (prevRole && i > 0) {            // 직전 말(상대 구역)은 흐려지는 중으로 보인다
        var pu = seq[i - 1], pc = chunksOf(pu.text), ph = huds[pu.role];
        ph.done.textContent = ''; ph.rest.textContent = pc[pc.length - 1]; setMode(ph, 'fading'); clearTimeout(ph.timer);
      }
      hudShow(u.role, ch[k]); hudProgress(u.role, ch[k], p);
      runActions(u.turn, 3000);
    },
    seqLength: function () { return buildSeq().length; },
    // 이 장에서 각 구역이 띄울 가장 긴 조각 — 가리는 면적이 최대일 때를 시험하려고(`tests/test_handout_hud.py`)
    worstChunks: function () {
      var best = { mc: '', docent: '' };
      buildSeq().forEach(function (u) { chunksOf(u.text).forEach(function (c) { if (c.length > best[u.role].length) best[u.role] = c; }); });
      return best;
    },
    showBoth: function (mcText, docentText) {
      hudClear(); hudShow('mc', mcText); setMode(huds.mc, 'fading'); clearTimeout(huds.mc.timer);
      hudShow('docent', docentText); hudProgress('docent', docentText, 0.5);
    },
    setSlide: setSlide, setLevel: setLevel, setCourse: setCourse, play: playSim, next: nextUtter, reset: resetSim,
    chunksOf: chunksOf, state: state
  };
})();
</script>
</body>
</html>
