<!--
  분해도 무대(전문가 수준) 시안 — `python -m scripts.handout_exploded.build` 가 만든 파일이다. 직접 고치지 않는다.
  틀은 `scripts/handout_exploded/template.html`(엔진) · `tables.yaml`(큐마다 부품 표) · `scenes.js`(부품 모양) · `parts.js`(형상 도구) ·
  `layout.js`(설명선 배치). 글은 handout-hud 의 검증된 카드(전문가), 음성은 고정 대사 TTS 캐시를 이어 붙인 것.

  표현 기법은 aimotion 148 「분해도」(https://github.com/kstost/cokacmotion, MIT License, Copyright (c) 2026 kstost)에서 **기술만**
  가져왔다: 부품 표가 정하는 장면 그래프 · 부모 좌표계의 분해 벡터 · 바깥 부품이 앞장서는 순서 곡선(back.out / back.in) ·
  3D 기준점 투영 + 가중 등위 회귀(PAVA) 설명선 · 엇갈리지 않는 꺾인 지시선 · 역방향 껍질 외곽선 · 딸깍(카메라 밀림) ·
  무광 면은 구면 조화 LightProbe, 금속만 환경 반사. 소재·색·구도·문구는 이 대본에서 새로 지었다(손전등·남색 스튜디오·호박색 없음).
  옮긴 코드(pava·필렛 단면·분해 곡선)는 MIT 고지를 따른다:
    Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation
    files (the "Software"), to deal in the Software without restriction … The above copyright notice and this permission notice
    shall be included in all copies or substantial portions of the Software. THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY.
    (전문: scripts/handout_exploded/LICENSE-aimotion)
  three.js 0.186.1(MIT License, Copyright © 2010-2026 three.js authors — 전문 scripts/handout_exploded/vendor/three-LICENSE)를
  import map 의 data: URL 로 내장했다. 외부 리소스를 부르지 않는다(전시장은 오프라인).

  글자는 캔버스에 그리지 않고 DOM textContent 로만 넣는다(라벨·말풍선·카드). 2D 캔버스에는 지시선·점·전파 고리만.
  그림은 t 의 순수 함수다 — `?cue=02&t=40` 으로 한 순간을 멈춰 볼 수 있다. `?check=1` 은 모든 장을 지어
  '대사에 없는 낱말' 경고를 body[data-warn] 에 적는다. `?bench=1` 은 프레임 시간을 재서 body[data-bench] 에 적는다.
  `?live`(또는 `?live=ws://…`)는 공연 모드 — 로봇 2대가 말하고 화면은 LiveFollow(scripts/handout_live/live_follow.js)의 시계를 따라간다.
-->

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';
import { LightProbeGenerator } from 'three/addons/LightProbeGenerator.js';
import { RoundedBoxGeometry } from 'three/addons/RoundedBoxGeometry.js';

var DATA = JSON.parse(document.getElementById('data').textContent), CUES = DATA.cues;
var W = 1600, H = 900;
var $ = function (s) { return document.querySelector(s); };
var WARN = [], cw = console.warn; console.warn = function () { WARN.push(Array.prototype.join.call(arguments, ' ')); cw.apply(console, arguments); };
var q = new URLSearchParams(location.search);

// ───────────────────────────────────────────── 작은 도구(이징은 aimotion _lib/stage.js 와 같은 식)
function clamp(v, a, b) { a = a == null ? 0 : a; b = b == null ? 1 : b; return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function smooth(v) { v = clamp(v); return v * v * (3 - 2 * v); }
var ease = {
  outCubic: function (p) { return 1 - Math.pow(1 - p, 3); }, inCubic: function (p) { return p * p * p; },
  inOutCubic: function (p) { return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; },
  outExpo: function (p) { return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); },
  outBack: function (p, c) { c = c == null ? 1.7 : c; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }
};
function backIn(q, c) { return (c + 1) * q * q * q - c * q * q; }
function mixHex(a, b, k) { var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16), ch = function (s) { return Math.round(lerp((pa >> s) & 255, (pb >> s) & 255, clamp(k))); };
  return 'rgb(' + ch(16) + ',' + ch(8) + ',' + ch(0) + ')'; }

/*__LAYOUT__*/
/*__PARTS__*/
/*__SCENES__*/

// ───────────────────────────────────────────── 렌더러 · 빛 · 환경(한 번)
var glc = $('#gl'), ovc = $('#ov'), og = ovc.getContext('2d'), K = 1;
// WebGL 이 안 열리는 PC(GPU·드라이버 없음, 최신 Chrome 은 소프트웨어 대체를 기본으로 안 켠다)에서는 조용히 빈 화면이 되지 않게
// 화면에 크게 알리고 멈춘다 — 시연장에서 원인을 바로 알 수 있어야 한다
var renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: q.get('t') != null }); }   // 버퍼 보존은 멈춘 화면 캡처용만
catch (e) {
  var gm = document.createElement('div'); gm.textContent = '이 PC 에서 3D(WebGL)를 열 수 없습니다 — 그래픽 가속을 켜거나 Chrome 을 --enable-unsafe-swiftshader 로 띄우세요';
  gm.style.cssText = 'position:fixed;inset:auto 24px 24px 24px;z-index:99;background:#B3261E;color:#fff;font-weight:800;font-size:20px;padding:16px 20px;border-radius:12px';
  document.body.appendChild(gm); document.documentElement.setAttribute('data-error', 'webgl'); throw e;
}
renderer.setClearColor(0x000000, 0);
// Neutral 톤 매핑: 밝은 바탕에서 HUD 재질 색이 ACES 처럼 탁해지지 않게(데모의 ACES 를 그대로 쓰지 않는 이유)
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
var scene = new THREE.Scene();
var pmrem = new THREE.PMREMGenerator(renderer), room = new RoomEnvironment();
var envTex = pmrem.fromScene(room, 0, .1, 100, { size: 128 }).texture;
// 무광 면 채움: 같은 방을 구면 조화 9계수로 줄인 LightProbe — 큐브 맵을 화면 전체에서 매 픽셀 읽지 않는다
var cubeRT = new THREE.WebGLCubeRenderTarget(32, { type: THREE.HalfFloatType });
new THREE.CubeCamera(.1, 100, cubeRT).update(renderer, room);
var probe = await LightProbeGenerator.fromCubeRenderTarget(renderer, cubeRT); cubeRT.dispose();
probe.intensity = 1.0;
var key = new THREE.DirectionalLight('#ffffff', 2.1), rim = new THREE.DirectionalLight('#d4e6f2', 1.1), hemi = new THREE.HemisphereLight('#ffffff', '#c3d2dc', .35);
key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.radius = 9; key.shadow.blurSamples = 10; key.shadow.bias = -.0006;
scene.add(key, key.target, rim, hemi, probe);
var floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.ShadowMaterial({ color: '#0E2433', opacity: .13 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; floor.renderOrder = -1; scene.add(floor);
var camera = new THREE.PerspectiveCamera(24, W / H, .5, 400);
var BG = new THREE.Color(PAL.bg), TMP = new THREE.Color();
var hullCache = new WeakMap();

// ───────────────────────────────────────────── 한 장(큐) 짓기: 표 → 장면 그래프 · 시각 · 라벨 · 카메라 맞춤
var labelsEl = $('#labels');
/** 큐 대사에서 kw 가 from 이후 처음 나오는 때(문장 안 글자 위치 비례 — 캐시 음성에는 낱말 시각이 없다). role 이면 그 역할 대사만 */
function wordTime(cue, kw, from, role) {
  for (var i = 0; i < cue.utt.length; i++) { var u = cue.utt[i]; if (role && u.role !== role) continue;
    for (var j = 0; j < u.s.length; j++) { var s = u.s[j], k = s.x.indexOf(kw); if (k < 0) continue;
      var t = s.t0 + (s.t1 - s.t0) * k / s.x.length - .12; if (t >= from - .01) return Math.max(0, t); } }
  console.warn('[' + cue.id + '] 대사에 없는 낱말:', kw); return null;
}
function U(cue, turn) { return cue.utt.filter(function (u) { return u.turn === turn; })[0]; }
/** 라벨 낱말 대조(빌더의 check_table 과 같은 규칙) — 대사 + 검증 카드에 없는 낱말이면 경고 */
function checkWords(cue, text, where) {
  var corpus = cue.utt.map(function (u) { return u.s.map(function (s) { return s.x; }).join(' '); }).join('\n') + '\n' + cue.card.join('\n');
  (text || '').split(/[\s·—()\/]+/).filter(Boolean).forEach(function (w) { if (corpus.indexOf(w) < 0) console.warn('[' + cue.id + '] 대사에 없는 낱말:', w, '(' + where + ')'); });
}

var scenes = [];
function getScene(ci) {
  if (scenes[ci]) return scenes[ci];
  var cue = CUES[ci], sc = { cue: cue, root: new THREE.Group(), parts: [], byId: {} };
  var T_EXP = U(cue, 'docent0').t0 + .1, T_RE = U(cue, 'after').t0, T_CLICK = T_RE + 1.05, T_ON = T_CLICK + .32;
  Object.assign(sc, { T_EXP: T_EXP, T_RE: T_RE, T_CLICK: T_CLICK, T_ON: T_ON });
  var maxDist = Math.max.apply(null, cue.parts.map(function (r) { return r.dist; }).concat([1e-6]));
  var maxRank = Math.max.apply(null, cue.parts.map(function (r) { return r.order; }).concat([1]));
  // ── 표의 행마다 부품 하나: 모양 · 재질(부품마다 따로 — "나머지 흐리게" 를 부품 단위 색 섞기로) · 외곽선 껍질
  cue.parts.forEach(function (row) {
    var p = Object.assign({}, row), M = makeMaterials(envTex);
    var mk = SHAPES[cue.id] && SHAPES[cue.id][row.shape];
    if (!mk) { console.warn('[' + cue.id + '] 모양이 없다:', row.shape); mk = function () { return new THREE.Group(); }; }
    p.M = M; p.shape = mk(KIT, M); p.g = new THREE.Group(); p.g.add(p.shape);
    p.mats = Object.keys(M).map(function (k) { return M[k]; });
    p.hullMat = hullMaterial(); p.hullMat.uniforms.uW.value = row.hull || .06; p.hulls = [];
    // 메시를 먼저 모으고 나서 껍질을 붙인다 — 순회 도중에 자식을 붙이면 그 껍질(Mesh)을 다시 만나 끝없이 껍질을 붙인다(스택 넘침)
    // 투명 재질(유리)에는 껍질을 붙이지 않는다 — 뒷면 껍질이 유리를 통해 비쳐, 강조될 때 꽉 찬 파란 상자로 보였다(19 선 상자·04 라이덴 병)
    var meshes = []; p.shape.traverse(function (o) { if (o.isMesh && !(o.material && o.material.transparent)) meshes.push(o); });
    meshes.forEach(function (o) { o.receiveShadow = false;
      var hn = hullCache.get(o.geometry); if (!hn) { hn = hullNormals(o.geometry); hullCache.set(o.geometry, hn); o.geometry.setAttribute('hullN', new THREE.BufferAttribute(hn, 3)); }
      var h = new THREE.Mesh(o.geometry, p.hullMat); h.renderOrder = 2; h.castShadow = false; h.visible = false; o.add(h); p.hulls.push(h); });
    p.rest = new THREE.Vector3().fromArray(row.rest); p.dirV = new THREE.Vector3().fromArray(row.dir).normalize();
    p.tiltAxis = new THREE.Vector3(Math.cos(row.phi || 0), 0, Math.sin(row.phi || 0));
    p.spin = row.spin || 0; p.tilt = row.tilt || [0, 0]; p.over = row.over || 1.5; p.delay = row.delay || 0;
    // 순서 곡선(aimotion 148): 단계 사이 간격이 뒤로 갈수록 좁아져(sin 분포) 바깥이 앞장서고 안쪽이 바짝 따라붙는다 → 한 동작으로 읽힌다
    p.tLeave = row.leave ? wordTime(cue, row.leave, T_EXP - .5, 'docent') : null;

        og.globalAlpha = (w > 0 ? lerp(.62, 1, w) : .62) * dimK; og.strokeStyle = w > 0 ? mixHex(INK, SIG, w) : INK; og.lineWidth = 1.6 + 1.2 * w;
        og.beginPath(); og.moveTo(pts[0][0], pts[0][1]); var acc = 0;
        for (i = 1; i < pts.length; i++) { var sl = seg[i - 1]; if (acc + sl <= shownL) { og.lineTo(pts[i][0], pts[i][1]); acc += sl; continue; }
          var f = (shownL - acc) / sl; og.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); break; }
        og.stroke();
      }
      var ds = (dotIn > 0 ? ease.outBack(dotIn, 2.2) : 0) * (1 - dotOut);
      if (ds > .01) { og.globalAlpha = dimK; og.fillStyle = '#ffffff'; og.beginPath(); og.arc(it.ax, it.ay, 8 * ds, 0, Math.PI * 2); og.fill();
        og.fillStyle = w > 0 ? mixHex(INK, SIG, w) : INK; og.beginPath(); og.arc(it.ax, it.ay, (4.5 + 1.5 * w) * ds, 0, Math.PI * 2); og.fill(); }
      p.lay = { y: it.y, la: labIn * (1 - labOut), labIn: labIn, labOut: labOut, dimK: dimK, w: w };
    });
  });
  og.globalAlpha = 1;
  // 두 부품을 잇는 점선(02: 보낸 쪽 안테나 → 받은 쪽) — 3D 이차 곡선을 투영해 길이를 따라 그어진다
  sc.links.forEach(function (ln) {
    if (ln.t == null) return; var k = ease.outCubic(clamp((t - ln.t - .5) / 1.3)) * (1 - smooth((t - sc.T_RE) / .3)); if (k <= .002) return;
    var a = ln.from.g.localToWorld(ln.a.clone()), b = ln.to.g.localToWorld(ln.b.clone()), m = a.clone().lerp(b, .5); m.y += a.distanceTo(b) * .32;
    og.strokeStyle = SIG; og.lineWidth = 3; og.setLineDash([10, 8]); og.globalAlpha = .95; og.beginPath();
    var N = 48, n = Math.max(1, Math.round(N * k));
    for (var i = 0; i <= n; i++) { var s = i / N, pa = a.clone().multiplyScalar((1 - s) * (1 - s)).addScaledVector(m, 2 * s * (1 - s)).addScaledVector(b, s * s), pr = project(pa);
      if (i) og.lineTo(pr[0], pr[1]); else og.moveTo(pr[0], pr[1]); }
    og.stroke(); og.setLineDash([]);
    [project(a), project(b)].forEach(function (e2, j) { if (j && k < .98) return; og.fillStyle = SIG; og.beginPath(); og.arc(e2[0], e2[1], 5, 0, Math.PI * 2); og.fill(); });
  });
  // 딸깍: 조립체 가운데에서 고리 하나 + 짧은 섬광 · 점등 뒤: 안테나 끝에서 전파 고리가 차례로 퍼진다
  var u = t - sc.T_CLICK;
  if (u >= 0 && u < .55) { var c0 = project(sc.fitA.c), kk = u / .55; og.globalAlpha = .85 * Math.pow(1 - kk, 1.4); og.strokeStyle = SIG; og.lineWidth = 8 * (1 - kk) + 1;
    og.beginPath(); og.arc(c0[0], c0[1], 40 + 260 * ease.outExpo(kk), 0, Math.PI * 2); og.stroke();
    var fl = clamp(u / .22); if (fl < 1) { og.globalAlpha = .18 * (1 - fl) * (1 - fl); og.fillStyle = '#ffffff'; og.fillRect(0, 0, W, H); } }
  if (on > 0) sc.emits.forEach(function (em) { var pr = project(em.p.shape.localToWorld(em.v.clone()));
    for (var r = 0; r < 3; r++) { var ph = ((t - sc.T_ON) - r * .42); if (ph < 0) continue; ph = (ph % 1.26) / 1.26;
      og.globalAlpha = on * .75 * (1 - ph) * (1 - ph); og.strokeStyle = SIG; og.lineWidth = 3 - 2 * ph; og.beginPath(); og.arc(pr[0], pr[1], 10 + 120 * ease.outCubic(ph), Math.PI * 1.05, Math.PI * 1.95); og.stroke(); }
    og.globalAlpha = on; og.fillStyle = SIG; og.beginPath(); og.arc(pr[0], pr[1], 5, 0, Math.PI * 2); og.fill(); });
  og.globalAlpha = 1;
}

// ───────────────────────────────────────────── DOM: 라벨 · 헤드라인 · 포인트 카드 · 로봇 · 말풍선
function dom(sc, t) {
  var cue = sc.cue;
  sc.labeled.forEach(function (p) {
    var L = p.lay; if (!L || L.la <= .002) { if (p.vis) { p.el.style.display = 'none'; p.vis = 0; } return; }
    if (!p.vis) { p.el.style.display = 'block'; p.vis = 1; }
    var x = p.side === 'L' ? LXL - p.lw + (1 - L.labIn) * 22 + L.labOut * 12 : LXR + (1 - L.labIn) * -22 - L.labOut * 12;
    p.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + (L.y - p.above).toFixed(1) + 'px)';
    p.el.style.opacity = (L.la * L.dimK).toFixed(3);
    var rev = Math.min(1, L.labIn * 1.25) * 100;
    p.el.style.clipPath = p.side === 'L' ? 'inset(-6px -6px -6px ' + (100 - rev).toFixed(1) + '%)' : 'inset(-6px ' + (100 - rev).toFixed(1) + '% -6px -6px)';
    p.elName.style.color = L.w > 0 ? mixHex('#0E2433', PAL.sig, L.w) : '';
    p.elName.style.borderBottomColor = L.w > 0 ? 'rgba(11,127,181,' + L.w.toFixed(3) + ')' : 'transparent';
  });
  $('#head').style.opacity = (.0 + smooth((t - sc.T_EXP + .2) / .5)).toFixed(3);
  // 포인트 카드: 도슨트 i 턴 동안 그 포인트 · 받아치기부터 '기억해 두기'
  var pt = $('#point'), cur = -1;
  cue.utt.forEach(function (u2) { if (u2.role === 'docent' && t >= u2.t0 - .1) cur = +u2.turn.slice(6); });
  var rem = t >= sc.T_RE - .05;
  if (rem) { pt.className = 'point rem'; $('#p-no').textContent = '기억해 두기'; $('#p-t').textContent = ''; $('#p-b').textContent = cue.remember; pt.style.visibility = 'visible'; pt.style.opacity = smooth((t - sc.T_RE) / .4).toFixed(3); }
  else if (sc.cardAt) { var k = -1; sc.cardAt.forEach(function (c, i) { if (t >= c.t0 - .1 && t < c.t1) k = i; });
    if (k < 0) pt.style.visibility = 'hidden';
    else { var ck = sc.cardAt[k], ik = cue.items[k]; pt.className = 'point'; $('#p-no').textContent = ('0' + (k + 1)).slice(-2) + ' / ' + ('0' + cue.items.length).slice(-2);
      $('#p-t').textContent = ik.t; $('#p-b').textContent = ik.b; pt.style.visibility = 'visible';
      // 앞 카드가 끊김 없이 이어지면(같은 턴 안에서 다음 포인트) 0 에서 다시 떠오르지 않고(깜빡임) 0.4 에서 올라오고, 뒤 카드가 바로 이어지면 내려가지 않는다
      var pc = sc.cardAt[k - 1], nc = sc.cardAt[k + 1], joinIn = pc && pc.t1 >= ck.t0 - .01, joinOut = nc && ck.t1 >= nc.t0 - .01;
      var fin = smooth((t - ck.t0 + .1) / .4), fout = joinOut ? 0 : smooth((t - ck.t1 + .3) / .3);
      pt.style.opacity = ((joinIn ? .4 + .6 * fin : fin) * (1 - fout)).toFixed(3); } }
  else if (cur >= 0 && cue.items[cur]) { var it = cue.items[cur], st = U(cue, 'docent' + cur).t0; pt.className = 'point'; $('#p-no').textContent = ('0' + (cur + 1)).slice(-2) + ' / ' + ('0' + cue.items.length).slice(-2);
    $('#p-t').textContent = it.t; $('#p-b').textContent = it.b; pt.style.visibility = 'visible'; pt.style.opacity = smooth((t - st + .1) / .4).toFixed(3); }
  else pt.style.visibility = 'hidden';
}

// 로봇·말풍선 — 3D 와 따로 매 프레임 갱신한다(공연 모드에서는 장면 시각이 멈춰도 말하는 로봇은 까딱여야 한다).
// opt.live: 누가 말하는지는 LiveFollow.speaking() 이 정한다 · opt.qa: 관람객 질문 흐름 — 생성 답의 글은 싣지 않는다(검수 전 글)
function people(sc, t, opt) {
  opt = opt || {}; var cue = sc.cue;
  ['mc', 'docent'].forEach(function (role) {
    var el = $('#b-' + role), last = null, now = null, img = $('#i-' + role);
    if (!opt.qa) cue.utt.forEach(function (u) { if (u.role !== role) return; u.s.forEach(function (s) { if (t >= s.t0 - .1) { last = s; now = t <= u.t1 + .15 ? u : null; } }); });
    var talking = opt.live ? !!(opt.speaking && opt.speaking.role === role) : !!now, bt = opt.live ? performance.now() / 1000 : t;
    img.style.transform = (role === 'docent' ? 'scaleX(-1) ' : '') + (talking ? 'translateY(' + (-5 * Math.abs(Math.sin(bt * 7.5))).toFixed(1) + 'px)' : '');
    if (!last) { el.className = 'bubble'; return; }
    var pr = clamp((t - last.t0) / (last.t1 - last.t0)), n = Math.round(last.x.length * pr);
    el.querySelector('.done').textContent = last.x.slice(0, n); el.querySelector('.rest').textContent = last.x.slice(n);
    el.className = 'bubble on' + (now ? '' : ' fade');
  });
}

// ───────────────────────────────────────────── 크기 맞춤 · 재생
function resize() {
  var fit = $('#fit'), s = Math.min(fit.clientWidth / W, fit.clientHeight / H), st = $('#stage');
  st.style.transform = 'translate(' + (-W * s / 2) + 'px,' + (-H * s / 2) + 'px) scale(' + s + ')';
  // 그리기 버퍼: 화면 픽셀에 맞추되 2배를 넘지 않게(전시장 큰 화면에서 프레임 시간을 지킨다)
  K = clamp(s * (window.devicePixelRatio || 1), .75, 2);
  renderer.setPixelRatio(K); renderer.setSize(W, H, false); ovc.width = Math.round(W * K); ovc.height = Math.round(H * K);
}
// ───────────────────────────────────────────── 장면 시계 — 하나뿐이다
// 미리보기 = 큐 음성의 currentTime. 공연 = 로봇 2대가 실제로 말하고 화면은 LiveFollow.time() 을 따라간다(오디오를 만들지도 틀지도
// 않는다). 공연 모드인지는 모듈이 정한다 — 감독 대시보드가 준 `/stage/exploded` 면 기본이 공연, `?live` 면 file:// 에서도 공연,
// `?preview` 면 미리보기. 장면·말풍선·낱말 시각(wordTime)은 전부 이 시계만 본다 — 발화 표(utt)의 턴 이름·시각 계산이 종이 무대
// 빌더와 같아서 감독의 발화 라벨이 그대로 풀린다. 분해도는 전문가 한 수준뿐이라 감독 수준이 다르면 모듈 배지가 알리는 것으로 충분하다.
var lf = window.LiveFollow ? window.LiveFollow.create({ cues: CUES, level: DATA.level,
  onCue: function (i) { if (i >= 0 && i < CUES.length) { getScene(i); lastKey = ''; } } }) : null;
var LIVE = !!(lf && lf.enabled);
if (!lf && (q.has('live') || location.pathname.indexOf('/stage/') === 0)) {
  console.warn('공연 모드 모듈(LiveFollow)이 이 빌드에 없다 — 대기 화면만 보인다(scripts/handout_live/live_follow.js 를 두고 다시 빌드)');
    var nb = document.createElement('div'); nb.textContent = '공연 모드 모듈 없음 — 다시 빌드해야 로봇 발화를 따라갑니다';
    nb.style.cssText = 'position:absolute;right:16px;bottom:16px;z-index:9;background:#B3261E;color:#fff;font-weight:800;padding:8px 14px;border-radius:10px;font-size:15px';
    document.body.appendChild(nb);
}
var audios = LIVE ? [] : CUES.map(function (c) { var a = new Audio(c.audio); a.preload = 'auto'; return a; });
var frozen = q.get('t') != null ? parseFloat(q.get('t')) : null, cur = 0, lastKey = '', held = {};
function sceneClock() {
  if (LIVE && frozen == null) {
    var ci = lf ? lf.cue() : -1;
    if (ci < 0 || ci >= CUES.length) return { ci: 0, t: 0, live: true, wait: true };     // 아직 모름 — 첫 장의 조립 상태로 기다린다
    var ph = lf.phase(), t = lf.time();
    // 관람객 질문 흐름: 장면을 그 큐의 마지막 대본 시각에 멈춘다(생성 답은 장면 시각이 아니다)
    if (ph === 'qa') t = held[ci] != null ? held[ci] : t; else held[ci] = t;
    return { ci: ci, t: t, live: true, qa: ph === 'qa', speaking: lf.speaking() };
  }
  return { ci: cur, t: frozen != null ? frozen : audios[cur].currentTime };
}
var fmt = function (s) { s = Math.max(0, s); return Math.floor(s / 60) + ':' + ('0' + Math.floor(s % 60)).slice(-2); };
function setCue(i, play) { if (LIVE) return; audios.forEach(function (a) { a.pause(); }); cur = i; audios[i].currentTime = 0; lastKey = ''; paint(); if (play) audios[i].play(); }
function paint() { $('#cues').value = String(cur); $('#scrub').max = CUES[cur].dur; $('#prev').disabled = cur === 0; $('#nextc').disabled = cur === CUES.length - 1; }
CUES.forEach(function (c, i) { var o = document.createElement('option'); o.value = String(i); o.textContent = c.no + ' ' + c.title; $('#cues').appendChild(o); });
if (LIVE) {
  // 공연 모드: 재생·탐색 컨트롤이 없다(큐와 시각은 공연이 정한다). 접속 상태 배지는 LiveFollow 가 직접 그린다
  ['#prev', '#cues', '#nextc', '#play', '#scrub', '#time'].forEach(function (s) { $(s).hidden = true; $(s).style.display = 'none'; });
  $('#start').hidden = true; $('#note').textContent = DATA.level + ' 수준 · 공연 따라가기(소리는 로봇이 낸다)';
  document.documentElement.setAttribute('data-live', '1');
} else {
  audios.forEach(function (a, i) { a.addEventListener('ended', function () { if (i + 1 < CUES.length) setCue(i + 1, true); }); });
  $('#cues').addEventListener('change', function () { $('#start').hidden = true; setCue(+this.value, true); this.blur(); });
  $('#prev').addEventListener('click', function () { if (cur > 0) { $('#start').hidden = true; setCue(cur - 1, true); } });
  $('#nextc').addEventListener('click', function () { if (cur + 1 < CUES.length) { $('#start').hidden = true; setCue(cur + 1, true); } });
  var toggle = function () { $('#start').hidden = true; var a = audios[cur]; if (a.paused) { if (a.ended || a.currentTime >= CUES[cur].dur - .05) a.currentTime = 0; a.play(); } else a.pause(); };
  $('#play').addEventListener('click', toggle);
  $('#startbtn').addEventListener('click', function () { $('#start').hidden = true; setCue(0, true); });
  $('#scrub').addEventListener('input', function () { audios[cur].currentTime = parseFloat(this.value); });
  document.addEventListener('keydown', function (ev) { if (ev.repeat || /^(SELECT|INPUT)$/.test((ev.target || {}).tagName || '')) return;
    if (ev.code === 'Space') { ev.preventDefault(); toggle(); } else if (ev.code === 'ArrowRight' && cur + 1 < CUES.length) setCue(cur + 1, !audios[cur].paused); else if (ev.code === 'ArrowLeft' && cur > 0) setCue(cur - 1, !audios[cur].paused); });
  // 장 번호는 데이터에서 — 빌드 범위가 늘 때마다 틀을 고치지 않게(손으로 적은 '01·02 시안' 이 범위가 늘어도 남아 있었다)
  $('#note').textContent = DATA.level + ' 수준 · 캐시 음성 재활용 · ' + CUES.map(function (c) { return c.no; }).join('·');
}

resize();
var rz = null; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { resize(); lastKey = ''; }, 200); });
if (q.get('check')) { CUES.forEach(function (c, i) { getScene(i); }); document.body.setAttribute('data-warn', JSON.stringify(WARN)); }
if (!LIVE && (frozen != null || q.get('bench'))) { cur = Math.max(0, CUES.map(function (c) { return c.id.slice(0, 2); }).indexOf(q.get('cue') || '01')); $('#start').hidden = true; }
paint();
// 셰이더를 한 번 다 엮어 둔다(첫 재생 프레임이 컴파일을 떠안지 않게) — 장면은 그 장에 들어갈 때 짓되 다음 장은 미리
getScene(cur); draw(cur, frozen != null ? frozen : 0); renderer.compile(scene, camera);
setTimeout(function () { if (cur + 1 < CUES.length) getScene(cur + 1); }, 300);
if (q.get('bench')) {
  // 프레임 시간: 그 장 전체에서 고르게 뽑은 시각을 그리고 1픽셀 읽기로 GPU 가 끝나기를 기다린다(헤드리스·전시장 PC 공통)
  var gl = renderer.getContext(), px = new Uint8Array(4), N = +q.get('bench') > 1 ? +q.get('bench') : 90, ms = [], sc0 = getScene(cur);
  for (var i = 0; i < 6; i++) { draw(cur, i); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
  for (i = 0; i < N; i++) { var tt = CUES[cur].dur * (i + .5) / N, a0 = performance.now(); draw(cur, tt); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); ms.push(performance.now() - a0); }
  ms.sort(function (a, b) { return a - b; });
  document.body.setAttribute('data-bench', JSON.stringify({ cue: CUES[cur].id, n: N, avg: +(ms.reduce(function (a, b) { return a + b; }, 0) / N).toFixed(2), p50: +ms[N >> 1].toFixed(2),
    p95: +ms[Math.floor(N * .95)].toFixed(2), max: +ms[N - 1].toFixed(2), buffer: [glc.width, glc.height], gl: gl.getParameter(gl.RENDERER) }));
}
(function loop() {
  var c = sceneClock(), k = c.ci + ':' + c.t.toFixed(3) + (c.qa ? ':qa' : '');
  if (k !== lastKey) { draw(c.ci, c.t, c); lastKey = k; }
  else if (c.live) people(getScene(c.ci), c.t, c);       // 장면이 멈춰도(질문 흐름) 말하는 로봇은 까딱인다
  if (!LIVE && frozen == null) { $('#scrub').value = c.t; $('#time').textContent = fmt(c.t) + ' / ' + fmt(CUES[cur].dur); $('#play').textContent = audios[cur].paused ? '▶ 재생' : '❚❚ 멈춤'; }
  requestAnimationFrame(loop);
})();
// 종이 무대(window.paperStage)와 같은 모양 — 조율자의 공연 통합 시험이 live·cue()·clock() 을 읽는다
window.explodedStage = { draw: draw, getScene: getScene, setCue: setCue, sceneClock: sceneClock, warn: WARN, live: lf,
  cue: function () { return sceneClock().ci; }, clock: function () { return sceneClock().t; } };
document.documentElement.setAttribute('data-ready', '1');
</script>
