# 16 — 무선국 한 곳을 검사 항목으로(사용자 결정 ㉮). 무선국 = 무선설비 + 그것을 조작하는 사람(전파법 정의, 조사 자료 A) — 무선설비 함(움직이지 않는
# 기준, 위에 안테나) = 기술기준·제45조, 운용자 자리(책상·의자·헤드셋) = 무선종사자 자격·정원 배치기준·제71조, 앞의 검사증명서 판 = 제25조 제1항
# (준공검사를 받은 뒤에 운용). 받침(제24조) 속에 다섯이 숨어 있다가 제 낱말에 빠진다: 1턴 달력 고리(5년 범위의 정기검사 — 다섯 마디) · 배·비행기
# 작은 모형(외국 출항 수시검사), 2턴 판 둘(위임 · 위탁 — 검사 주체가 둘로 갈린다)과 명판(1981년 수탁 · 2011년부터 지금 이름). 2턴 판들은 받침 앞 띠
# (무선국 부품이 없는 자리)에 숨어 있다가 위·바깥으로 오른다 — 위임·위탁 판은 무선국보다 높은 줄로(낮으면 1턴의 달력 고리·운용자 자리와 겹쳤다),
# 명판은 무선국 앞 가운데로. 처음엔 앞으로 내보냈더니 받침 앞에 낮게 내려앉아 서로 겹쳤다. 검사 장비 기종은 그리지 않는다(조사 자료 '확인 불가'). 카드 셋 = 턴 셋
