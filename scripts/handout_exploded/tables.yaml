# 06 — ITU 대역 표를 쌓은 탑(대역 탑). 대역 4(VLF)~11(EHF) 여덟 층이 받침(ITU-R 권고 V.431-8 표) 위에 축을 꿰고 쌓여 있다.
# 높이 = 대역번호(로그 주파수) — 층마다 두께·간격이 같다(대역번호 N 은 0.3×10^N ~ 3×10^N Hz, 대역마다 정확히 10배). 층 반지름은 위로 갈수록
# 곧게 줄고(로그-로그에서 반비례는 곧은 기울기), 층 테두리의 물결은 위로 갈수록 촘촘하다(파장이 짧아진다). 분해는 아코디언 — 위 층이 먼저,
# 아래 층으로 갈수록 덜 올라가 간격이 고르게 벌어지고(시험이 같은 간격을 박는다), 축 속에 접혀 있던 가는 막대(주파수 축)가 위로 뽑혀 나온다.
# 층마다 이름 칸 둘 — 왼쪽 앞(어두운 칸) = 주파수 기준 이름 열, 오른쪽 앞(은색 칸) = 파장 기준 이름 열(표 Table 1 의 두 열). 2턴에서
# 맨 아래 층의 왼쪽 칸(초장파 — 주파수 기준)과 맨 위 층의 오른쪽 칸(밀리미터파 — 파장 기준)이 제 낱말에 서랍처럼 빠지고, "두 계열이" 에서
# 두 칸을 잇는 점선 — 제목 '초장파에서 밀리미터파까지' 가 서로 다른 두 열을 잇는다.
# 전시품(기증품) 목록과 대역별 구성은 조사 자료의 확인 불가 항목이라 기기 모양을 그리지 않는다 — 탑은 대역 표만 말한다.
# 층은 돌지 않는다(spin 0) — 이름 칸이 화면 왼쪽·오른쪽 열에 남아야 한다. 카드 셋(파장과 주파수 · 전파 방식 · V.431-8)은 도슨트 턴 셋과 맞아 cards 를 안 쓴다
