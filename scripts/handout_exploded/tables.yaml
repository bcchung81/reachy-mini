# 분해도 무대 — 큐마다 부품 표 하나(데이터만). 엔진(template.html)은 같고 이 표만 바뀐다.
#
# 한 행 = 부품 하나. 기법은 aimotion 148 「분해도」의 부품 표(MIT © 2026 kstost)에서 가져왔다.
#   shape   scenes.js 의 SHAPES[큐][shape] — 부품 모양(자기 중심이 원점, 긴 축 y)
#   parent  함께 움직이는 부품(비우면 조립체 루트). 자식의 분해 벡터는 부모 좌표계 안이라 부모가 움직이면 같이 실려 나간다
#   rest    조립 상태에서 부모 좌표계 안의 원점
#   dir·dist  부모 좌표계 안의 분해 벡터(dir 은 빌더가 단위 벡터로 맞춘다). dist 0 = 움직이지 않는 기준 부품
#   order   순서 단계(0 = 가장 바깥, 먼저 나가고 마지막에 닫힌다) · delay 같은 단계 안의 미세 지연(초)
#   spin    완전히 분해됐을 때 자기 축을 도는 양(rad) · tilt [비행 중 최대, 휴지] · phi 기울기 축 방향 · over back.out 넘침
#   anchor  [축 위 높이, 반지름] — 설명선 기준점(그 높이의 축 점에서 반지름만큼 라벨 쪽·카메라 쪽으로)
#   side    설명선 열(L 왼쪽 / R 오른쪽) — 화면 위치로 정하지 않아 열이 바뀌며 튀지 않는다
#   label·sub  라벨 글. **그 큐 대사 + 검증된 카드(전문가 수준)의 낱말에서만**(빌더와 ?check=1 이 대조한다)
#              ⚠ 행이 흐름 매핑 {…} 이라 쉼표가 값을 자른다 — 쉼표가 든 글(3,500km)은 반드시 "따옴표" 로 감싼다(모르는 키가 생기면 빌더가 멈춘다)
#   say     도슨트가 이 낱말을 말할 때 이 부품을 강조한다(처음 낱말에서 설명선이 나온다). 도슨트 대사에서만 찾는다
#   leave   이 낱말을 말할 때 따로 떨어져 나간다(없으면 도슨트 0턴 시작에 다 같이 분해)
#   ghost   강조가 끝난 뒤에도 흐리게 남는다(대사가 "아니다" 라고 한 것)
# 큐 단위: view.az [분해 동안 처음, 끝](카메라 방위각, 천천히 돈다) · view.el 앙각 · view.yaw0 처음 들어올 때 조립체가 돌아 있는 양
#          links  두 부품의 점을 잇는 점선(say 낱말부터 그어진다)
#          cards  (선택) 포인트 카드마다 뜨는 도슨트 낱말 — 카드 수와 같게, 말하는 순서대로. 카드는 그 낱말에 뜨고 그 도슨트 턴이 끝나면
#                 내려간다. 없으면 카드 i = 도슨트 i턴(턴 번호와 포인트 번호가 같을 때만 맞다 — docs/lessons.md)

