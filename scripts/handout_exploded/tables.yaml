# 04 — 체험대 한 판 위의 세 장치: 전건(모양만 — 라벨은 대사의 "국제 모스 부호 송신") · 라이덴 병 · 룸코르프 유도코일 + 1미터 쌍극자(02 의 모양).
# 0턴은 세 장치를 한 번씩 부르며 지나가고(1.4초 간격), 1턴은 전건 위로 점·선 판 → 점 타일이 사다리처럼 올라간다(표준화의 경로).
# 2턴 "룸코르프 유도코일의" 에서 코일 단자 → 쌍극자 점선(고전압으로 불꽃 간극을 때렸다). 카드 셋은 도슨트 턴 셋과 맞아 cards 를 안 쓴다.
# 분해는 거의 위로만(옆으로 벌리면 체험대 폭에 맞춰 화면이 작아진다) — 세 장치 층 위에 쌍극자. 납작한 판(전건·점·선 판)은 phi −0.5(카메라 오른쪽 축)로
# 기울여 윗면이 카메라를 보게 한다(안 그러면 앙각 0.32 에서 모서리만 보인다). 병의 설명선 기준점은 꼭지 구 — 몸통 옆이면 지시선이 코일을 가로지른다
