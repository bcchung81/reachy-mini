# 03 — 주파수 다이얼 한 대를 "정의의 층" 으로(카드 그림이 주파수 다이얼이다). 가운데 축(눈금 막대)은 움직이지 않는 기준 부품이다 —
# 대사의 결론("c 는 측정값이 아니라 미터의 정의가 고정한 값")을 "혼자 제자리에 남는 축" 으로 보인다. 축 강조는 카드와 같은 "진공에서" 부터. 물결은 하우징 안에 들어 있다가
# "파장은" 에서 떠오르고(leave), 마루 사이 점선이 한 파장이다. 라벨 낱말은 전문가 대사·카드에서만(전기장·자기장은 대사에 없어 쓰지 않는다)
# ⚠ "299,792,458…" 처럼 쉼표가 든 글은 흐름 매핑·흐름 목록 안에서 반드시 따옴표(lessons — 쉼표가 값을 자른다)
