# 17 — 탐사 로버 한 대(차체 · 마스트 카메라 · 접시 안테나 · 양쪽 바퀴 묶음)를 전시 받침(라벨 없음) 위에서 분해. 받침 속에 두 차가 숨어 있다가
# 2턴에서 제 낱말에 받침 양 끝 위로 올라선다 — 루노호트 1호(원격 조종)는 왼쪽, 아폴로 월면차(승무원이 탑승해 조종 — "구분이 중요")는 오른쪽에
# 서서 흐리게 남는다(ghost — 02 의 1785년 판과 같은 "아니다" 표시). 처음엔 지면판 위에 세워 두었더니(옆 → 화면이 작아짐, 뒤 → 차체에 가려짐)
# 둘 다 안 됐다. 받침의 자식이라 받침이 내려가도 숨은 채 따라간다(14 의 막대와 같은 방식).
# 이 방위(az ≈ 0.5)에서 −x(로버 뒤)는 화면 왼쪽, +z 는 화면 왼쪽 앞이다 — 접시(뒤)는 왼쪽 열, 마스트 카메라(앞)는 오른쪽 열.
