# 18 — 실험 도구 선반 + 테레민 한 대. 0턴은 앞줄 세 도구(고리 · 원뿔 코일 · 화면 상자)를 연도 순으로, 1턴은 테레민 속 — 뚜껑(라벨 없음)이 가장
# 위로, 발진기 둘이 얹힌 판이 상자 밖으로 떠오르고("헤테로다인"), 세운 막대가 올라간다("커패시터 극판"). 볼륨 고리는 상자 모양에 붙여 둔다
# (따로 떼면 왼쪽 앞줄의 고리와 같은 자리에 와 겹쳤다). 발진기 판의 설명선은 왼쪽 열 — 오른쪽이면 같은 높이의 세운 막대를 가로지른다. 점등은 판·화면만, 전파 고리는 **없다** — 이 큐의 '기억해 두기' 가 "안테나는 전파용이
