<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전파체험관 교육자료 — 웹툰 칸</title>
<!--
  웹툰 칸 연출 시안(초등·중고등) — `python -m scripts.handout_webtoon.build` 가 만든 파일이다. 직접 고치지 않는다.
  틀은 `scripts/handout_webtoon/template.html`(엔진) · `scenes.js`(칸 그림) · `storyboard.yaml`(콘티).
  글은 handout-hud 의 검증된 데이터, 음성은 고정 대사 TTS 캐시를 이어 붙인 것.

  표현 기법은 aimotion 157 「칸 너머로 점프」(https://github.com/kstost/cokacmotion, MIT © 2026 kstost)에서 **기술만** 가져왔다:
  스크롤이 곧 시간(정지 위치·최소 저크 이동) · 속도장 위의 읽기 시간 σ(s)=∫ds/v 와 그 역함수 · 여백 = 쉼 · 다각형 clip 칸과 층 시차 y−f·d ·
  칸 깨기(테두리 위 층 + 합집합 clip, 화면 공간 베지어 + 스크롤) · 집중선 · 말풍선 꼬리(타원 매개변수 각) · 스트립 지도 레일.
  장면·소재·색·구도·문구는 이 대본에서 새로 지었다. 데모는 칸에 머무는 시간을 읽을거리에서 정했지만 여기서는 **실제 음성 길이**이고,
  여백 높이는 빌더가 넣은 쉼에 이동이 꼭 맞도록 거꾸로 푼다.

  외부 리소스를 부르지 않는다(전시장은 오프라인). 글자는 캔버스에 그리지 않고 DOM textContent 로만 넣는다.
  그림은 t 의 순수 함수다 — `?lv=초등&cue=02&t=40` 으로 한 순간을 멈춰 볼 수 있다. `?check=1` 은 두 수준 × 모든 큐를 지어 경고를 모은다.
-->
<style>
:root{--ink:#0E2433;--sig:#0B7FB5;--teal:#0A6F84;--amber:#B96F00;--mcbg:#DDF1F5;--docbg:#FFEFD6;--paper:#FBFCFD;--bg:#E4EDF3;--bar:#0E2433;--muted:#52636F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0B1A26;color:var(--ink);overflow:hidden;word-break:keep-all;
  font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.bar{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bar);color:#fff;font-size:14px}
.bar b{font-weight:800;letter-spacing:.02em;white-space:nowrap}
.bar select{background:#1B3A4F;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:5px 12px;min-height:32px;font:inherit;max-width:260px}
.round{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:transparent;padding:0;font-size:17px;line-height:1}
.seg{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 14px;min-height:32px;white-space:nowrap}
.seg button+button{border-left:1px solid rgba(255,255,255,.3)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--bar);font-weight:800}
.pill{border:1px solid rgba(255,255,255,.55);background:transparent;border-radius:999px;padding:5px 14px;min-height:32px;white-space:nowrap}
.pill.go{background:#fff;color:var(--bar);font-weight:800}
#scrub{flex:1;min-width:80px;accent-color:#7FD3F5}
#time{font-variant-numeric:tabular-nums;opacity:.85;white-space:nowrap}
.note{opacity:.7;white-space:nowrap}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7FD3F5;outline-offset:2px}
.fit{position:relative;height:calc(100vh - 48px);overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;background:var(--bg);overflow:hidden}

/* 가운데 스트립 열 — 캔버스(칸 그림·풍선 모양·레일) 위에 DOM(풍선 글·이름표)이 같은 스트립 좌표로 얹힌다 */
.view{position:absolute;left:470px;top:0;width:690px;height:900px;
  -webkit-mask-image:linear-gradient(transparent,#000 34px,#000 866px,transparent);mask-image:linear-gradient(transparent,#000 34px,#000 866px,transparent)}
.view canvas{position:absolute;left:0;top:0;width:690px;height:900px;display:block}
.sroot{position:absolute;left:10px;top:0;width:640px;height:1px;will-change:transform}
.pn{position:absolute;left:0;top:0;width:640px;pointer-events:none}
.pin{position:absolute;left:0;top:0;width:640px;height:100%;transform-origin:0 0}
.lab{position:absolute;left:0;top:0;visibility:hidden;transform-origin:0 0}
.lab>span{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:block;text-align:center;white-space:nowrap;font-weight:800;line-height:1.22}
.lab small{display:block;font-weight:700}
.l-sign>span{background:#fff;border:3px solid var(--ink);border-radius:4px;padding:4px 12px;font-size:21px;color:var(--ink)}
.l-tag>span{background:var(--amber);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 16px;font-size:20px}

.l-fact small{font-size:16px;color:var(--muted);margin-top:3px}
.l-q>span{font-size:96px;color:var(--teal);-webkit-text-stroke:3px var(--ink);line-height:1}
.l-big>span{font-size:42px;color:#F2B64B;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;letter-spacing:.02em}
.l-gut>span{background:#fff;border:3px solid var(--ink);padding:6px 12px;font-size:18px;color:var(--ink);box-shadow:6px 6px 0 #C9D9E4;white-space:normal;width:max-content;max-width:260px}
.bl{position:absolute;left:0;top:0;visibility:hidden;font-size:21px;line-height:1.38;font-weight:700;letter-spacing:-.2px;color:var(--ink);text-align:center;text-wrap:balance}
.bl .rest{opacity:.42}

/* 옆 열 — 왼쪽 사회자(큐·제목·기억해 두기), 오른쪽 도슨트(포인트 카드) */
.cue-tag{position:absolute;left:40px;top:28px;max-width:400px;background:var(--ink);color:#fff;font-weight:800;font-size:19px;padding:7px 16px;border-radius:6px 16px 16px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{position:absolute;right:30px;top:30px;font-size:15px;font-weight:800;color:var(--muted)}
.robot{position:absolute;width:176px;height:176px;margin:-88px 0 0 -88px;border-radius:50%;border:5px solid var(--ink);display:flex;align-items:center;justify-content:center;will-change:transform}
.robot img{width:142px;height:142px;display:block}
.robot.mc{left:240px;top:186px;background:var(--mcbg)}
.robot.doc{left:1375px;top:186px;background:var(--docbg)}
.robot.doc img{transform:scaleX(-1)}
.robot .ring{position:absolute;inset:-14px;border-radius:50%;border:6px solid transparent}
.robot.mc.on .ring{border-color:var(--teal)}
.robot.doc.on .ring{border-color:var(--amber)}
.who{position:absolute;top:286px;transform:translateX(-50%);font-weight:800;font-size:20px;color:#fff;padding:5px 18px;border-radius:999px;border:3px solid var(--ink)}
.who.mc{left:240px;background:var(--teal)}
.who.doc{left:1375px;background:var(--amber)}
.headline{position:absolute;left:44px;top:348px;width:392px;font-size:31px;font-weight:800;line-height:1.32;letter-spacing:-.01em;visibility:hidden}
.headline:before{content:"";display:block;width:56px;height:6px;border-radius:3px;background:var(--sig);margin-bottom:14px}
.remember{position:absolute;left:40px;bottom:40px;width:400px;background:#fff;border:4px solid var(--ink);border-radius:8px;padding:14px 18px 16px;
  box-shadow:7px 8px 0 var(--amber);visibility:hidden}
.remember b{display:inline-block;background:var(--amber);color:#fff;font-size:17px;padding:3px 12px;border-radius:999px;margin-bottom:8px}
.remember p{margin:0;font-size:22px;font-weight:800;line-height:1.4}
.cards{position:absolute;left:1180px;top:338px;width:392px}
.card{background:#fff;border:3px solid var(--ink);border-radius:8px;padding:12px 16px 13px;margin-bottom:14px;visibility:hidden;box-shadow:5px 6px 0 rgba(14,36,51,.16)}
.card.on{border-color:var(--amber);box-shadow:6px 7px 0 var(--amber)}
.card h3{margin:0 0 5px;font-size:21px;font-weight:800;line-height:1.3}
.card h3 i{font-style:normal;color:var(--amber);margin-right:10px}
.card p{margin:0;font-size:17px;font-weight:600;line-height:1.45;color:#33454f}
.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,20,30,.55);z-index:5}
.start button{font-size:30px;font-weight:800;padding:22px 44px;border:4px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);box-shadow:8px 9px 0 var(--amber)}
.start small{display:block;font-size:16px;font-weight:600;margin-top:6px;color:var(--muted)}
.start[hidden]{display:none}
</style>

<body>
<header class="bar">
  <b>웹툰 칸 시안</b>
  <div class="seg" id="lvseg" role="group" aria-label="수준 고르기"></div>
  <button type="button" class="round" id="prev" aria-label="이전 장">‹</button>
  <select id="cues" aria-label="장 고르기"></select>
  <button type="button" class="round" id="nextc" aria-label="다음 장">›</button>
  <button type="button" class="pill go" id="play">▶ 재생</button>
  <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="재생 위치">
  <span id="time">0:00 / 0:00</span>
  <span class="note" id="note"></span>
</header>
<div class="fit" id="fit">
  <div class="stage" id="stage">
    <div class="cue-tag" id="cuetag"></div>
    <div class="robot mc" id="rb-mc"><span class="ring"></span><img alt="사회자 로봇" src="__ICON__"></div>
    <div class="who mc">사회자</div>
    <div class="headline" id="headline"></div>
    <div class="remember" id="remember"><b>기억해 두기</b><p id="remtext"></p></div>
    <div class="robot doc" id="rb-doc"><span class="ring"></span><img alt="도슨트 로봇" src="__ICON__"></div>
    <div class="who doc">도슨트</div>
    <div class="cards" id="cards"></div>
    <div class="view" id="view"><canvas id="cv" width="690" height="900"></canvas></div>
  </div>
  <div class="start" id="start"><button type="button" id="startbtn">▶ 공연 시작<small id="startsub">로봇 목소리가 나와요</small></button></div>
</div>
<script type="application/json" id="data">__DATA__</script>
<script>
/*__LIVE__*/
</script>
<script>
(async function () {
  'use strict';
  const DATA = JSON.parse(document.getElementById('data').textContent), LEVELS = DATA.levels;
  // ── 무대 치수(무대 1600×900 의 px). 스트립 좌표: x 0..640(열 안), y 아래로. 화면 y = 스트립 y − s(t)
  const W = 1600, H = 900, VW = 690, VH = 900, SX = 10, SW = 640, XL = 22, XR = 618, SIL = [140, 500];
  const ANCHOR = 450;                       // 눈이 쉬는 화면 y — 칸의 가운데를 여기에 데려와 멈춘다
  // 속도장(데모의 V_PAGE 2600 / V_GUTTER 520 / EDGE 420 은 1920 높이 무대 값 — 900 높이 열에 맞춰 줄였다)
  const V_PAGE = 1500, V_GUTTER = 300, EDGE = 200, MOVE0 = 0.3, GMIN = 26, GMAX = 1600;
  const SL_T = 34, SL_B = 110;              // 기울어진 칸: 위 변은 오른쪽이 34 낮고, 아래 변은 오른쪽이 110 낮다(데모와 반대로 기울임)
  const ART_H = { wide: 290, normal: 250, slant: 286, free: 330 };
  const TAU = Math.PI * 2, DEG = Math.PI / 180;
  const COL = { ink: '#0E2433', ink2: '#1B3A4F', sig: '#0B7FB5', sig2: '#59AED6', sig3: '#C4E3F2', teal: '#0A6F84', teal2: '#57B5C3', teal3: '#CDEBEF',
    amber: '#B96F00', amber2: '#EBA53A', amber3: '#FBE2B5', mcbg: '#DDF1F5', docbg: '#FFEFD6', paper: '#FBFCFD', sky: '#E2F0F7', sky2: '#C6E2F0',
    land: '#B9D3A6', land2: '#8DB27F', sea: '#8CC8E2', sea2: '#4F9EC4', cream: '#FFF9EC', skin: '#F2D3B1', hair: '#3B2A22', red: '#D0573A',
    grey: '#9FB0BB', grey2: '#D8E2E9', white: '#FFFFFF', night: '#132C40', shade: '#D3DEE6' };
  const $ = (s) => document.querySelector(s);
  const cv = $('#cv'), ctx = cv.getContext('2d'), view = $('#view');
  let K = 1, STAGE_SC = 1;

  // ───────────────────────────────────────────── 작은 도구(결정적 — 난수는 시드 rand 만, 시계는 장면 시각 t 만)
  function rand(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (v) => { v = clamp(v); return v * v * (3 - 2 * v); };
  const MJ = (u) => { u = clamp(u); return u * u * u * (10 + u * (-15 + 6 * u)); };          // 최소 저크
  const outCubic = (u) => { u = clamp(u); return 1 - (1 - u) ** 3; };
  const outBack = (u, k = 1.7) => { u = clamp(u) - 1; return 1 + (k + 1) * u * u * u + k * u * u; };
  const pop = (t, t0, d = 0.32, k = 2.2) => (t < t0 ? 0 : outBack((t - t0) / d, k));
  function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
  function path(c, P) { c.beginPath(); c.moveTo(P[0][0], P[0][1]); for (let i = 1; i < P.length; i++) c.lineTo(P[i][0], P[i][1]); c.closePath(); }
  function pathAdd(c, P) { c.moveTo(P[0][0], P[0][1]); for (let i = 1; i < P.length; i++) c.lineTo(P[i][0], P[i][1]); c.closePath(); }
  const rectPoly = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  function bbox(P) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const p of P) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); } return { x0, y0, x1, y1 }; }
  const bez = (a, b, c, d, u) => { const v = 1 - u; return v * v * v * a + 3 * v * v * u * b + 3 * v * u * u * c + u * u * u * d; };
  const WARN = [], ISSUES = [];
  const warn = (m) => { if (WARN.indexOf(m) < 0) WARN.push(m); console.warn(m); };
  const issue = (m) => { if (ISSUES.indexOf(m) < 0) ISSUES.push(m); };

  // 로봇 아이콘(칸 안 그림에도 쓴다)
  const iconImg = new Image(); iconImg.src = $('#rb-mc img').src; await iconImg.decode();
  const iconFlip = mk(160, 160); { const c = iconFlip.getContext('2d'); c.translate(160, 0); c.scale(-1, 1); c.drawImage(iconImg, 0, 0); }

/*__SCENES__*/

  // ───────────────────────────────────────────── 속도장: 읽는 선이 칸 그림 위면 빠르게, 빈 여백 위면 느리게
  // (aimotion 157 strip.js:52·58 의 식 — MIT © 2026 kstost. 여백 소속도 g 를 양 끝 smoothstep 두 개의 곱으로)
  function gutterG(gs, y) { let g = 0; for (const G of gs) g = Math.max(g, smooth((y - G.y0 + EDGE / 2) / EDGE) * smooth((G.y1 - y + EDGE / 2) / EDGE)); return g; }
  const pace = (gs, y) => V_PAGE + (V_GUTTER - V_PAGE) * gutterG(gs, y);

  // ───────────────────────────────────────────── 칸 기하
  function geom(pn) {
    const y0 = pn.y0, h = pn.h;
    pn.poly = pn.kind === 'slant' ? [[XL, y0], [XR, y0 + SL_T], [XR, y0 + h + SL_B], [XL, y0 + h]]
      : pn.kind === 'silent' ? rectPoly(SIL[0], y0, SIL[1], y0 + h)
      : pn.kind === 'free' ? rectPoly(0, y0, SW, y0 + h) : rectPoly(XL, y0, XR, y0 + h);
    const P = pn.poly; pn.bb = bbox(P);
    pn.topMean = (P[0][1] + P[1][1]) / 2; pn.botMean = (P[2][1] + P[3][1]) / 2; pn.botMax = Math.max(P[2][1], P[3][1]);
    pn.focus = (pn.bb.y0 + pn.bb.y1) / 2;
  }

  // ───────────────────────────────────────────── 장면 짓기 — 칸 재기 → 여백 풀기 → σ 표 → 그림 굽기 → DOM
  function Scene(li, ci) {
    const lv = LEVELS[li], cue = lv.cues[ci];
    const sc = { li, ci, level: lv.name, cue, items: cue.items, visual: cue.visual, panels: [], balloons: [], labels: [], COL, iconImg, iconFlip };
    const said = cue.utt.map((u) => u.s.map((s) => s.x).join(' ')).join(' ');
    sc.has = (kw) => said.indexOf(kw) >= 0;
    /** 이름표 글이 그 큐 대사에 실제로 나온 낱말인지 — 아니면 경고(검증된 카드 글은 이걸 거치지 않고 그대로 쓴다) */
    sc.word = (kw) => { if (!sc.has(kw)) warn('[' + lv.name + ' ' + cue.id + '] 대사에 없는 낱말: ' + kw); return kw; };
    /** 큐 대사에서 kw 가 from 이후 처음 나오는 때(글자 위치 비례 — 캐시 음성에는 낱말 시각이 없다). 없으면 경고 */
    sc.w = (kw, from = 0) => {
      for (const u of cue.utt) for (const s of u.s) { const k = s.x.indexOf(kw); if (k < 0) continue; const t = s.t0 + (s.t1 - s.t0) * k / s.x.length - 0.12; if (t >= from - 0.01) return Math.max(0, t); }
      warn('[' + lv.name + ' ' + cue.id + '] 대사에 없는 낱말: ' + kw); return from;
    };
    sc.U = (turn) => cue.utt.find((u) => u.turn === turn);
    return sc;
  }

  const scenes = {};
  function getScene(li, ci) { const k = li + ':' + ci; if (!scenes[k]) scenes[k] = build(li, ci); return scenes[k]; }

  function build(li, ci) {
    const sc = Scene(li, ci), cue = sc.cue;
    const root = document.createElement('div'); root.className = 'sroot'; root.style.visibility = 'hidden'; view.appendChild(root); sc.root = root;
    // 1) 칸마다 말풍선을 재고 높이를 정한다
    cue.panels.forEach((p, i) => {
      const pn = Object.assign({ i }, p); sc.panels.push(pn);
      pn.bls = [];
      if (pn.kind === 'silent') { pn.h = 300; return; }
      const u = sc.U(pn.u), band = pn.kind === 'band', maxW = band ? 300 : 360;
      u.s.slice(pn.a, pn.b).forEach((s, j) => {
        const el = document.createElement('div'); el.className = 'bl';
        const done = document.createElement('span'), rest = document.createElement('span'); rest.className = 'rest'; rest.textContent = s.x;
        el.appendChild(done); el.appendChild(rest); el.style.maxWidth = maxW + 'px'; root.appendChild(el);

    lv.cues.forEach((c, i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = c.no + ' ' + c.title; $('#cues').appendChild(o); });
    $('#cues').value = String(CI); $('#scrub').max = lv.cues[CI].dur;
    $('#prev').disabled = CI === 0; $('#nextc').disabled = CI === lv.cues.length - 1;
    [...$('#lvseg').children].forEach((b, i) => b.setAttribute('aria-pressed', String(i === LI)));
    $('#note').textContent = LIVE ? lv.name + ' · 공연 따라가기' + (liveMiss ? ' — 공연 모듈 없음(다시 빌드)' : '') : lv.name + ' · 캐시 음성(' + DATA.cache + ')';
    $('#startsub').textContent = lv.name + ' · 로봇 목소리가 나와요';
  }
  LEVELS.forEach((l, i) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = l.name;
    b.addEventListener('click', () => {
      manualLevel = true;                                  // 직접 고름 — 이제 감독 수준이 바뀌어도 이 수준을 지킨다
      if (LIVE) { setLevelLive(i); return; }
      const a = audio(LI, CI), playing = a && !a.paused; $('#start').hidden = true; setCue(i, Math.min(CI, l.cues.length - 1), playing); }); $('#lvseg').appendChild(b); });
  $('#cues').addEventListener('change', function () { $('#start').hidden = true; setCue(LI, +this.value, true); this.blur(); });
  $('#prev').addEventListener('click', () => { if (CI > 0) { $('#start').hidden = true; setCue(LI, CI - 1, true); } });
  $('#nextc').addEventListener('click', () => { if (CI + 1 < LEVELS[LI].cues.length) { $('#start').hidden = true; setCue(LI, CI + 1, true); } });
  function toggle() { const a = audio(LI, CI); if (!a) return; $('#start').hidden = true; if (a.paused) { if (a.ended || a.currentTime >= LEVELS[LI].cues[CI].dur - 0.05) a.currentTime = 0; a.play(); } else a.pause(); }
  $('#play').addEventListener('click', toggle);
  $('#startbtn').addEventListener('click', () => { $('#start').hidden = true; setCue(LI, CI, true); });
  $('#scrub').addEventListener('input', function () { const a = audio(LI, CI); if (a) a.currentTime = parseFloat(this.value); });
  document.addEventListener('keydown', (ev) => { if (LIVE || /^(SELECT|INPUT)$/.test((ev.target || {}).tagName || '')) return;
    const a = audio(LI, CI);
    if (ev.key === ' ') { ev.preventDefault(); toggle(); }
    else if (ev.key === 'ArrowRight' && CI + 1 < LEVELS[LI].cues.length) setCue(LI, CI + 1, !a.paused);
    else if (ev.key === 'ArrowLeft' && CI > 0) setCue(LI, CI - 1, !a.paused); });
  const fmt = (s) => { s = Math.max(0, s); return Math.floor(s / 60) + ':' + ('0' + Math.floor(s % 60)).slice(-2); };
  if (LIVE) {                                              // 공연 모드: 재생·탐색 컨트롤을 숨긴다(무대가 진행한다)
    for (const id of ['#prev', '#cues', '#nextc', '#play', '#scrub', '#time']) { $(id).hidden = true; $(id).style.display = 'none'; }
    $('#start').hidden = true;
    for (const el of [document.documentElement, document.body]) el.setAttribute('data-live', liveMiss ? 'missing' : '1');
  }

  fitStage();
  // `?check=1` — 두 수준 × 모든 큐를 지어 '대사에 없는 낱말'·초등 숫자 경고를 body[data-warn], 배치 문제를 body[data-issues] 에 적는다
  if (q.get('check')) {
    LEVELS.forEach((l, li) => l.cues.forEach((c, ci) => getScene(li, ci)));
    document.body.setAttribute('data-warn', JSON.stringify(WARN));
    document.body.setAttribute('data-issues', JSON.stringify(ISSUES));
    document.body.setAttribute('data-gaps', JSON.stringify(Object.values(scenes).map((sc) => ({ lv: sc.level, cue: sc.cue.id,
      gaps: sc.panels.slice(0, -1).map((p, i) => ({ want: +p.want.toFixed(2), G: Math.round(p.gap), m: +sc.moves[i].m.toFixed(2), early: +sc.moves[i].early.toFixed(2) })) }))));
  }
  if (frozen != null) $('#start').hidden = true;
  if (LIVE && lf && lf.cue() >= 0) CI = lf.cue();
  setCue(LI, CI, false);
  let rz = null;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { fitStage(); rebakeAll(); last = -1; }, 250); });
  let last = -1;
  (function loop() {
    const t = clock();
    if (t !== last || frozen == null) {
      const sc = shown, fr = draw(sc, t); dom(sc, t, fr); sideDom(sc, t, lf ? lf.speaking() : undefined); last = t;
    }
    if (frozen == null && !LIVE) { const a = audio(LI, CI); $('#scrub').value = t; $('#time').textContent = fmt(t) + ' / ' + fmt(LEVELS[LI].cues[CI].dur); $('#play').textContent = a.paused ? '▶ 재생' : '❚❚ 멈춤'; }
    requestAnimationFrame(loop);
  })();
  window.webtoon = { getScene, scrollAt, draw, scenes };
  // 종이 무대(window.paperStage)와 같은 모양 — 조율자의 통합 테스트가 읽는다
  window.webtoonStage = { live: lf || { enabled: false }, cue: () => CI, clock, level: () => LEVELS[LI].name,
    audios: () => Object.keys(audios).length, getScene, draw, setCue };
  document.documentElement.setAttribute('data-ready', '1');
})();
</script>
</body>
</html>
