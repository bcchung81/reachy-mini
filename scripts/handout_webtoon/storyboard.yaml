# 웹툰 칸 콘티 — 큐 × 수준마다 칸 목록. 빌더(build.py)가 읽는다.
#
#   u     : 어느 발화의 문장인가 — open / ask{i} / docent{i} / after (빌더가 큐시트에서 만드는 발화 이름)
#   n     : 그 발화의 문장 몇 개를 이 칸에 담나. 빌더가 발화마다 앞에서부터 차례로 소비하고, 남거나 모자라면 멈춘다
#           (대본이 바뀌어 캐시 문장 수가 달라지면 여기서 걸린다 — 조용히 문장이 빠진 칸을 만들지 않는다)
#   kind  : 칸 모양 = 대화 구조. wide(오프닝 설정 칸) · band(사회자 질문 가로 띠) · normal · slant(도슨트 핵심, 기울어진 칸)
#           · silent(말 없는 작은 칸 — '기억해 두기' 직전, u 없음) · free(마지막, 테두리 없는 칸)
#   art   : scenes.js 의 ART[이름] — 칸 그림. 이름표 글은 그 수준의 카드(items·visual)나 대사 낱말에서만 나온다
#   brk   : 이 칸에서 시작해 테두리를 깨고 다음 칸(침묵 칸)으로 건너가는 물체 — 큐마다 한 번
#   v     : 그림 변형 번호(같은 그림 함수의 다른 소품)
#   item  : 이 칸 이름표에 쓰는 카드 포인트 번호(0부터)
#   card  : 오른쪽 카드 i 를 이 칸이 시작될 때 놓는다(없으면 item 칸, 그것도 없으면 도슨트 i턴 시작) — 턴 번호와 포인트 번호는 같지 않다
#
# 칸 사이 쉼(= 여백 높이)은 경계 종류로 정해진다(build.py PAUSE): 같은 발화 안 < 질문→답 < 답→다음 질문 < 침묵 칸 앞.

