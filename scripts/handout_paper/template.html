<title>전파체험관 교육자료 — 종이 무대</title>
<!--
  종이 무대(스톱모션) 시안 — `python -m scripts.handout_paper.build` 가 만든 파일이다. 직접 고치지 않는다.
  틀은 `scripts/handout_paper/template.html`(엔진)과 `scenes.js`(큐별 장면). 글은 handout-hud 의 검증된 데이터, 음성은 고정 대사 TTS 캐시를 이어 붙인 것.

  표현 기법은 aimotion 24 「종이 인형 극장」(https://github.com/kstost/cokacmotion, MIT © 2026 kstost)에서 **기술만** 가져왔다:
  가위 날 윤곽(cutOutline) · 잘린 단면의 흰 심(inset) · 종이결 타일 overlay · 높이에서 나오는 그림자 · 초당 12포즈 ·
  (조각, 포즈) 시드 손 오차 · 교체 애니메이션 · 다면 무대 시차 · 포즈별 노출. 장면·소재·색·구도는 이 대본에서 새로 지었다.

  외부 리소스를 부르지 않는다(전시장은 오프라인). 글자는 캔버스에 그리지 않고 DOM textContent 로만 넣는다.
  그림은 포즈 번호 step = floor(t·12) 의 순수 함수다 — `?cue=02&t=40` 으로 한 순간을 멈춰 볼 수 있다.
-->
<style>

  $('#cues').addEventListener('change', function () { $('#start').hidden = true; setCue(+this.value, true); this.blur(); });

  $('#nextc').addEventListener('click', function () { if (cur + 1 < CUES.length) { $('#start').hidden = true; setCue(cur + 1, true); } });
  function toggle() { $('#start').hidden = true; var a = audios[cur]; if (a.paused) { if (a.ended || a.currentTime >= CUES[cur].dur - .05) a.currentTime = 0; a.play(); } else a.pause(); }
  $('#play').addEventListener('click', toggle);
  $('#startbtn').addEventListener('click', function () { $('#start').hidden = true; setCue(0, true); });
  $('#scrub').addEventListener('input', function () { audios[cur].currentTime = parseFloat(this.value); });
  document.addEventListener('keydown', function (ev) { if (/^(SELECT|INPUT)$/.test((ev.target || {}).tagName || '')) return; if (ev.key === ' ') { ev.preventDefault(); toggle(); } else if (ev.key === 'ArrowRight' && cur + 1 < CUES.length) setCue(cur + 1, !audios[cur].paused); else if (ev.key === 'ArrowLeft' && cur > 0) setCue(cur - 1, !audios[cur].paused); });
  $('#note').textContent = DATA.level + ' 수준 · ' + (LF.enabled ? '공연 따라가기(소리는 로봇이 낸다)' : '미리보기 — 캐시 음성 재생');
  if (LF.enabled) {
    // 재생·탐색은 공연이 정한다 — 운영자가 눌러 화면만 어긋나게 만들지 않도록 숨긴다.
    ['#prev', '#nextc', '#play', '#scrub', '#time', '#cues'].forEach(function (s) { $(s).hidden = true; });
    $('#start').hidden = true;
    document.documentElement.setAttribute('data-live', '1');
  }

  bakeAll();
  // `?check=1` — 19장을 모두 지어 보고 '대사에 없는 낱말' 경고를 body[data-warn] 에 적는다(헤드리스 점검용)
  if (q.get('check')) { CUES.forEach(function (c, i) { getScene(i); }); document.body.setAttribute('data-warn', JSON.stringify(WARN)); }
  if (frozen != null) { cur = Math.max(0, CUES.map(function (c) { return c.id.slice(0, 2); }).indexOf(q.get('cue') || '01')); $('#start').hidden = true; }
  paint();
  var rz = null; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { shownScene = -1; bakeAll(); lastKey = ''; }, 250); });
  (function loop() {
    var t = frozen != null ? frozen : clock(), key = cur + ':' + Math.floor(t * STEP + 1e-6);
    if (key !== lastKey) { draw(cur, t); lastKey = key; }
    bubbles(CUES[cur], t);
    if (frozen == null && !LF.enabled) { $('#scrub').value = t; $('#time').textContent = fmt(t) + ' / ' + fmt(CUES[cur].dur); $('#play').textContent = audios[cur].paused ? '▶ 재생' : '❚❚ 멈춤'; }
    requestAnimationFrame(loop);
  })();
  window.paperStage = { draw: draw, getScene: getScene, setCue: setCue, live: LF, cue: function () { return cur; }, clock: clock };
  document.documentElement.setAttribute('data-ready', '1');
})();
</script>
