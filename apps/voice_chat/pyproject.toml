[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "voice_chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    # 아래는 앱이 실제로 import 하는데 선언이 빠져 있던 것들이다.
    # 시뮬에서는 .venv 에 이미 깔려 있어 드러나지 않았고, 로봇에 설치하면
    # `import numpy` 부터 깨진다.
    "numpy",           # audio_in.py, stt.py, tts.py
    "requests",        # llm.py, stt.py — 추론 서버 호출
    "sounddevice",     # tts.py — 상주 오디오 출력 스트림
    "PyGObject",       # audio_in.py — GStreamer 마이크 캡처(gi)
]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
voice_chat = "voice_chat.main:VoiceChat"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
voice_chat = ["**/*"] # Also include all non-.py files