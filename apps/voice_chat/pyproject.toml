[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "voice_chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    # 아래는 앱이 실제로 import 하는데 선언이 빠져 있던 것들이다.
    # 시뮬에서는 .venv 에 이미 깔려 있어 드러나지 않았고, 로봇에 설치하면
    # `import numpy` 부터 깨진다.
    "numpy",           # audio_in.py, stt.py, tts.py
    "requests",        # llm.py, stt.py — 추론 서버 호출
    "sounddevice",     # tts.py — 상주 오디오 출력 스트림
    # stage_client.py 가 무대감독에 붙는 데 쓴다. reachy-mini 가 이미
    # `websockets<16,>=12` 로 끌어오지만, **우리가 직접 import 하는 것은
    # 우리가 선언한다** — 선언 누락은 이 저장소가 이미 밟은 지뢰다
    # (docs/real-robot-deployment.md §3).
    # **하한은 13 이다.** `stage_client.run()` 이 `ws.recv(timeout=...)` 을 쓰는데
    # sync API 의 recv 타임아웃은 13.0 에서 들어왔다. 12 를 허용하면 로봇에서
    # TypeError 로 죽거나(인자를 모른다) 타임아웃 없이 영원히 블록된다 —
    # 감독이 조용한 구간에서 should_stop 을 다시 못 본다(stage_client.py POLL_S 주석).
    "websockets>=13,<16",
    # audio_in.py·tts.py 가 `gi`(GStreamer)를 쓴다. **공급자가 플랫폼마다 다르다** —
    # reachy-mini 자신이 이렇게 갈라 둔다:
    #     PyGObject<=3.46.0,>=3.42.2 ; sys_platform == "linux"
    #     gstreamer-bundle==1.28.3   ; sys_platform != "linux"
    # 그래서 여기서도 Linux 에서만 선언한다. 조건 없이 "PyGObject" 로 두면
    # macOS/Windows(Lite 구성 — 데몬·앱이 PC 에서 돈다)에서 pip 가 소스 빌드로
    # 들어가 깨지고, 상한이 없어 3.46 초과가 잡히면 SDK 핀과 충돌한다.
    # 비-Linux 의 `gi` 는 reachy-mini 가 끌어오는 gstreamer-bundle 이 공급하므로
    # 우리가 다시 선언하지 않는다(SDK 가 정확 핀이라 재선언이 충돌만 만든다).
    "PyGObject>=3.42.2,<=3.46.0; sys_platform == 'linux'",
]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
voice_chat = "voice_chat.main:VoiceChat"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
voice_chat = ["**/*"] # Also include all non-.py files