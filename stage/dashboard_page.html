<!doctype html>
<!--
  무대감독 조정실 — 시안 B(docs/design/dashboard-B.dc.html)를 오프라인 한 장으로.

  시연장은 인터넷이 없다: 이 파일은 외부 폰트·스크립트·이미지를 하나도 부르지
  않는다(정적 테스트가 확인한다). 서버 문자열(관람객 STT, 경고, 대사)은 전부
  textContent 로만 DOM 에 넣는다 — HTML 을 그대로 심는 DOM API 는 쓰지 않는다
  (정적 테스트가 확인한다). 서버는 stage/dashboard.py 다(소켓·발행은
  stage/server.py, stage/dashboard_hub.py) — 메시지 형식은 스펙 표
  (docs/superpowers/specs/2026-09-21-stage-dashboard-design.md 51-61행)를 그대로 따른다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무대감독 조정실</title>
<style>
  /* 폰트는 시스템 스택뿐이다 — 하나도 내려받지 않는다. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0D1014;
    color: #E8EAED;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    /* 높이를 창에 **고정**한다(min-height 가 아니다). min-height 면 로그·런다운이 길어질수록
       페이지가 따라 늘어나 로그 끝이 창 밖으로 밀려나고, 운영자가 최신 경고를 보려면 페이지를
       스크롤해야 했다. 고정해 두면 늘어나는 것은 각 목록 **안쪽** 스크롤뿐이다.
       창이 아주 낮으면(.lower 하한 밑) 그때만 페이지가 스크롤된다. */
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
  }
  button { font-family: inherit; cursor: pointer; }
  /* 단독 모드에서 잠기는 버튼들(진행 제어·확인 바·런다운 행) 공통 시각 표시.
     `disabled` 하나로 클릭도 막히고(브라우저 기본) 눈에도 "지금 못 누른다"가 보여야
     한다 — 안 그러면 운영자가 왜 안 먹히는지 화면만 봐서는 모른다. */
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .mono, .cue-label, .cue-topic, .cue-num, .cue-tag, .log-time, .log-text,
  kbd, .cam-label, .mic, .auto-head span {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  header {
    flex: 0 0 56px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #242B35;
    gap: 16px;
    overflow: hidden;
  }
  header .left { display: flex; align-items: center; gap: 16px; min-width: 0; }
  header .right { display: flex; align-items: center; gap: 18px; font-size: 13px; color: #9AA3AE; flex: 0 0 auto; }
  .app-title { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
  /* 헤더 오른쪽 묶음(수준 버튼+대기 문구+연결 배지)이 약 500px 로 늘어나면, flex item
     기본 최소폭(nowrap 텍스트는 줄어들지 않는다)에 걸려 이 라벨이 "관람객 수준" 캡션
     위로 겹쳤다(1024px 실측, 수준 리뷰 Minor 2). min-width:0 으로 줄어들 수 있게 하고
     넘치면 말줄임한다 — white-space:nowrap 은 그대로 둔다(말줄임은 한 줄 전제). */
  .cue-label { font-size: 13px; color: #9AA3AE; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .cue-topic {
    font-size: 12px; color: #6B7684; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 320px;
  }
  /* 운영 모드 토글(팟캐스트/단독) — 제목 바로 옆(헤더 왼쪽)에 둔다. 전환이 발화를
     멈추는 무거운 조작이라 오른쪽의 관람객 수준 버튼(가벼운 조작, 다음 큐부터 적용)과
     헷갈리지 않게 자리를 뗀다. 레벨 버튼과 같은 배지 크기로 헤더 56px 를 넘지 않는다. */
  .mode-group { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  /* [hidden] 만으로는 위 flex 규칙에 밀린다 — .level-pending-text[hidden] 과 같은 이유로
     명시한다. hello.modes 가 없는 구버전 서버에서는 이 컨테이너 자체를 숨긴다. */
  .mode-group[hidden] { display: none; }
  .mode-btn {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    border: 1px solid #3A4350; background: #1C222B; color: #9AA3AE; line-height: 1.3;
  }
  .mode-btn.applied { background: #4CC3D9; border-color: #4CC3D9; color: #05070A; }
  .mode-note { font-size: 11px; color: #F0A64A; white-space: nowrap; flex: 0 0 auto; }
  .mode-note[hidden] { display: none; }

  .level-group { display: flex; align-items: center; gap: 6px; }
  /* #level 은 버튼 4개의 컨테이너다(구버전 서버 폴백일 때만 평문 이름 하나). 헤더가
     56px 로 고정이라 버튼은 배지 크기(11px/패딩 3~9px)로 작게 잡는다 — 그래도 1280px
     폭에서 cue-topic(가변폭, 넘치면 말줄임) 옆에 들어간다. */
  #level { color: #E8EAED; display: inline-flex; align-items: center; gap: 4px; }
  .level-btn {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    border: 1px solid #3A4350; background: #1C222B; color: #9AA3AE; line-height: 1.3;
  }
  /* 적용된 수준 = 채워진 색(계약: filled/primary). 대기 중인 수준 = 테두리 강조만
     (계약: outlined/highlight) — 둘 다 켜질 일은 없지만(적용=대기 취소 규칙, 감독
     쪽에서 보장) 클래스는 독립이라 겹쳐도 스타일이 깨지지 않는다. */
  .level-btn.applied { background: #4CC3D9; border-color: #4CC3D9; color: #05070A; }
  .level-btn.pending { background: transparent; border-color: #4CC3D9; color: #4CC3D9; }
  .level-pending-text { font-size: 11px; color: #4CC3D9; white-space: nowrap; }
  /* [hidden] 속성만으로는 다른 display 규칙에 밀릴 수 있다 — .goto-bar[hidden] 과 같은
     이유로 명시한다. */
  .level-pending-text[hidden] { display: none; }

  .conn {
    font-size: 12px; font-weight: 600; color: #fff; background: #3A4350;
    padding: 4px 10px; border-radius: 4px; white-space: nowrap;
  }
  .conn.connected { background: #2B6E39; }
  .conn.disconnected { background: #E5484D; }

  /* 단독 모드 안내 배너 — 헤더 "안"이 아니라 헤더 바로 아래 별도 줄에 둔다(헤더는
     56px 고정을 지켜야 하므로 안에 넣으면 그 제약이 깨진다). 팟캐스트에서는 항상
     [hidden] 이라 레이아웃에 아무 영향이 없고, 단독일 때만 나타나 그만큼을
     `.lower`(flex:1 1 auto)가 줄어들며 나눠 가진다 — 페이지 스크롤은 생기지 않는다. */
  .solo-banner {
    flex: 0 0 auto; padding: 8px 24px; background: #10262B; color: #8FDCEA;
    font-size: 13px; font-weight: 700; border-bottom: 1px solid #1D3A40;
  }
  .solo-banner[hidden] { display: none; }

  /* 예전에는 `.monitors` 가 최상단 폭 전체를 쓰는 독립 줄이었다(자체 좌우 padding).
     지금은 `.right-col` 안에 있어 그 부모(`.stage-grid`)의 padding 을 그대로 쓴다 —
     여기서 또 주면 이중으로 좁아진다. */
  .monitors { flex: 0 0 auto; display: flex; gap: 24px; flex-wrap: wrap; }
  /* min-width 를 420→300 으로 낮췄다 — 왼쪽 열(300px 고정)이 새로 생겨, 태블릿
     가로(1024px, 페이지 여백 48 + 두 열 사이 간격 24 뺀 나머지)에서도 두 카메라가
     한 줄에 남으려면 이만큼 줄여야 한다(§1024px 테스트가 계산을 고정한다). */
  .monitor-col { flex: 1 1 360px; min-width: 300px; display: flex; flex-direction: column; }
  .cam {
    /* 창 높이에 비례(최대 320px). 고정 320px 이면 720px 창에서 모니터만 460px 을 먹어
       하단(런다운·제어·로그)이 창 밖으로 밀리고 페이지 스크롤이 생겼다 — 운영자 화면은
       스크롤 없이 한눈에 들어와야 한다(즉시 중단 버튼이 창 밖에 있으면 안 된다). */
    height: clamp(120px, 34vh, 320px);
    border-radius: 6px 6px 0 0;
    background: #05070A;
    border: 1px solid #242B35;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .cam.onair { border: 3px solid #E5484D; }
  .cam.rejected { border: 2px dashed #F0A64A; }
  /* z-index: 1 — .cam-video(뒤 DOM 순서, absolute, 명시 z-index 없음=auto)가 같은 칸을
     inset:0 으로 덮는다. 절대위치 형제는 z-index 가 같으면(둘 다 auto) DOM 순서로 쌓여
     나중에 오는 video 가 위로 온다 — 영상이 뜨는 순간 라벨·탤리(OFFLINE/ON AIR)가
     가려져 버린다(리뷰 Important). .cam-controls 가 이미 쓰는 값(1)과 맞춘다 — 새 값을
     만들 이유가 없다. */
  .cam-label { position: absolute; top: 12px; left: 12px; font-size: 12px; color: #4CC3D9; z-index: 1; }
  .tally {
    position: absolute; top: 10px; right: 12px; font-size: 12px; color: #9AA3AE;
    border: 1px solid #3A4350; padding: 2px 8px; border-radius: 4px; z-index: 1;
  }
  .tally.onair { color: #fff; font-weight: 600; background: #E5484D; border-color: #E5484D; }
  .tally.offline { color: #6B7684; }
  .tally.rejected { color: #F0A64A; border-color: #F0A64A; }
  .cam-placeholder { font-size: 14px; color: #6B7684; }
  .mic { position: absolute; bottom: 12px; left: 12px; font-size: 11px; color: #6B7684; }
  .cam-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
               border-radius: 6px 6px 0 0; }
  .cam-video[hidden] { display: none; }
  .cam-controls { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 6px; z-index: 1; }
  .cam-controls button { font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid #3A4350;
                          background: #1C222B; color: #C9CFD6; }

  /* 자막은 **고정 높이 + 안쪽 스크롤**. min-height 였을 때는 도슨트 해설(최대 280자)이
     6~7줄로 늘어나 칸이 커지고, 그만큼 하단 패널을 창 밖으로 밀었다. */
  .caption {
    height: clamp(56px, 11vh, 110px); overflow-y: auto; padding: 12px 16px; background: #151A21; border: 1px solid #242B35;
    border-top: none; border-radius: 0 0 6px 6px; font-size: 15px; line-height: 1.5; color: #9AA3AE;
  }
  .caption.onair { background: #1B1416; border-color: #4A2A2E; color: #FFFFFF; }

  /* 대사 감정 배지 — 자막 앞에 붙는 작은 알약(감독이 `say` 에 싣는 `emotion`,
     어휘 8종은 stage/cues.py::EMOTIONS). 크기·모양·테두리는 헤더의 수준·모드 배지
     (.level-btn/.mode-btn)와 **같은 값**이다 — 여기서만 다른 크기를 쓰면 한 화면에
     배지 방언이 둘이 된다. 글자만 강조색이라 ON AIR 로 흰 글자가 된 자막 위에서도
     배지가 대사와 따로 읽힌다. 감정이 없거나 `설명` 이면 아예 만들지 않는다
     (shownEmotion) — 거의 모든 줄이 `설명` 이라 그리면 늘 켜진 장식이 된다. */
  .emotion-badge {
    display: inline-block; font-size: 11px; font-weight: 600; line-height: 1.3;
    padding: 2px 8px; margin-right: 8px; border-radius: 999px;
    border: 1px solid #3A4350; background: #1C222B; color: #8FDCEA;
  }

  /* 2단 그리드 — 남은 높이(헤더·단독 배너 아래)를 다 쓴다. 런다운·로그는 안쪽에서
     스크롤하므로 여기에 하한을 두지 않는다(예전 260px·320px 하한이 720px 창에서 페이지
     스크롤을 만들었다). 좁은 창(아래 미디어쿼리)에서만 세로로 쌓이고 페이지가 스크롤된다. */
  .stage-grid { flex: 1 1 auto; min-height: 200px; padding: 16px 24px 20px; display: flex; gap: 24px; }
  /* 왼쪽 열 — 런다운(위) + 진행 제어(아래), 세로 전체. 폭을 **고정**한다(flex-grow 0) —
     오른쪽 카메라·로그가 창이 넓어질 때 그 여유를 갖게 하려는 것이다(사용자 요청: 로그를
     가로로 넓게). 300px 은 옛 rundown-panel/control-panel 기본 폭(280~300)과 같다. */
  .left-col { flex: 0 0 300px; min-width: 260px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  /* 오른쪽 열 — 카메라 두 대(위, 내용 높이만큼) + 로그(아래, 남는 높이 전부). */
  .right-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .panel {
    background: #151A21; border: 1px solid #242B35; border-radius: 6px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 8px; min-height: 0;
  }
  /* 런다운은 왼쪽 열의 남는 세로 공간을 다 먹는다(안쪽 스크롤) — 제어판은 내용 높이만큼만. */
  .rundown-panel { flex: 1 1 auto; min-height: 0; }
  .control-panel { flex: 0 0 auto; }
  /* 로그는 오른쪽 열 폭 **전부**(카메라 두 대 + 사이 간격) — 예전 280px 고정 폭보다
     훨씬 넓다(사용자 요청). 남는 세로 공간도 다 먹는다. */
  .log-panel { flex: 1 1 auto; min-height: 0; overflow: hidden; }

  .panel-head { display: flex; justify-content: space-between; font-size: 12px; color: #9AA3AE; }
  .panel-title { font-weight: 700; color: #E8EAED; }

  /* `contain: size` — 목록의 **내용 길이가 패널 높이를 밀어 올리지 않게** 한다. 이것이 없으면
     19행(약 620px)이 하단 줄 높이를 정해, 같은 줄의 이벤트 로그까지 그만큼 늘어나 창을 넘친다.
     크기를 내용에서 떼면 목록은 패널이 준 높이만 차지하고 나머지는 안쪽에서 스크롤된다. */
  .rundown-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; contain: size; display: flex; flex-direction: column; gap: 2px; }
  .cue-row {
    height: 30px; flex: 0 0 30px; display: flex; align-items: center; gap: 12px; padding: 0 10px;
    border: none; border-radius: 4px; background: transparent; color: #C9CFD6; font-size: 13px; text-align: left;
  }
  .cue-row .cue-num { width: 20px; color: #9AA3AE; flex: 0 0 auto; }
  .cue-row .cue-title { flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cue-row .cue-tag { font-size: 11px; color: #6B7684; flex: 0 0 auto; }
  .cue-row.done { color: #6B7684; }
  .cue-row.now { background: #3A1D21; color: #FFFFFF; font-weight: 700; }
  .cue-row.now .cue-tag { color: #FF8A8E; }
  /* 시작 전(idle)의 지금 큐는 READY — ON AIR 빨강을 켜지 않는다(P3). 두 클래스
     자리(.now.ready)라 위 규칙보다 구체적이어서 이긴다. */
  .cue-row.now.ready .cue-tag { color: #9AA3AE; }
  /* .cue-row.todo 는 일부러 규칙이 없다 — 시안 B 목업도 미래 큐를 기본 .cue-row 색 그대로 두고
     "NEXT" 태그만 달았다(강조는 지금 큐 하나뿐이어야 런다운에서 눈이 한 곳에만 간다). */
  .cue-row.selected { outline: 1px solid #4CC3D9; outline-offset: -1px; }

  .goto-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: #10262B; border: 1px solid #4CC3D9; border-radius: 4px; padding: 8px 10px; font-size: 12px;
  }
  .goto-bar[hidden] { display: none; }
  #goto-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .goto-actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .goto-actions button { border: none; border-radius: 4px; padding: 4px 10px; font-size: 12px; }
  #goto-confirm { background: #4CC3D9; color: #05070A; font-weight: 700; }
  #goto-cancel { background: #242B35; color: #C9CFD6; }

  .control-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .ctrl-btn {
    /* 창 높이에 비례(48~76px) — 낮은 창에서도 제어 패널이 하단 줄 안에 들어오게. */
    height: clamp(48px, 8vh, 76px); border-radius: 6px; border: 1px solid #3A4350; background: #1C222B; color: #E8EAED;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 15px; font-weight: 700;
  }
  .ctrl-btn kbd { font-size: 11px; color: #9AA3AE; }
  .ctrl-btn.primary { border-color: #4CC3D9; background: #10262B; }
  .ctrl-btn.primary kbd { color: #8FDCEA; }
  .ctrl-btn.abort { grid-column: span 2; border: none; background: #E5484D; color: #fff; font-size: 18px; font-weight: 900; }
  .ctrl-btn.abort kbd { color: #FFE1E2; }

  .auto { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .auto-head { display: flex; justify-content: space-between; font-size: 12px; color: #9AA3AE; }
  .auto-track { height: 6px; border-radius: 3px; background: #242B35; }
  #auto-bar { width: 0%; height: 6px; border-radius: 3px; background: #F0A64A; transition: width 0.3s linear; }

  /* 로그는 200줄까지 쌓인다 — 런다운과 같은 이유로 `contain: size` 로 내용 길이를 패널 높이에서
     떼고, 창에 맞춘 높이 안에서 세로 스크롤한다(최신 줄로 자동 스크롤은 appendLog 가 한다). */
  .log { flex: 1 1 auto; min-height: 0; overflow-y: auto; contain: size; display: flex; flex-direction: column; gap: 4px; }
  .log-line { display: flex; gap: 10px; font-size: 11.5px; line-height: 1.5; }
  .log-time { color: #6B7684; flex: 0 0 auto; }
  .log-text { color: #C9CFD6; overflow-wrap: anywhere; }
  .log-line.warn .log-text { color: #F0A64A; }

  /* 1280px 아래(태블릿 접속, 오프라인 테스트 절차 참고)에서는 `.cue-label` 이
     min-width:0 으로 줄어들어도 오른쪽 묶음(수준 버튼+대기 문구+연결 배지)이 자리를
     다 못 내준다(1024px 실측). "관람객 수준" 캡션과 "→ 이름 (다음 큐부터)" 대기
     문구는 정보용 텍스트라 좁은 폭에서 먼저 접는다 — 수준 버튼(.level-btn, 클릭으로
     수준을 바꾸는 조작)과 연결 배지(#conn, 연결 끊김 경고)는 시연 중 언제나 보여야
     하므로 여기서 숨기지 않는다. */
  @media (max-width: 1180px) {
    .level-caption { display: none; }
    .level-pending-text { display: none; }
  }

  /* 900px 보다 좁으면(세로 태블릿·휴대폰 가로 등) 왼쪽 열(300 고정) + 오른쪽 열(카메라
     최소 폭 2×300+24)이 한 줄에 안 들어간다. 그때 옆으로 우겨넣으면 카메라·로그가 몇 px
     로 찌그러지므로, 두 열을 세로로 쌓고 각 패널에 쓸 만한 높이를 준 뒤 넘치는 만큼은
     페이지 스크롤로 넘긴다(body 는 이미 overflow-y: auto — 옛 955px 분기와 같은 이유). */
  @media (max-width: 900px) {
    .stage-grid { flex-direction: column; flex: 0 0 auto; }
    .left-col, .right-col { flex: 0 0 auto; width: 100%; }
    .panel { min-height: 260px; }
  }
</style>
</head>
<body>

<header>
  <div class="left">
    <span class="app-title">무대감독 · 조정실</span>
    <!-- 버튼 2개는 JS 가 hello.modes 로 짓는다(계약 순서: podcast, solo — 재접속마다
         비우고 다시 짓는다, buildLevelControl 과 같은 이유). modes 가 없으면(구버전
         서버) 이 컨테이너 자체를 숨긴다 — 던지지 않는다(계약: never throw). -->
    <span id="mode" class="mode-group" hidden></span>
    <!-- 단독을 못 켜는 이유 안내 — 사회자가 안 붙었으면 "단독: 사회자 로봇 연결 후", 붙었는데
         앱이 단독을 모르면 "단독: 로봇 앱 업데이트 후". snapshot.solo_available 이 거짓이고
         지금 모드가 solo 가 아닐 때만 채워진다. -->
    <span id="mode-note" class="mode-note" hidden></span>

      <!-- 버튼 4개는 JS 가 hello.levels 로 짓는다(순서가 levels.yaml 그대로 온다).
           hello.levels 가 없는 구버전 서버에서는 renderLevelState 가 여기 이름 하나만
           평문으로 넣는다 — 두 경우 다 id="level" 은 그대로 있다(정적 테스트가 요구). -->

<!-- 단독일 때만 보인다(팟캐스트면 hidden) — 문구는 고정이라 서버에서 오지 않는다,

<!-- 2단 그리드 — 왼쪽은 런다운(위)·진행 제어(아래)로 세로 전체를 쓰고, 오른쪽은 카메라
     두 대(위) 아래로 이벤트 로그가 가로 폭 전부를 쓴다. 예전에는 넷이 한 줄(.lower)에
     늘어서 있었는데, 이벤트 로그가 320px 안팎으로 좁아 긴 줄이 자주 접혔다(사용자 요청:
     런다운 좌측 상단·제어 좌측 하단·로그는 가로로 넓게). -->
<div class="stage-grid">
  <div class="left-col">

        <button type="button" id="btn-next" class="ctrl-btn primary">다음<kbd>N</kbd></button>

  <div class="right-col">

               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

          <div class="cam-controls">

          <span class="tally offline" id="tag-docent">OFFLINE</span>
          <video id="vid-docent" class="cam-video" autoplay muted playsinline hidden></video>
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3A4350" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="6" width="18" height="13" rx="2"></rect>
            <circle cx="12" cy="12.5" r="3.5"></circle>
            <path d="M8 6l1.5-2h5L16 6"></path>
          </svg>
          <span class="cam-placeholder" id="cam-reason-docent">[도슨트 카메라 영상 — 실기 연결 후]</span>

          <div class="cam-controls">
            <button type="button" class="cam-toggle" id="cam-toggle-docent">카메라 끄기</button>

    <section class="panel log-panel" aria-label="이벤트 로그">

        <span class="panel-title">이벤트 로그</span>
        <span id="log-warn-count">경고 0</span>

      <div id="log" class="log"></div>

<script>
"use strict";
// 이 파일은 빌드 과정이 없다 — 브라우저가 그대로 읽는 순수 JS 하나다.
// 서버는 stage/dashboard.py 다(발행은 stage/server.py `_publish`). 메시지 형식은
// docs/superpowers/specs/2026-09-21-stage-dashboard-design.md 표(51-61행)를 그대로 따른다.

// ── 상태 ──────────────────────────────────────────────────────────
var ws = null;
var reconnectTimer = null;
var RECONNECT_MS = 2000;
var LOG_MAX = 200;

var rundownRows = [];     // [{id, title, topic, btn, tag}] — hello.cues 로 짓는다(hello 는
                           // 연결마다 다시 오므로 매번 새로 짓는다 — "한 번만" 아니다)
var levelButtons = {};    // name -> button 엘리먼트. hello.levels 로 지을 때만 채워진다
var levelButtonsMode = false; // hello.levels 가 있어야 true. 없으면(구버전 서버) #level 은
                               // 버튼 없이 snapshot.level 이름만 평문으로 보여준다(폴백 —
                               // 절대 안 터진다. 계약: level-switch-contract.md).
var modeButtons = {};     // name("podcast"/"solo") -> button 엘리먼트. hello.modes 로
                           // 지을 때만 채워진다(레벨과 같은 패턴).
var modeButtonsMode = false; // hello.modes 가 있어야 true. 없으면(구버전 서버) 토글 전체를
                              // 숨긴다 — 절대 안 던진다(계약).
var MODE_LABEL = { podcast: "팟캐스트", solo: "단독" }; // 계약이 고정한 두 값만 안다.
                              // 모르는 이름이 와도(4단계 전까지는 안 온다) 이름 그대로
                              // 보여주지 죽지 않는다(아래 buildModeControl).
var latestSnapshot = null;
var selectedCueId = null; // 런다운 줄을 클릭해 "선택만" 된 큐 — 확인 전에는 이동하지 않는다
var lastScrolledCueIdx = -1; // 런다운을 마지막으로 스크롤해 보여 준 현재 큐 — 바뀔 때만 스크롤한다
var warnCount = 0;
var camPeers = {};  // role -> RTCPeerConnection
var camNoFrameTimer = {};  // role -> setTimeout id (끊김 판정)

var CONN_LABEL = { connecting: "연결 중…", connected: "연결됨", disconnected: "연결 끊김 — 재접속 중" };
var TALLY_TEXT = { offline: "OFFLINE", rejected: "거부됨", onair: "ON AIR", standby: "STANDBY" };
var STATE_CLASSES = ["offline", "rejected", "onair", "standby"];

// ── 접속 ──────────────────────────────────────────────────────────
// 같은 호스트의 /ws 로 붙는다 — 대시보드가 어느 호스트·포트에 떠 있어도
// 하드코딩 없이 맞는 곳으로 간다(REACHY_DASHBOARD_HOST/PORT 로 옮겨도 그대로 동작).
function wsUrl() {
  var scheme = location.protocol === "https:" ? "wss://" : "ws://";
  return scheme + location.host + "/ws";
}

function setConn(state) {
  var el = document.getElementById("conn");
  el.textContent = CONN_LABEL[state] || state;
  el.className = "conn " + state;
}

function connect() {
  setConn("connecting");
  ws = new WebSocket(wsUrl());
  ws.addEventListener("open", function () { setConn("connected"); });
  ws.addEventListener("close", scheduleReconnect);
  // 에러 뒤에는 항상 close 가 따라오므로 재접속은 close 쪽 한 곳에서만 잡는다 —
  // 여기서 또 스케줄하면 타이머가 두 벌 돌아 재접속이 두 번 겹칠 수 있다.
  ws.addEventListener("error", function () { ws.close(); });
  ws.addEventListener("message", function (ev) {
    var msg;
    try {
      msg = JSON.parse(ev.data);
    } catch (err) {
      // 서버가 규약에 안 맞는 것을 보냈다 — 페이지를 죽이지 않고 콘솔에만 남긴다.
      console.warn("대시보드: 메시지를 해석할 수 없다", err);
      return;
    }
    handleMessage(msg);
  });
}

function scheduleReconnect() {
  setConn("disconnected");
  if (reconnectTimer) return;   // 이미 재접속을 기다리는 중이면 중복 예약하지 않는다
  reconnectTimer = setTimeout(function () {
    reconnectTimer = null;
    connect();
  }, RECONNECT_MS);
}

function sendCmd(cmd) {
  // 콘솔(stage/console.py)이 받는 것과 같은 명령 문자열을 그대로 보낸다.
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    // console.warn 만 남기면 운영자는 버튼(또는 단축키, 즉시 중단 포함 — 예외
    // 없다)을 눌렀는데 왜 반응이 없는지 화면만 봐서는 모른다. 로그 패널에도
    // 경고 줄로 남긴다(경고 수에도 센다). 서버가 보낸 이벤트가 아니라 이 페이지가
    // 지어낸 줄이라 t 는 지금 시각을 쓴다.
    appendLogFor({
      kind: "warn",
      t: Date.now() / 1000,
      text: "보내지 못했다(연결 끊김) — 터미널 콘솔 키를 쓴다: " + cmd,
    });
    return;
  }
  ws.send(JSON.stringify({ cmd: cmd }));
}

// ── 카메라 WebRTC — 관람객 카메라 두 대의 영상을 받는다 ────────────
// rtc 메시지 형식은 스펙 표(2026-09-22-dashboard-camera-design.md)를 따른다 — M5:
// 2026-09-21 스펙은 카메라를 "이번 범위 밖" 으로 명시한 문서라 rtc 표는 거기 없다.
// {kind:"rtc", role, sdp?, candidate?, sdpMLineIndex?, bye?}. 페이지는 답신 SDP·
// ICE 후보를 같은 형식으로 ws 에 되돌린다 — 서버가 로봇 쪽 스트리머와 중계한다.
function ensurePeer(role) {
  if (camPeers[role]) return camPeers[role];
  var pc = new RTCPeerConnection({ iceServers: [] });
  var video = document.getElementById("vid-" + role);
  pc.ontrack = function (ev) {
    video.srcObject = ev.streams[0] || new MediaStream([ev.track]);
    video.hidden = false;
    document.getElementById("cam-reason-" + role).hidden = true;
  };
  pc.onicecandidate = function (ev) {
    if (!ev.candidate) return;
    ws.send(JSON.stringify({ rtc: { role: role, candidate: ev.candidate.candidate,
                                     sdpMLineIndex: ev.candidate.sdpMLineIndex } }));
  };
  pc.onconnectionstatechange = function () {
    if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
      requestCamRestart(role);
    }
  };
  camPeers[role] = pc;
  return pc;
}

function requestCamRestart(role) {
  video_hide(role);
  ws.send(JSON.stringify({ rtc: { role: role, restart: true } }));
}

function video_hide(role) {
  var v = document.getElementById("vid-" + role);
  v.hidden = true;
  v.srcObject = null;
}

function handleRtc(msg) {
  var role = msg.role;
  if (!role) return;
  if (msg.bye) {
    var pc = camPeers[role];
    if (pc) { pc.close(); delete camPeers[role]; }
    video_hide(role);
    return;
  }
  var pc = ensurePeer(role);
  if (msg.sdp) {
    pc.setRemoteDescription(msg.sdp).then(function () {
      return pc.createAnswer();
    }).then(function (answer) {
      return pc.setLocalDescription(answer).then(function () { return answer; });
    }).then(function (answer) {
      ws.send(JSON.stringify({ rtc: { role: role, sdp: { type: "answer", sdp: answer.sdp } } }));
    }).catch(function (err) { console.warn("대시보드: rtc 협상 실패", role, err); });
  } else if (msg.candidate) {
    pc.addIceCandidate({ candidate: msg.candidate, sdpMLineIndex: msg.sdpMLineIndex }).catch(function () {});
  }
}

// ── 메시지 종류별 렌더 — kind 하나에 함수 하나 ─────────────────────
function handleMessage(msg) {
  if (!msg || typeof msg.kind !== "string") return;
  switch (msg.kind) {
    case "hello":
      renderHello(msg);
      break;
    case "snapshot":
      renderSnapshot(msg);
      break;
    case "sent":
      renderSent(msg);
      break;
    case "rtc":
      handleRtc(msg);
      break;
    case "recv":
    case "connect":
    case "disconnect":
    case "warn":
    case "command":
      appendLogFor(msg);
      break;
    default:
      console.warn("대시보드: 모르는 메시지 종류 — " + msg.kind);
  }
}

function renderHello(msg) {
  // hello 는 연결마다 온다(세션에 한 번이 아니다) — 새로고침·재접속마다 다시 온다.
  // 로그와 경고 수를 먼저 비운다: 안 비우면 이력이 지금까지 쌓인 실시간 줄 옆에
  // 다시 덧쌓여 로그 줄이 중복되고 경고 수가 두 배가 된다.
  clearLog();

  var cues = Array.isArray(msg.cues) ? msg.cues : [];
  buildRundown(cues);
  // hello.levels 도 연결마다 다시 온다 — buildRundown 과 같은 이유로 매번 새로 짓는다
  // (안 그러면 재접속마다 레벨 버튼이 두 배로 쌓인다).
  buildLevelControl(msg.levels);
  // hello.modes 도 마찬가지로 연결마다 다시 온다 — 같은 이유로 매번 새로 짓는다.
  buildModeControl(msg.modes);

  // 이력은 appendLogFor 가 아니라 handleMessage 로 흘린다 — 그래야 실시간과 같은
  // 길을 타서 sent say/mic 이 자막·MIC 표시에도 반영된다. appendLogFor 만 부르면
  // 로그 줄은 남아도 자막·MIC 는 복원되지 않는다(LISTENING 중 새로고침하면
  // 운영자가 관람객 마이크가 열린 걸 모른다).
  var history = Array.isArray(msg.history) ? msg.history : [];
  for (var i = 0; i < history.length; i++) {
    handleMessage(history[i]);
  }

  // 이력 재생 뒤에 hello.snapshot 을 적용한다 — 탤리·런다운 태그는 스냅샷이 최종
  // 권위다(이력 재생 중 마지막으로 본 speaking_role 이 지금은 낡았을 수 있다).
  // snapshot 이 없어도(null) 안 터진다.
  if (msg.snapshot) renderSnapshot(msg.snapshot);
}

function clearLog() {
  // hello 를 다시 받을 때(재접속·새로고침) 지난 로그를 비운다 — 안 비우면 이력이
  // 중복되고 경고 수가 두 배가 된다(P2).
  var log = document.getElementById("log");
  while (log.firstChild) log.removeChild(log.firstChild);
  warnCount = 0;
  document.getElementById("log-warn-count").textContent = "경고 " + warnCount;
}

function renderSnapshot(s) {
  latestSnapshot = s;

  var idx = indexOfCue(s.cue_id, s.cue_index);
  var cue = idx >= 0 && idx < rundownRows.length ? rundownRows[idx] : null;
  var title = cue ? cue.title : (s.cue_id || "—");
  var num = typeof s.cue_index === "number" ? s.cue_index + 1 : "—";
  var count = typeof s.cue_count === "number" ? s.cue_count : "—";
  document.getElementById("cue-label").textContent =
    "CUE " + pad2(num) + " / " + count + " · " + title;

  var topicEl = document.getElementById("cue-topic");
  var topic = cue ? cue.topic : "";
  topicEl.textContent = topic;
  topicEl.title = topic;   // 잘려도 마우스오버로 전문을 본다

  renderLevelState(s);
  renderModeState(s);

  var connected = new Set(Array.isArray(s.connected) ? s.connected : []);
  var rejected = new Set(Array.isArray(s.rejected) ? s.rejected : []);
  setTally("mc", connected, rejected, s.speaking_role);
  setTally("docent", connected, rejected, s.speaking_role);

  refreshRundownTags();
  refreshGotoBarForCurrent();
  applyAutoProgress(s.question_wait_s, s.question_wait_total_s);

  // 카메라 relay 가 있을 때만 snapshot.cameras 가 온다(계약, Task 7) — 없으면(구버전
  // 서버·relay 미장착) 아무것도 하지 않는다(never throw).
  if (s.cameras) {
    ["mc", "docent"].forEach(function (role) {
      var c = s.cameras[role];
      if (!c) return;
      var reasonEl = document.getElementById("cam-reason-" + role);
      var btn = document.getElementById("cam-toggle-" + role);
      if (reasonEl) { reasonEl.textContent = c.reason || ""; reasonEl.hidden = !c.reason; }
      if (btn) btn.textContent = c.enabled ? "카메라 끄기" : "카메라 켜기";
    });
  }
  if (Array.isArray(s.standby)) {
    ["mc", "docent"].forEach(function (role) {
      var btn = document.getElementById("standby-toggle-" + role);
      if (btn) btn.textContent = s.standby.indexOf(role) !== -1 ? "대기 해제" : "대기모드";
    });
  }
}

function renderSent(msg) {
  var role = msg.role;
  var fields = msg.fields || {};
  if (msg.type === "say" && role && typeof fields.text === "string") {
    var cap = document.getElementById("cap-" + role);
    // 관람객 STT·로봇 대사가 그대로 온다 — textContent 로만 넣는다(setCaption).
    if (cap) setCaption(cap, fields.text, fields.emotion);
  } else if (msg.type === "mic" && role) {
    var mic = document.getElementById("mic-" + role);
    if (mic) mic.textContent = fields.open ? "MIC ON" : "MIC OFF";
  }
  appendLogFor(msg);
}

// ── 대사 감정 ─────────────────────────────────────────────────────
// 감독이 `say` 에 싣는 `emotion`(계약: 계획 §12.5, 어휘 8종은 stage/cues.py::EMOTIONS).
function shownEmotion(value) {
  // `설명` 은 "특별한 감정 없음"(stage/cues.py::DEFAULT_EMOTION)이라 거의 모든 줄에
  // 붙는다 — 그리면 배지가 늘 켜져 있는 장식이 되어 진짜 감정(놀람·아쉬움)이 눈에 안
  // 띈다. 필드가 아예 없는 경우(감정을 모르는 옛 감독, 관람객 질문 답)도 같다.
  // 문자열이 아닌 값이 와도 던지지 않는다 — 자막은 시연 내내 도는 경로라 여기서
  // 던지면 그 뒤 대사가 화면에서 통째로 멈춘다(계약: never throw).
  // 아는 태그 목록을 여기 한 벌 더 두지 않는다 — 모르는 태그는 감독이 기동에서
  // 거절하고(load_cues), 목록을 들고 있으면 어휘가 늘 때마다 두 곳이 어긋난다.
  if (typeof value !== "string") return "";
  var name = value.trim();
  return name === "" || name === "설명" ? "" : name;
}

function setCaption(cap, text, emotion) {
  // 칸을 **비우고 다시 짓는다.** 배지 엘리먼트를 남긴 채 텍스트만 갈아 끼우면 감정이
  // 없는 다음 대사에 앞 대사의 배지가 그대로 붙어 있고, 운영자는 그것을 지금 감정으로
  // 읽는다.
  while (cap.firstChild) cap.removeChild(cap.firstChild);
  var name = shownEmotion(emotion);
  if (name) {
    var badge = document.createElement("span");
    badge.className = "emotion-badge";
    badge.textContent = name;   // 감독이 준 문자열 — textContent 로만 넣는다
    cap.appendChild(badge);
  }
  cap.appendChild(document.createTextNode(text));
}

// ── 로그 한 줄 ────────────────────────────────────────────────────
function describeEvent(msg) {
  var fields = msg.fields || {};
  switch (msg.kind) {
    case "sent":
      if (msg.type === "say") {
        // 감정은 로그에도 남긴다 — 자막은 다음 대사가 곧 덮어쓰므로, 시연이 끝난 뒤
        // "이 대사에 왜 저 모션이 났나" 를 되짚을 기록은 이 줄뿐이다. 배지와 **같은
        // 규칙**(없거나 `설명` 이면 안 적는다)이라 같은 함수를 쓴다 — 규칙을 두 벌로
        // 적으면 한쪽만 고쳐져 화면과 로그가 엇갈린다.
        var emo = shownEmotion(fields.emotion);
        return "say " + msg.role + " " + fields.cue_id + " seq=" + fields.seq +
               (emo ? " " + emo : "");
      }
      if (msg.type === "mic") return "mic " + msg.role + " " + (fields.open ? "on" : "off");
      if (msg.type === "abort") return "abort " + msg.role;
      return msg.type + " " + msg.role;
    case "recv":
      if (msg.type === "heard") return "관람객> " + fields.text;
      if (msg.type === "speaking_started") return "[" + msg.role + "] 발화 시작 seq=" + fields.seq;
      if (msg.type === "speaking_ended") return "[" + msg.role + "] 발화 종료 seq=" + fields.seq;
      if (msg.type === "error") {
        // fields = {where, detail}(stage/server.py:217) — 그대로 이어붙이면
        // "[mc] error" 로만 남아 무엇이 어디서 실패했는지 로그만 봐서는 모른다.
        // where·detail 은 둘 다 없을 수 있어 있는 것만 잇는다.
        var where = typeof fields.where === "string" ? fields.where : "";
        var detail = typeof fields.detail === "string" ? fields.detail : "";
        var text = "[" + msg.role + "] 오류";
        if (where) text += " " + where;
        if (detail) text += (where ? ": " : " ") + detail;
        return text;
      }
      return "[" + msg.role + "] " + msg.type;
    case "connect":
      return "[" + msg.role + "] 붙었다";
    case "disconnect":
      return "[" + msg.role + "] 끊겼다";
    case "warn":
      return msg.text || "";
    case "command": {
      // ok=false 면 서버 lines 가 이미 "거절됨: …" 을 담고 있다(stage/console.py
      // `out(f"  거절됨: {exc}")`). 접두에서 또 "거절됨" 을 붙이면 "거절됨 거절됨: …"
      // 으로 겹친다. lines 를 그대로 쓰고, lines 가 비어 있을 때만 "거절됨" 을 채운다.
      var lines = Array.isArray(msg.lines) ? msg.lines.join(" ") : "";
      if (!msg.ok) return "명령 " + msg.cmd + " — " + (lines || "거절됨");
      return "명령 " + msg.cmd + " — 실행" + (lines ? " " + lines : "");
    }
    default:
      return String(msg.kind);
  }
}

function isWarnLine(msg) {
  return msg.kind === "warn" || (msg.kind === "command" && msg.ok === false);
}

function formatTime(t) {
  // 서버는 epoch 초(time.time())를 보낸다 — 시간대는 브라우저가 알아서 맞춘다.
  if (typeof t !== "number") return "--:--:--";
  var d = new Date(t * 1000);
  var two = function (n) { return String(n).padStart(2, "0"); };
  return two(d.getHours()) + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds());
}

function appendLogFor(msg) {
  var warn = isWarnLine(msg);
  var line = document.createElement("div");
  line.className = warn ? "log-line warn" : "log-line";

  var time = document.createElement("span");
  time.className = "log-time";
  time.textContent = formatTime(msg.t);

  var text = document.createElement("span");
  text.className = "log-text";
  text.textContent = describeEvent(msg);   // 서버 문자열 — textContent 로만 넣는다

  line.appendChild(time);
  line.appendChild(text);

  var log = document.getElementById("log");
  log.appendChild(line);
  while (log.childElementCount > LOG_MAX) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;   // 최신이 아래 — 자동 스크롤

  if (warn) {
    warnCount += 1;
    document.getElementById("log-warn-count").textContent = "경고 " + warnCount;
  }
}

// ── 런다운 ────────────────────────────────────────────────────────
function pad2(n) {
  return typeof n === "number" ? String(n).padStart(2, "0") : String(n);
}

function indexOfCue(cueId, fallbackIndex) {
  for (var i = 0; i < rundownRows.length; i++) {
    if (rundownRows[i].id === cueId) return i;
  }
  return typeof fallbackIndex === "number" ? fallbackIndex : -1;
}

function buildRundown(cues) {
  // hello 는 연결마다 온다(세션에 한 번만 오는 게 아니다) — 재접속·새로고침마다
  // 다시 온다. 그래서 root 를 먼저 비우고 매번 다시 짓는다(안 비우면 런다운 줄이
  // 두 배로 쌓인다). 반대로 snapshot 은 세션 내내 자주 오므로 그때는 클래스·
  // 텍스트만 갈아끼운다(rundownRows) — 매번 다시 지으면 클릭 리스너를 새로 달아야
  // 하고 스크롤 위치도 흔들린다.
  var root = document.getElementById("rundown");
  while (root.firstChild) root.removeChild(root.firstChild);
  rundownRows = [];
  lastScrolledCueIdx = -1;   // 행을 새로 지었다 — 재접속 뒤에도 현재 큐를 다시 보여 준다

  cues.forEach(function (c, i) {
    var title = c.title || c.id;
    var topic = c.topic || title;

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cue-row";

    var num = document.createElement("span");
    num.className = "cue-num";
    num.textContent = pad2(i + 1);

    var titleSpan = document.createElement("span");
    titleSpan.className = "cue-title";
    titleSpan.textContent = title;   // 런다운 줄에는 title(짧은 이름)을 쓴다

    var tag = document.createElement("span");
    tag.className = "cue-tag";

    btn.appendChild(num);
    btn.appendChild(titleSpan);
    btn.appendChild(tag);
    btn.addEventListener("click", function () { selectCue(c.id); });
    root.appendChild(btn);

    rundownRows.push({ id: c.id, title: title, topic: topic, btn: btn, tag: tag });
  });

  refreshRundownTags();
}

function refreshRundownTags() {
  var idx = latestSnapshot ? indexOfCue(latestSnapshot.cue_id, latestSnapshot.cue_index) : -1;
  var done = 0;
  rundownRows.forEach(function (row, i) {
    row.btn.classList.remove("done", "now", "todo", "selected", "ready");
    if (idx >= 0 && i < idx) {
      row.btn.classList.add("done");
      row.tag.textContent = "DONE";
      done += 1;
    } else if (i === idx) {
      row.btn.classList.add("now");
      // 시작 전(idle)에는 아직 방송 중이 아니다 — 여기서 ON AIR(빨강)를 켜면
      // 운영자가 이미 시작된 것으로 착각한다. idle 이 아니면(발화 중·LISTENING)
      // 그대로 ON AIR.
      var idle = latestSnapshot && latestSnapshot.state === "idle";
      if (idle) row.btn.classList.add("ready");
      row.tag.textContent = idle ? "READY" : "ON AIR";
    } else {
      row.btn.classList.add("todo");
      row.tag.textContent = "NEXT";
    }
    if (row.id === selectedCueId) row.btn.classList.add("selected");
  });
  document.getElementById("rundown-summary").textContent =
    rundownRows.length + "개 중 " + done + "개 끝남";

  // 런다운이 창 높이에 맞춰 안쪽 스크롤이 되면서, 현재 큐가 목록 아래로 숨을 수 있다
  // (19행 중 보이는 건 창 크기에 따라 7~10행). 큐가 **바뀔 때만** 그 행을 보이게 한다 —
  // 스냅샷은 0.5초마다 오므로 매번 당기면 운영자가 다른 큐를 고르려 내려 본 목록을 도로
  // 끌어올린다. `nearest` 는 이미 보이면 움직이지 않는다.
  if (idx >= 0 && idx !== lastScrolledCueIdx && rundownRows[idx]) {
    lastScrolledCueIdx = idx;
    rundownRows[idx].btn.scrollIntoView({ block: "nearest" });
  }
}

// ── 관람객 수준 4버튼 ────────────────────────────────────────────
function buildLevelControl(levels) {
  // hello 는 연결마다 다시 온다 — 컨테이너를 먼저 비우고 다시 짓는다(buildRundown 과
  // 같은 이유: 안 비우면 재접속마다 버튼이 두 배로 쌓인다).
  var root = document.getElementById("level");
  while (root.firstChild) root.removeChild(root.firstChild);
  levelButtons = {};
  // hello.levels 가 없는 구버전 서버에서는 배열이 아니거나 비어 있다 — 그때는 버튼을
  // 하나도 짓지 않고 renderLevelState 가 이름만 평문으로 넣는다(never throw, 계약).
  levelButtonsMode = Array.isArray(levels) && levels.length > 0;
  if (!levelButtonsMode) return;

  levels.forEach(function (name) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "level-btn";
    btn.textContent = name;   // 서버가 준 수준 이름 그대로 — textContent 로만 넣는다
    // 확인 단계 없이 바로 보낸다 — 되돌릴 수 있는 조작이고 적용은 어차피 다음 큐부터라
    // 안전하다(계약). 지금 적용된 수준을 다시 눌러도 그냥 "l <이름>" 을 보낸다 —
    // 대기 중이던 변경을 취소하는 것도 감독 쪽 같은 명령이 하므로 페이지에서 따로
    // 분기하지 않는다. 마우스 클릭만 받는다 — ev.code 단축키는 두지 않는다(레벨은
    // 실수로 눌리기 쉬운 키보드 경로를 얹지 않는다).
    btn.addEventListener("click", function () { sendCmd("l " + name); });
    root.appendChild(btn);
    levelButtons[name] = btn;
  });
}

function renderLevelState(s) {
  var pendingText = document.getElementById("level-pending-text");
  if (!levelButtonsMode) {
    // 구버전 서버 폴백 — 버튼이 없으니 이름만 보여준다(계약: never throw).
    document.getElementById("level").textContent = s.level || "—";
    pendingText.hidden = true;
    return;
  }
  var pending = s.level_pending;   // 다음 큐부터 적용될 이름, 없으면 null(계약)
  Object.keys(levelButtons).forEach(function (name) {
    var btn = levelButtons[name];
    btn.classList.remove("applied", "pending");
    if (name === s.level) btn.classList.add("applied");
    if (pending && name === pending) btn.classList.add("pending");
  });
  if (pending) {
    pendingText.textContent = "→ " + pending + " (다음 큐부터)";
    pendingText.hidden = false;
  } else {
    pendingText.hidden = true;
  }
}

// ── 운영 모드 토글(팟캐스트/단독) ────────────────────────────────
function buildModeControl(modes) {
  // hello 는 연결마다 다시 온다 — buildLevelControl 과 같은 이유로 컨테이너를 먼저
  // 비우고 다시 짓는다(안 비우면 재접속마다 버튼이 두 배로 쌓인다).
  var root = document.getElementById("mode");
  while (root.firstChild) root.removeChild(root.firstChild);
  modeButtons = {};
  // hello.modes 가 없는 구버전 서버에서는 토글 전체를 숨긴다 — 계약이 없는 서버에
  // 명령을 보내 봐야 감독이 모른다. 버튼을 하나도 안 짓고 던지지도 않는다.
  modeButtonsMode = Array.isArray(modes) && modes.length > 0;
  root.hidden = !modeButtonsMode;
  if (!modeButtonsMode) return;

  modes.forEach(function (name) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "mode-btn";
    btn.dataset.mode = name;
    // 서버가 준 이름은 "podcast"/"solo" 고정(계약) — 한국어 라벨을 붙이되, 모르는
    // 이름이 오면(4단계 전까지는 안 오지만 방어적으로) 이름 그대로 보여준다.
    btn.textContent = MODE_LABEL[name] || name;
    btn.addEventListener("click", function () {
      // 확인 단계 없이 바로 보낸다 — 팟캐스트→단독도 마찬가지다. 런다운 두 단계
      // 이동(goto-bar)과 달리 이 버튼은 (1) 단독 쪽은 solo_available 일 때만
      // 눌리고(로봇 앱이 지원할 때만), (2) 되돌리기(단독→팟캐스트)가 버튼 한 번이라
      // 실수의 대가가 낮다 — "실수 한 번이 진행을 깨지 않는다"(스펙 결정 2)를 해치는
      // 정도가 런다운 이동보다 작다고 판단해 확인 바를 쓰지 않는다(task-2 브리프 판정).
      var current = latestSnapshot ? latestSnapshot.mode : null;
      if (name === current) return;   // 이미 그 모드 — 감독도 "바꿀 것이 없다"로 경고만 한다
      sendCmd("m " + name);
    });
    root.appendChild(btn);
    modeButtons[name] = btn;
  });
}

function renderModeState(s) {
  var note = document.getElementById("mode-note");
  if (!modeButtonsMode) {
    // 구버전 서버 폴백 — 토글이 이미 숨어 있으니 안내문도 비워 둔다.
    note.textContent = "";
    note.hidden = true;
    applySoloLockdown(false);
    return;
  }
  Object.keys(modeButtons).forEach(function (name) {
    var btn = modeButtons[name];
    btn.classList.remove("applied");
    if (name === s.mode) btn.classList.add("applied");
  });
  // 단독 버튼은 사회자 로봇 앱이 caps 로 단독을 알리지 않았거나(구버전 앱) 사회자가
  // 붙어 있지 않으면 잠근다(계약: solo_available). 이미 단독 모드라면(잠깐이라도
  // solo_available 이 흔들려도) 잠그지 않는다 — 잠그면 팟캐스트로 되돌아갈 버튼까지
  // 막히는 게 아니라 단독 버튼 자체가 "지금 상태"를 보여주는 자리라, 눌러도 감독이
  // 어차피 "이미 solo 모드다"로 무시하지만 disabled 로 만들면 지금 모드가 무엇인지
  // 시각적으로 헷갈린다.
  var soloLocked = !s.solo_available && s.mode !== "solo";
  if (modeButtons.solo) modeButtons.solo.disabled = soloLocked;
  if (soloLocked) {
    // 잠긴 이유가 둘이다(감독의 거절 경고도 둘) — 사회자 로봇이 안 붙었거나, 붙었는데 그 앱이
    // 단독을 모른다(caps). 하나로 뭉개면 사회자가 끊긴 것을 "앱 업데이트" 문제로 오인해 엉뚱한
    // 곳을 본다(최종 리뷰 M4). connected 가 없는 구버전 서버면 "사회자 연결" 쪽으로 읽힌다.
    var mcConnected = Array.isArray(s.connected) && s.connected.indexOf("mc") !== -1;
    note.textContent = mcConnected ? "단독: 로봇 앱 업데이트 후" : "단독: 사회자 로봇 연결 후";
    note.hidden = false;
  } else {
    note.textContent = "";
    note.hidden = true;
  }

  applySoloLockdown(s.mode === "solo");
}

function applySoloLockdown(isSolo) {
  // 단독에서는 감독이 팟캐스트 진행 명령을 거절한다(계약: "단독 모드에서는 팟캐스트
  // 진행(...)을 하지 않는다 — 먼저 m podcast"). 페이지에서도 눌러 봐야 소용없다는 것을
  // 미리 보여준다 — 안 그러면 운영자가 눌렀는데 로그에 거절 경고만 쌓이는 것을 보고야
  // 안다. 런다운 행·확인 바도 같은 이유로 잠근다. 즉시 중단(abort)만은 살려 둔다 —
  // 단독 중에도 사회자가 이상 동작을 하면 멈출 유일한 손잡이라서다(계약에도 단독
  // 진행 가드 목록에 abort 는 없다).
  ["btn-prev", "btn-restart", "btn-next", "btn-start"].forEach(function (id) {
    document.getElementById(id).disabled = isSolo;
  });
  document.getElementById("goto-confirm").disabled = isSolo;
  document.getElementById("goto-cancel").disabled = isSolo;
  rundownRows.forEach(function (row) { row.btn.disabled = isSolo; });

  // 확인 바가 열린 채(런다운 행을 눌러 선택해 둔 상태) 단독으로 전환되면, 위에서 막
  // 확인·취소 버튼과 런다운 행이 함께 잠겨 바를 닫을 방법이 없는 막다른 골목이 된다
  // (수준 리뷰 I2). 단독으로 들어가는 순간 열려 있던 확인 바를 스스로 닫는다 — 팟캐스트로
  // 돌아오면 다시 누르면 그만이라 잃을 것이 없다. selectedCueId 가 이미 null 이면(바가
  // 안 열려 있었으면) closeGotoBar 는 그냥 hidden 을 다시 세팅할 뿐이라 안전하다.
  if (isSolo) closeGotoBar();

  document.getElementById("solo-banner").hidden = !isSolo;
}

// ── 큐 이동 확인 바 — 클릭은 선택만, 확인해야 이동한다 ─────────────
function selectCue(id) {
  var row = null;
  for (var i = 0; i < rundownRows.length; i++) {
    if (rundownRows[i].id === id) { row = rundownRows[i]; break; }
  }
  if (!row) return;

  selectedCueId = id;
  refreshRundownTags();

  var curIdx = latestSnapshot ? indexOfCue(latestSnapshot.cue_id, latestSnapshot.cue_index) : -1;
  var rowIdx = rundownRows.indexOf(row);
  var isCurrent = curIdx >= 0 && curIdx === rowIdx;
  var label = row.btn.querySelector(".cue-num").textContent + " " + row.title;

  var bar = document.getElementById("goto-bar");
  var text = document.getElementById("goto-text");
  var confirm = document.getElementById("goto-confirm");

  if (isCurrent) {
    // 지금 방송 중인 큐를 다시 누른 것 — 큐 이동이 아니라 "다시(r)" 를 권한다.
    text.textContent = "\"" + label + "\" — 지금 방송 중이다. 다시 하려면 R.";
    confirm.textContent = "이 큐 다시(R)";
  } else {
    text.textContent = "\"" + label + "\" 으로 이동";
    confirm.textContent = "이 큐로 이동";
  }
  bar.hidden = false;
  bar.dataset.current = isCurrent ? "1" : "";
}

function closeGotoBar() {
  selectedCueId = null;
  document.getElementById("goto-bar").hidden = true;
  refreshRundownTags();
}

function refreshGotoBarForCurrent() {
  // snapshot 이 갱신되며 선택해 둔 큐가 방금 현재 큐가 됐을 수 있다(운영자가
  // 다른 경로로 이미 옮긴 경우) — 문구를 다시 맞춘다.
  var stillThere = false;
  for (var i = 0; i < rundownRows.length; i++) {
    if (rundownRows[i].id === selectedCueId) { stillThere = true; break; }
  }
  if (selectedCueId && stillThere) selectCue(selectedCueId);
}

document.getElementById("goto-confirm").addEventListener("click", function () {
  if (!selectedCueId) return;
  var isCurrent = document.getElementById("goto-bar").dataset.current === "1";
  if (isCurrent) {
    sendCmd("r");
  } else {
    sendCmd("g " + selectedCueId);
  }
  closeGotoBar();
});
document.getElementById("goto-cancel").addEventListener("click", closeGotoBar);

// ── 진행 제어 버튼·자동 진행 표시 ───────────────────────────────────
document.getElementById("btn-prev").addEventListener("click", function () { sendCmd("p"); });
document.getElementById("btn-restart").addEventListener("click", function () { sendCmd("r"); });
document.getElementById("btn-next").addEventListener("click", function () { sendCmd("n"); });
document.getElementById("btn-start").addEventListener("click", function () { sendCmd("s"); });
document.getElementById("btn-abort").addEventListener("click", function () { sendCmd("a"); });

// 카메라 켜기/끄기·대기모드 버튼 — 콘솔(stage/console.py)과 같은 "c <role>"/"z <role>"
// 명령 문자열을 그대로 보낸다(계약, Task 5). 라벨은 renderSnapshot 이 cameras/standby
// 로 갈아 끼운다 — 여기서는 클릭 시 명령만 보낸다.
["mc", "docent"].forEach(function (role) {
  var camBtn = document.getElementById("cam-toggle-" + role);
  if (camBtn) camBtn.addEventListener("click", function () { sendCmd("c " + role); });
  var standbyBtn = document.getElementById("standby-toggle-" + role);
  if (standbyBtn) standbyBtn.addEventListener("click", function () { sendCmd("z " + role); });
});

var KEY_CMD = { "KeyP": "p", "KeyR": "r", "KeyN": "n", "KeyS": "s", "KeyA": "a" };
document.addEventListener("keydown", function (ev) {
  // 수정키가 하나라도 눌려 있으면 무시한다 — 브라우저 단축키(예: Cmd+R 새로고침)
  // 와 겹치지 않게 하기 위해서다.
  if (ev.ctrlKey || ev.altKey || ev.metaKey || ev.shiftKey) return;
  // 자동반복(키를 길게 누르고 있을 때 브라우저가 계속 쏘는 keydown)을 거른다 —
  // 안 거르면 N 을 0.3초 넘게 누른 것만으로 sendCmd 가 여러 번 불려 큐가 여러 개
  // 건너뛴다("실수 한 번이 진행을 깨지 않는다"는 원칙 위반, 스펙 결정 2).
  if (ev.repeat) return;
  // `ev.key` 대신 물리 키 위치인 `ev.code` 로 매핑한다 — 한글 입력기(IME)가 켜진
  // 상태면 `ev.key` 가 `ㄴ`·`ㅜ` 같은 자모가 되어 버려 단축키가 조용히 안 먹는다.
  // `ev.code` 는 입력기 상태와 무관하게 항상 물리 키 이름(KeyN 등)이다.
  var cmd = KEY_CMD[ev.code];
  if (!cmd) return;
  // 단독에서는 진행 버튼(prev/restart/next/start)이 disabled 지만, 키보드 지름길은
  // DOM 의 disabled 속성과 무관하게 그대로 sendCmd 를 불러 버튼 잠금을 우회했다(수준
  // 리뷰 I1) — applySoloLockdown 이 막으려던 "감독이 거절해 로그에 경고만 쌓이는"
  // 상황을 키보드로는 그대로 재현한 것이다. 즉시 중단(a)만은 버튼과 마찬가지로 단독
  // 에서도 살려 둔다.
  if (cmd !== "a" && latestSnapshot && latestSnapshot.mode === "solo") return;
  ev.preventDefault();
  sendCmd(cmd);
});

function setTally(role, connected, rejected, speakingRole) {
  var mon = document.getElementById("mon-" + role);
  var tag = document.getElementById("tag-" + role);
  var cap = document.getElementById("cap-" + role);
  var state;
  if (rejected.has(role)) state = "rejected";
  else if (!connected.has(role)) state = "offline";
  else if (speakingRole === role) state = "onair";
  else state = "standby";

  [mon, tag, cap].forEach(function (el) {
    STATE_CLASSES.forEach(function (c) { el.classList.remove(c); });
    el.classList.add(state);
  });
  tag.textContent = TALLY_TEXT[state];
}

function applyAutoProgress(wait, total) {
  var text = document.getElementById("auto-text");
  var bar = document.getElementById("auto-bar");
  if (wait === null || wait === undefined) {
    text.textContent = "대기 전";
    bar.style.width = "0%";
    return;
  }
  var seconds = Math.max(0, Math.round(wait));
  text.textContent = "침묵 " + seconds + "초 뒤 다음 큐로";
  var t = typeof total === "number" && total > 0 ? total : wait;
  var ratio = t > 0 ? Math.min(1, Math.max(0, 1 - wait / t)) : 0;
  bar.style.width = Math.round(ratio * 100) + "%";
}

connect();
</script>
